/* ── En elev ── */
async function larRitaElev(){
  const kropp=document.getElementById("larkropp"); if(!kropp) return;
  if(!larData.grupper) await larHamtaGrupper();
  const g=larGrupp();
  kropp.innerHTML=`<button class="lank larbak" onclick="larTillbaka(true)">← ${esc(g?.namn||"Gruppen")}</button>
    <div id="larelev"><div class="empty">Hämtar elevens träning …</div></div>`;
  const r=await klassRpc("kg_lar_elev",{p_grupp:state.larGrupp,p_user:state.larElev});
  const box=document.getElementById("larelev"); if(!box) return;
  if(!r?.ok){ box.innerHTML=`<div class="empty">Kunde inte hämta eleven.</div>`; return; }
  const kurser=(r.kurser||[]).filter(k=>Number(k.forsok)>0 || (k.omraden||[]).length);
  const vecka=kurser.reduce((a,k)=>a+(Number(k.vecka)||0),0);
  const forsok=kurser.reduce((a,k)=>a+(Number(k.forsok)||0),0);
  const ratt=kurser.reduce((a,k)=>a+(Number(k.ratt)||0),0);
  // Aktivitet de senaste 14 dagarna
  const dagar=[];
  for(let i=13;i>=0;i--){
    const d=new Date(Date.now()-i*864e5);
    const nyckel=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    dagar.push({d,n:Number(r.dagar?.[nyckel])||0});
  }
  const max=Math.max(1,...dagar.map(x=>x.n));
  box.innerHTML=`<div class="larelev-topp"><h2>${esc(r.namn||"Elev")}</h2><small>${esc(r.epost||"")}</small></div>
    <div class="statgrid larstat">
      ${statRuta(String(Number(r.uppgifter)||0),"Uppgifter totalt")}
      ${statRuta(String(vecka),"Senaste 7 dagarna")}
      ${statRuta(larPct(ratt,forsok),"Andel rätt","senaste försöken")}
      ${statRuta(String(Number(r.streak)||0),"Dagar i rad")}
    </div>
    <div class="laraktivitet" aria-label="Uppgifter per dag de senaste 14 dagarna">
      ${dagar.map(x=>`<span class="lardag" title="${x.d.toLocaleDateString("sv-SE",{weekday:"short",day:"numeric",month:"short"})}: ${x.n} uppgifter">
        <i style="height:${Math.round(x.n/max*100)}%"></i><small>${x.d.getDate()}</small></span>`).join("")}
    </div>
    <div id="larkurser">${kurser.length?kurser.map((k,i)=>`<section class="larkurs" id="larkurs-${i}">
        <h3>${esc(larKursNamn(k.kurs))}</h3>
        <p class="lartext liten">${Number(k.forsok)||0} försök · ${larPct(k.ratt,k.forsok)} rätt · ${Number(k.vecka)||0} senaste veckan · senast ${larNar(k.senast)}</p>
        <div class="empty">Läser in kursens områden …</div></section>`).join("")
      :`<div class="empty">Eleven har inte tränat något än.</div>`}</div>
    ${(r.pass||[]).length?`<section class="larkurs"><h3>Träningspass</h3>
      ${r.pass.map(p=>{
        const pct=Math.min(100,Math.round((Number(p.klara)||0)/Math.max(1,Number(p.antal)||1)*100));
        return `<div class="provres-rad${pct>=100?" bra":pct>0?" mellan":" svag"}">
          <span class="provres-namn">${esc(p.titel)}</span>
          <span class="provres-stapel"><i style="width:${pct}%"></i></span>
          <span class="provres-pct">${Number(p.klara)||0}/${Number(p.antal)||0}</span>
          <small>${larPct(p.ratt,p.klara)} rätt${p.aktiv?"":" · avslutat"}</small></div>`;}).join("")}</section>`:""}
    <div class="modal-fot"><span class="spacer"></span>
      <button class="btn sm quiet farligtext" onclick="larTaBortElev()">Ta bort eleven ur gruppen</button></div>`;
  // Områdesnamn kräver att kursen läses in; görs kurs för kurs.
  for(let i=0;i<kurser.length;i++){
    const k=kurser[i];
    const kd=await provKursData(k.kurs).catch(()=>null);
    const sek=document.getElementById("larkurs-"+i); if(!sek) return;
    sek.querySelector(".empty")?.replaceWith(larKursOmradenEl(k,kd));
  }
}
function larKursOmradenEl(k,kd){
  const namn=o=>kd?.namn?.[o]||o;
  const omr=(k.omraden||[]).map(o=>({...o,m:Number(o.m)||0,f:Number(o.f)||0,r:Number(o.r)||0}));
  const svaga=omr.filter(o=>o.f>=2 && o.m<.6).sort((a,b)=>a.m-b.m).slice(0,5);
  const starka=omr.filter(o=>o.m>=.75).sort((a,b)=>b.m-a.m).slice(0,4);
  const rad=o=>{
    const pct=Math.round(o.m*100);
    const ton=o.m>=.75?" bra":o.m>=.55?" mellan":" svag";
    return `<div class="provres-rad${ton}"><span class="provres-namn">${esc(namn(o.omr))}</span>
      <span class="provres-stapel"><i style="width:${pct}%"></i></span><span class="provres-pct">${pct} %</span>
      <small>${o.f} försök · ${larPct(o.r,o.f)} rätt i senaste försöken</small></div>`;
  };
  const el=document.createElement("div");
  el.innerHTML=`<div class="larkolumner">
      <div><h4>Behöver träna mer på</h4>${svaga.length?`<div class="provres">${svaga.map(rad).join("")}</div>`
        :`<p class="lartext liten">Inga tydligt svaga områden bland dem eleven har tränat.</p>`}</div>
      <div><h4>Starkast i</h4>${starka.length?`<div class="provres">${starka.map(rad).join("")}</div>`
        :`<p class="lartext liten">Inga områden är ännu riktigt säkra.</p>`}</div>
    </div>
    ${omr.length?`<details class="laralla"><summary>Alla ${omr.length} områden eleven har tränat</summary>
      <div class="provres">${[...omr].sort((a,b)=>a.m-b.m).map(rad).join("")}</div></details>`:""}
    <p class="lartext liten">Procenten är Kunskapsgymmets uppskattning av hur säkert eleven behärskar området, utifrån alla svar.</p>`;
  return el;
}

async function larRitaOmraden(){
  const box=document.getElementById("largruppkropp"); if(!box) return;
  const kurser=COURSE_ORDER.filter(id=>COURSES[id] && id!=="hist");
  if(!kurser.includes(state.larKurs)) state.larKurs=kurser.includes(state.course)?state.course:kurser[0];

      <select class="admin-sok" onchange="state.larKurs=this.value;larRitaOmraden()">
        ${kurser.map(id=>`<option value="${id}"${id===kurs?" selected":""}>${esc(COURSES[id].name)}</option>`).join("")}</select></label>
    <div id="laromr"><div class="empty">Hämtar …</div></div>`;
  const [r,kd]=await Promise.all([klassRpc("kg_lar_grupp_omraden",{p_grupp:state.larGrupp,p_kurs:kurs}),
                                  provKursData(kurs).catch(()=>null)]);
  const host=document.getElementById("laromr"); if(!host || state.larKurs!==kurs) return;
  if(!r?.ok){ host.innerHTML=`<div class="empty">Kunde inte hämta gruppens resultat.</div>`; return; }
  const ordning=kd?kd.kapitel.flatMap(k=>k.omraden):[];
  const omr=Object.entries(r.omraden||{}).map(([o,x])=>({omr:o,m:Number(x.m)||0,elever:Number(x.elever)||0,
      f:Number(x.forsok)||0,r:Number(x.ratt)||0}))
    .filter(o=>!kd || ordning.includes(o.omr));
  if(!omr.length){ host.innerHTML=`<div class="empty">Ingen i gruppen har tränat ${esc(larKursNamn(kurs))} än.</div>`; return; }
  omr.sort((a,b)=>a.m-b.m);
  const svagast=omr.filter(o=>o.f>=3).slice(0,5).map(o=>o.omr);
  larData.svagast={kurs,omr:svagast};
  host.innerHTML=`<p class="lartext">Gruppens genomsnittliga behärskning per område, svagast först.</p>
    <div class="provres">${omr.map(o=>{
      const pct=Math.round(o.m*100);
      const ton=o.m>=.75?" bra":o.m>=.55?" mellan":" svag";
      return `<div class="provres-rad${ton}"><span class="provres-namn">${esc(kd?.namn?.[o.omr]||o.omr)}</span>
        <span class="provres-stapel"><i style="width:${pct}%"></i></span><span class="provres-pct">${pct} %</span>
        <small>${o.elever} elever · ${o.f} försök · ${larPct(o.r,o.f)} rätt</small></div>`;}).join("")}</div>
    ${svagast.length?`<div class="modal-fot"><span class="spacer"></span>
      <button class="btn primary" onclick="larNyttPass(${Number(state.larGrupp)},larData.svagast.kurs,larData.svagast.omr)">Skapa träningspass med de ${svagast.length} svagaste</button></div>`:""}`;
}

const GRUPPLARARE_KEY="kunskapsgymmet-grupplarare";

async function sparaLararprofil(franRollval){
  const namn=(document.getElementById("larprofil-namn")?.value||"").trim();
  const skola=(document.getElementById("larprofil-skola")?.value||"").trim();
  const h=document.getElementById("larprofil-hjalp");
  const fel=t=>{ if(h){ h.textContent=t; h.className="kodhjalp fel"; } };
  if(namn.length<3 || !namn.includes(" ")) return fel("Skriv ditt fullständiga namn, både för- och efternamn.");
  if(skola.length<2) return fel("Skriv vilken skola du arbetar på.");

/* ===== Hjälpmedel under träningen: formelblad och miniräknare =====
   Två fönster som dockas till höger (uppgiften krymper) eller dras loss och
   flyttas fritt i rubrikraden. Formelbladet
   går också att ändra storlek på (hörnet nere till höger) och zooma i (knappar,
   Ctrl/⌘ + scroll, nyp med två fingrar, dubbelklick). Fönstren ligger utanför
   #app så att de inte ritas om vid varje uppgift. Formelbladen är Skolverkets
   PDF:er i mappen formelblad/ och ritas med pdf.js, som laddas först när ett
   formelblad öppnas. Miniräknaren är tillåten på uppgifter med "miniräknare": true. */
const FORMELBLAD={

};

const HJALP_KEY="kunskapsgymmet-hjalpmedel3";
const ZOOM_MIN=0.5, ZOOM_MAX=4;
const hjalp={formel:false,raknare:false,zoom:1,grader:true,pos:{},dock:{raknare:true,formel:true},dockBredd:0};
try{ const s=JSON.parse(localStorage.getItem(HJALP_KEY)||"{}");
  ["zoom","grader","pos","dock","dockBredd"].forEach(k=>{ if(k in s) hjalp[k]=s[k]; }); }catch(_){}
if(!(hjalp.zoom>=ZOOM_MIN && hjalp.zoom<=ZOOM_MAX)) hjalp.zoom=1;
if(!hjalp.pos || typeof hjalp.pos!=="object") hjalp.pos={};
if(!hjalp.dock || typeof hjalp.dock!=="object") hjalp.dock={raknare:true,formel:true};
function hjalpSpara(){
  try{ localStorage.setItem(HJALP_KEY,JSON.stringify({zoom:hjalp.zoom,grader:hjalp.grader,pos:hjalp.pos,dock:hjalp.dock,dockBredd:hjalp.dockBredd})); }catch(_){}

/* Miniräknare är alltid tillåten i fysik, annars enligt uppgiftens "miniräknare". */
function raknareTillaten(t){
  return t?.["miniräknare"]===true || COURSES[state.course]?.subject==="Fysik";
}
/* Knapparna i svarsraden. */
function hjalpKnappar(t){
  const k=[];
  if(FORMELBLAD[state.course]) k.push(`<button class="btn hmknapp${hjalp.formel?" pa":""}" data-hjalp="formel"
      onclick="hjalpVaxla('formel')" title="Formelblad" aria-pressed="${hjalp.formel}">${HJALP_IKON.formel}<span>Formelblad</span></button>`);
  if(raknareTillaten(t)) k.push(`<button class="btn hmknapp${hjalp.raknare?" pa":""}" data-hjalp="raknare"
      onclick="hjalpVaxla('raknare')" title="Miniräknare" aria-pressed="${hjalp.raknare}">${HJALP_IKON.raknare}<span>Miniräknare</span></button>`);
  return k.join("");
}
function hjalpVaxla(vad){
  hjalp[vad]=!hjalp[vad];
  document.querySelectorAll(`[data-hjalp="${vad}"]`).forEach(b=>{
    b.classList.toggle("pa",hjalp[vad]); b.setAttribute("aria-pressed",String(hjalp[vad]));
  });
  hjalpSynk();
  const f=document.getElementById(vad==="formel"?"hm-formel":"hm-raknare");
  if(hjalp[vad] && f) hjalpFram(f);
  if(vad==="raknare" && hjalp.raknare && !matchMedia("(pointer:coarse)").matches)
    setTimeout(()=>document.getElementById("rk-in")?.focus(),30);
}

/* Visar eller döljer fönstren efter vyn och uppgiften. Körs varje gång #app ritas om. */
function hjalpSynk(){
  const t=state.view==="training"?state.currentTask:null;
  const fb=t?FORMELBLAD[state.course]:null;
  const visaF=!!fb && hjalp.formel;
  const visaR=!!t && hjalp.raknare && (raknareTillaten(t) || "miniräknare" in t);
  const tillaten=!!t && raknareTillaten(t);

  let r=document.getElementById("hm-raknare");
  if(visaR){
    if(!r) r=hjalpSkapaRaknare();
    r.hidden=false;
    r.classList.toggle("sparrad",!tillaten);
    r.querySelectorAll(".rk-tangenter button,#rk-in").forEach(el=>{ el.disabled=!tillaten; });
  }else if(r) r.hidden=true;

  let f=document.getElementById("hm-formel");
  if(visaF){
    if(!f) f=hjalpSkapaFormel();
    f.hidden=false;
    f.querySelector("#hp-formelnamn").textContent=fb.namn;
    f.querySelector("#hp-pdf").href=fb.fil;
  }else if(f) f.hidden=true;

  hjalpLayout();
  if(visaF) formelRita();
}

/* ── Fönstren: dockade eller flytande ──
   Dockade fönster står i en kolumn till höger, och uppgiften krymper så att
   inget täcks över. På smala skärmar ligger de i stället längst ned. Drar man
   ett dockat fönster i rubriken blir det flytande; släpps det mot högerkanten
   (nederkanten på smala skärmar) dockas det igen. */
const HJALP_SMAL=999;
let hjalpZ=60;
function hjalpNyckel(f){ return f.id==="hm-formel"?"formel":"raknare"; }
function hjalpArDockad(f){ return hjalp.dock[hjalpNyckel(f)]!==false; }
function hjalpFram(f){
  f.style.zIndex=String(++hjalpZ);
  if(hjalpZ>68){ hjalpZ=61; document.querySelectorAll(".hmfonster").forEach(x=>x.style.zIndex="60"); f.style.zIndex="61"; }
}
function hjalpDockBredd(){
  const W=window.innerWidth;
  return Math.round(Math.max(340,Math.min(hjalp.dockBredd||Math.min(520,W*0.36),W*0.55)));
}
function hjalpLayout(){
  const W=window.innerWidth, H=window.innerHeight, smal=W<=HJALP_SMAL;
  const r=document.getElementById("hm-raknare"), f=document.getElementById("hm-formel");
  const syns=x=>!!x && !x.hidden;
  const dr=syns(r)&&hjalpArDockad(r), df=syns(f)&&hjalpArDockad(f);
  [r,f].forEach(x=>{
    if(!syns(x)) return;
    x.classList.toggle("dockad",hjalpArDockad(x));
    if(!hjalpArDockad(x)) hjalpPlacera(x);
  });
  const rot=document.documentElement, kant=hjalpDockKant();
  document.body.classList.toggle("hm-dockad",(dr||df)&&!smal);
  document.body.classList.toggle("hm-dockad-smal",(dr||df)&&smal);
  if(!dr && !df){ kant.hidden=true; return; }
  if(!smal){
    const dw=hjalpDockBredd(), x0=W-dw;
    rot.style.setProperty("--hm-dock",dw+"px");
    kant.hidden=false; kant.style.left=(x0-5)+"px";
    let y=12;
    if(dr){
      const cw=Math.min(dw-24,440);
      Object.assign(r.style,{left:Math.round(x0+(dw-cw)/2)+"px",top:y+"px",width:cw+"px",height:""});
      y+=r.offsetHeight+12;
    }
    if(df) Object.assign(f.style,{left:(x0+12)+"px",top:y+"px",width:(dw-24)+"px",height:Math.max(200,H-y-12)+"px"});
  }else{
    kant.hidden=true;
    const w=W-16; let botten=H-8;
    if(dr){
      Object.assign(r.style,{left:"8px",width:w+"px",height:""});
      r.style.top=(botten-r.offsetHeight)+"px"; botten-=r.offsetHeight+8;
    }
    if(df){
      const h=Math.round(Math.min(H*0.45,Math.max(200,botten-80)));
      Object.assign(f.style,{left:"8px",width:w+"px",height:h+"px",top:(botten-h)+"px"}); botten-=h+8;
    }
    rot.style.setProperty("--hm-dock-h",(H-botten)+"px");
  }
}
/* Mjuk övergång när ett fönster dockas eller släpps loss. */
function hjalpAnimera(){
  document.querySelectorAll(".hmfonster").forEach(x=>x.classList.add("anim"));
  document.body.classList.add("hm-anim");
  setTimeout(()=>{
    document.querySelectorAll(".hmfonster").forEach(x=>x.classList.remove("anim"));
    document.body.classList.remove("hm-anim");
    formelRita();
  },320);
}
/* Kanten mellan uppgiften och dockkolumnen: dra för att ändra bredden. */
function hjalpDockKant(){
  let k=document.getElementById("hm-dockkant");
  if(k) return k;
  k=document.createElement("div");
  k.id="hm-dockkant"; k.className="hm-dockkant"; k.hidden=true;
  k.title="Dra för att ändra bredden";
  k.addEventListener("pointerdown",e=>{
    e.preventDefault(); k.setPointerCapture(e.pointerId); k.classList.add("drar");
    document.body.classList.add("hm-drar");
    const flytta=ev=>{ hjalp.dockBredd=window.innerWidth-ev.clientX; hjalp.dockBredd=hjalpDockBredd(); hjalpLayout(); };
    const slapp=()=>{
      k.removeEventListener("pointermove",flytta); k.classList.remove("drar");
      document.body.classList.remove("hm-drar"); hjalpSpara(); formelRita();
    };
    k.addEventListener("pointermove",flytta);
    k.addEventListener("pointerup",slapp,{once:true});
    k.addEventListener("pointercancel",slapp,{once:true});
  });
  document.body.appendChild(k);
  return k;
}
/* Ytan som visar var fönstret dockas om man släpper det. */
function hjalpDockZon(visa){
  let z=document.getElementById("hm-dockzon");
  if(!z){ z=document.createElement("div"); z.id="hm-dockzon"; z.className="hm-dockzon"; document.body.appendChild(z); }
  if(visa){
    const W=window.innerWidth, H=window.innerHeight;
    if(W>HJALP_SMAL){ const dw=hjalpDockBredd(); Object.assign(z.style,{left:(W-dw+8)+"px",top:"8px",width:(dw-16)+"px",height:(H-16)+"px"}); }
    else Object.assign(z.style,{left:"8px",top:(H*0.55)+"px",width:(W-16)+"px",height:(H*0.45-8)+"px"});
  }
  z.classList.toggle("syns",!!visa);
}
function hjalpIDockZon(ev){
  const W=window.innerWidth, H=window.innerHeight;
  return W>HJALP_SMAL ? ev.clientX>W-70 : ev.clientY>H-70;
}

function hjalpStandard(f){
  const W=window.innerWidth, H=window.innerHeight, smal=W<640;
  if(f.id==="hm-formel"){
    const w=smal?W-16:Math.min(560,Math.max(360,W*0.36));
    const h=smal?Math.round(H*0.55):H-100;
    return {x:W-w-(smal?8:16),y:smal?64:84,w,h};
  }
  const w=smal?W-16:390, h=f.offsetHeight||560;
  return {x:smal?8:W-w-16,y:Math.max(70,H-h-16),w};
}
function hjalpPlacera(f){
  const p={...hjalpStandard(f),...(hjalp.pos[hjalpNyckel(f)]||{})};
  const W=window.innerWidth, H=window.innerHeight;
  if(p.w){ p.w=Math.max(f.id==="hm-formel"?280:300,Math.min(p.w,W-16)); f.style.width=p.w+"px"; }
  if(f.id==="hm-formel"){ p.h=Math.max(220,Math.min(p.h||H-100,H-16)); f.style.height=p.h+"px"; }
  else f.style.height="";
  const bredd=f.offsetWidth||p.w||300;
  p.x=Math.max(8-bredd+120,Math.min(p.x,W-120));
  p.y=Math.max(8,Math.min(p.y,H-56));
  f.style.left=Math.round(p.x)+"px"; f.style.top=Math.round(p.y)+"px";
}
function hjalpSparaPos(f){
  const r=f.getBoundingClientRect(), nyckel=hjalpNyckel(f);
  hjalp.pos[nyckel]={x:Math.round(r.left),y:Math.round(r.top),w:Math.round(r.width),
    ...(nyckel==="formel"?{h:Math.round(r.height)}:{})};
  hjalpSpara();
}
/* Flytta i rubriken; storleksändra flytande formelblad i hörnet. */
function hjalpDragbar(f){
  f.addEventListener("pointerdown",()=>hjalpFram(f),true);
  const topp=f.querySelector(".hmf-topp");
  topp.addEventListener("pointerdown",e=>{
    if(e.button!==0 || e.target.closest("button,a,input")) return;
    e.preventDefault();
    let r=f.getBoundingClientRect(), dx=e.clientX-r.left, dy=e.clientY-r.top;
    const x0=e.clientX, y0=e.clientY;
    let igang=false, iZon=false;
    topp.setPointerCapture(e.pointerId);
    const flytta=ev=>{
      if(!igang){
        if(Math.hypot(ev.clientX-x0,ev.clientY-y0)<5) return;
        igang=true; f.classList.add("drar"); document.body.classList.add("hm-drar");
        if(hjalpArDockad(f)){
          // Släpp loss: fönstret behåller sin storlek och följer pekaren.
          hjalp.dock[hjalpNyckel(f)]=false;
          const w=Math.min(r.width,f.id==="hm-formel"?560:420), h=Math.min(r.height,window.innerHeight-100);
          dx=Math.min(dx,w-40);
          f.style.width=w+"px"; if(f.id==="hm-formel") f.style.height=h+"px";
          f.classList.remove("dockad");
          hjalp.pos[hjalpNyckel(f)]={x:ev.clientX-dx,y:ev.clientY-dy,w,...(f.id==="hm-formel"?{h}:{})};
          hjalpAnimera(); hjalpLayout();
          f.classList.remove("anim");
          r=f.getBoundingClientRect();
        }
      }
      const W=window.innerWidth, H=window.innerHeight;
      const x=Math.max(8-r.width+120,Math.min(ev.clientX-dx,W-120));
      const y=Math.max(8,Math.min(ev.clientY-dy,H-56));
      f.style.left=x+"px"; f.style.top=y+"px";
      iZon=hjalpIDockZon(ev); hjalpDockZon(iZon);
    };
    const slapp=()=>{
      topp.removeEventListener("pointermove",flytta);
      if(!igang) return;
      f.classList.remove("drar"); document.body.classList.remove("hm-drar"); hjalpDockZon(false);
      if(iZon){ hjalp.dock[hjalpNyckel(f)]=true; hjalpSpara(); hjalpAnimera(); hjalpLayout(); }
      else{ hjalpSparaPos(f); formelRita(); }
    };
    topp.addEventListener("pointermove",flytta);
    topp.addEventListener("pointerup",slapp,{once:true});
    topp.addEventListener("pointercancel",slapp,{once:true});
  });
  const horn=f.querySelector(".hmf-storlek"); if(!horn) return;
  horn.addEventListener("pointerdown",e=>{
    if(hjalpArDockad(f)) return;
    e.preventDefault(); e.stopPropagation();
    const r=f.getBoundingClientRect(), x0=e.clientX, y0=e.clientY;
    horn.setPointerCapture(e.pointerId); f.classList.add("drar");
    const andra=ev=>{
      f.style.width=Math.max(280,Math.min(r.width+ev.clientX-x0,window.innerWidth-r.left-8))+"px";
      f.style.height=Math.max(220,Math.min(r.height+ev.clientY-y0,window.innerHeight-r.top-8))+"px";
    };
    const slapp=()=>{
      horn.removeEventListener("pointermove",andra); f.classList.remove("drar"); hjalpSparaPos(f); formelRita();
    };
    horn.addEventListener("pointermove",andra);
    horn.addEventListener("pointerup",slapp,{once:true});
    horn.addEventListener("pointercancel",slapp,{once:true});
  });
}
let hjalpResizeTimer=null;
window.addEventListener("resize",()=>{

  hjalpResizeTimer=setTimeout(()=>{ hjalpLayout(); formelRita(); },150);

/* ── Formelbladet ── */
let pdfjsLaddar=null;
const formelDok={};
function laddaPdfjs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(!pdfjsLaddar) pdfjsLaddar=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=PDFJS_URL; s.async=true;
    s.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER; res(window.pdfjsLib); };
    s.onerror=()=>{ pdfjsLaddar=null; s.remove(); rej(new Error("pdf.js")); };
    document.head.appendChild(s);
  });
  return pdfjsLaddar;
}
function formelPassning(box){ return Math.max(200,box.clientWidth-24); }
function formelVisaProcent(){
  const el=document.getElementById("hp-procent"); if(el) el.textContent=Math.round(hjalp.zoom*100)+" %";
}
/* Zoomar direkt genom att skala sidorna med CSS, och ritar sedan om skarpt.
   Punkten (px,py) i rutan står still medan man zoomar. */
let formelSkarpTimer=null;
function formelZoomaTill(ny,px,py){
  const box=document.getElementById("hp-sidor"); if(!box) return;
  ny=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,ny));
  const gammal=hjalp.zoom; if(Math.abs(ny-gammal)<1e-4) return;
  if(px===undefined){ px=box.clientWidth/2; py=box.clientHeight/2; }
  const kvot=ny/gammal, sx=box.scrollLeft+px, sy=box.scrollTop+py;
  hjalp.zoom=ny; formelVisaProcent();
  const bredd=formelPassning(box)*ny;
  box.querySelectorAll("canvas").forEach(c=>{
    const a=Number(c.dataset.aspekt)||1.414;
    c.style.width=Math.round(bredd)+"px"; c.style.height=Math.round(bredd*a)+"px";
  });
  box.scrollLeft=sx*kvot-px; box.scrollTop=sy*kvot-py;
  clearTimeout(formelSkarpTimer);
  formelSkarpTimer=setTimeout(()=>{ hjalpSpara(); formelRita(); },220);
}
function formelZooma(faktor){ formelZoomaTill(hjalp.zoom*faktor); }
function formelZoomGester(box){
  box.addEventListener("wheel",e=>{
    if(!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const r=box.getBoundingClientRect();
    formelZoomaTill(hjalp.zoom*Math.exp(-e.deltaY*0.0022),e.clientX-r.left,e.clientY-r.top);
  },{passive:false});
  box.addEventListener("dblclick",e=>{
    const r=box.getBoundingClientRect();
    formelZoomaTill(hjalp.zoom<1.6?2:1,e.clientX-r.left,e.clientY-r.top);
  });
  /* Nyp med två fingrar. */
  const fingrar=new Map(); let start=null;
  const avstand=()=>{ const [a,b]=[...fingrar.values()]; return Math.hypot(a.x-b.x,a.y-b.y); };
  const mitt=()=>{ const [a,b]=[...fingrar.values()], r=box.getBoundingClientRect();
    return {x:(a.x+b.x)/2-r.left,y:(a.y+b.y)/2-r.top}; };
  box.addEventListener("pointerdown",e=>{
    if(e.pointerType!=="touch") return;
    fingrar.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(fingrar.size===2) start={d:avstand(),z:hjalp.zoom};
  });
  box.addEventListener("pointermove",e=>{
    if(!fingrar.has(e.pointerId)) return;
    fingrar.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(fingrar.size===2 && start){
      e.preventDefault();
      const m=mitt(); formelZoomaTill(start.z*avstand()/start.d,m.x,m.y);
    }
  });
  const slut=e=>{ fingrar.delete(e.pointerId); if(fingrar.size<2) start=null; };
  box.addEventListener("pointerup",slut); box.addEventListener("pointercancel",slut);
}
/* Ritar sidorna skarpt för aktuell zoom och bredd. Finns sidorna redan byts de
   ut en i taget på plats, så att rullningen står still. */
let formelRitning=0;
async function formelRita(){
  const kurs=state.course, fb=FORMELBLAD[kurs];
  const box=document.getElementById("hp-sidor"); if(!fb || !box || box.closest("[hidden]")) return;
  formelVisaProcent();
  const bredd=formelPassning(box)*hjalp.zoom;
  const nyckel=kurs+"|"+Math.round(bredd);
  if(box.dataset.nyckel===nyckel) return;
  box.dataset.nyckel=nyckel;
  const nr=++formelRitning;
  const finns=box.dataset.kurs===kurs && box.querySelector("canvas");
  if(!finns) box.innerHTML='<div class="empty">Hämtar formelbladet …</div>';
  try{
    const lib=await laddaPdfjs();
    if(!formelDok[kurs]) formelDok[kurs]=lib.getDocument(fb.fil).promise.catch(e=>{ delete formelDok[kurs]; throw e; });
    const dok=await formelDok[kurs];
    const dpr=Math.min(window.devicePixelRatio||1,2);
    if(!finns){ box.innerHTML=""; box.dataset.kurs=kurs; }
    for(let i=1;i<=dok.numPages;i++){
      const sida=await dok.getPage(i);
      if(nr!==formelRitning) return;
      const v1=sida.getViewport({scale:1}), aspekt=v1.height/v1.width;
      const b=formelPassning(box)*hjalp.zoom, skala=b/v1.width;
      const vp=sida.getViewport({scale:skala*Math.min(dpr,3600/b)});
      const c=document.createElement("canvas");
      c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
      c.dataset.aspekt=String(aspekt);
      c.style.width=Math.round(b)+"px"; c.style.height=Math.round(b*aspekt)+"px";
      c.setAttribute("role","img"); c.setAttribute("aria-label",`Formelblad, sida ${i} av ${dok.numPages}`);
      await sida.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
      if(nr!==formelRitning) return;
      const gammal=box.querySelectorAll("canvas")[i-1];
      if(gammal) gammal.replaceWith(c); else box.appendChild(c);
    }
  }catch(_){
    if(nr!==formelRitning) return;
    box.dataset.nyckel="";
    box.innerHTML=`<div class="empty">Formelbladet kunde inte visas här.
      <a href="${fb.fil}" target="_blank" rel="noopener">Öppna det som PDF</a>.</div>`;
  }
}

const rk={ans:0,klar:false,hist:[]};

function raknTangent(v){
  const inp=document.getElementById("rk-in"); if(!inp) return;
  if(v==="rensa"){ inp.value=""; rk.klar=false; raknVisa(""); return; }
  if(v==="bak"){
    if(rk.klar){ rk.klar=false; }
    const s=inp.selectionStart??inp.value.length, e=inp.selectionEnd??s;
    if(s!==e) inp.value=inp.value.slice(0,s)+inp.value.slice(e);
    else if(s>0){
      const m=inp.value.slice(0,s).match(/(sin⁻¹\(|cos⁻¹\(|tan⁻¹\(|sin\(|cos\(|tan\(|log\(|ln\(|√\(| nCr | nPr |Ans|·10\^\()$/);
      const n=m?m[0].length:1;
      inp.value=inp.value.slice(0,s-n)+inp.value.slice(s); inp.setSelectionRange(s-n,s-n);
    }
    raknForhands(); return;
  }
  if(v==="lika"){ raknRakna(); return; }
  if(rk.klar){
    inp.value=/^[+−×÷^!²]|^ n[CP]r /.test(v)?"Ans":"";
    rk.klar=false;
  }
  const s=inp.selectionStart??inp.value.length, e=inp.selectionEnd??s;
  inp.value=inp.value.slice(0,s)+v+inp.value.slice(e);
  const pos=s+v.length;
  try{ inp.setSelectionRange(pos,pos); }catch(_){}
  if(!matchMedia("(pointer:coarse)").matches) inp.focus();
  raknForhands();
}

function rkHistVarde(i){ return (rk.hist[i]?.svar||"").replace(/·10\^(−?\d+)/,"·10^($1)"); }

function raknFormat(x){
  if(typeof x!=="number" || !isFinite(x)) throw "Matematiskt fel";
  if(Math.abs(x)<1e-13) x=0;
  const a=Math.abs(x);
  let s;
  if(a!==0 && (a>=1e10 || a<1e-6)){
    const [m,ex]=x.toExponential(9).split("e");
    s=String(+m)+"·10^"+Number(ex);
  }else s=String(+x.toPrecision(10));
  return s.replace(".",",").replace(/-/g,"−");
}
function raknTolka(txt,options={}){
  const NAMN=["sin⁻¹","cos⁻¹","tan⁻¹","arcsin","arccos","arctan","asin","acos","atan","sqrt","sin","cos","tan",
              "ln","log","lg","Ans","ans","nCr","nPr","pi","π","√","e"];
  const tok=[]; let i=0;
  const s=txt.replace(/\s+/g," ");
  while(i<s.length){
    const c=s[i];
    if(c===" "){ i++; continue; }
    const tal=s.slice(i).match(/^(\d+([.,]\d*)?|[.,]\d+)/);
    if(tal){ tok.push({t:"tal",v:parseFloat(tal[0].replace(",","."))}); i+=tal[0].length; continue; }
    const namn=NAMN.find(n=>s.startsWith(n,i));
    if(namn){ tok.push({t:"namn",v:namn}); i+=namn.length; continue; }
    const op={"+":"+","-":"-","−":"-","–":"-","*":"*","×":"*","·":"*","⋅":"*","/":"/","÷":"/",
              "^":"^","!":"!","²":"²","³":"³","(":"(",")":")","[":"(","]":")"}[c];
    if(op){ tok.push({t:op}); i++; continue; }
    throw "Okänt tecken: "+c;
  }
  let p=0;
  const titta=()=>tok[p], ta=()=>tok[p++];
  const grader=options.grader??hjalp.grader;
  const grad=x=>grader?x*Math.PI/180:x, fraGrad=x=>grader?x*180/Math.PI:x;
  const heltal=x=>{ if(!Number.isInteger(Math.round(x*1e9)/1e9) || x<0) throw "Matematiskt fel"; return Math.round(x); };
  const fak=n=>{ n=heltal(n); if(n>170) throw "För stort tal"; let r=1; for(let k=2;k<=n;k++) r*=k; return r; };
  const FUNK={
    sin:x=>Math.sin(grad(x)), cos:x=>Math.cos(grad(x)), tan:x=>{
      if(grader && Math.abs(((x%180)+180)%180-90)<1e-9) throw "Matematiskt fel"; return Math.tan(grad(x)); },
    "sin⁻¹":x=>{ if(Math.abs(x)>1) throw "Matematiskt fel"; return fraGrad(Math.asin(x)); },
    "cos⁻¹":x=>{ if(Math.abs(x)>1) throw "Matematiskt fel"; return fraGrad(Math.acos(x)); },
    "tan⁻¹":x=>fraGrad(Math.atan(x)),
    ln:x=>{ if(x<=0) throw "Matematiskt fel"; return Math.log(x); },
    log:x=>{ if(x<=0) throw "Matematiskt fel"; return Math.log10(x); },
    "√":x=>{ if(x<0) throw "Matematiskt fel"; return Math.sqrt(x); }
  };
  const ALIAS={arcsin:"sin⁻¹",asin:"sin⁻¹",arccos:"cos⁻¹",acos:"cos⁻¹",arctan:"tan⁻¹",atan:"tan⁻¹",sqrt:"√",lg:"log"};
  const borjarFaktor=k=>k && (k.t==="tal" || k.t==="(" || (k.t==="namn" && k.v!=="nCr" && k.v!=="nPr"));

  function uttryck(){
    let v=term();
    while(titta() && (titta().t==="+" || titta().t==="-")){
      const op=ta().t, h=term(); v=op==="+"?v+h:v-h;
    }
    return v;
  }
  function term(){
    let v=komb();
    for(;;){
      const k=titta();
      if(k && (k.t==="*" || k.t==="/")){ ta(); const h=komb(); if(k.t==="/" && h===0) throw "Division med noll"; v=k.t==="*"?v*h:v/h; }
      else if(borjarFaktor(k)) v*=komb();
      else return v;
    }
  }
  function komb(){
    let v=unar();
    while(titta()?.t==="namn" && (titta().v==="nCr" || titta().v==="nPr")){
      const op=ta().v, n=heltal(v), k=heltal(unar());
      if(k>n){ v=0; continue; }
      let r=1; for(let j=0;j<k;j++) r*=(n-j);
      v=op==="nPr"?r:Math.round(r/fak(k));
    }
    return v;
  }
  function unar(){
    const k=titta();
    if(k && (k.t==="-" || k.t==="+")){ ta(); const v=unar(); return k.t==="-"?-v:v; }
    return potens();
  }
  function potens(){
    const bas=postfix();
    if(titta()?.t==="^"){
      ta(); const ex=unar();
      const v=Math.pow(bas,ex);
      if(Number.isNaN(v)){
        // Udda rot ur negativt tal, t.ex. (−8)^(1/3)
        const q=1/ex;
        if(bas<0 && Math.abs(q-Math.round(q))<1e-9 && Math.round(q)%2!==0) return -Math.pow(-bas,ex);
        throw "Matematiskt fel";
      }
      return v;
    }
    return bas;
  }
  function postfix(){
    let v=primar();
    for(;;){
      const k=titta()?.t;
      if(k==="!"){ ta(); v=fak(v); }
      else if(k==="²"){ ta(); v=v*v; }
      else if(k==="³"){ ta(); v=v*v*v; }
      else return v;
    }
  }
  function primar(){
    const k=ta();
    if(!k) throw "Uttrycket är inte färdigt";
    if(k.t==="tal") return k.v;
    if(k.t==="("){
      const v=uttryck();
      if(titta()?.t===")") ta(); else if(options.strict || titta()) throw "Syntaxfel";
      return v;
    }
    if(k.t==="namn"){
      if(k.v==="π" || k.v==="pi") return Math.PI;
      if(k.v==="e") return Math.E;
      if(k.v==="Ans" || k.v==="ans") return rk.ans;
      const f=FUNK[ALIAS[k.v]||k.v];
      if(f){
        if(titta()?.t==="("){
          ta(); const v=uttryck();
          if(titta()?.t===")") ta(); else if(options.strict || titta()) throw "Syntaxfel";
          return f(v);
        }
        return f(potens());
      }
    }
    throw "Syntaxfel";
  }
  const v=uttryck();
  if(p<tok.length) throw tok[p].t===")"?"För många parenteser":"Syntaxfel";
  return v;
}

function kvFacit(q){
  const fel=[];
  let info, layout;
  try{ info=expectedAnswersForTask(q); layout=answerLayout(q); }catch(e){ return [`kan inte läsa facit (${e.message})`]; }
  if(!info.auto) return fel;
  const prova=(anv,f,enh,tol,i,fmt,vad)=>{
    let ok=false;
    try{ ok=delSvarRatt(anv,f,enh,tol,q,i,fmt); }catch(e){ fel.push(`${vad}: fel i rättningen (${e.message})`); return; }
    if(!ok) fel.push(`${vad}: "${String(anv).slice(0,60)}" godkänns inte`);
  };
  const delar=[];
  if(layout.plan){
    layout.plan.delar.forEach((d,di)=>{ if(d.auto) d.svar.forEach((v,j)=>delar.push({v,enh:d.enhet[j],tol:d.tol[j],fmt:d.format[j],i:j,namn:"del "+String.fromCharCode(97+di)})); });
  }else{
    info.answers.forEach((v,i)=>{
      if(layout.delAuto && !layout.delAuto[i]) return;
      delar.push({v,i,namn:info.answers.length>1?"svar "+(i+1):"svar",
        enh:Array.isArray(q.svarEnhet)?q.svarEnhet[i]:q.svarEnhet,
        tol:Array.isArray(q.tolerans)?q.tolerans[i]:q.tolerans,
        fmt:Array.isArray(q.svarFormat)?q.svarFormat[i]:q.svarFormat});
    });
  }
  delar.forEach(d=>{
    if(d.v===null || d.v===undefined || d.v==="") return;
    const v=String(d.v);
    // Eleven skriver inte LaTeX: ett LaTeX-facit provas i den vanliga text eleven skriver.
    if(/\\[a-zA-Z(]/.test(v)){
      const plain=latexToPlain(v);
      prova(plain||v,d.v,d.enh,d.tol,d.i,d.fmt,d.namn+" (utan LaTeX)");
    }else prova(v,d.v,d.enh,d.tol,d.i,d.fmt,d.namn);
    // Med enheten utskriven. Är svaret en bokstav eller en skala är det enheten som ser felaktig ut.
    if(d.enh && typeof d.enh==="string"){
      if(/^[A-Za-zÅÄÖåäö]$/.test(v.trim()) || /^\d+\s*:\s*\d+$/.test(v.trim()) || ["kort_text","val","text"].includes(d.fmt))
        fel.push(`${d.namn}: enheten "${d.enh}" är angiven men svaret är "${v.slice(0,30)}"`);
      else prova(v+" "+d.enh,d.v,d.enh,d.tol,d.i,d.fmt,d.namn+" med enhet");
    }
    // Lösningsmängder i omkastad ordning.
    try{
      const l=rotListor(d.v);
      if(l.length && l.every(x=>x.length>1)){
        const omv="x = "+[...l[0]].reverse().map(x=>String(+x.toFixed(6)).replace(".",",")).join(", ");
        prova(omv,d.v,d.enh,d.tol,d.i,d.fmt,d.namn+" omkastad");
      }
    }catch(_){}
  });
  return fel;
}

function kvLjus(farg){
  const m=String(farg||"").trim().match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if(!m) return /^(none|transparent)$/i.test(String(farg||"").trim());
  let h=m[1]; if(h.length===3) h=h.split("").map(c=>c+c).join("");
  const [r,g,b]=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255);
  return 0.2126*r+0.7152*g+0.0722*b>0.78;
}
function kvSegmentIRuta(a,b,r){
  // Liang–Barsky: skär sträckan a–b rektangeln r?
  let t0=0,t1=1; const dx=b.x-a.x, dy=b.y-a.y;
  const p=[-dx,dx,-dy,dy], qv=[a.x-r.x0,r.x1-a.x,a.y-r.y0,r.y1-a.y];
  for(let i=0;i<4;i++){
    if(p[i]===0){ if(qv[i]<0) return false; }
    else{ const t=qv[i]/p[i]; if(p[i]<0){ if(t>t1) return false; if(t>t0) t0=t; } else { if(t<t0) return false; if(t<t1) t1=t; } }
  }
  return true;
}
let kvRitbord=null;
function kvFigur(q){
  const html=[q.t,q.spelIntro].filter(Boolean).join(" ");
  if(!/<svg/i.test(html)) return [];
  if(!kvRitbord){
    kvRitbord=document.createElement("div");
    kvRitbord.setAttribute("aria-hidden","true");
    kvRitbord.style.cssText="position:fixed;left:-20000px;top:0;width:1200px;opacity:0;pointer-events:none";
    document.body.appendChild(kvRitbord);
  }
  const fel=[];
  const svgs=(String(q.t||"").match(/<svg[\s\S]*?<\/svg>/gi)||[]);
  svgs.forEach((kod,si)=>{
    kvRitbord.innerHTML=kod;
    const svg=kvRitbord.querySelector("svg"); if(!svg) return;
    const vb=svg.viewBox?.baseVal;
    if(vb && vb.width){ svg.style.width=vb.width+"px"; svg.style.height=vb.height+"px"; }
    const sr=svg.getBoundingClientRect();
    const pt=(el,x,y)=>{ const m=el.getScreenCTM(); const p=svg.createSVGPoint(); p.x=x; p.y=y; const r=p.matrixTransform(m); return {x:r.x,y:r.y}; };
    const syns=el=>{ const cs=getComputedStyle(el); return cs.display!=="none" && cs.visibility!=="hidden" && cs.opacity!=="0"; };
    const linjer=[];
    const ordning=new Map([...svg.querySelectorAll("*")].map((el,i)=>[el,i]));
    const streck=el=>{ const cs=getComputedStyle(el); return {farg:cs.stroke, bredd:parseFloat(cs.strokeWidth)||0}; };
    const tung=el=>{ const s=streck(el); return s.bredd>=1.4 && !kvLjus(el.getAttribute("stroke")||"") && s.farg!=="none"; };
    const nyLinje=(el,a,b)=>linjer.push(Object.assign([a,b],{ord:ordning.get(el)}));
    svg.querySelectorAll("line").forEach(el=>{ if(!syns(el)||!tung(el)) return;
      const g=n=>el[n].baseVal.value; nyLinje(el,pt(el,g("x1"),g("y1")),pt(el,g("x2"),g("y2"))); });
    svg.querySelectorAll("polyline,polygon").forEach(el=>{ if(!syns(el)||!tung(el)) return;
      const p=[...el.points].map(x=>pt(el,x.x,x.y)); for(let i=1;i<p.length;i++) nyLinje(el,p[i-1],p[i]);
      if(el.tagName.toLowerCase()==="polygon" && p.length>2) nyLinje(el,p[p.length-1],p[0]); });
    svg.querySelectorAll("path").forEach(el=>{ if(!syns(el)||!tung(el)) return;
      const d=el.getAttribute("d")||"";
      if(!/^\s*M[\d\s.,-]+(L[\d\s.,-]+)+Z?\s*$/i.test(d) || /[a-km-yA-KN-Y]/.test(d.replace(/[MLZ]/gi,""))) return;
      const tal=d.replace(/[MLZ]/gi," ").trim().split(/[\s,]+/).map(Number);
      const p=[]; for(let i=0;i+1<tal.length;i+=2) p.push(pt(el,tal[i],tal[i+1]));
      for(let i=1;i<p.length;i++) nyLinje(el,p[i-1],p[i]); });
    /* Fyllda former som ritas ovanpå en linje döljer den (t.ex. en ledning bakom amperemeterns cirkel). */
    const fyllda=[...svg.querySelectorAll("rect,circle,ellipse,polygon")].filter(el=>{
      if(!syns(el)) return false;
      const cs=getComputedStyle(el);
      return cs.fill && cs.fill!=="none" && !/rgba\([^)]*,\s*0\)/.test(cs.fill) && (parseFloat(cs.fillOpacity)||1)>0.5;
    }).map(el=>({ord:ordning.get(el),r:el.getBoundingClientRect(),cirkel:/circle|ellipse/i.test(el.tagName)}));
    const skymd=(linje,t)=>{
      const cx=(t.r.x0+t.r.x1)/2, cy=(t.r.y0+t.r.y1)/2;
      return fyllda.some(f=>f.ord>linje.ord && (f.cirkel
        ? Math.hypot(cx-(f.r.left+f.r.right)/2,cy-(f.r.top+f.r.bottom)/2)<=Math.min(f.r.width,f.r.height)/2
        : cx>=f.r.left && cx<=f.r.right && cy>=f.r.top && cy<=f.r.bottom));
    };
    const cirklar=[];
    svg.querySelectorAll("circle,ellipse").forEach(el=>{ if(!syns(el)||!tung(el)) return;
      const m=el.getScreenCTM(); const r=(el.r?el.r.baseVal.value:el.rx.baseVal.value)*Math.abs(m.a);
      if(r<12) return; cirklar.push({c:pt(el,el.cx.baseVal.value,el.cy.baseVal.value),r}); });
    // Roterad text (t.ex. längs en linje) får en missvisande rak ruta och hoppas över.
    const rak=el=>{ const m=el.getScreenCTM(); return !m || (Math.abs(m.b)<1e-6 && Math.abs(m.c)<1e-6); };
    const texter=[...svg.querySelectorAll("text")].filter(el=>syns(el) && el.textContent.trim() && rak(el)).map(el=>{
      const b=el.getBoundingClientRect();
      // Bara linjer genom textens mitt räknas; etiketter som ligger an mot en linje är avsiktliga.
      const kx=b.width*0.30, ky=b.height*0.36;
      return {txt:el.textContent.trim(), r:{x0:b.left+kx,x1:b.right-kx,y0:b.top+ky,y1:b.bottom-ky}, hel:b};
    }).filter(t=>t.r.x1>t.r.x0 && t.r.y1>t.r.y0);
    const krock=new Map();
    const lagg=(t,vad)=>{ if(!krock.has(t.txt)) krock.set(t.txt,new Set()); krock.get(t.txt).add(vad); };
    texter.forEach(t=>{
      if(t.hel.left<sr.left-2 || t.hel.right>sr.right+2 || t.hel.top<sr.top-2 || t.hel.bottom>sr.bottom+2) lagg(t,"utanför bilden");
      if(linjer.some(l=>kvSegmentIRuta(l[0],l[1],t.r) && !skymd(l,t))) lagg(t,"linje");
      cirklar.forEach(c=>{
        const nx=Math.max(t.r.x0,Math.min(c.c.x,t.r.x1)), ny=Math.max(t.r.y0,Math.min(c.c.y,t.r.y1));
        const nara=Math.hypot(nx-c.c.x,ny-c.c.y);
        const fjarr=Math.max(...[[t.r.x0,t.r.y0],[t.r.x1,t.r.y0],[t.r.x0,t.r.y1],[t.r.x1,t.r.y1]].map(([x,y])=>Math.hypot(x-c.c.x,y-c.c.y)));
        if(nara<c.r-1 && fjarr>c.r+1) lagg(t,"cirkel");
      });
    });
    for(let i=0;i<texter.length;i++) for(let j=i+1;j<texter.length;j++){
      const a=texter[i].r, b=texter[j].r;
      if(a.x0<b.x1 && b.x0<a.x1 && a.y0<b.y1 && b.y0<a.y1){ lagg(texter[i],"annan etikett"); lagg(texter[j],"annan etikett"); }
    }
    /* Små fynd: siffror vid axlar, eller en enda kort etikett (högst två tecken) som en linje
       går igenom. Tydliga fynd: flera krockar i samma figur, längre etiketter, text över text
       och text utanför bilden. */
    krock.forEach((vad,txt)=>{
      const baraLinje=[...vad].every(v=>v==="linje");
      const axeltal=/^[−-]?\d+(?:[.,]\d+)?$/.test(txt) && baraLinje;
      const kort=baraLinje && krock.size===1 && txt.replace(/\s/g,"").length<=2;
      fel.push({text:`${svgs.length>1?"figur "+(si+1)+": ":""}"${txt.slice(0,24)}" – ${[...vad].join(", ")}`,liten:axeltal||kort});
    });
  });
  kvRitbord.innerHTML="";
  return fel;
}

const KV_PLURAL=/\b(?:varje (?:funktion|föremål|kropp|fall|ekvation|uttryck|integral|tal|ekvationssystem|polynom|graf|kurva|talföljd|situation|del)|ekvationerna|uttrycken|integralerna|funktionerna|derivatorna|gränsvärdena|olikheterna|ekvationssystemen|polynomen|talföljderna|följande (?:uttryck|ekvationer|funktioner|integraler|tal)|i alla (?:två|tre|fyra|fem) fallen|deluppgifterna)\b/i;
function kvPlural(t){
  if(t.spelDelning!=="deluppgifter" || !Array.isArray(t.spelDelar) || t.spelDelar.length<2) return [];
  const m=kvText(t.spelIntro).match(KV_PLURAL);

/* ── Kontroll 4: miniräknare ── */
const KV_JAMNA_VINKLAR=new Set([0,30,45,60,90,120,135,150,180,210,225,240,270,300,315,330,360]);
function kvFulTal(x){
  if(typeof x!=="number" || !Number.isFinite(x) || Number.isInteger(x)) return false;
  for(let n=2;n<=12;n++) if(Math.abs(x*n-Math.round(x*n))<1e-9) return false;
  const s=String(Math.abs(x));
  return !(s.split(".")[1]?.length<=2 && s.replace(".","").replace(/^0+/,"").length<=3);
}
function kvRaknare(t,kurs){
  if(t["miniräknare"]!==false) return [];
  if(COURSES[kurs]?.subject==="Fysik") return ["fysik ska alltid ha miniräknare"];
  if(!kvMatte(kurs) || KV_RAKNARE_GRANSKADE.has(kurs+":"+t.id)) return [];
  const txt=kvText(t.t);
  if(/exakt|utan (?:mini)?räknare|utan digitalt|huvudräkning|överslag/i.test(txt)) return [];
  const skal=[];
  if(/digitalt verktyg|geogebra/i.test(txt)) skal.push("digitalt verktyg efterfrågas");
  if(/avrunda|decimal|värdesiffr|närmevärde|≈/i.test(txt)) skal.push("avrundning eller decimaler efterfrågas");
  const tal=(function plocka(v){ return Array.isArray(v)?v.flatMap(plocka):[v]; })(t["rättSvar"]).filter(v=>typeof v==="number");
  if(tal.some(kvFulTal)) skal.push("svaret har många decimaler");
  const vinklar=[...txt.matchAll(/(?:sin|cos|tan)\s*\(?\s*(\d+(?:[.,]\d+)?)\s*°/g)].map(m=>parseFloat(m[1].replace(",",".")));
  if(vinklar.some(v=>!KV_JAMNA_VINKLAR.has(v))) skal.push("trigonometri med ojämn vinkel");
  return skal.length ? [skal.join("; ")] : [];
}

async function kvMarkera(nr,ok){
  const f=kv.fynd?.[nr]; if(!f) return;
  const r=await klassRpc("kg_admin_kvalitet_ok",{p_kurs:f.kurs,p_uppgift:String(f.id),p_kontroll:f.kontroll,p_signatur:f.sig,p_ok:ok});
  if(r?.saknas){ toast("Kör sql/2026-10-07-kvalitet.sql i Supabase först."); return; }
  if(!r?.ok){ toast("Kunde inte spara."); return; }
  const k=f.kurs+"|"+f.id+"|"+f.kontroll;
  ok ? kv.ok.set(k,f.sig) : kv.ok.delete(k);
  kvRita();
}

/* ── Visning ── */
function kvSynliga(){
  return (kv.fynd||[]).map((f,nr)=>({...f,nr})).filter(f=>(kv.visaOk || !kvArOk(f)) && (kv.visaSma || !f.liten) && (!kv.filter || f.kontroll===kv.filter));
}
function kvRapportText(){
  const rader=["Kvalitetsrapport · Kunskapsgymmet · "+new Date().toLocaleDateString("sv-SE"),""];
  let kurs=null;
  kvSynliga().forEach(f=>{
    if(f.kurs!==kurs){ kurs=f.kurs; rader.push("",(COURSES[kurs]?.name||kurs)+"  ["+kurs+"]"); }
    rader.push(`  #${f.id}  ${KV_KONTROLL[f.kontroll].kort}`+f.detalj.map(d=>"\n      "+d).join(""));
  });
  return rader.join("\n");
}
function kvKopiera(){
  navigator.clipboard?.writeText(kvRapportText()).then(()=>toast("Rapporten är kopierad.")).catch(()=>toast("Kunde inte kopiera."));
}
function kvVisaUppgift(nr,knapp){
  const f=kv.fynd?.[nr]; const box=document.getElementById("kvvisa-"+nr); if(!f||!box) return;
  if(!box.hidden){ box.hidden=true; knapp.textContent="Visa"; return; }
  let q=f.uppgift;
  try{ q=expandGameTask(f.uppgift).find(x=>String(x.id)===String(f.id))||f.uppgift; }catch(_){}
  box.innerHTML=`<div class="kvuppgift tbody">${q.t||""}</div>
    <p class="kvfacit"><b>Facit:</b> ${esc(JSON.stringify(q["rättSvar"]))}${q.svarFormat?` · format ${esc(JSON.stringify(q.svarFormat))}`:""}${q.svarEnhet?` · enhet ${esc(JSON.stringify(q.svarEnhet))}`:""} · miniräknare ${q["miniräknare"]===true?"ja":q["miniräknare"]===false?"nej":"–"}</p>`;
  box.hidden=false; knapp.textContent="Dölj";
  renderMath(box);
}
let kvRitaTimer=null;
function kvRita(snabb){
  const host=document.getElementById("adminlista"); if(!host || kgAdminFlik!=="kvalitet") return;
  if(snabb){ const s=document.getElementById("kvstatus"); if(s){ s.textContent=kv.status; return; } }
  const fynd=kv.fynd;
  const antal=k=>(fynd||[]).filter(f=>f.kontroll===k && (kv.visaOk || !kvArOk(f)) && (kv.visaSma || !f.liten)).length;
  const sma=(fynd||[]).filter(f=>f.liten && (kv.visaOk || !kvArOk(f))).length;
  const syn=kvSynliga();
  let kurs=null;
  host.innerHTML=`<div class="kvtopp">
      <select class="admin-sok" id="kvkurs" onchange="kv.kurs=this.value" ${kv.kor?"disabled":""}>
        <option value="alla"${kv.kurs==="alla"?" selected":""}>Alla kurser</option>
        ${Object.entries(COURSES).map(([id,c])=>`<option value="${id}"${kv.kurs===id?" selected":""}>${esc(c.name)}</option>`).join("")}
      </select>
      <button class="btn sm primary" onclick="kvKor()" ${kv.kor?"disabled":""}>${fynd?"Granska igen":"Granska"}</button>
      ${fynd&&!kv.kor?`<button class="btn sm" onclick="kvKopiera()">Kopiera rapport</button>
        <label class="kvvisaok"><input type="checkbox" ${kv.visaOk?"checked":""} onchange="kv.visaOk=this.checked;kvRita()"> Visa fynd markerade som OK</label>
        <label class="kvvisaok"><input type="checkbox" ${kv.visaSma?"checked":""} onchange="kv.visaSma=this.checked;kvRita()"> Visa små fynd (siffror vid axlar${sma?", "+sma+" st":""})</label>`:""}
    </div>
    ${kv.kor?`<p class="modal-text" id="kvstatus">${esc(kv.status)}</p>`:""}
    ${!fynd&&!kv.kor?`<p class="modal-text">Granskningen kontrollerar facit, figurer, kortinledningar och miniräknare i bankerna, med appens egen rättning och ritning.
      Markera fynd som är rätt som <b>OK</b>, så visas de inte igen så länge uppgiften är oförändrad.
      Kopiera rapporten och klistra in den i chatten med Claude för åtgärd i Uppgiftslabbet.</p>`:""}
    ${kv.okSaknas?`<p class="modal-text">OK-markeringar kräver att sql/2026-10-07-kvalitet.sql är körd i Supabase.</p>`:""}
    ${fynd&&!kv.kor?`<div class="kvchips">
        <button class="${!kv.filter?"pa":""}" onclick="kv.filter=null;kvRita()">Alla <b>${Object.keys(KV_KONTROLL).reduce((s,k)=>s+antal(k),0)}</b></button>
        ${Object.entries(KV_KONTROLL).map(([k,v])=>`<button class="${kv.filter===k?"pa":""}" onclick="kv.filter='${k}';kvRita()">${esc(v.txt)} <b>${antal(k)}</b></button>`).join("")}
      </div>
      ${syn.length?syn.slice(0,400).map(f=>{
        const rubrik=f.kurs!==kurs ? `<h3 class="kvkurs">${esc(COURSES[f.kurs]?.name||f.kurs)}</h3>` : "";
        kurs=f.kurs;
        const ok=kvArOk(f);
        return `${rubrik}<div class="kvfynd${ok?" kvok":""}">
            <div class="kvrad"><span><b>#${esc(f.id)}</b> <span class="kvtyp kvtyp-${f.kontroll}">${esc(KV_KONTROLL[f.kontroll].kort)}</span>
              <small>${f.detalj.map(esc).join("<br>")}</small></span>
              <span class="kvknappar"><button class="btn sm quiet" onclick="kvVisaUppgift(${f.nr},this)">Visa</button>
              <button class="btn sm ${ok?"":"quiet"}" onclick="kvMarkera(${f.nr},${ok?"false":"true"})">${ok?"Ångra OK":"OK"}</button></span></div>
            <div class="kvvisa" id="kvvisa-${f.nr}" hidden></div></div>`;
      }).join("")+(syn.length>400?`<p class="modal-text">Visar de första 400 av ${syn.length}. Filtrera på en kontroll eller kurs.</p>`:"")
      :`<p class="modal-text">Inga fynd${kv.filter?" för den här kontrollen":""}. 🎉</p>`}`:""}`;
}
</script>
