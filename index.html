.summary .passring .num{align-content:center;gap:4px;font-size:38px;line-height:1}
.summary .passring .num b{font-weight:750;letter-spacing:-.055em}
.summary .passring .num b i{font-style:normal;font-size:.5em;font-weight:650;margin-left:2px;color:var(--ink2);letter-spacing:0}
.summary .passring .num small{margin:0;font-size:12px}
.summary .rankrow .ringwrap>.ring{width:58px;height:58px}
.tilebonus{display:block;margin-top:3px;font-style:normal;font-size:11.5px;color:var(--gold)}
.summary h1{font-size:30px;margin-top:22px;letter-spacing:-.045em}
.summary p{color:var(--ink2);margin:10px 0 0;font-family:var(--read);letter-spacing:0}
.sumtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 0 24px}

.rekord{
  display:flex;align-items:center;gap:13px;text-align:left;margin:0 0 18px;
  padding:13px 16px;border-radius:17px;
  border:1px solid var(--hair);background:var(--surface2);
}
.rekord .ikon{
  width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;
  background:var(--surface3);color:var(--ink3);
}
.rekord .marke{width:19px}
.rekord b{display:block;font-size:14px;letter-spacing:-.02em}
.rekord small{display:block;margin-top:2px;font-size:12.5px;color:var(--ink3)}
.rekord.ny{
  border-color:transparent;
  background:linear-gradient(140deg,var(--goldSoft),var(--surface2));
  box-shadow:0 12px 28px -18px rgba(180,140,50,.9);
}
.rekord.ny .ikon{background:linear-gradient(155deg,#f3d99f,#c99b3b);color:#402f08;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.rekord.ny b{color:var(--gold)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:11px 16px;border-radius:13px;background:var(--ink);color:var(--bg);box-shadow:var(--e2);
  transition:.25s var(--ease);z-index:60;font-size:13.5px;font-weight:500;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Tränaren som chattassistent i hörnet under passet: visselpipan som
   knapp och en pratbubbla där texten skrivs fram. */
.tchat{position:fixed;right:18px;bottom:18px;z-index:58;display:flex;flex-direction:column;align-items:flex-end;gap:10px;
  pointer-events:none}
.tchat>*{pointer-events:auto}
.tchat-av{border:0;padding:0;background:none;cursor:pointer;border-radius:50%;transition:transform .2s var(--ease),opacity .25s;
  opacity:0;transform:scale(.6)}
.tchat.synlig .tchat-av{opacity:1;transform:none}
.tchat-av .pt-avatar{width:52px;height:52px;box-shadow:0 10px 26px -8px color-mix(in srgb,var(--acc) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.tchat-av:hover{transform:translateY(-2px)}
.tchat-av:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.tchat-av.ny .pt-avatar{animation:tchatPuls 1.2s var(--ease) 2}
@keyframes tchatPuls{50%{transform:scale(1.08)}}
.tchat-bubbla{position:relative;width:min(300px,calc(100vw - 36px));padding:12px 34px 13px 14px;border-radius:16px 16px 4px 16px;
  background:var(--surface);border:1px solid color-mix(in srgb,var(--acc) 30%,var(--hair));color:var(--ink2);
  box-shadow:0 18px 40px -18px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.08);
  font-family:var(--read);font-size:14px;line-height:1.45;
  opacity:0;transform:translateY(10px) scale(.97);transform-origin:100% 100%;transition:opacity .22s var(--ease),transform .22s var(--ease);
  pointer-events:none}
.tchat-bubbla.visa{opacity:1;transform:none;pointer-events:auto}
.tchat-namn{display:block;font-family:var(--ui,inherit);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accInk);margin-bottom:3px}
.tchat-txt{margin:0}
.tchat-knappar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tchat-txt b{color:var(--ink)}
.tchat-x{position:absolute;top:7px;right:7px;width:24px;height:24px;border:0;border-radius:7px;background:none;color:var(--ink3);
  font-size:16px;line-height:1;cursor:pointer}
.tchat-x:hover{background:var(--surface2);color:var(--ink)}
@media(max-width:620px){
  .tchat{right:12px;bottom:12px}
  .tchat-av .pt-avatar{width:44px;height:44px}
  .tchat-bubbla{width:min(250px,calc(100vw - 24px));font-size:13.5px}
}
@media(prefers-reduced-motion:reduce){.tchat-av.ny .pt-avatar{animation:none}}

.modal{
  position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;
  background:rgba(6,14,26,.5);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;transition:opacity .25s var(--ease);
}
.modal.visa{opacity:1}
.modal-kort{
  width:min(560px,100%);max-height:86vh;overflow:auto;padding:24px;border-radius:26px;
  background:var(--surface);border:1px solid var(--hair);box-shadow:var(--e2);
  transform:scale(.95) translateY(10px);transition:.3s var(--ease);
}
.modal.visa .modal-kort{transform:none}
.modal-topp{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
.modal-topp>div{flex:1;min-width:0}
.modal-topp .lbl{
  font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
}
.modal-topp h2{margin-top:6px;font-size:22px;letter-spacing:-.04em}
.gg-modalrubrik{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.gg-modalrubrik h2{margin-right:2px}
.gg-formelknapp{
  display:flex;align-items:center;gap:5px;padding:5px 8px;margin-top:6px;
  border-radius:9px;border:1px solid var(--hair);background:transparent;
  color:var(--ink3);font-size:11px;font-weight:650;transition:.2s var(--ease)
}
.gg-formelknapp svg{width:14px;height:14px}
.gg-formelknapp:hover{color:var(--accInk);background:var(--accSoft);border-color:color-mix(in srgb,var(--acc) 30%,var(--hair))}
#formelruta{z-index:76}
.modal-text{margin:4px 0 16px;font-family:var(--read);font-size:14px;color:var(--ink2);letter-spacing:0}
.valgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.valruta{
  --tone:var(--ink3);
  display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:15px;text-align:left;
  border:1px solid var(--hair);background:var(--surface2);transition:.2s var(--ease);
}
.valruta:hover{border-color:var(--hair2)}
.valruta .kryss{
  width:19px;height:19px;flex:none;border-radius:6px;border:1.5px solid var(--hair2);
  display:grid;place-items:center;transition:.2s var(--ease);
}
.valruta.vald{border-color:var(--acc);background:var(--accSoft)}
.valruta.vald .kryss{background:var(--acc);border-color:var(--acc)}
.valruta.vald .kryss:after{content:"✓";color:#fff;font-size:12px;font-weight:700;line-height:1}
.valnamn{flex:1;min-width:0;font-size:13.5px;font-weight:600;letter-spacing:-.015em}
.valstate{font-size:11px;font-weight:600;color:var(--tone)}
.valruta.t-good{--tone:var(--good)}.valruta.t-mid{--tone:var(--accInk)}
.valruta.t-low{--tone:var(--low)}
.modal-fot{display:flex;align-items:center;gap:8px;margin-top:20px;flex-wrap:wrap}
.modal-fot .spacer{flex:1}
/* Varningsvariant: samma kort, men rött genomgående så den känns som en
   tillsägelse och inte som ännu en informationsruta. */
.modal-kort.varning{
  border-color:color-mix(in srgb,var(--bad) 45%,var(--hair));
  box-shadow:var(--e2),0 0 0 4px var(--badSoft);
}
.modal-kort.varning .modal-topp .lbl{color:var(--bad)}
.modal-kort.varning .modal-topp h2{color:var(--bad)}
.modal-kort.varning .varningsmark{
  width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:var(--badSoft);color:var(--bad);font-size:19px;font-weight:700;line-height:1;
}
.modal-kort.varning .btn.primary{
  background:var(--bad);border-color:transparent;color:#fff;
  box-shadow:0 8px 20px -9px color-mix(in srgb,var(--bad) 70%,transparent);
}
@media(max-width:520px){
  .modal-kort{padding:20px;border-radius:22px}
  .valgrid{grid-template-columns:1fr}
  .modal-fot .btn.primary{width:100%;order:-1;margin-bottom:6px}
}
.kaptrana.valj{background:var(--accSoft);border-color:transparent;color:var(--accInk)}

.typ-kort{width:min(680px,100%)}
/* Raden klistrar sig överst i kortet när man skrollar, så att bläddringen
   följer med genom långa genomgångar. Negativa marginaler låter bakgrunden
   täcka kortets sidopadding. */
.typ-topnav{
  position:sticky;top:-1px;z-index:5;
  display:flex;align-items:center;gap:12px;
  margin:-10px -24px 4px;padding:11px 24px;
  background:var(--surface);border-bottom:1px solid var(--hair);
}
.typ-topnav .typ-stig{flex:1;min-width:0;margin:0}
.ggnav{
  width:36px;height:36px;flex:none;border-radius:12px;
  display:grid;place-items:center;
  font-size:17px;line-height:1;font-weight:600;
  border:1px solid var(--hair);background:var(--surface2);color:var(--ink2);
  transition:.18s var(--ease);
}
.ggnav:hover:not(:disabled){
  background:var(--accSoft);color:var(--accInk);
  border-color:color-mix(in srgb,var(--acc) 30%,var(--hair));
}
.ggnav:active:not(:disabled){transform:scale(.94)}
.ggnav:disabled{opacity:.3;cursor:default}
@media(max-width:620px){
  .typ-topnav{margin:-8px -18px 4px;padding:10px 18px;gap:9px}
  .ggnav{width:40px;height:40px}
  .typ-stig i{width:6px;height:6px}
  .typ-stig i.nu{width:16px}
}

.typ-stig{display:flex;align-items:center;gap:5px;margin:14px 0 2px;flex-wrap:wrap}
.typ-stig i{
  width:7px;height:7px;border-radius:50%;background:var(--hair2);flex:none;
  transition:.25s var(--ease);
}
.typ-stig i.gjord{background:var(--ink3)}
.typ-stig i.last{background:var(--gold)}
.typ-stig i.nu{width:20px;border-radius:99px;background:var(--acc)}
.typ-rakn{margin-left:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3)}

.typ-omr{
  font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);margin-top:16px;
}
.typ-familj{font-size:20px;letter-spacing:-.035em;margin:5px 0 0;line-height:1.2}

.typ-block{margin-top:16px;border:1px solid var(--hair);border-radius:18px;overflow:hidden;background:var(--surface2)}

/* Typuppgiften är kortets huvudsak — allt annat på sidan är stöd åt
   den. Den får därför accentram, egen bakgrund, större brödtext och
   en skugga som lyfter den ur ytan. Genomgången under är avsiktligt
   nedtonad, annars konkurrerar de två blocken om blicken. */
.typ-block.fraga{
  position:relative;margin-top:18px;border-radius:20px;
  border:1.5px solid color-mix(in srgb,var(--acc) 42%,transparent);
  background:linear-gradient(180deg,var(--accSoft),transparent 62%),var(--surface);
  box-shadow:0 1px 2px rgba(11,33,51,.05),0 18px 34px -22px color-mix(in srgb,var(--acc) 55%,transparent);
}
.typ-block.fraga:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--acc),color-mix(in srgb,var(--acc) 35%,transparent));
}
.typ-block.fraga > .typ-lbl{
  color:var(--accInk);font-weight:700;background:transparent;
  border-bottom:1px solid color-mix(in srgb,var(--acc) 20%,transparent);
  padding-left:19px;
}
.typ-block.fraga > .typ-kropp{padding:17px 18px 19px 19px;font-size:16px;line-height:1.6;color:var(--ink)}
.typ-block.fraga > .typ-kropp p{font-weight:500}
@media(max-width:520px){.typ-block.fraga > .typ-kropp{font-size:15px}}
.typ-block > .typ-lbl{
  display:flex;align-items:center;gap:7px;padding:9px 15px;
  font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);border-bottom:1px solid var(--hair);background:var(--surface);
}
.typ-block > .typ-lbl b{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none}
.typ-block.losning > .typ-lbl b{background:var(--good)}
.typ-kropp{padding:15px;font-family:var(--read);font-size:14.5px;line-height:1.65;color:var(--ink)}
.typ-kropp > * + *{margin-top:10px}
.typ-kropp p{margin:0}
.typ-kropp ol,.typ-kropp ul{margin:0;padding-left:22px}
.typ-kropp li + li{margin-top:6px}
.typ-kropp img,.typ-kropp svg:not(.katex svg){max-width:100%;height:auto}
.typ-kropp table{border-collapse:collapse;max-width:100%}
.typ-kropp th,.typ-kropp td{border:1px solid var(--hair2);padding:7px 12px;text-align:center}
.typ-kropp th{background:var(--surface2);font-weight:700;color:var(--ink2)}
.typ-kropp .katex-display{overflow-x:auto;overflow-y:hidden}

/* Temasäkra diagram i genomgångarna. SVG-element utan explicita färger
   blir annars svarta och tappar kontrast i mörkt läge. */
.dg{display:block;max-width:100%;height:auto;color:var(--ink2)}
.dg-rut{fill:none;stroke:var(--hair2);stroke-width:1}
.dg-axel,.dg-form,.dg-grenar{fill:none;stroke:var(--ink2);stroke-width:2}
.dg-pil{fill:var(--ink2)}
.dg-txt,.dg-not{fill:var(--ink2);font-family:var(--read);font-size:12px}
.dg-linje{fill:none;stroke:var(--acc);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.dg-matt{fill:var(--acc);stroke:var(--surface);stroke-width:1.5}
.dg-vald{fill:var(--gold);stroke:var(--surface);stroke-width:1.8}
.dg-skar{fill:var(--good);stroke:var(--surface);stroke-width:1.5}
.dg-delta,.dg-vinkel,.dg-gren-vald{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dg-hjalp{fill:none;stroke:var(--ink3);stroke-width:1.3;stroke-dasharray:5 5}
.dg-avl,.dg-etikett{fill:var(--gold);font-family:var(--read);font-size:12px;font-weight:650}
.dg-vek1{fill:none;stroke:var(--acc);stroke-width:3}.dg-spets1{fill:var(--acc)}
.dg-vek2{fill:none;stroke:var(--good);stroke-width:3}.dg-spets2{fill:var(--good)}
.dg-vek3{fill:none;stroke:var(--gold);stroke-width:3}.dg-spets3{fill:var(--gold)}
.dg-sp2{fill:var(--good)}
.dg-e1{fill:var(--acc)}.dg-e2{fill:var(--good)}.dg-e3{fill:var(--gold)}
.dg-nod{fill:var(--gold);stroke:var(--surface);stroke-width:1.5}
.dg-vagbild{width:100%;min-width:0}
.dg-rubrik{fill:var(--ink);font-family:var(--ui);font-size:14px;font-weight:750}
.dg-liten{fill:var(--ink3);font-family:var(--read);font-size:12px}
.dg-strang{fill:none;stroke:var(--hair2);stroke-width:1.5}
.dg-fast,.dg-ror{fill:none;stroke:var(--ink3);stroke-width:3;stroke-linecap:round}
.dg-spegel{fill:none;stroke:var(--acc);stroke-width:2.2;stroke-dasharray:7 6;opacity:.48;stroke-linecap:round}
.dg-buk{fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round}
.gg-figur{margin-top:10px;padding:8px;border-radius:14px;background:var(--surface);border:1px solid var(--hair)}
.gg-figur.huvud{margin:14px 0 2px;padding:14px;background:color-mix(in srgb,var(--surface) 88%,var(--acc) 12%)}

.gg-ram{margin:11px 0 0;font-family:var(--read);font-size:14px;line-height:1.65;color:var(--ink2)}
.gg-ram em{color:var(--ink);font-style:normal;font-weight:600}
.gg-huvudformel{
  margin:12px 0 0;padding:10px 14px;border-radius:13px;
  background:color-mix(in srgb,var(--acc) 8%,var(--surface));
  border:1px solid color-mix(in srgb,var(--acc) 28%,var(--hair));
  color:var(--ink)
}
.gg-huvudformel .katex-display{margin:0;overflow-x:auto;overflow-y:hidden}

.gg-lista{list-style:none;margin:0;padding:0;counter-reset:none}
.gg-steg{display:flex;gap:12px;align-items:flex-start}
.gg-steg + .gg-steg{margin-top:16px;padding-top:16px;border-top:1px solid var(--hair)}
.gg-nr{
  flex:none;width:23px;height:23px;border-radius:8px;margin-top:1px;
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;
  background:var(--accSoft);color:var(--accInk);
}
.gg-txt{flex:1;min-width:0}
.gg-txt h4{margin:0 0 5px;font-size:14px;letter-spacing:-.02em;line-height:1.35;color:var(--ink)}
.gg-txt p{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink2)}
.gg-txt em{color:var(--ink);font-style:normal;font-weight:600}
.gg-matte{margin-top:9px;padding:9px 12px;border-radius:12px;background:var(--surface);
  border:1px solid var(--hair);overflow-x:auto;overflow-y:hidden}
.gg-matte .katex-display{margin:0}
.gg-matte .katex-display + .katex-display{margin-top:6px}
.gg-svar{
  margin:16px 0 0;padding:11px 13px;border-radius:12px;font-size:14px;line-height:1.6;
  background:var(--goldSoft);border:1px solid rgba(190,145,50,.28);color:var(--ink);
}

.gg-ruta{margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--hair);background:var(--surface2)}
.gg-ruta p{margin:5px 0 0;font-family:var(--read);font-size:13.5px;line-height:1.6;color:var(--ink2)}
.gg-ruta em{color:var(--ink);font-style:normal;font-weight:600}
.gg-rlbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.gg-ruta.fel{border-color:rgba(176,124,25,.30);background:var(--amberSoft)}
.gg-ruta.fel .gg-rlbl{color:var(--amber)}
.gg-ruta.bar{border-color:var(--hair2)}
.gg-formler{margin:12px 0 2px;border:1px solid var(--hair2);border-radius:14px;background:var(--surface2);overflow:hidden}
.gg-formler summary{display:flex;align-items:center;gap:9px;padding:10px 12px;cursor:pointer;list-style:none;color:var(--ink2);font-size:12.5px;font-weight:700}
.gg-formler summary::-webkit-details-marker{display:none}
.gg-formler summary svg{width:17px;height:17px;color:var(--accInk);flex:none}
.gg-formler summary .formel-antal{margin-left:auto;color:var(--ink3);font-size:10.5px;font-weight:600}
.gg-formler summary:after{content:"⌄";font-size:15px;color:var(--ink3);transition:transform .2s ease}
.gg-formler[open] summary:after{transform:rotate(180deg)}
.gg-formel-lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:7px;padding:0 10px 10px}
.gg-formel{min-width:0;padding:8px 9px;border-radius:10px;background:var(--surface);border:1px solid var(--hair)}
.gg-formel b{display:block;margin-bottom:3px;color:var(--ink3);font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.gg-formel span{font-size:13px;color:var(--ink)}
.gg-formel .katex{font-size:.98em}
.formel-kort{width:min(660px,100%)}
.formel-intro{margin:8px 0 16px;color:var(--ink2);font-family:var(--read);font-size:13.5px;line-height:1.55}
.formel-kort .gg-formel-lista{padding:0;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}
.formel-kort .gg-formel{padding:11px 12px;background:var(--surface2)}
.formel-kort .gg-formel b{margin-bottom:5px}
.formel-kort .gg-formel span{font-size:14px}

.typ-nav{display:flex;align-items:center;gap:8px;margin-top:20px;flex-wrap:wrap}
.typ-nav .spacer{flex:1}
@media(max-width:520px){
  .typ-familj{font-size:17px}
  .typ-nav .btn{flex:1 1 auto}
  .typ-nav .spacer{display:none}
}

.cheer{
  position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
  background:rgba(6,18,30,.46);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;pointer-events:none;transition:opacity .4s var(--ease);
}
.cheer.show{opacity:1;pointer-events:auto}
.cheer-card{
  width:min(370px,100%);padding:38px 30px 26px;border-radius:30px;text-align:center;
  background:linear-gradient(180deg,var(--surface),var(--surface2));
  border:1px solid var(--hair);box-shadow:var(--e2),0 0 90px -30px rgba(200,155,60,.8);
  transform:scale(.88) translateY(14px);opacity:0;transition:.5s var(--ease);
}
.cheer.show .cheer-card{transform:none;opacity:1}
.cheer-halo{position:relative;width:104px;height:104px;margin:0 auto 22px;display:grid;place-items:center}

}
.cheer.show .cheer-halo:before{animation:halo 2.6s var(--ease) .25s 2}
.cheer.show .cheer-halo:after{animation:halo 2.6s var(--ease) .95s 2}
@keyframes halo{0%{transform:scale(.9);opacity:.6}100%{transform:scale(2);opacity:0}}
.cheer-medal{
  position:relative;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-size:34px;
  color:#3A2A05;background:linear-gradient(152deg,#FBEFD2,#EFCF8F 38%,#C89B3C 72%,#E4C185);

}
.cheer-medal:after{
  content:"";position:absolute;inset:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);
}

@keyframes cfIn{to{opacity:1;transform:none}}
.cf-medalj .cheer-medal{width:68px;height:68px;font-size:26px;margin-bottom:4px}

.cheer.show .cheer-dag circle[stroke-dasharray]{animation:dagbit .35s var(--ease) forwards}
.cheer-dag .bock{stroke-dasharray:1;stroke-dashoffset:1}
.cheer.show .cheer-dag .bock{animation:dagbock .45s var(--ease) .85s forwards}
@keyframes dagbit{from{opacity:0}to{opacity:1}}
@keyframes dagbock{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  .cheer-dag circle[stroke-dasharray]{opacity:1}
  .cheer-dag .bock{stroke-dashoffset:0}

const MOLN_PA = () => !!(SUPABASE_URL && SUPABASE_KEY);

/* E-postkonto med lösenord, samma flöde som i Uppgiftslabbet. Kräver att
   Email-providern är påslagen i Supabase (Authentication → Providers). */
const EPOST_LOGIN=true;

}

  try{
    const v=sessionStorage.getItem(KG_LOGIN_EVENT_KEY);

}

  const h={apikey:SUPABASE_KEY,"Content-Type":"application/json"};
  if(auth && session?.access_token) h.Authorization="Bearer "+session.access_token;

let inloggningsTyp=null, inloggningsFel=null;
function fangaInloggning(){
  const h=location.hash||"";
  if(h.includes("error_description=")||h.includes("error=")){
    const e=new URLSearchParams(h.replace(/^#/,""));
    inloggningsFel=decodeURIComponent(e.get("error_description")||e.get("error")||"")
      .replace(/\+/g," ");
    history.replaceState(null,"",location.pathname+location.search);
    return false;
  }
  if(!h.includes("access_token=")) return false;
  const p=new URLSearchParams(h.replace(/^#/,""));
  const at=p.get("access_token"), rt=p.get("refresh_token");
  if(!at) return false;
  inloggningsTyp=p.get("type")||null;
  sparaSession({access_token:at,refresh_token:rt,
    expires_at:Date.now()+(+(p.get("expires_in")||3600))*1000,user:null});
  history.replaceState(null,"",location.pathname+location.search);
  return true;
}

async function fornyaSession(){
  if(!session?.refresh_token) return false;
  try{
    const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",{
      method:"POST",headers:sbHeaders(false),
      body:JSON.stringify({refresh_token:session.refresh_token})});
    if(!r.ok) throw new Error("kunde inte förnya");
    const d=await r.json();
    sparaSession({access_token:d.access_token,refresh_token:d.refresh_token,
      expires_at:Date.now()+(d.expires_in||3600)*1000,user:d.user||session.user});
    return true;
  }catch(_){ sparaSession(null); return false; }

function authFel(d){
  const m=(d?.error_description||d?.msg||d?.message||"").toLowerCase();
  if(m.includes("invalid login"))            return "Fel e‑post eller lösenord.";
  if(m.includes("already registered")||m.includes("already been registered"))
                                             return "Det finns redan ett konto med den e‑posten. Logga in i stället.";
  if(m.includes("password")&&m.includes("6")) return "Lösenordet är för kort.";
  if(m.includes("password should be"))       return "Lösenordet uppfyller inte kraven.";
  if(m.includes("unable to validate")||m.includes("invalid email"))
                                             return "E‑postadressen ser inte giltig ut.";
  if(m.includes("not confirmed"))            return "Bekräfta din e‑post först. Kolla inkorgen.";
  if(m.includes("rate limit")||m.includes("too many")||m.includes("security purposes"))
                                             return "För många försök. Vänta en stund och prova igen.";
  if(m.includes("same password"))            return "Välj ett lösenord som skiljer sig från det gamla.";
  return d?.error_description||d?.msg||d?.message||"Något gick fel. Försök igen.";
}

function syncMessage(code){
  if(code==="name_taken") return "Namnet är upptaget. Prova ett annat.";
  if(code==="name_format") return "Använd 3–16 bokstäver, siffror, bindestreck eller understreck.";
  if(code==="conflict") return "En nyare profil finns. Den har hämtats; osparad träning har säkerhetskopierats på enheten.";
  if(code==="rate_limit") return "Ovanligt många uppgifter skickades samtidigt. Den senaste sparade profilen har återställts. Kontakta ansvarig om träningen stämmer.";
  if(code==="review_required") return "Din tidigare profil behöver granskas. Kontakta webbplatsens ansvarige.";
  return "Resultaten kunde inte godkännas. Den senaste sparade profilen har återställts.";
}
/* Servern (kg_profile) släpper bara igenom medaljer den känner till. En
   medalj som saknas i serverns lista försvinner alltså ur profilen vid
   varje sparning, och checkBadges() delar ut den igen vid nästa svar.
   Därför markeras alla medaljer vars villkor redan är uppfyllt, tyst,
   så snart en profil från molnet installeras. Då firas en medalj bara
   när villkoret faktiskt uppfylls för första gången. */
function markeraUppfylldaMedaljer(){
  profile.badges ||= {};
  for(const b of BADGES){
    if(profile.badges[b.id]) continue;
    let cur=0;
    try{ cur=b.cur()||0; }catch(_){ continue; }
    if(cur>=b.max) profile.badges[b.id]=Date.now();
  }
}
function installCloudProfile(reply){
  profile=loadProfileFrom(reply.data);
  markeraUppfylldaMedaljer();
  acceptedProfile=JSON.parse(JSON.stringify(profile));
  syncRevision=reply.revision;
  pushKo=false;
  cacheCloudProfile();
}
function recoverCloudProfile(reply){
  backupLocalProfile(reply.code);
  installCloudProfile(reply);
  rensaPagaendePass();
  state.currentTask=null;
  state.view=state.course&&state.data?"dashboard":"home";
  render();
  toast(syncMessage(reply.code));
}
async function sendProfileNow(){
  if(!MOLN_PA() || !session || !syncOwner || syncRevision===null) return {ok:false};
  const uid=syncOwner;
  if(uid!==session.user?.id) return {ok:false};
  const snapshot=JSON.stringify(profile);
  try{
    const reply=await cloudRpc("save",JSON.parse(snapshot),syncRevision);
    if(uid!==syncOwner || uid!==session?.user?.id) return {ok:false};
    if(!reply.ok){
      if(reply.data) recoverCloudProfile(reply);
      else toast(syncMessage(reply.code));
      return reply;
    }
    acceptedProfile=JSON.parse(JSON.stringify(reply.data));
    syncRevision=reply.revision;
    syncRetry=0;
    if(JSON.stringify(profile)===snapshot){
      installCloudProfile(reply);
    }else{
      pushKo=true;
      cacheCloudProfile();
      schemalaggPush();
    }
    return reply;
  }catch(err){
    if(uid!==syncOwner || uid!==session?.user?.id) return {ok:false};
    pushKo=true;
    cacheCloudProfile();
    if(!syncRetry) toast(err.message);
    syncRetry++;
    if(err.status!==404 && err.status!==401 && err.status!==403){
      clearTimeout(pushTimer);
      pushTimer=setTimeout(skickaMolnprofil,Math.min(60000,5000*2**Math.min(syncRetry,4)));
    }
    return {ok:false,fel:err.message};
  }
}
function skickaMolnprofil(){ return serialSync(sendProfileNow); }
function schemalaggPush(){
  if(!MOLN_PA() || !session || !syncOwner) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(skickaMolnprofil,2500);
}
async function synkaProfil(){
  if(!MOLN_PA() || !session) return;
  const user=await hamtaAnvandare();
  if(!user) return;
  syncOwner=user.id;
  let cached=null;
  try{ cached=JSON.parse(localStorage.getItem(localSyncKey(user.id))); }catch(_){}
  if(cached?.data && Number.isSafeInteger(cached.revision)){
    profile=loadProfileFrom(cached.data);
    syncRevision=cached.revision;
    pushKo=!!cached.pending;
  }else{
    backupLocalProfile("before-account-sync");
    profile=loadProfileFrom({});
  }
  try{
    const reply=await cloudRpc("read");
    if(syncOwner!==user.id || session?.user?.id!==user.id) return;
    if(!reply.ok || !reply.data) throw new Error("Kunde inte hämta din sparade profil.");
    acceptedProfile=JSON.parse(JSON.stringify(reply.data));
    if(cached?.pending && cached.revision===reply.revision && !reply.review){
      await skickaMolnprofil();
    }else{
      if(cached?.pending){ backupLocalProfile("startup-conflict"); rensaPagaendePass(); }
      installCloudProfile(reply);
      if(cached?.pending) toast(syncMessage("conflict"));
      if(reply.review) toast(syncMessage("review_required"));
    }
  }catch(err){
    toast(err.message);
  }
}

/* ===== Klasser =====
   Databasfunktionerna finns i sql/2026-10-01-klasser.sql. Eleven väljer
   själv klass ur en lista (byte högst en gång per vecka), admin hanterar
   klasserna och kan flytta elever. Klassen "Lärare" kräver lärarkonto. */
async function klassRpc(namn,kropp={},inloggad=true){
  if(!MOLN_PA()) return null;
  const med = inloggad && !!session && await giltigSession();
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+namn,{method:"POST",headers:sbHeaders(med),body:JSON.stringify(kropp)});
    if(!r.ok) return r.status===404?{saknas:true}:null;
    return await r.json();
  }catch(_){ return null; }
}
/* Topplistans medaljer delas ut av servern när en period är slut
   (sql/2026-10-01-topplistemedaljer.sql). Anropet görs i synkkön när
   profilen är sparad, så servern ändrar bara toppMedaljer och badges på en
   profil som är identisk med den lokala. Då kan samma fält sättas in lokalt
   och träningen fortsätta på den nya revisionen. */
function hamtaToppMedaljer(){
  if(!MOLN_PA() || !session) return Promise.resolve(null);
  return serialSync(async()=>{
    if(pushKo || syncRevision===null || !syncOwner) return null;
    const uid=syncOwner, rev=syncRevision;
    const r=await klassRpc("kg_topp_medaljer");
    if(!r?.ok || uid!==syncOwner || uid!==session?.user?.id) return null;
    if(r.revision==null) return r;
    if(r.fran!==rev){ return r; }   /* annan enhet hann före: nästa sparning hämtar läget */
    profile.toppMedaljer=r.toppMedaljer||{};
    profile.badges ||= {};
    const nya=(r.nya||[]).filter(k=>!profile.badges[k]);
    nya.forEach(k=>{ profile.badges[k]=Date.now(); });
    if(acceptedProfile){
      acceptedProfile.toppMedaljer=JSON.parse(JSON.stringify(profile.toppMedaljer));
      acceptedProfile.badges={...(acceptedProfile.badges||{}),...Object.fromEntries(nya.map(k=>[k,profile.badges[k]]))};
    }
    syncRevision=r.revision;
    cacheCloudProfile();
    const nyaMedaljer=nya.map(k=>BADGES.find(b=>b.id===k)).filter(Boolean);
    if(nyaMedaljer.length) setTimeout(()=>cheerMedaljer(nyaMedaljer),1800);
    return r;
  });
}

let topplistaFunk="topplista_period2";
async function hamtaTopplista(flik,gräns=50){
  if(!MOLN_PA()) return null;
  const svar=await hamtaTopplistaFran(topplistaFunk,flik,gräns);
  if(svar===undefined && topplistaFunk!=="topplista_period"){
    topplistaFunk="topplista_period";
    return hamtaTopplistaFran(topplistaFunk,flik,gräns);
  }
  return svar===undefined?null:svar;

/* undefined = funktionen saknas eller fel i databasen (prova den gamla). */
async function hamtaTopplistaFran(funk,flik,gräns){
  const inloggad = !!session && await giltigSession();
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+funk,{
      method:"POST",headers:sbHeaders(inloggad),
      body:JSON.stringify({p_period:flik,p_limit:gräns,
        p_namn:(session && profile.visaTopplista && profile.namn)?profile.namn:null})
    });
    if(!r.ok){
      let txt=""; try{ txt=await r.text(); }catch(_){}
      console.warn("Topplistan ("+funk+", "+flik+") svarade "+r.status+": "+txt);
      if(funk!=="topplista_period" && (r.status===404 || r.status>=500)) return undefined;
      if(r.status===404) return flik==="alla" ? hamtaTotalFranVy(inloggad,gräns) : {saknas:true};
      return null;
    }
    const d=await r.json();
    return {
      rader:Array.isArray(d?.rader)?d.rader:[],
      plats:d?.plats??null,
      fuskare:Array.isArray(d?.fuskare)?d.fuskare:[]
    };
  }catch(_){ return funk!=="topplista_period" ? undefined : null; }
}

/* Reserv om databasfunktionen inte är installerad än: den gamla vyn

async function hamtaTotalFranVy(inloggad,gräns){
  const r=await fetch(SUPABASE_URL+"/rest/v1/topplista"
    +"?select=namn,xp,niva,rang,uppgifter,dagar,medaljer"
    +"&visa=eq.true&order=xp.desc,uppgifter.desc&limit="+gräns,
    {headers:sbHeaders(inloggad)});

  return {rader:await r.json(),plats:await minPlacering()};
}

async function minPlacering(){
  if(!session || !profile.visaTopplista || !profile.namn) return null;
  if(!acceptedProfile || !await giltigSession()) return null;
  const mitt=acceptedProfile.xp||0;
  try{

      {headers:{...sbHeaders(true),Prefer:"count=exact",Range:"0-0"}});

    const n=parseInt(cr.split("/")[1],10);

  }catch(_){ return null; }
}

const navStack=[];

function navDesc(view){
  return {view,course:state.course,track:state.track,
          area:state.focusArea,omr:state.focusOmr,namn:state.focusNamn,

function navRecord(view,replace){
  stangKunskap();
  const st=navDesc(view);
  st.depth = replace ? (history.state?.depth||0) : (history.state?.depth??-1)+1;
  navStack.length=st.depth;
  navStack.push(st);
  const url = st.course ? "#"+st.course : location.pathname+location.search;
  try{
    if(replace) history.replaceState(st,"",url);
    else history.pushState(st,"",url);
  }catch(_){}
}
function navPrev(){
  const d=history.state?.depth||0;
  return d>0 ? navStack[d-1] : null;
}

function navBackTo(view){
  const p=navPrev();
  if(p && p.view===view && p.course===state.course){ history.back(); return true; }
  return false;
}

  }
  if(st.track) state.track=st.track;

  state.focusNamn=st.namn||null;
  state.focusFamily=st.family||null;

function loadProfile(){

function loadProfileFrom(p){
  p = p || {};
  p.xp||=0; p.attempts||=0; p.correct||=0; p.streak||=0; p.bestStreak||=0;
  p.run||=0; p.bestRun||=0; p.aCorrect||=0; p.today||=0; p.goal||=8;
  p.pass||=0; p.felfria||=0; p.utanFacit||=0; p.morgon||=0;
  p.bestKapitel||=0; p.bestKurs||=0; p.bestNiva3||=0;
  p.reparerade||=0;
  /* Kvitterade felrapportsbelöningar: "kurs|uppgift" -> tidpunkt. */
  p.felBelonade ||= {}; p.felFynd||=0;
  p.fortsatt||=0; p.sistFel=!!p.sistFel;
  p.nyheter ||= {};
  p.uppdrag ??= null; p.uppdragDagar||=0; p.uppdragKlara||=0; p.uppdragHuvud||=0; p.uppdragDag ??= null;
  p.bastaPass ??= null;
  p.lastDay ??= null;

  p.namn ??= null;
  p.toppValt ??= !!p.namn;
  p.visaTopplista = p.toppValt ? !!p.visaTopplista : true;
  p.courses ||= {}; p.badges ||= {};
  /* Lästa genomgångar. Nycklarna är "kurs|delmoment" respektive
     "kurs|kapitel", så samma delmomentsnamn i två kurser räknas var
     för sig. */
  p.genomgangar ||= {}; p.ggKapKlara ||= {};
  p.ggTranat ||= 0;
  p.ggForslagVisade ||= {};
  aterstallGenomgangsmedaljer(p);
  return p;
}
function aterstallGenomgangsmedaljer(p){
  const antal=Object.keys(p.genomgangar||{}).length;
  const regler={gg1:antal>=1,gg10:antal>=10,
    ggkap:Object.keys(p.ggKapKlara||{}).length>=1,ggtrana:(p.ggTranat||0)>=5};
  for(const [id,uppfylld] of Object.entries(regler)){
    if(uppfylld && !p.badges[id]) p.badges[id]=Date.now();
  }
}

function mastery(map,key){
  if(!key) return .55;
  return typeof map[key]==="number" ? map[key] : .55;
}
/* vikt < 1 för rätt svar med ledtråd: de höjer behärskningen mindre. */
function updateMastery(map,key,correct,vikt=1){
  if(!key) return;
  let s=mastery(map,key);
  s = correct ? s + .10*vikt*(1-s) : s - .16*s;
  map[key]=Math.max(.08,Math.min(.96,s));
}

const RANKS=[
  {lvl:1,  name:"Nykomling",   sym:"1"},
  {lvl:2,  name:"Motionär",    sym:"2"},
  {lvl:4,  name:"Stammis",     sym:"3"},

  {lvl:9,  name:"Tävlande",    sym:"5"},
  {lvl:12, name:"Elitatlet",   sym:"6"},

];

function totalXpForLevel(L){
  const n=L-1;
  return Math.round(20*n + 10*n*n + 0.6*n*n*n);
}
function levelFromXP(xp){
  let L=1;
  while(L<99 && totalXpForLevel(L+1)<=xp) L++;
  return L;
}
function rankFor(level){
  let r=RANKS[0];
  for(const x of RANKS) if(level>=x.lvl) r=x;
  return r;
}
function nextRank(level){ return RANKS.find(x=>x.lvl>level) || null; }
function levelProgress(){
  const L=levelFromXP(profile.xp);
  const base=totalXpForLevel(L), top=totalXpForLevel(L+1);
  return {level:L, into:profile.xp-base, need:top-base, pct:(profile.xp-base)/Math.max(1,top-base)};
}

function todayKey(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function yesterdayKey(){
  const d=new Date(Date.now()-864e5);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function todayCount(){ return profile.lastDay===todayKey() ? (profile.today||0) : 0; }
function currentStreak(){
  if(profile.lastDay===todayKey() || profile.lastDay===yesterdayKey()) return profile.streak||0;
  return 0;
}
function touchDay(){
  const t=todayKey();
  if(profile.lastDay===t) return;
  profile.streak = (profile.lastDay===yesterdayKey()) ? (profile.streak||0)+1 : 1;
  profile.bestStreak=Math.max(profile.bestStreak||0,profile.streak);
  profile.lastDay=t;
  profile.today=0;
}

function allAreaMasteries(){
  return Object.values(profile.courses||{}).flatMap(c=>Object.values(c.areas||{}));
}
function bestAreaMastery(){

/* Antalet lästa genomgångar räknas över alla kurser — den som läst i
   både fysik och matematik har läst lika mycket för det. */
function lastaGenomgangar(){ return Object.keys(profile.genomgangar||{}).length; }
function toppVinster(k){ return Number(profile.toppMedaljer?.[k]?.n)||0; }
function badgeState(b){
  const cur=Math.max(0,Math.min(b.max,b.cur()||0));
  return {cur,pct:cur/b.max,on:!!profile.badges[b.id]||cur>=b.max};
}

function stripBadges(){
  const tagna=BADGES.filter(b=>badgeState(b).on)
    .sort((a,b)=>(profile.badges[b.id]||0)-(profile.badges[a.id]||0));
  const kvar=BADGES.filter(b=>!badgeState(b).on)
    .sort((a,b)=>badgeState(b).pct-badgeState(a).pct);
  return [...tagna.slice(0,4),...kvar].slice(0,8);
}

function nextBadge(){
  const locked=BADGES.filter(b=>!badgeState(b).on).map(b=>({b,s:badgeState(b)}));
  if(!locked.length) return null;
  locked.sort((x,y)=>y.s.pct-x.s.pct);
  return locked[0];
}

function checkBadges(fordroj=0){
  const gained=[];
  for(const b of BADGES){
    if(profile.badges[b.id]) continue;
    if((b.cur()||0)>=b.max){ profile.badges[b.id]=Date.now(); gained.push(b); }
  }
  const agare=ggAgare();
  const visa=()=>{
    if(agare!==ggAgare()) return;
    cheerMedaljer(gained);
  };
  if(gained.length){
    saveProfile();
    fordroj>0 ? setTimeout(visa,fordroj) : visa();
  }
  return gained;
}

const ACCENT_BG={
  ljus:{a:"#F2ECF0",b:"#E6F2F1",c:"#E7EEF9",fy1:"#E4F2F4",fy2:"#EBECF8",hist:"#F3EDE4"},
  mork:{a:"#120E14",b:"#091216",c:"#090F1B",fy1:"#081217",fy2:"#0D0E1C",hist:"#150F0A"}
};
function accentKey(){
  if(!state.course) return "c";
  if(state.course==="fy1") return "fy1";
  if(state.course==="fy2") return "fy2";
  if(state.course==="hist") return "hist";
  const m=String(state.track||"").match(/[abc]$/i);

  return m ? m[0].toLowerCase() : "c";
}
function applyAccent(){
  const k=accentKey();
  if(k) document.documentElement.dataset.accent=k;
  else delete document.documentElement.dataset.accent;
  syncThemeColor();
}
function syncThemeColor(){
  const meta=document.querySelector('meta[name="theme-color"]');
  if(!meta) return;
  const mork = document.documentElement.dataset.theme==="dark";
  const k = accentKey();
  meta.content = mork ? (ACCENT_BG.mork[k] || "#090F1B")
                      : (ACCENT_BG.ljus[k] || "#E7EEF9");
}
function setTheme(next){

const cheerQueue=[];
/* Flera nya medaljer samtidigt visas på ett kort, sida vid sida. */
function cheerMedaljer(lista){
  lista=(lista||[]).filter(Boolean);
  if(!lista.length) return;
  if(lista.length===1){ const b=lista[0]; cheer(medaljIkon(b.icon),"Ny medalj",b.name,b.desc); return; }
  cheerQueue.push({typ:"flera",label:"Nya medaljer",title:`${lista.length} nya medaljer`,desc:"",
    items:lista.map(b=>({icon:medaljIkon(b.icon),namn:b.name,desc:b.desc||""}))});
  if(cheerQueue.length===1) pumpCheer();
}
function cheer(icon,label,title,desc,typ){
  cheerQueue.push({icon,label,title,desc:desc||"",typ:typ||"medalj"});
  if(cheerQueue.length===1) pumpCheer();
}
function pumpCheer(){
  const el=document.getElementById("cheer");
  const c=cheerQueue[0];
  if(!c) return;
  const topp = c.typ==="dag" ? dagsRing(c.icon)
    : c.typ==="flera" ? `<div class="cheer-flera">${c.items.map((m,i)=>`<div class="cf-medalj" style="animation-delay:${(.12+i*.1).toFixed(2)}s">
          <div class="cheer-medal">${m.icon}</div><b>${esc(m.namn)}</b>${m.desc?`<small>${esc(m.desc)}</small>`:""}</div>`).join("")}</div>`
    : `<div class="cheer-halo"><div class="cheer-medal">${c.icon}</div></div>`;
  const rubrik=`<div class="cheer-label">${esc(c.label)}</div>
      <h2>${esc(c.title)}</h2>`;
  el.innerHTML=`<div class="cheer-card${c.typ==="dag"?" dag":""}${c.typ==="flera"?" flera":""}">
      ${c.typ==="flera" ? rubrik+topp : topp+rubrik}
      ${c.desc?`<p>${esc(c.desc)}</p>`:""}
      <button class="btn primary" onclick="dismissCheer()">Fortsätt</button>
    </div>`;
  el.onclick=e=>{ if(e.target===el) dismissCheer(); };
  requestAnimationFrame(()=>el.classList.add("show"));
  clearTimeout(pumpCheer._t);
  pumpCheer._t=setTimeout(dismissCheer, c.typ==="flera" ? Math.min(15000,6000+1500*(c.items.length-1)) : 6000);
}
/* Dagens mål visas som en sluten ring med en bit per uppgift, inte som
   en medalj. icon är här antalet uppgifter i dagsmålet. */
function dagsRing(n){
  n=Math.max(1,Math.min(20,Number(n)||8));
  const S=96, r=40, C=2*Math.PI*r, del=C/n, lucka=Math.min(5,del*.28), bit=del-lucka;
  let bitar="";
  for(let i=0;i<n;i++){
    bitar+=`<circle cx="${S/2}" cy="${S/2}" r="${r}" fill="none" stroke="var(--acc)" stroke-width="7"
      stroke-linecap="round" stroke-dasharray="${bit.toFixed(2)} ${(C-bit).toFixed(2)}"
      stroke-dashoffset="${(-i*del-lucka/2).toFixed(2)}" transform="rotate(-90 ${S/2} ${S/2})"
      style="animation-delay:${(0.15+i*0.07).toFixed(2)}s"/>`;
  }
  return `<div class="cheer-dag"><svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" aria-hidden="true">
      <circle cx="${S/2}" cy="${S/2}" r="${r}" fill="none" stroke="var(--hair)" stroke-width="7"/>${bitar}
      <path class="bock" d="M35 49l9 9 18-19" fill="none" stroke="var(--acc)" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
    </svg></div>`;
}
function dismissCheer(){
  const el=document.getElementById("cheer");
  if(!el.classList.contains("show")) return;
  clearTimeout(pumpCheer._t);
  el.classList.remove("show");
  cheerQueue.shift();
  setTimeout(()=>{ if(cheerQueue.length) pumpCheer(); else el.innerHTML=""; },450);
}

function ring(pct,size,stroke,color){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  const off=c*(1-Math.max(0,Math.min(1,pct||0)));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--hair)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${c.toFixed(1)}"
      data-off="${off.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}

function renderMath(root=app){
  if(typeof renderMathInElement!=="function"){ setTimeout(()=>renderMath(root),120); return; }
  try{
    renderMathInElement(root,{
      delimiters:[
        {left:"$$",right:"$$",display:true},
        {left:"\\[",right:"\\]",display:true},
        {left:"\\(",right:"\\)",display:false}
      ],
      throwOnError:false, strict:false, trust:false
    });
  }catch(err){ console.warn("KaTeX:",err); }
}

/* Matematiken i genomgångarna skrivs med \\( och \\[ i JS-källan, vilket
   blir ett bakstreck i den färdiga strängen — det är vad KaTeX vill ha.
   Skrivs ett bakstreck för mycket hamnar rå LaTeX på skärmen i stället
   för formler. Felet är lätt att göra och svårt att se i källkoden, så
   filen granskas en gång vid inläsningen. */
function granskaGenomgangar(kurs){
  const typ=window[kurs.typGlobal];
  if(!typ) return;
  const trasiga=[];
  Object.entries(typ).forEach(([familj,g])=>{
    const falt=[g.rubrik,g.t,g.ram,g.svar,g.fallgrop,g.komihag]
      .concat((g.steg||[]).map(s=>(s.text||"")+(s.matte||"")));
    if(falt.some(x=>typeof x==="string" && /\\\\[[(]/.test(x))) trasiga.push(familj);
  });
  if(trasiga.length){
    console.warn("Dubbla bakstreck i "+kurs.typfil+" — LaTeX visas som råtext i "
      +trasiga.length+" delmoment:",trasiga);
  }
}

function typData(){
  const c=COURSES[state.course];
  return (c&&c.typGlobal&&window[c.typGlobal]) || null;
}

/* omr får vara antingen en sträng eller en lista. Det gör genomgångsfilerna
   bakåtkompatibla när ett äldre samlingsområde senare delas upp i flera områden. */
function genomgangOmr(g){
  const v=g?.omr;
  return (Array.isArray(v)?v:[v]).filter(Boolean).map(String);
}
function genomgangPassarKort(g,kort){
  if(!kort) return false;
  const omr=genomgangOmr(g);
  return omr.some(o=>kort.omr.includes(o));
}

/* Explicit kapitelplacering ger genomgångarna en egen pedagogisk ordning.
   kortNyckel används när eleven öppnar "Det här behöver du kunna" från ett
   enskilt område. Utan kortNyckel visas hela kapitlets genomgång som tidigare. */
function kunskapSteg(kap,kortNyckel=null){
  const typ=typData();
  if(!typ) return [];
  const allaKort=getCards().filter(k=>String(k.kap)===String(kap));
  const valtKort=kortNyckel ? allaKort.find(k=>String(k.key)===String(kortNyckel)) : null;
  if(kortNyckel && !valtKort) return [];

  const explicita=Object.entries(typ).filter(([,g])=>g.kap!=null);
  if(explicita.length){
    const bank=state.data?.bank||[];
    return explicita.filter(([,g])=>String(g.kap)===String(kap)
      && (!Array.isArray(g.kurs) || g.kurs.includes(state.track))
      && (!valtKort || genomgangPassarKort(g,valtKort)))
      .map(([familj,g])=>{
        const k=valtKort || allaKort.find(k=>genomgangPassarKort(g,k));
        const bankuppgift=g.uppgift
          ? bank.find(t=>String(t.id)===String(g.uppgift)) : null;
        const uppgift=g.t ? {t:g.t,niva:g.niva||"E"} : bankuppgift;
        if(!uppgift){
          console.warn('Typuppgift saknas för '+(g.rubrik||familj));
          return null;
        }
        /* Ett explicit kort måste faktiskt finnas i den valda kursvarianten.
           Därmed visas inte genomgångar för områden som saknar uppgifter i spåret. */
        if(!k) return null;
        const harFamilj=g.traningsfamilj && cardTaskPool(k).some(t=>
          (Array.isArray(t.familj)?t.familj:[t.familj]).includes(g.traningsfamilj));
        const primartOmr=genomgangOmr(g).find(o=>k.omr.includes(o)) || k.omr[0];
        return {kort:k.key,omr:primartOmr,
          omrNamn:familyName(k.name||chapterName(kap)),familj,
          metoder:Array.isArray(g.metoder)?g.metoder:[],
          traningsfamilj:harFamilj?g.traningsfamilj:null,
          genomgang:g,uppgift};
      }).filter(Boolean);
  }

  const poster=new Map(); let n=0;
  (valtKort?[valtKort]:allaKort).forEach(k=>{
    cardTaskPool(k).forEach(t=>{
      const fs=(Array.isArray(t.familj)?t.familj:[t.familj]).filter(Boolean);
      fs.forEach(f=>{
        if(!typ[f]) return;
        if(!poster.has(f)) poster.set(f,{ordn:n++,kort:k.key,omrNamn:k.name});
      });
    });
  });
  const bank=state.data?.bank||[];
  return [...poster.entries()]
    .sort((a,b)=>a[1].ordn-b[1].ordn)
    .map(([familj,p])=>{
      const g=typ[familj];
      const uppgift=g.uppgift ? bank.find(x=>String(x.id)===String(g.uppgift)) : null;
      if(g.uppgift && !uppgift){
        console.warn('Genomgången för "'+familj+'" pekar på uppgift '+g.uppgift+' som inte finns i banken.');
      }
      if(uppgift && String(uppgift.niva||"").toUpperCase()!=="E"){
        console.warn('Typuppgiften '+g.uppgift+' för "'+familj+'" ligger på nivå '
          +uppgift.niva+'. Typuppgifter bör vara E-nivå.');
      }
      return {kort:p.kort, omrNamn:p.omrNamn, familj, traningsfamilj:familj, genomgang:g, uppgift};
    });
}
function harKunskap(kap){ return kunskapSteg(kap).length>0; }
function harKunskapKort(kort){
  const typ=typData();
  if(!typ||!kort) return false;
  return Object.values(typ).some(g=>String(g.kap)===String(kort.kap)
    && (!Array.isArray(g.kurs) || g.kurs.includes(state.track))
    && genomgangPassarKort(g,kort)
    && (g.t || g.uppgift));

function oppnaKunskap(kap,kortNyckel=null,familj=null){
  stangKunskap();
  const steg=kunskapSteg(kap,kortNyckel);
  if(!steg.length) return;
  const startIndex=familj ? steg.findIndex(s=>String(s.familj)===String(familj)) : 0;
  const valtKort=kortNyckel ? getCards().find(k=>String(k.key)===String(kortNyckel)) : null;
  const rubrik=valtKort?.name || chapterName(kap);
  state.kunskap={kap:String(kap),kortNyckel:kortNyckel||null,steg,i:Math.max(0,startIndex),course:state.course,track:state.track,
    view:state.view,owner:ggAgare(),rubrik};
  const el=document.createElement("div");
  el.className="modal"; el.id="kunskapsruta";
  el.innerHTML=`<div class="modal-kort typ-kort" role="dialog" aria-modal="true"
      aria-label="Det här behöver du kunna i ${esc(rubrik)}">
      <div class="modal-topp">
        <div>
          <div class="lbl">${esc(rubrik)}</div>
          <div class="gg-modalrubrik">
            <h2>Det här behöver du kunna</h2>
            ${genomgangFormelKnapp(kap)}
          </div>
        </div>
        <button class="iconbtn" onclick="stangKunskap()" aria-label="Stäng">✕</button>
      </div>
      <div id="kunskapInnehall"></div>
    </div>`;
  document.body.appendChild(el);
  el.addEventListener("click",e=>{ if(e.target===el) stangKunskap(); });
  /* Svep vågrätt på själva genomgångskortet för att bläddra på mobil.
     Ett tydligt horisontellt svep krävs, så vanlig lodrät skrollning påverkas inte. */
  let svepStart=null;
  el.addEventListener("touchstart",e=>{
    if(e.touches.length!==1 || e.target.closest("button,a,input,textarea,select,.katex-display")){
      svepStart=null; return;
    }
    const p=e.touches[0];
    svepStart={x:p.clientX,y:p.clientY,tid:Date.now()};
  },{passive:true});
  el.addEventListener("touchend",e=>{
    if(!svepStart || e.changedTouches.length!==1){ svepStart=null; return; }
    const p=e.changedTouches[0], dx=p.clientX-svepStart.x, dy=p.clientY-svepStart.y;
    const snabbNog=Date.now()-svepStart.tid<1100;
    svepStart=null;
    if(snabbNog && Math.abs(dx)>=55 && Math.abs(dx)>Math.abs(dy)*1.25){
      kunskapGa(dx<0 ? 1 : -1);
    }
  },{passive:true});
  el.addEventListener("touchcancel",()=>{ svepStart=null; },{passive:true});
  ritaKunskap();
  requestAnimationFrame(()=>{
    if(state.kunskap && el.isConnected){ el.classList.add("visa"); ggStartaLastimer(); }
  });
}
function stangKunskap(){
  ggStoppaLastimer();

function kunskapGa(steg){

function kunskapTrana(){

/* Bara sammanhängande tid i en synlig, aktiv genomgång räknas.
   Kurs, spår, konto, vy och kort låses till samma lästillfälle. */
const GG_LASTID=15000;
let ggTimer=null,ggTimerVersion=0;
function ggAgare(){ return session?.user?.id || syncOwner || "guest"; }
function ggNyckel(familj){ return state.course+"|"+familj; }
function ggLast(familj){ return !!(profile.genomgangar||{})[ggNyckel(familj)]; }
function ggStoppaLastimer(){
  clearTimeout(ggTimer); ggTimer=null; ggTimerVersion++;
}
function ggSynlig(k){
  const el=document.getElementById("kunskapsruta");
  if(!k || k!==state.kunskap || !el?.isConnected || !el.classList.contains("visa")) return false;
  if(document.visibilityState!=="visible" || !document.hasFocus()) return false;
  if(k.course!==state.course || k.track!==state.track || k.view!==state.view || k.owner!==ggAgare()) return false;
  const style=getComputedStyle(el);
  return el.getClientRects().length>0 && style.display!=="none" && style.visibility!=="hidden";
}
function ggStartaLastimer(){
  ggStoppaLastimer();
  const k=state.kunskap;
  if(!ggSynlig(k)) return;
  const s=k.steg[k.i]; if(!s || ggLast(s.familj)) return;
  const familj=s.familj,index=k.i,version=ggTimerVersion;
  ggTimer=setTimeout(()=>{
    if(version!==ggTimerVersion || !ggSynlig(k) || k.i!==index || k.steg[k.i]?.familj!==familj || ggLast(familj)) return;
    ggTimer=null;
    profile.genomgangar ||= {};
    profile.genomgangar[ggNyckel(familj)]=Date.now();
    ggKollaKapitel(k);
    checkBadges(); saveProfile();
    uppdateraKunskapsindikator(k.kap);
    ritaKunskap();
  },GG_LASTID);
}
function ggKollaKapitel(k){
  const nyckel=state.course+"|"+(state.track?state.track+"|":"")+k.kap;
  profile.ggKapKlara ||= {};
  if(profile.ggKapKlara[nyckel]) return;
  if(k.steg.length && k.steg.every(x=>ggLast(x.familj))) profile.ggKapKlara[nyckel]=Date.now();
}
function uppdateraKunskapsindikator(kap){
  const steg=kunskapSteg(kap); if(!steg.length) return;
  const lasta=steg.filter(x=>ggLast(x.familj)).length;
  const klart=lasta===steg.length;
  document.querySelectorAll(".kap-kunskap").forEach(btn=>{
    if(btn.dataset.kap!==String(kap)) return;
    btn.classList.toggle("klar",klart);
    const tal=btn.querySelector(".kvot"); if(tal) tal.textContent=lasta+"/"+steg.length;
    btn.setAttribute("aria-label","Det här behöver du kunna i "+chapterName(kap)+". "+lasta+" av "+steg.length+" lästa.");
  });
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible") ggStartaLastimer();
  else ggStoppaLastimer();
});
window.addEventListener("blur",ggStoppaLastimer);

function playIn(root){
  root.querySelectorAll("[data-off]").forEach(el=>{ el.style.strokeDashoffset=el.getAttribute("stroke-dashoffset"); });
  root.querySelectorAll("[data-w]").forEach(el=>{ el.style.width="0"; });
  root.querySelectorAll(".stagger").forEach(g=>{
    [...g.children].forEach((el,i)=>{
      el.style.animation="none"; void el.offsetHeight;
      el.style.animation=""; el.style.animationDelay=Math.min(i*35,420)+"ms";
    });
  });
  requestAnimationFrame(()=>{
    root.querySelectorAll("[data-off]").forEach(el=>{ el.style.strokeDashoffset=el.dataset.off; });
    root.querySelectorAll("[data-w]").forEach(el=>{ el.style.width=el.dataset.w; });
  });
}

/* Allmän framskrivning som i en kommandotolk. Text skrivs tecken för
   tecken; formler (KaTeX), bilder och figurer visas hela när de nås, så
   att matematiken aldrig syns halvfärdig. Höjden låses under tiden. */
const SKRIV_HEL=".katex,.katex-display,img,svg,canvas,table,figure,mjx-container,button";
function skrivFram(el,{tecken=3,ms=14,markor=true}={}){
  if(!el) return Promise.resolve();
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return Promise.resolve();
  const delar=[];
  const samla=nod=>{
    for(const c of [...nod.childNodes]){
      if(c.nodeType===3){ if(c.data.trim()) delar.push({typ:"text",n:c,txt:c.data}); }
      else if(c.nodeType===1){
        if(c.matches(SKRIV_HEL)) delar.push({typ:"hel",n:c});
        else samla(c);
      }
    }
  };
  samla(el);
  if(!delar.length) return Promise.resolve();
  el.style.minHeight=el.offsetHeight+"px";
  delar.forEach(d=>{ if(d.typ==="text") d.n.data=""; else d.n.style.visibility="hidden"; });
  const mark=document.createElement("span");
  mark.className="pt-markor"; mark.setAttribute("aria-hidden","true");
  const vanta=t=>new Promise(res=>setTimeout(res,t));
  const klar=()=>{ mark.remove(); delar.forEach(d=>{ if(d.typ==="text") d.n.data=d.txt; else d.n.style.visibility=""; }); el.style.minHeight=""; };
  return (async()=>{
    for(const d of delar){
      if(!el.isConnected) return klar();
      if(markor) d.n.after(mark);
      if(d.typ==="hel"){ d.n.style.visibility=""; await vanta(ms*4); continue; }
      for(let i=0;i<=d.txt.length;i+=tecken){
        if(!el.isConnected) return klar();
        d.n.data=d.txt.slice(0,i);
        await vanta(ms);
      }
      d.n.data=d.txt;
    }
    await vanta(500);
    klar();
  })();
}

/* Tränaren som chattassistent under passet. Visselpipan syns i hörnet
   under träningen; när tränaren har något att säga glider en pratbubbla
   fram och texten skrivs som i en kommandotolk. Klick på visselpipan visar
   senaste repliken igen (eller en lägesrapport om passet). */
let tchatTimer=null, tchatSenast=null;
function tchatEl(){
  let el=document.getElementById("tranar-chat");
  if(el) return el;
  el=document.createElement("div");
  el.id="tranar-chat"; el.className="tchat";
  el.innerHTML=`<div class="tchat-bubbla" role="status" aria-live="polite">
      <button class="tchat-x" onclick="tchatStang()" aria-label="Stäng">×</button>
      <span class="tchat-namn">Din tränare</span><p class="tchat-txt"></p></div>
    <button class="tchat-av" onclick="tchatKlick()" aria-label="Din tränare">${tranarAvatar(false)}</button>`;
  document.body.appendChild(el);
  return el;
}
function tchatLage(){
  const el=document.getElementById("tranar-chat");
  const pa=state.view==="training";
  if(!pa){ if(el){ el.classList.remove("synlig"); tchatStang(); } return; }
  tchatEl().classList.add("synlig");
}
function tchatStang(){
  clearTimeout(tchatTimer);
  document.querySelector("#tranar-chat .tchat-bubbla")?.classList.remove("visa");
}
function tchatLageText(){
  const kvar=Math.max(0,(state.sessionTarget||0)-(state.sessionDone||0));
  if(!state.sessionDone) return `Kör hårt! Du har <b>${state.sessionTarget||8} uppgifter</b> i passet. Fastnar du finns ledtråden.`;
  return `<b>${state.sessionCorrect||0} av ${state.sessionDone}</b> rätt hittills.${kvar?` ${kvar} uppgifter kvar i passet.`:" Sista uppgiften!"}`;
}
function tchatKlick(){
  const b=document.querySelector("#tranar-chat .tchat-bubbla");
  if(b?.classList.contains("visa")) return tchatStang();
  tranarenSager(tchatSenast && Date.now()-tchatSenast.at<60000 ? tchatSenast.html : tchatLageText(),{html:true});
}
function tranarenSager(text,{html=false,ms=null,kvar=false}={}){
  const el=tchatEl();
  el.classList.add("synlig");
  const b=el.querySelector(".tchat-bubbla"), p=el.querySelector(".tchat-txt"), av=el.querySelector(".tchat-av");
  const inner=html?text:esc(text);
  tchatSenast={html:inner,at:Date.now()};
  p.innerHTML=inner;
  b.classList.add("visa");
  av.classList.remove("ny"); void av.offsetWidth; av.classList.add("ny");
  clearTimeout(tchatTimer);
  const tid=ms ?? Math.max(5200,p.textContent.length*60);
  const ava=av.querySelector(".pt-avatar"); ava?.classList.add("pratar");
  skrivFram(p,{tecken:1,ms:22}).then(()=>{ ava?.classList.remove("pratar"); clearTimeout(tchatTimer); if(!kvar) tchatTimer=setTimeout(tchatStang,tid); });
}

    const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/kg_ar_admin",{
      method:"POST",headers:sbHeaders(true),body:"{}"
    });
    arAdmin = r.ok ? (await r.json())===true : false;
  }catch(_){ arAdmin=false; }
  return arAdmin;
}

async function kgHeartbeat(){
  if(!MOLN_PA() || !session || document.visibilityState==="hidden") return;
  if(arAdmin) uppdateraFelAntal();
  try{
    if(!await giltigSession()) return;
    await fetch(SUPABASE_URL+"/rest/v1/rpc/kg_heartbeat",{
      method:"POST",headers:sbHeaders(true),body:JSON.stringify({p_data:{
        namn:profile?.namn||null,
        xp:Math.max(0,Number(profile?.xp)||0),
        uppgifter:Math.max(0,Number(profile?.attempts)||0),
        kurs:state?.course||null,
        vy:state?.view||null
      }})
    });
  }catch(_){ /* närvaro får aldrig störa träningen */ }
}
function startaKgHeartbeat(){
  clearInterval(kgHeartbeatTimer);
  kgHeartbeat();
  kgHeartbeatTimer=setInterval(kgHeartbeat,45000);
}

async function kontrolleraLarare(){
  if(!MOLN_PA() || !session){ arLarare=false; }
  else{
    try{
      const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/kg_ar_larare",{
        method:"POST",headers:sbHeaders(true),body:"{}"
      });
      arLarare = r.ok ? (await r.json())===true : false;
    }catch(_){ arLarare=false; }
  }
  try{ arLarare?localStorage.setItem(LARARE_KEY,"1"):localStorage.removeItem(LARARE_KEY); }catch(_){}
  uppdateraLararKnapp();

  hamtaLarprofil();

/* Öppna rapporter i menyn, och en röd siffra på administratörens avatar. */
let felAntalHamtar=false;
async function uppdateraFelAntal(){
  if(!session||(!arLarare&&!arAdmin)||felAntalHamtar) return;
  const uid=session.user?.id||session.access_token;
  felAntalHamtar=true;
  try{
    const antal=(await hamtaFelloggen(false)).length;
    if(!session||(session.user?.id||session.access_token)!==uid||(!arLarare&&!arAdmin)) return;
    felOppnaAntal=antal;
    uppdateraFelNotis();
  }
  catch(_){ /* är tabellen inte installerad ännu visas menyn utan siffra */ }

function kontoFelNotisAntal(){
  return session&&arAdmin?Math.max(0,Number(felOppnaAntal)||0):0;
}
function uppdateraFelNotis(){
  const antal=kontoFelNotisAntal();
  document.querySelectorAll('.konto').forEach(k=>{
    const notis=k.querySelector('.konto-notis');
    if(notis){ notis.hidden=!antal; notis.textContent=antal>99?'99+':String(antal); }
    k.setAttribute('aria-label',antal?`Konto – ${antal} öppna felrapporter`:'Konto');
  });
  document.querySelectorAll('[data-felrapporter]').forEach(k=>{
    k.textContent='Felrapporter'+(felOppnaAntal?' ('+felOppnaAntal+')':'');
  });
}

let kgAdminData={anvandare:[],rapporter:[],detalj:null};
let kgAdminFlik="anvandare", kgAdminUserFilter=null, kgAdminStatusFilter="alla";
let kgAdminAktivFilter="alla", kgAdminSort="sedd";

async function kgAdminRpc(namn,kropp={}){
  if(!await giltigSession()) throw new Error("Logga in igen.");
  const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+namn,{
    method:"POST",headers:sbHeaders(true),body:JSON.stringify(kropp)
  });
  if(r.status===404) throw new Error("Adminfunktionen är inte installerad i Supabase ännu.");
  if(!r.ok){
    let t=""; try{ t=await r.text(); }catch(_){}
    if(/kg:ej_admin/.test(t)) throw new Error("Det här kontot är inte Kunskapsgymmet-admin.");
    throw new Error("Admininformationen kunde inte hämtas.");
  }
  return r.json();
}
function kgAdminTid(v){
  if(!v) return "–";
  const d=new Date(v); if(Number.isNaN(d.getTime())) return "–";
  return d.toLocaleString("sv-SE",{dateStyle:"short",timeStyle:"short"});
}
function kgAdminDag(v){
  if(!v) return "–";
  const d=new Date(String(v)+"T12:00:00");
  if(Number.isNaN(d.getTime())) return String(v);
  return d.toLocaleDateString("sv-SE",{weekday:"short",month:"short",day:"numeric"});
}
function kgAdminTal(v){ return new Intl.NumberFormat("sv-SE").format(Number(v)||0); }
function kgAdminMin(v){
  const n=Math.max(0,Math.round(Number(v)||0));
  if(n<60) return n+" min";
  const h=Math.floor(n/60), m=n%60;
  return h+" h"+(m?" "+m+" min":"");
}
function kgAdminPct(ratt,antal){
  const n=Number(antal)||0; if(!n) return "–";
  return Math.round(100*(Number(ratt)||0)/n)+" %";
}
function kgAdminProviders(v){
  const a=Array.isArray(v)?v:(v?[v]:[]);
  return a.map(x=>String(x)==="google"?"Google":String(x)==="email"?"E-post":String(x)).join(", ")||"–";
}
function kgAdminStatusText(s){ return s==="atgardad"?"Åtgärdad":s==="ignorerad"?"Ignorerad":"Öppen"; }
function kgAdminNiva(xp){ return levelFromXP(Math.max(0,Number(xp)||0)); }
function kgAdminHarDagstat(){ return kgAdminData.anvandare.some(x=>Object.prototype.hasOwnProperty.call(x,"uppgifter_idag")); }
function kgAdminAktivIdag(u){ return u.aktiv_idag===true || (u.forsta_sedd_idag!=null); }

async function oppnaAdmin(){
  document.getElementById("kontomeny")?.remove();
  stangAdmin();
  const el=document.createElement("div");
  el.className="modal"; el.id="adminruta";
  el.innerHTML=`<div class="modal-kort" role="dialog" aria-modal="true" aria-label="Administration">
      <div class="modal-topp">
        <div><div class="lbl">Kunskapsgymmet · admin</div><h2>Användare och aktivitet</h2></div>

        <button class="iconbtn" onclick="stangAdmin()" aria-label="Stäng">✕</button>
      </div>
      <div id="adminkropp"><p class="modal-text">Hämtar användare…</p></div>
      <div class="modal-fot"><span class="spacer"></span><button class="btn primary" onclick="stangAdmin()">Stäng</button></div>
    </div>`;

function stangAdmin(){
  const el=document.getElementById("adminruta"); if(!el) return;
  el.removeAttribute("id"); el.classList.remove("visa"); setTimeout(()=>el.remove(),250);
}
async function kgAdminLadda(manuell=false){
  const host=document.getElementById("adminkropp"); if(!host) return;
  const scroll=host.scrollTop;
  if(manuell) host.setAttribute("aria-busy","true");
  try{
    const [a,r]=await Promise.all([
      kgAdminRpc("kg_admin_anvandare"),
      kgAdminRpc("kg_admin_felrapporter",{p_user:null,p_status:null,p_limit:1000})
    ]);
    kgAdminData.anvandare=Array.isArray(a)?a:[];
    kgAdminData.rapporter=Array.isArray(r)?r:[];
    if(kgAdminData.detalj?.uid){
      const uid=kgAdminData.detalj.uid;
      try{ kgAdminData.detalj={uid,data:await kgAdminRpc("kg_admin_anvandarstat",{p_user:uid,p_days:30})}; }
      catch(_){ kgAdminData.detalj=null; if(kgAdminFlik==="detalj") kgAdminFlik="anvandare"; }
    }
    kgAdminRita();
    requestAnimationFrame(()=>{ const h=document.getElementById("adminkropp"); if(h) h.scrollTop=Math.min(scroll,h.scrollHeight); });
  }catch(e){ host.innerHTML=`<p class="modal-text">${esc(e.message)}</p>`; }
  finally{ document.getElementById("adminkropp")?.removeAttribute("aria-busy"); }
}
function kgAdminBytFlik(f){ kgAdminFlik=f; if(f!=="detalj") kgAdminData.detalj=null; kgAdminRita(); }
function kgAdminVisaRapporterFor(uid){ kgAdminUserFilter=uid; kgAdminFlik="rapporter"; kgAdminRita(); }
function kgAdminRensaUserFilter(){ kgAdminUserFilter=null; kgAdminRita(); }
function kgAdminSok(){ kgAdminRitaLista(); }
function kgAdminStatus(v){ kgAdminStatusFilter=v; kgAdminRitaLista(); }
function kgAdminAktiv(v){ kgAdminAktivFilter=v; kgAdminRitaLista(); }
function kgAdminSortera(v){ kgAdminSort=v; kgAdminRitaLista(); }
async function kgAdminVisaStat(uid){
  const host=document.getElementById("adminlista"); if(host) host.innerHTML='<p class="modal-text">Hämtar 30 dagars aktivitet…</p>';
  try{
    const d=await kgAdminRpc("kg_admin_anvandarstat",{p_user:uid,p_days:30});
    kgAdminData.detalj={uid,data:d}; kgAdminFlik="detalj"; kgAdminRita();
    document.getElementById("adminkropp")?.scrollTo({top:0,behavior:"smooth"});
  }catch(e){ if(host) host.innerHTML=`<p class="modal-text">${esc(e.message)}</p>`; }
}

  const online=alla.filter(x=>x.online).length;

  const inloggIdag=har?alla.reduce((a,x)=>a+(Number(x.inloggningar_idag)||0),0):"–";
  const uppgIdag=har?alla.reduce((a,x)=>a+(Number(x.uppgifter_idag)||0),0):"–";
  const uppg7=har?alla.reduce((a,x)=>a+(Number(x.uppgifter_7d)||0),0):"–";
  const aktiva7=har?alla.filter(x=>(Number(x.aktiva_dagar_7d)||0)>0).length:"–";
  const oppna=kgAdminData.rapporter.filter(x=>x.status==="oppen").length;
  const f=(v)=>typeof v==="number"?kgAdminTal(v):v;
  host.innerHTML=`
    <div class="admin-summering">
      <div class="admin-siffra"><strong>${f(alla.length)}</strong><span>registrerade användare</span></div>
      <div class="admin-siffra"><strong>${f(online)}</strong><span>online nu</span></div>
      <div class="admin-siffra today"><strong>${f(onlineIdag)}</strong><span>varit online idag</span></div>
      <div class="admin-siffra today"><strong>${f(inloggIdag)}</strong><span>inloggningar idag</span></div>
      <div class="admin-siffra today"><strong>${f(uppgIdag)}</strong><span>uppgifter idag</span></div>
      <div class="admin-siffra"><strong>${f(uppg7)}</strong><span>uppgifter senaste 7 dagarna</span></div>
      <div class="admin-siffra"><strong>${f(aktiva7)}</strong><span>aktiva användare 7 dagar</span></div>
      <div class="admin-siffra"><strong>${f(oppna)}</strong><span>öppna felrapporter</span></div>
    </div>
    <div class="admin-flikar">
      <button class="${kgAdminFlik==="anvandare"||kgAdminFlik==="detalj"?"pa":""}" onclick="kgAdminBytFlik('anvandare')">Användare</button>
      <button class="${kgAdminFlik==="rapporter"?"pa":""}" onclick="kgAdminBytFlik('rapporter')">Felrapporter</button>
      <button class="${kgAdminFlik==="klasser"?"pa":""}" onclick="kgAdminBytFlik('klasser')">Klasser</button>
      <button class="${kgAdminFlik==="larare"?"pa":""}" onclick="kgAdminBytFlik('larare')">Lärare</button>
      <button class="${kgAdminFlik==="skolor"?"pa":""}" onclick="kgAdminBytFlik('skolor')">Skolor</button>
      <button class="${kgAdminFlik==="kvalitet"?"pa":""}" onclick="kgAdminBytFlik('kvalitet')">Kvalitet</button>
    </div>
    <div id="adminlista"></div>
    <div class="admin-notis">Online nu betyder heartbeat under de senaste två minuterna. Dagsstatistik använder svensk kalenderdag. Aktiv tid är en uppskattning från synliga heartbeat-signaler och räknas därför inte som exakt skärmtid.${har?"":" Kör SQL-filen för adminstatistik v8 för att börja samla dagsstatistik."}</div>`;
  kgAdminRitaLista();
}

        ${k.skapad_av?`<p class="aklass-skapare">Skapad av ${esc(k.skapad_av.namn||"")}${k.skapad_av.epost?` (${esc(k.skapad_av.epost)})`:""}</p>`:""}
        <div class="aklass-verktyg">
          <input class="admin-sok" id="aklass-namn-${Number(k.id)}" value="${esc(k.namn)}" maxlength="40" aria-label="Klassnamn">
          <input class="admin-sok aklass-ordning" id="aklass-ord-${Number(k.id)}" type="number" value="${Number(k.ordning)||0}" aria-label="Ordning i listan" title="Ordning i listan">
          <button class="btn sm" onclick="kgAdminSparaKlass(${Number(k.id)})">Spara</button>
          ${k.larare?"":`<button class="btn sm quiet" onclick="kgAdminKlassTillGrupp(${Number(k.id)},'${esc(k.namn)}')" title="Skapa en lärarklass med klassens elever">Koppla lärare</button>`}
          ${k.larare?"":`<button class="btn sm quiet" onclick="kgAdminTaBortKlass(${Number(k.id)},'${esc(k.namn)}')">Ta bort</button>`}
        </div>
        ${elever.length?elever.map(e=>elev(e,k.id)).join(""):`<p class="modal-text">${sok?"Ingen träff i klassen.":"Inga elever i klassen än."}</p>`}
      </details>`;
    }).join("")}

      <summary><b>Utan klass</b><span class="aklass-antal">${(d.utan_klass||[]).length} ${(d.utan_klass||[]).length===1?"konto":"konton"}</span></summary>

async function kgAdminKlassAnrop(namn,kropp,klart){
  try{
    const r=await kgAdminRpc(namn,kropp);
    if(r && r.ok===false){
      toast({namn:"Skriv ett namn på 1–40 tecken.",namn_upptaget:"Det finns redan en klass med det namnet.",
        lararklass:"Klassen Lärare kan inte tas bort.",okand_klass:"Klassen finns inte längre."}[r.code]||"Det gick inte att spara.");
      return;
    }
    if(klart) toast(klart);
    await kgAdminRitaKlasser(document.getElementById("adminlista"));
  }catch(e){ toast(e.message); }
}
function kgAdminNyKlass(){
  const namn=(document.getElementById("admin-ny-klass")?.value||"").trim();
  if(!namn) return;
  kgAdminKlassAnrop("kg_admin_klass_spara",{p_id:null,p_namn:namn,p_ordning:0},`Klassen ${namn} är tillagd.`);
}
function kgAdminSparaKlass(id){
  const namn=(document.getElementById("aklass-namn-"+id)?.value||"").trim();
  const ord=Number(document.getElementById("aklass-ord-"+id)?.value)||0;
  kgAdminKlassAnrop("kg_admin_klass_spara",{p_id:id,p_namn:namn,p_ordning:ord},"Klassen är sparad.");
}
function kgAdminTaBortKlass(id,namn){
  if(!confirm(`Ta bort klassen ${namn}? Eleverna blir utan klass men behåller sin träning och XP.`)) return;
  kgAdminKlassAnrop("kg_admin_klass_ta_bort",{p_id:id},`Klassen ${namn} är borttagen.`);

  document.getElementById("kontomeny")?.remove();

  el.className="modal"; el.id="namnruta";
  el.innerHTML=`<div class="modal-kort" role="dialog" aria-label="Välj användarnamn" style="width:min(420px,100%)">
      <div class="modal-topp">
        <div>
          <div class="lbl">Topplistan</div>

        </div>
        <button class="iconbtn" onclick="stangNamnruta()" aria-label="Stäng">✕</button>
      </div>
      <p class="modal-text">${besked?esc(besked)+" ":""}Det här namnet är det enda andra ser.
        Välj något du inte har något emot att visa. Ditt riktiga namn behövs inte.</p>
      <input id="namnfalt" class="namnfalt" maxlength="${NAMN_MAX}" autocomplete="off"
        spellcheck="false" placeholder="t.ex. raketrav"
        value="${esc(forslag||profile.namn||"")}"
        oninput="namnSkrivet()" onkeydown="if(event.key==='Enter')sparaNamn()">
      <div class="namnhjalp" id="namnhjalp">${NAMN_MIN}–${NAMN_MAX} tecken. Bokstäver, siffror, bindestreck och understreck.</div>
      <div class="modal-fot">
        <span class="spacer"></span>
        <button class="btn" onclick="stangNamnruta()">Avbryt</button>
        <button class="btn primary" id="namnspara" onclick="sparaNamn()">Spara</button>
      </div>
    </div>`;
  document.body.appendChild(el);
  el.addEventListener("click",e=>{ if(e.target===el) stangNamnruta(); });

  setTimeout(()=>document.getElementById("namnfalt")?.focus(),80);
  namnSkrivet();

function stangNamnruta(){
  const el=document.getElementById("namnruta");
  if(!el) return;
  el.classList.remove("visa");
  setTimeout(()=>el.remove(),250);
}

function namnSkrivet(){
  const f=document.getElementById("namnfalt"), h=document.getElementById("namnhjalp"),
        k=document.getElementById("namnspara");
  if(!f||!h||!k) return;
  const fel=namnFel(f.value);
  const tomt=!f.value.trim();
  h.textContent = tomt
    ? `${NAMN_MIN}–${NAMN_MAX} tecken. Bokstäver, siffror, bindestreck och understreck.`
    : (fel || "Ser bra ut.");
  h.className = "namnhjalp" + (tomt?"":(fel?" fel":" ok"));
  k.disabled = !!fel;
}
async function sparaNamn(){
  const f=document.getElementById("namnfalt"), h=document.getElementById("namnhjalp"),
        k=document.getElementById("namnspara");
  if(!f||k.disabled) return;
  k.disabled=true; k.textContent="Sparar…";
  const svar=await claimaNamn(f.value);
  if(!svar.ok){
    h.textContent=svar.fel; h.className="namnhjalp fel";
    k.disabled=false; k.textContent="Spara";
    return;
  }
  stangNamnruta();
  toast("Användarnamnet är sparat.");

  setTimeout(()=>oppnaTopplista(),300);
}

/* --- Kurser under uppbyggnad -------------------------------------------
   Ett kort kan märkas med under:true och en kod. Kortet syns för alla,
   men går bara att öppna med koden. Upplåsningen ligger lokalt på
   enheten — det här är en alfaspärr, inte ett säkerhetsskydd. */
const ALFA_KEY="kunskapsgymmet-alfa";

function alfaOpplasta(){
  try{ return new Set(JSON.parse(localStorage.getItem(ALFA_KEY))||[]); }
  catch(_){ return new Set(); }
}
function alfaOpplast(id){
  const c=COURSES[id];
  if(!c||!c.under) return true;
  return alfaOpplasta().has(id);
}
function alfaLasUpp(id){
  const set=alfaOpplasta(); set.add(id);
  try{ localStorage.setItem(ALFA_KEY,JSON.stringify([...set])); }catch(_){}
}
function oppnaKurs(id){
  if(alfaOpplast(id)) return selectCourse(id);
  oppnaKodruta(id);
}
function oppnaKodruta(id){
  const c=COURSES[id];
  if(!c) return;
  const el=document.createElement("div");
  el.className="modal"; el.id="kodruta";
  el.innerHTML=`<div class="modal-kort" role="dialog" aria-label="Kurs under uppbyggnad" style="width:min(420px,100%)">
      <div class="modal-topp">
        <div>
          <div class="lbl">Under uppbyggnad</div>
          <h2>${esc(c.name)}</h2>
        </div>
        <button class="iconbtn" onclick="stangKodruta()" aria-label="Stäng">✕</button>
      </div>
      <p class="modal-text">Kursen är inte klar än. Har du fått en kod för att
        testa den så skriver du in den här.</p>
      <input id="kodfalt" class="kodfalt" autocomplete="off" spellcheck="false"
        placeholder="Kod" oninput="kodSkrivet()"
        onkeydown="if(event.key==='Enter')provaKod('${id}')">
      <div class="kodhjalp" id="kodhjalp"></div>
      <div class="modal-fot">
        <span class="spacer"></span>
        <button class="btn" onclick="stangKodruta()">Avbryt</button>
        <button class="btn primary" onclick="provaKod('${id}')">Öppna</button>
      </div>
    </div>`;
  document.body.appendChild(el);
  el.addEventListener("click",e=>{ if(e.target===el) stangKodruta(); });
  requestAnimationFrame(()=>el.classList.add("visa"));
  setTimeout(()=>document.getElementById("kodfalt")?.focus(),80);
}
function stangKodruta(){
  const el=document.getElementById("kodruta");
  if(!el) return;
  el.classList.remove("visa");
  setTimeout(()=>el.remove(),250);
}
function kodSkrivet(){
  const h=document.getElementById("kodhjalp");
  if(h){ h.textContent=""; h.className="kodhjalp"; }
}
function provaKod(id){
  const f=document.getElementById("kodfalt");
  const h=document.getElementById("kodhjalp");
  const svar=(f?.value||"").trim().toLowerCase();
  if(svar!==String(COURSES[id]?.kod||"").toLowerCase()){
    if(h){ h.textContent="Fel kod."; h.className="kodhjalp fel"; }
    if(f){ f.select(); }
    return;
  }
  alfaLasUpp(id);
  stangKodruta();
  selectCourse(id);
}

/* Kurskortets mätare räknar kursens moment på samma sätt som kursens översikt:
   Stark (minst 78 %), På gång (55–77 %), Behöver träning och ej påbörjade.
   Momentlistan sparas lokalt när kursens översikt har ritats. */
const KURSMOMENT_KEY="kunskapsgymmet-kursmoment";
function sparaKursMoment(kort){
  try{
    const alla=JSON.parse(localStorage.getItem(KURSMOMENT_KEY)||"{}");
    alla[state.course]={spar:state.track||null,kort:kort.map(k=>k.omr)};
    localStorage.setItem(KURSMOMENT_KEY,JSON.stringify(alla));
  }catch(_){}
}
function kursMomentLage(id){
  let lista=null;
  try{ lista=JSON.parse(localStorage.getItem(KURSMOMENT_KEY)||"{}")[id]?.kort; }catch(_){}
  if(!Array.isArray(lista) || !lista.length) return null;
  const areas=(profile.courses||{})[id]?.areas||{};
  const r={stark:0,pagang:0,svag:0,ny:0,totalt:lista.length};
  lista.forEach(omr=>{
    const v=(omr||[]).map(k=>typeof areas[k]==="number"?areas[k]:null);
    if(!v.some(x=>x!==null)){ r.ny++; return; }
    const m=v.reduce((a,x)=>a+(x||0),0)/v.length;
    if(m>=.78) r.stark++; else if(m>=.55) r.pagang++; else r.svag++;
  });
  return r;
}
function kursLage(id){
  const cp=(profile.courses||{})[id];
  if(!cp) return null;
  const varden=Object.values(cp.areas||{}).filter(x=>typeof x==="number");
  if(!varden.length) return null;
  let uppgifter=0;
  Object.values(cp.levels||{}).forEach(a=>{
    ["E","C","A"].forEach(L=>{ uppgifter+=(a?.[L]?.n)||0; });
  });
  return {
    omraden:varden.length,
    snitt:varden.reduce((a,b)=>a+b,0)/varden.length,
    uppgifter
  };
}

/* Hur många av rutnätets sex spår varje kort tar, så att varje rad i en
   grupp fylls ut: 3 kort → 2+2+2, 2 kort → 3+3, 1 kort → hela raden.
   Fyra kort blir två rader om två, fem blir 3 + 2 och så vidare. */
function kursspann(n){
  const rader=[];
  let kvar=n;
  while(kvar>0){
    const r = kvar===4 ? 2 : Math.min(3,kvar);
    rader.push(r); kvar-=r;
  }
  return rader.flatMap(r=>Array(r).fill(6/r));
}

   visas). Då ändras dokumentets bredd, och måttet uppdateras. */

function kopplaKursljus(){
  matRullningslist();

  app.querySelectorAll(".course-card,.area:not(.stack)").forEach(k=>{

async function loadScript(src){
  if(loadedScripts.has(src)) return;
  await new Promise((resolve,reject)=>{
