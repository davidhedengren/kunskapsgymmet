<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf6fd">
<title>Kunskapsgymmet</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<!-- KaTeX: snygg matematisk rendering av \( ... \) och \[ ... \] -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>

<style>
:root{
  color-scheme:light;
  --bg:#f3f9fd;
  --bg2:#eaf6fd;
  --surface:#ffffff;
  --surface2:#f8fcff;
  --surface3:#edf7fd;
  --text:#20313e;
  --text2:#526674;
  --muted:#7d929f;
  --line:#d9e9f2;
  --line2:#c9dfeb;
  --blue:#64afe0;
  --blue2:#2d89c6;
  --blue3:#176caa;
  --blueSoft:#e0f2fc;
  --green:#1b8a67;
  --greenSoft:#e6f6f0;
  --amber:#a66a12;
  --amberSoft:#fff5df;
  --red:#b65454;
  --redSoft:#fdecec;
  --purple:#7151a2;
  --purpleSoft:#f1ebfa;
  --shadow:0 10px 32px rgba(48,100,134,.08),0 2px 8px rgba(48,100,134,.035);
  --shadow2:0 18px 55px rgba(48,100,134,.13),0 4px 12px rgba(48,100,134,.05);
  --r:22px;
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1820;
  --bg2:#14232e;
  --surface:#17242e;
  --surface2:#1b2a35;
  --surface3:#203744;
  --text:#ecf5fa;
  --text2:#bed0da;
  --muted:#8ea4b1;
  --line:#29404d;
  --line2:#365363;
  --blue:#6fb9e8;
  --blue2:#76c3f1;
  --blue3:#a1d7f7;
  --blueSoft:#1e3b4c;
  --green:#65cba7;
  --greenSoft:#183b32;
  --amber:#e1b666;
  --amberSoft:#3b301d;
  --red:#e08b8b;
  --redSoft:#42272a;
  --purple:#bba1e0;
  --purpleSoft:#352b46;
  --shadow:0 12px 34px rgba(0,0,0,.22);
  --shadow2:0 20px 60px rgba(0,0,0,.30);
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{
  margin:0;min-height:100vh;color:var(--text);font-family:var(--ui);
  background:
    radial-gradient(900px 520px at 8% -10%,rgba(91,177,229,.14),transparent 65%),
    radial-gradient(700px 460px at 95% 105%,rgba(74,157,208,.09),transparent 66%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
::selection{background:rgba(100,175,224,.25)}
.app{min-height:100vh}
.shell{width:min(1180px,calc(100% - 36px));margin:0 auto}
.topbar{
  height:78px;display:flex;align-items:center;gap:14px;
}
.brand{
  display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:0;color:var(--text);
  font-weight:800;letter-spacing:-.025em;font-size:20px;
}
.brandmark{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,#7bc4ee,#2f8cc9);box-shadow:0 8px 22px rgba(47,140,201,.24);
  font-weight:800;
}
.spacer{flex:1}
.iconbtn,.ghost,.primary,.softbtn,.chip,.answer-action{
  border:1px solid var(--line);border-radius:14px;background:var(--surface);transition:.16s ease;
}
.iconbtn{
  width:43px;height:43px;display:grid;place-items:center;font-size:18px;
}
.iconbtn:hover,.ghost:hover,.softbtn:hover,.chip:hover{border-color:var(--line2);background:var(--surface3)}
.iconbtn:focus-visible,.ghost:focus-visible,.primary:focus-visible,.softbtn:focus-visible,.chip:focus-visible,
input:focus-visible{outline:3px solid rgba(100,175,224,.28);outline-offset:2px}
.hero{
  position:relative;overflow:hidden;padding:clamp(28px,5vw,52px);
  background:linear-gradient(135deg,var(--surface),var(--surface3));
  border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);
}
.hero:after{
  content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-110px;top:-150px;
  background:radial-gradient(circle,rgba(100,175,224,.19),rgba(100,175,224,0) 70%);
}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--blue3);margin-bottom:16px;
}
.eyebrow:before{content:"";width:26px;height:2px;background:var(--blue);border-radius:99px}
.hero h1{margin:0;font-size:clamp(38px,5.5vw,68px);line-height:.98;letter-spacing:-.055em;max-width:820px}
.hero p{margin:20px 0 0;max-width:720px;color:var(--text2);font-family:var(--read);font-size:clamp(17px,1.8vw,20px);line-height:1.55}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:30px 2px 14px}
.section-head h2{margin:0;font-size:22px;letter-spacing:-.025em}
.section-head span{color:var(--muted);font-size:13px}
.course-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;padding-bottom:42px}
.course-card{
  min-height:184px;text-align:left;padding:20px;border:1px solid var(--line);border-radius:22px;
  background:var(--surface);box-shadow:var(--shadow);position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.course-card:hover{transform:translateY(-2px);border-color:#a9d2e9;box-shadow:var(--shadow2)}
.course-card.loading{pointer-events:none;opacity:.72}
.course-card .course-code{font-family:var(--mono);font-size:10px;color:var(--blue3);letter-spacing:.08em;text-transform:uppercase}
.course-card h3{font-size:20px;line-height:1.12;letter-spacing:-.035em;margin:24px 0 8px}
.course-card p{font-family:var(--read);color:var(--muted);margin:0;font-size:14px;line-height:1.4}
.course-card .arrow{margin-top:auto;align-self:flex-end;width:34px;height:34px;border-radius:50%;background:var(--blueSoft);display:grid;place-items:center;color:var(--blue3);font-weight:800}
.course-card.loading .arrow{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.course-head{
  padding:24px 0 8px;display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;
}
.breadcrumb{border:0;background:transparent;color:var(--muted);padding:8px 0;font-size:13px}
.breadcrumb:hover{color:var(--blue3)}
.course-title{flex:1;min-width:260px}
.course-title .mini{font-family:var(--mono);font-size:10px;letter-spacing:.09em;color:var(--blue3);text-transform:uppercase}
.course-title h1{margin:5px 0 2px;font-size:clamp(30px,4vw,46px);letter-spacing:-.05em}
.course-title p{margin:0;color:var(--muted);font-family:var(--read)}
.trackbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.chip{padding:8px 11px;font-size:12px;font-weight:700}
.chip.active{background:var(--blue2);border-color:var(--blue2);color:#fff}

.dashboard{
  display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,.75fr);gap:16px;padding:14px 0 42px;
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-pad{padding:22px}
.training-start{
  padding:28px;background:linear-gradient(135deg,var(--surface),var(--surface3));
  display:flex;align-items:center;gap:20px;min-height:190px;
}
.training-start h2{margin:0 0 7px;font-size:27px;letter-spacing:-.04em}
.training-start p{margin:0;color:var(--text2);font-family:var(--read);max-width:620px}
.training-start .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.primary,.ghost,.softbtn{padding:11px 15px;font-weight:700}
.primary{background:var(--blue2);border-color:var(--blue2);color:#fff;box-shadow:0 7px 18px rgba(45,137,198,.18)}
.primary:hover{background:var(--blue3);border-color:var(--blue3);transform:translateY(-1px)}
.ghost{background:var(--surface)}
.softbtn{background:var(--blueSoft);color:var(--blue3);border-color:transparent}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:16px;border-radius:17px;background:var(--surface2);border:1px solid var(--line)}
.stat span{display:block;color:var(--muted);font-size:11px}
.stat strong{display:block;margin-top:5px;font-size:22px;letter-spacing:-.035em}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:11px}
.progress > i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--blue2))}
.feedback-mini h3,.areas h3{margin:0 0 14px;font-size:16px}
.mini-list{display:grid;gap:8px}
.mini-row{
  display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:13px;border:1px solid var(--line);
  background:var(--surface2);font-size:13px;text-align:left;width:100%;
}
.mini-row:hover{border-color:var(--line2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.dot.weak{background:var(--amber)}
.mini-row span:nth-child(2){flex:1}
.score{font-family:var(--mono);font-size:10px;color:var(--muted)}

.area-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.area-card{
  padding:15px;text-align:left;border:1px solid var(--line);border-radius:17px;background:var(--surface2);
}
.area-card:hover{background:var(--surface3);border-color:var(--line2)}
.area-card strong{display:block;font-size:14px}
.area-card small{display:block;margin-top:5px;color:var(--muted)}
.area-card .area-meter{height:5px;background:var(--line);border-radius:99px;margin-top:12px;overflow:hidden}
.area-card .area-meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

.picker{padding:8px 0 42px}
.chapter{margin-bottom:16px}
.chapter-title{margin:0 0 9px;color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.family-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.family-chip{padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:11px}
.family-chip:hover{background:var(--blueSoft);border-color:#b7dced;color:var(--blue3)}

.training-shell{width:min(920px,calc(100% - 32px));margin:0 auto;padding-bottom:42px}
.training-top{display:flex;align-items:center;gap:12px;padding:16px 0 14px}
.training-top .grow{flex:1}
.session-progress{font-family:var(--mono);font-size:10px;color:var(--muted)}
.task-card{
  border:1px solid var(--line);border-radius:28px;background:var(--surface);box-shadow:var(--shadow2);overflow:hidden;
}
.task-meta{
  display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);
  background:var(--surface2);
}
.badge{
  display:inline-flex;align-items:center;min-height:26px;padding:4px 9px;border-radius:999px;
  font-size:10px;font-weight:700;border:1px solid var(--line);background:var(--surface);
}
.badge.level-E{background:var(--greenSoft);color:var(--green);border-color:transparent}
.badge.level-C{background:var(--blueSoft);color:var(--blue3);border-color:transparent}
.badge.level-A{background:var(--purpleSoft);color:var(--purple);border-color:transparent}
.task-id{margin-left:auto;color:var(--muted);font-family:var(--mono);font-size:10px}
.task-body{
  padding:clamp(24px,4.5vw,46px);font-family:var(--read);font-size:18px;line-height:1.65;color:var(--text);
  overflow-wrap:anywhere;
}
.task-body p{margin:0 0 18px}
.task-body p:last-child{margin-bottom:0}
.task-body svg{display:block;max-width:100%;height:auto;margin:22px auto}
html[data-theme="dark"] .task-body svg{
  background:#fff;border-radius:14px;padding:8px;
}
.task-body table{max-width:100%;border-collapse:collapse}
.task-body td,.task-body th{border:1px solid var(--line);padding:7px 10px}
.katex{font-size:1.08em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 2px;margin:1em 0}
.answer-zone{padding:20px 22px 22px;border-top:1px solid var(--line);background:var(--surface2)}
.answer-zone h3{font-size:13px;margin:0 0 10px}
.answer-inputs{display:grid;gap:9px}
.answer-line{display:flex;align-items:center;gap:9px}
.answer-line label{width:24px;color:var(--muted);font-family:var(--mono);font-size:11px}
.answer-line input{
  flex:1;min-width:0;border:1px solid var(--line2);background:var(--surface);border-radius:13px;
  padding:12px 13px;font-family:var(--read);font-size:16px;
}
.answer-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.resultbox{
  margin-top:14px;padding:14px 16px;border-radius:15px;border:1px solid var(--line);
  font-family:var(--read);
}
.resultbox.good{background:var(--greenSoft);border-color:transparent;color:var(--green)}
.resultbox.bad{background:var(--redSoft);border-color:transparent;color:var(--red)}
.solution{
  margin-top:12px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);
  font-family:var(--read);font-size:16px;line-height:1.6;color:var(--text);
}
.solution svg{display:block;max-width:100%;height:auto;margin:18px auto}
html[data-theme="dark"] .solution svg{background:#fff;border-radius:12px;padding:8px}

.feedback-page{padding:8px 0 42px}
.feedback-hero{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.feedback-box{padding:22px}
.feedback-box h2{margin:0 0 5px;font-size:19px}
.feedback-box p{margin:0 0 15px;color:var(--muted);font-family:var(--read)}
.feedback-item{
  width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:12px;
  border:1px solid var(--line);background:var(--surface2);border-radius:14px;margin-top:7px;
}
.feedback-item:hover{border-color:var(--line2);background:var(--surface3)}
.feedback-item strong{flex:1;font-size:13px}
.feedback-item small{color:var(--muted)}
.empty{padding:20px;border:1px dashed var(--line2);border-radius:16px;color:var(--muted);font-family:var(--read)}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:11px 15px;border-radius:13px;background:var(--text);color:var(--surface);box-shadow:var(--shadow2);
  transition:.2s ease;z-index:50;font-size:13px;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:900px){
  .course-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dashboard{grid-template-columns:1fr}
  .feedback-hero{grid-template-columns:1fr}
}
@media(max-width:620px){
  .shell{width:min(100% - 22px,1180px)}
  .topbar{height:68px}
  .brand{font-size:18px}.brandmark{width:38px;height:38px}
  .hero{padding:26px;border-radius:24px}
  .course-grid{grid-template-columns:1fr}
  .area-grid{grid-template-columns:1fr}
  .course-head{padding-top:14px}
  .training-start{padding:22px}
  .training-shell{width:calc(100% - 18px)}
  .task-card{border-radius:22px}
  .task-body{font-size:17px;padding:24px 20px}
  .task-meta,.answer-zone{padding-left:16px;padding-right:16px}
}
</style>
</head>

<body>
<div id="app" class="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ==========================================================
   KUNSKAPSGYMMET
   All UI, CSS och träningslogik ligger i denna index.html.
   Struktur- och uppgiftsfilerna ligger separat i rooten.
   ========================================================== */

const COURSES = {
  fy1:{
    name:"Fysik nivå 1", code:"Fy1",
    files:["struktur.js","uppgifter.js"],
    globals:{bank:"BANK",kap:"KAPNAMN",omr:"OMR"},
    tracks:[]
  },
  fy2:{
    name:"Fysik nivå 2", code:"Fy2",
    files:["struktur2.js","uppgifter2.js"],
    globals:{bank:"BANK2",kap:"KAPNAMN2",omr:"OMR2"},
    tracks:[]
  },
  ma1:{
    name:"Matematik nivå 1", code:"Ma1",
    files:["strukturma1.js","uppgifterma1.js"],
    globals:{bank:"BANKMA1",kap:"KAPNAMNMA1",omr:"OMRMA1"},
    tracks:["1a","1b","1c"], defaultTrack:"1c"
  },
  ma2:{
    name:"Matematik nivå 2", code:"Ma2",
    files:["strukturma2.js","uppgifterma2.js"],
    globals:{bank:"BANKMA2",kap:"KAPNAMNMA2",omr:"OMRMA2"},
    tracks:["2a","2b","2c"], defaultTrack:"2c"
  },
  mato1:{
    name:"Matematik – fortsättning nivå 1", code:"Ma forts 1",
    files:["strukturmato1.js","uppgiftermato1.js"],
    globals:{bank:"BANKMATO1",kap:"KAPNAMNMATO1",omr:"OMRMATO1"},
    tracks:["1b","1c"], defaultTrack:"1c"
  },
  mato2:{
    name:"Matematik – fortsättning nivå 2", code:"Ma forts 2",
    files:["strukturmato2.js","uppgiftermato2.js"],
    globals:{bank:"BANKMATO2",kap:"KAPNAMNMATO2",omr:"OMRMATO2"},
    tracks:["2c"], defaultTrack:"2c"
  },
  matf1:{
    name:"Matematik – fördjupning nivå 1", code:"Ma fördj 1",
    files:["strukturmatf1.js","uppgiftermatf1.js"],
    globals:{bank:"BANKMATF1",kap:"KAPNAMNMATF1",omr:"OMRMATF1"},
    tracks:[]
  }
};

const COURSE_ORDER=["ma1","ma2","mato1","mato2","matf1","fy1","fy2"];
const app=document.getElementById("app");

const state={
  course:null, track:null, data:null, view:"home",
  focusArea:null, focusFamily:null,
  currentTask:null, sessionDone:0, lastIds:[],
  solutionShown:false, answered:false
};

const loadedScripts=new Set();
const PROFILE_KEY="kunskapsgymmet-profile-v1";
let profile=loadProfile();

function loadProfile(){
  try{
    return JSON.parse(localStorage.getItem(PROFILE_KEY)) || {xp:0,attempts:0,correct:0,streak:0,lastDay:null,courses:{}};
  }catch(_){ return {xp:0,attempts:0,correct:0,streak:0,lastDay:null,courses:{}}; }
}
function saveProfile(){ localStorage.setItem(PROFILE_KEY,JSON.stringify(profile)); }
function ensureCourseProfile(){
  const c=state.course || "none";
  profile.courses[c] ||= {areas:{},families:{},history:[]};
  return profile.courses[c];
}
function mastery(map,key){
  if(!key) return .55;
  return typeof map[key]==="number" ? map[key] : .55;
}
function updateMastery(map,key,correct){
  if(!key) return;
  let s=mastery(map,key);
  s = correct ? s + .10*(1-s) : s - .16*s;
  map[key]=Math.max(.08,Math.min(.96,s));
}
function levelFromXP(xp){ return Math.max(1,Math.floor(Math.sqrt(xp/110))+1); }
function xpToNext(level){ return Math.round(level*level*110); }

function setTheme(next){
  document.documentElement.dataset.theme=next;
  localStorage.setItem("kunskapsgymmet-theme",next);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content=next==="dark" ? "#0f1820" : "#eaf6fd";
}
(function initTheme(){
  const saved=localStorage.getItem("kunskapsgymmet-theme");
  if(saved==="dark"||saved==="light"){ setTheme(saved); return; }
  const dark=window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  setTheme(dark?"dark":"light");
})();

function toggleTheme(){
  setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
  render();
}
function themeIcon(){ return document.documentElement.dataset.theme==="dark" ? "☀" : "☾"; }

function renderMath(root=app){
  if(typeof renderMathInElement!=="function"){
    setTimeout(()=>renderMath(root),120);
    return;
  }
  try{
    renderMathInElement(root,{
      delimiters:[
        {left:"$$",right:"$$",display:true},
        {left:"\\[",right:"\\]",display:true},
        {left:"\\(",right:"\\)",display:false}
      ],
      throwOnError:false,
      strict:false,
      trust:false
    });
  }catch(err){ console.warn("KaTeX:",err); }
}

function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>el.classList.remove("show"),1700);
}

function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function topbar(back=false){
  return `<div class="shell"><div class="topbar">
    <button class="brand" onclick="${back?'goHome()':'goHome()'}" aria-label="Till startsidan">
      <span class="brandmark">K</span><span>Kunskapsgymmet</span>
    </button>
    <div class="spacer"></div>
    ${state.course?`<button class="ghost" onclick="showFeedback()">Min feedback</button>`:""}
    <button class="iconbtn" onclick="toggleTheme()" title="Byt färgläge" aria-label="Byt färgläge">${themeIcon()}</button>
  </div></div>`;
}

  state.view="home";
  app.innerHTML=topbar()+`
  <main class="shell">

async function loadScript(src){
  if(loadedScripts.has(src)) return;
  await new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src=src+"?v="+Date.now();
    s.onload=()=>{loadedScripts.add(src);resolve();};
    s.onerror=()=>reject(new Error("Kunde inte ladda "+src));
    document.head.appendChild(s);
  });
}

async function selectCourse(id){
  const c=COURSES[id];
  if(!c) return;
  const card=document.getElementById("course-"+id);
  if(card) card.classList.add("loading");
  try{
    for(const f of c.files) await loadScript(f);
    const bank=window[c.globals.bank];
    const kap=window[c.globals.kap] || {};
    const omr=window[c.globals.omr] || {};
    if(!Array.isArray(bank)) throw new Error(`Globalen window.${c.globals.bank} hittades inte eller är inte en array.`);
    state.course=id;
    state.track=c.defaultTrack || (c.tracks[0]||null);
    state.data={bank,kap,omr};
    state.focusArea=null;state.focusFamily=null;state.currentTask=null;
    ensureCourseProfile();
    history.replaceState(null,"","#"+id);
    renderDashboard();
  }catch(err){
    console.error(err);
    if(card) card.classList.remove("loading");
    alert("Kunde inte öppna kursen.\n\n"+err.message+"\n\nKontrollera att filerna ligger i samma mapp som index.html.");
  }
}

function availableTasks(){
  if(!state.data) return [];
  let tasks=state.data.bank;
  if(state.track){
    tasks=tasks.filter(t=>{
      if(!t.kurs) return true;
      const k=Array.isArray(t.kurs)?t.kurs:[t.kurs];
      return k.includes(state.track);
    });
  }
  return tasks;
}
function areaName(key){
  const omr=state.data?.omr||{};
  for(const v of Object.values(omr)){
    if(v && typeof v==="object" && key in v) return v[key];
  }
  if(key in omr && typeof omr[key]==="string") return omr[key];
  return key ? key.replaceAll("_"," ") : "Övrigt";
}
function chapterName(kap){
  const k=state.data?.kap||{};
  return k[kap] || k[String(kap)] || `Kapitel ${kap}`;
}
function familyName(f){
  if(!f) return "Övrigt";
  return String(f).replaceAll("_"," ").replace(/\b\w/g,m=>m.toUpperCase());
}
function abilityText(f){
  if(!f) return "";
  const a=Array.isArray(f)?f:[f];
  return a.map(x=>String(x).replaceAll("_"," ")).join(" · ");
}
function getAreas(){
  const tasks=availableTasks();
  const by={};
  for(const t of tasks){
    const key=t.omr||"ovrigt";
    by[key] ||= {key,name:areaName(key),kap:t.kap,count:0,families:new Set()};
    by[key].count++;
    if(t.familj){
      const fs=Array.isArray(t.familj)?t.familj:[t.familj];
      fs.forEach(f=>by[key].families.add(f));
    }
  }
  return Object.values(by).sort((a,b)=>(+a.kap||99)-(+b.kap||99)||a.name.localeCompare(b.name,"sv"));
}

function setTrack(track){
  state.track=track; state.focusArea=null; state.focusFamily=null; state.currentTask=null;
  renderDashboard();
}
function courseStats(){
  const cp=ensureCourseProfile();
  const level=levelFromXP(profile.xp);
  return {
    level,xp:profile.xp,attempts:profile.attempts,correct:profile.correct,
    accuracy:profile.attempts?Math.round(profile.correct/profile.attempts*100):0,
    next:xpToNext(level),cp
  };
}

function weakAreas(limit=4){
  const cp=ensureCourseProfile();
  return getAreas().map(a=>({...a,m:mastery(cp.areas,a.key)})).sort((a,b)=>a.m-b.m).slice(0,limit);
}
function strongAreas(limit=4){
  const cp=ensureCourseProfile();
  return getAreas().map(a=>({...a,m:mastery(cp.areas,a.key)})).sort((a,b)=>b.m-a.m).slice(0,limit);
}
function weakFamilies(limit=6){
  const cp=ensureCourseProfile();
  const seen=new Map();
  availableTasks().forEach(t=>{
    if(!t.familj) return;
    const fs=Array.isArray(t.familj)?t.familj:[t.familj];
    fs.forEach(f=>{ if(!seen.has(f)) seen.set(f,{family:f,area:t.omr,count:0}); seen.get(f).count++; });
  });
  return [...seen.values()].map(x=>({...x,m:mastery(cp.families,x.family)}))
    .sort((a,b)=>a.m-b.m).slice(0,limit);
}

function renderDashboard(){

}

function difficulty(t){
  const n=String(t.niva||"E").toUpperCase();
  return n==="A"?.84:n==="C"?.64:.40;
}
function chooseTask(){
  let pool=availableTasks();
  if(state.focusArea) pool=pool.filter(t=>t.omr===state.focusArea);
  if(state.focusFamily) pool=pool.filter(t=>{
    const fs=Array.isArray(t.familj)?t.familj:[t.familj];
    return fs.includes(state.focusFamily);
  });
  if(!pool.length) return null;
  const cp=ensureCourseProfile();
  const recent=new Set(state.lastIds.slice(-6));
  const scored=pool.map(t=>{
    const am=mastery(cp.areas,t.omr);
    const fs=Array.isArray(t.familj)?t.familj:[t.familj].filter(Boolean);
    const fm=fs.length?Math.min(...fs.map(f=>mastery(cp.families,f))):am;
    const target=(am*.55+fm*.45);
    let score=Math.abs(difficulty(t)-target);
    score += (fm-.50)*.32;             // svag familj prioriteras
    score += recent.has(t.id)?.60:0;    // undvik upprepning
    score += Math.random()*.22;         // variation
    return {t,score};
  }).sort((a,b)=>a.score-b.score);
  const top=scored.slice(0,Math.min(8,scored.length));
  return top[Math.floor(Math.random()*top.length)].t;
}

function startAdaptive(){
  state.focusArea=null;state.focusFamily=null;state.sessionDone=0;state.lastIds=[];
  nextTask();
}
function startArea(area){
  state.focusArea=area;state.focusFamily=null;state.sessionDone=0;state.lastIds=[];
  nextTask();
}
function startFamily(area,family){
  state.focusArea=area;state.focusFamily=family;state.sessionDone=0;state.lastIds=[];
  nextTask();
}
function nextTask(){
  const t=chooseTask();
  if(!t){toast("Inga uppgifter hittades.");return;}
  state.currentTask=t;state.answered=false;state.solutionShown=false;
  state.lastIds.push(t.id);
  if(state.lastIds.length>12) state.lastIds.shift();
  renderTraining();
}

function renderTraining(){
  state.view="training";
  const t=state.currentTask;
  if(!t) return renderDashboard();
  const family=Array.isArray(t.familj)?t.familj.join(" · "):t.familj;
  const canAuto=!!t.självrättning && t.rättSvar!==null && t.rättSvar!==undefined;
  const answers=Array.isArray(t.rättSvar)?t.rättSvar:[t.rättSvar];
  const meta=[
    `<span class="badge level-${esc(t.niva||"E")}">${esc(t.niva||"E")}-nivå</span>`,
    `<span class="badge">${esc(areaName(t.omr))}</span>`,
    family?`<span class="badge">${esc(familyName(family))}</span>`:"",
    t.formaga?`<span class="badge">${esc(abilityText(t.formaga))}</span>`:"",
    t.miniräknare?`<span class="badge">Miniräknare</span>`:"",
    t.geogebra?`<span class="badge">GeoGebra</span>`:""
  ].join("");

  const answerUI=canAuto?`
    <h3>Skriv ditt svar</h3>
    <div class="answer-inputs">
      ${answers.map((_,i)=>`<div class="answer-line"><label>${answers.length>1?String.fromCharCode(97+i)+")":""}</label>
        <input id="ans-${i}" autocomplete="off" inputmode="text" placeholder="${answers.length>1?'Svar '+String.fromCharCode(97+i):'Ditt svar'}" onkeydown="if(event.key==='Enter')checkAnswer()">
      </div>`).join("")}
    </div>
    <div class="answer-actions">
      <button class="primary" onclick="checkAnswer()">Kontrollera</button>
      <button class="ghost" onclick="showSolution()">Visa lösning</button>
    </div>
  `:`
    <h3>Redovisa din lösning på papper eller i ditt digitala verktyg.</h3>
    <div class="answer-actions">
      <button class="primary" onclick="showSolution()">Visa facit</button>
    </div>`;

  app.innerHTML=`
    <div class="training-shell">
      <div class="training-top">
        <button class="breadcrumb" onclick="renderDashboard()">← Avsluta passet</button>
        <div class="grow"></div>
        <span class="session-progress">${state.sessionDone} avklarade</span>
        <button class="iconbtn" onclick="toggleTheme()" title="Byt färgläge">${themeIcon()}</button>
      </div>
      <article class="task-card">
        <div class="task-meta">${meta}<span class="task-id">#${esc(t.id)}</span></div>
        <div class="task-body">${t.t||""}</div>
        <div class="answer-zone" id="answer-zone">${answerUI}<div id="answer-result"></div><div id="solution-holder"></div></div>
      </article>
    </div>`;
  renderMath(app);
  setTimeout(()=>document.getElementById("ans-0")?.focus(),60);
}

function latexToPlain(s){
  let x=String(s??"");
  x=x.replace(/<[^>]+>/g,"");
  x=x.replace(/\\\(|\\\)|\\\[|\\\]/g,"");
  x=x.replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g,"($1)/($2)");
  x=x.replace(/\\sqrt\s*\{([^{}]+)\}/g,"sqrt($1)");
  x=x.replace(/\\cdot/g,"*").replace(/\\,/g,"");
  x=x.replace(/[−–—]/g,"-").replace(/\u00a0/g," ");
  return x.trim();
}
function normalizeAnswer(s){
  return latexToPlain(s).toLowerCase()
    .replace(/^svar:\s*/,"")
    .replace(/\s+/g,"")
    .replace(/,/g,".")
    .replace(/[.;]$/,"");
}
function firstNumber(s){
  const x=latexToPlain(s).replace(/\s(?=\d{3}\b)/g,"").replace(/,/g,".");
  const m=x.match(/[-+]?\d+(?:\.\d+)?/);
  return m?Number(m[0]):NaN;
}
function oneAnswerCorrect(user,expected,t){
  const u=normalizeAnswer(user), e=normalizeAnswer(expected);
  if(!u) return false;
  if(u===e) return true;
  const un=firstNumber(user), en=firstNumber(expected);
  if(Number.isFinite(un)&&Number.isFinite(en)){
    const tol=typeof t.tolerans==="number" ? t.tolerans : Math.max(1e-9,Math.abs(en)*1e-4);
    if(Math.abs(un-en)<=tol) return true;
  }
  return false;
}
function checkAnswer(){
  if(state.answered) return;
  const t=state.currentTask;
  const expected=Array.isArray(t.rättSvar)?t.rättSvar:[t.rättSvar];
  const users=expected.map((_,i)=>document.getElementById("ans-"+i)?.value||"");
  if(users.some(x=>!x.trim())){toast("Fyll i alla svar först.");return;}
  const flags=expected.map((e,i)=>oneAnswerCorrect(users[i],e,t));
  finishAttempt(flags.every(Boolean));
}
function finishAttempt(correct){
  if(state.answered) return;
  state.answered=true;state.sessionDone++;
  profile.attempts++; if(correct) profile.correct++;
  const xp=correct ? (String(state.currentTask.niva).toUpperCase()==="A"?28:String(state.currentTask.niva).toUpperCase()==="C"?18:10) : 2;
  profile.xp += xp;
  const cp=ensureCourseProfile();
  updateMastery(cp.areas,state.currentTask.omr,correct);
  const fs=Array.isArray(state.currentTask.familj)?state.currentTask.familj:[state.currentTask.familj].filter(Boolean);
  fs.forEach(f=>updateMastery(cp.families,f,correct));
  cp.history.push({id:state.currentTask.id,ok:correct,at:Date.now(),area:state.currentTask.omr,family:state.currentTask.familj});
  cp.history=cp.history.slice(-300);
  saveProfile();

  const box=document.getElementById("answer-result");
  if(box) box.innerHTML=`<div class="resultbox ${correct?'good':'bad'}">
    <strong>${correct?'Rätt!':'Inte riktigt.'}</strong> ${correct?`+${xp} XP`:"Titta på lösningen och försök förstå vilket steg som blev fel."}
  </div><div class="answer-actions">
    ${!correct?`<button class="ghost" onclick="showSolution()">Visa lösning</button>`:""}
    <button class="primary" onclick="nextTask()">Nästa uppgift →</button>
  </div>`;
}
function showSolution(){
  const t=state.currentTask;
  state.solutionShown=true;
  const holder=document.getElementById("solution-holder");
  if(holder){
    holder.innerHTML=`<div class="solution"><strong>Lösning</strong><div style="margin-top:10px">${t.s||"Facit saknas."}</div></div>
      ${!state.answered?`<div class="answer-actions">
        <button class="softbtn" onclick="selfGrade(true)">Jag hade rätt</button>
        <button class="ghost" onclick="selfGrade(false)">Jag behöver träna mer</button>
      </div>`:""}`;
    renderMath(holder);
  }
}
function selfGrade(ok){ if(!state.answered) finishAttempt(ok); }

function showFeedback(){
  if(!state.course){return renderHome();}
  state.view="feedback";
  const strong=strongAreas(5),weak=weakAreas(5),families=weakFamilies(8),stats=courseStats();
  app.innerHTML=topbar(true)+`<main class="shell feedback-page">
    <div class="course-head">
      <button class="breadcrumb" onclick="renderDashboard()">← Till kursen</button>
      <div class="course-title"><div class="mini">${esc(COURSES[state.course].code)}</div><h1>Min feedback</h1>
      <p>Profilen uppdateras efter varje tränad uppgift. Klicka på ett område eller en familj för att punktträna.</p></div>
    </div>

    <div class="feedback-hero">
      <section class="panel feedback-box">
        <h2>Starkt just nu</h2><p>Områden där resultaten är stabilast.</p>
        ${profile.attempts?strong.map(x=>`<button class="feedback-item" onclick="startArea('${esc(x.key)}')">
          <span class="dot"></span><strong>${esc(x.name)}</strong><small>${Math.round(x.m*100)}%</small>
        </button>`).join(""):`<div class="empty">Träna några uppgifter först så bygger Kunskapsgymmet din profil.</div>`}
      </section>
      <section class="panel feedback-box">
        <h2>Träna mer på</h2><p>Områden som systemet prioriterar i kommande pass.</p>
        ${weak.map(x=>`<button class="feedback-item" onclick="startArea('${esc(x.key)}')">
          <span class="dot weak"></span><strong>${esc(x.name)}</strong><small>${Math.round(x.m*100)}%</small>
        </button>`).join("")}
      </section>
    </div>

    <div class="section-head"><h2>Familjer att punktträna</h2><span>Mer specifik feedback</span></div>
    <section class="panel feedback-box">
      ${families.length?families.map(x=>`<button class="feedback-item" onclick="startFamily('${esc(x.area)}','${esc(x.family)}')">
        <span class="dot weak"></span><strong>${esc(familyName(x.family))}</strong>
        <small>${esc(areaName(x.area))} · ${Math.round(x.m*100)}%</small>
      </button>`).join(""):`<div class="empty">Den här banken saknar familjetaggar eller så finns ännu ingen data.</div>`}
    </section>
  </main>`;
}

function goHome(){
  state.course=null;state.data=null;state.track=null;state.currentTask=null;
  history.replaceState(null,"",location.pathname+location.search);
  renderHome();
}

function render(){
  if(state.view==="dashboard"&&state.course) renderDashboard();
  else if(state.view==="picker"&&state.course) showAreaPicker();
  else if(state.view==="training"&&state.currentTask) renderTraining();
  else if(state.view==="feedback"&&state.course) showFeedback();
  else renderHome();
}

/* Om sidan öppnas som index.html#ma1 laddas kursen direkt. */
window.addEventListener("load",async()=>{
  renderHome();
  const id=location.hash.replace("#","");
  if(COURSES[id]) await selectCourse(id);
});
