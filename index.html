    <div class="sumtiles">
      <div class="card tile" style="background:var(--surface)"><span>Uppgifter</span><strong>${state.sessionCorrect} / ${total}</strong></div>
      <div class="card tile" style="background:var(--surface)"><span>Intjänat</span><strong>+${state.sessionXp} XP</strong></div>
      <div class="card tile" style="background:var(--surface)"><span>Idag</span><strong>${done} / ${goal}</strong></div>
    </div>

    ${felLista()}

    ${(()=>{
      const b=profile.bastaPass;
      if(!b) return "";
      const nytt=state.rekord;
      return `<div class="rekord${nytt?" ny":""}">
        <span class="ikon" aria-hidden="true">${medaljIkon(nytt?"provklar":"skiva")}</span>
        <span class="txt">
          <b>${nytt?"Nytt rekord!":"Bästa passet hittills"}</b>
          <small>${b.pct} % · ${b.ratt} av ${b.total} rätt${nytt&&state.gamlaRekordet?` · slog ${state.gamlaRekordet.pct} %`:""}</small>
        </span>
      </div>`;
    })()}

    <div class="card pad" style="text-align:left">
      <div class="rankrow">
        <div class="ringwrap" style="width:58px;height:58px">
          ${ring(lp.pct,58,5,"#c79a3c")}
          <div class="num" style="font-size:16px">${lp.level}</div>
        </div>
        <div style="flex:1">
          <div class="rankname">${esc(rank.name)}</div>
          <div class="rankmeta">${nxt?`${toNext} XP till nivå ${lp.level+1} · ${esc(nxt.name)} vid nivå ${nxt.lvl}`:`${toNext} XP till nivå ${lp.level+1}`}</div>
        </div>
        ${st?`<span class="pill"><span class="flame">${st}</span> dagar i rad</span>`:""}
      </div>
      <div class="rankbar"><i data-w="${Math.round(lp.pct*100)}%"></i></div>
    </div>

    ${(()=>{const nb=nextBadge(); if(!nb) return "";
      return `<div class="badge-row" style="margin-top:10px;background:var(--surface);border-color:var(--hair)">

    <div class="aacts" style="justify-content:center;margin-top:22px">

    onclick="oppnaTopplista('${id}',false)">${txt}</button>`;

                  dagar:"dagsstreck just nu"}[s];

    ? `<div class="toppnotis">
         <b>Du är inte med och tävlar.</b>

       </div>`
    : !profile.namn
    ? `<div class="toppnotis">
         <b>Du är inte med än.</b>

       </div>`
    : !profile.visaTopplista
      ? `<div class="toppnotis">

           <button class="btn sm primary" onclick="snabbVisa(true)">Visa mig på listan</button>
         </div>`
      : `<div class="toppnotis pa">
           <b>Du syns som ${esc(profile.namn)}${placering?` · plats ${placering}`:""}.</b>
           <span>Andra ser ditt namn, din nivå, dina medaljer och hur mycket du tränat.</span>
           <button class="btn sm" onclick="snabbVisa(false)">Dölj mig</button>
         </div>`;

  let lista;

    lista=`<div class="toppladdar">Hämtar listan…</div>`;
  }else if(!rader){
    lista=`<div class="empty">Kunde inte hämta topplistan just nu. Försök igen om en stund.</div>`;

      return `<li class="topprad${jag?" jag":""}${i<3?" pall":""}">
        <span class="plats">${i+1}</span>

  }

  app.innerHTML=topbar()+`<main class="shell view" style="padding-bottom:60px">
    <div class="chead">
      <div class="t">
        <button class="crumb" onclick="tillbakaFranTopplista()"><span aria-hidden="true">←</span> Tillbaka</button>
        <h1>Topplistan</h1>

      </div>
    </div>
    ${egen}

    <div class="card pad" style="margin-top:14px">${lista}</div>
  </main>`;
  afterRender();
}

function render(){
  if(state.view==="gate") renderGate();
  else if(state.view==="dashboard"&&state.course) renderDashboard();
  else if(state.view==="training"&&state.currentTask) renderTraining();
  else if(state.view==="progress"&&state.course) showProgress();

/* Om sidan öppnas som index.html#ma1 laddas kursen direkt. */
window.addEventListener("load",async()=>{
  // Tokens från Google plockas bort ur adressen innan något annat läser den.
  const nyInloggning=MOLN_PA() && fangaInloggning();
  if(MOLN_PA()) lasSession();
  // Adressen läses först: navRecord skriver om den och skulle annars
  // radera hashen innan vi hunnit se vilken kurs som efterfrågas.
  {
    const adr=tolkaAdress(location.hash);
    onskadKurs=adr.kurs;
    if(adr.kurs && adr.kapitel) onskadKapitel={kurs:adr.kurs,lista:adr.kapitel};
  }

  // Länken från "glömt lösenord" loggar in tillfälligt. Då är det bara
  // lösenordsrutan som ska mötas, inte hela appen.
  if(inloggningsTyp==="recovery"){ gateLage="nytt"; renderGate(); navRecord("home",true); return; }
  if(visaGate()){ renderGate(); navRecord("home",true); return; }
  // Ett avbrutet pass går före kurslistan: eleven var mitt i något.
  const avbrutet=lasPagaendePass();
  if(avbrutet && !onskadKurs && COURSES[avbrutet.kurs]){
    renderHome(); navRecord("home",true);
    await selectCourse(avbrutet.kurs);
    if(aterupptaPass(avbrutet)) renderDashboard();
  }else{
    await startaAppen();
  }

  if(MOLN_PA() && session){
    await hamtaAnvandare();
    await synkaProfil();
    await autoNamnFranGoogle();
    render();
    if(nyInloggning) toast("Inloggad. Din träning synkas nu mellan enheterna.");
  }
});

window.KG_TEST_ANSWER_CHECKER=function(){
  const cases=[
    ["11y+3","3+11y",true],
    ["5y-y+2y","6y",true],
    ["(x+1)^2","x^2+2x+1",true],
    ["2(x+3)","2x+6",true],
    ["1,5","1.5",true],
    ["3/4","0,75",true],
    ["x=2","2=x",true],
    ["2x=4","x=2",true],
    ["x+1","x+2",false]
  ];
  const result=cases.map(([u,e,want])=>{
    const got=algebraicallyEquivalent(u,e) || oneAnswerCorrect(u,e,{});
    return {elevsvar:u,facit:e,förväntat:want,resultat:got,ok:got===want};
  });
  console.table(result);
  return result.every(x=>x.ok);
};
