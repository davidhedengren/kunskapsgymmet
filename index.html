/* ==========================================================
   URVAL OCH PASS
   ========================================================== */

/* Bankens E, C och A visas för eleven som nivå 1, 2 och 3. */
const NIVA={E:1,C:2,A:3};
function levelOf(t){
  const n=String(t.niva||"E").toUpperCase();
  return (n==="A"||n==="C") ? n : "E";
}
function levelNumber(t){ return NIVA[levelOf(t)]; }
function levelChip(t){
  const n=levelNumber(t);
  const pips=[1,2,3].map(i=>`<b class="${i<=n?"on":""}"></b>`).join("");
  return `<span class="tag lv lv${n}" title="Svårighetsgrad ${n} av 3">
    <span class="pips" aria-hidden="true">${pips}</span>Nivå ${n}</span>`;
}
function familyMastery(t,cp){
  const fs=(Array.isArray(t.familj)?t.familj:[t.familj]).filter(Boolean);
  if(!fs.length) return mastery(cp.areas,t.omr);
  return Math.min(...fs.map(f=>mastery(cp.families,f)));
}

/* ==========================================================
   RÖRLIGA NIVÅGRÄNSER
   Varje svårighetsgrad har ett eget resultat per område. Det gör att
   appen kan skilja på "svarar fel på nivå 1" och "svarar fel på
   nivå 2", och förskjuta blandningen åt rätt håll i båda fallen.
   ========================================================== */

function levelStats(area,L){
  const cp=ensureCourseProfile();
  cp.levels ||= {};
  if(!cp.levels[area]){
    // Har eleven redan tränat området före uppdateringen ärvs den
    // gamla siffran som ett resultat på nivå 1, så ingen börjar om.
    const m = typeof cp.areas[area]==="number" ? cp.areas[area] : null;
    const n = m===null ? 0 : Math.min(8,cp.history.filter(h=>h.area===area).length);
    cp.levels[area]={E:{s:m===null?.5:m,n},C:{s:.5,n:0},A:{s:.5,n:0}};
  }
  return cp.levels[area][L] || (cp.levels[area][L]={s:.5,n:0});
}
function updateLevelStat(area,L,ok){
  if(!area) return;
  const st=levelStats(area,L);
  // Snabbare utslag än områdets mastery: gränserna ska röra sig
  // inom några uppgifter, inte över ett helt kapitel.
  st.s = ok ? st.s + .16*(1-st.s) : st.s - .22*st.s;
  st.s = Math.max(.06,Math.min(.97,st.s));
  st.n = (st.n||0)+1;
}
/* Resultatet för en nivå i ett bestämt område. Varje område har sin
   egen resa: den som är stark i ett område börjar ändå på nivå 1 i
   nästa, eftersom innehållet är nytt. */
function scopeLevel(L,area){
  const st=levelStats(area,L);
  return {s:st.s,n:st.n||0};
}

/* ==========================================================
   KUNSKAPSLÄGE PER KAPITEL OCH KURS
   Nivåresultaten vägs ihop till ett tal 0–100. Nivå 1 svarar för
   45, nivå 2 för 35 och nivå 3 för 20 — den som bara behärskar
   grunderna landar alltså kring 45 och den som klarar allt på 100.
   ========================================================== */

const NIVA_VIKT={E:.45,C:.35,A:.20};

/* Läser utan att skapa poster, så att en vy inte fyller profilen
   med tomma områden. */
function levelStatRead(area,L){
  const cp=ensureCourseProfile();
  const a=cp.levels && cp.levels[area];
  if(a && a[L]) return a[L];
  if(L==="E" && typeof cp.areas[area]==="number"){
    return {s:cp.areas[area],n:Math.min(8,cp.history.filter(h=>h.area===area).length)};
  }
  return {s:.5,n:0};
}
/* Hur väl en nivå sitter i ett område: resultatet dämpat av hur få
   uppgifter som ligger bakom det. Oprövat ger noll. */
function levelQuality(area,L){
  const st=levelStatRead(area,L);
  return st.s*Math.min(1,(st.n||0)/5);
}
function areaLevels(area){
  return {E:levelQuality(area,"E"),C:levelQuality(area,"C"),A:levelQuality(area,"A")};
}
function scoreOf(q){ return 100*(NIVA_VIKT.E*q.E + NIVA_VIKT.C*q.C + NIVA_VIKT.A*q.A); }
function meanLevels(list){
  if(!list.length) return {E:0,C:0,A:0};
  const sum={E:0,C:0,A:0};
  list.forEach(q=>{sum.E+=q.E;sum.C+=q.C;sum.A+=q.A;});
  return {E:sum.E/list.length,C:sum.C/list.length,A:sum.A/list.length};
}
function chapterProgress(){
  const by={};
  getAreas().forEach(a=>{(by[a.kap] ||= []).push(a)});
  return Object.keys(by).sort((x,y)=>kapNr(x)-kapNr(y)).map(kap=>{
    const q=meanLevels(by[kap].map(a=>areaLevels(a.key)));
    return {kap,name:chapterName(kap),antal:by[kap].length,q,score:scoreOf(q)};
  });
}
function courseProgress(){
  const q=meanLevels(getAreas().map(a=>areaLevels(a.key)));
  return {q,score:scoreOf(q)};
}
function scoreLabel(v){
  if(v<3)  return {txt:"Inte påbörjat",cls:"s-new"};
  if(v<30) return {txt:"Påbörjat",cls:"s-low"};
  if(v<55) return {txt:"Grunderna sitter",cls:"s-mid"};
  if(v<80) return {txt:"Stabilt",cls:"s-mid"};
  return {txt:"Behärskar",cls:"s-good"};
}

/* behärskar: redo att lämna nivån bakom sig.
   klarar:    hänger med på nivån just nu. En nivå som ännu inte är
              prövad får förtroendet .6, så att den introduceras mjukt. */
const behärskar = x => Math.max(0,Math.min(1,(x.s-.55)/.25)) * Math.max(0,Math.min(1,x.n/6));
const klarar    = x => x.n<2 ? .6 : Math.max(0,Math.min(1,(x.s-.35)/.30));

function levelWeights(area){
  const e=scopeLevel("E",area), c=scopeLevel("C",area), a=scopeLevel("A",area);
  const m1=behärskar(e), m2=behärskar(c), k2=klarar(c), k3=klarar(a);
  const w={
    // Nivå 1 viker undan först när grunderna sitter OCH nivå 2 går bra.
    // Kärvar det på nivå 2 kommer nivå 1 tillbaka av sig själv.
    E: 1 - .90*m1*k2,
    C: m1*(.25+.75*k2),
    A: m1*m2*(.25+.75*k3)
  };
  // Dagens passtyp förskjuter blandningen. Den ändrar aldrig vad eleven
  // faktiskt har låst upp — ett tungt pass i ett område där nivå 2 inte
  // är öppen blir helt enkelt ett vanligt pass.
  const v=(PASS[state.passTyp]||{}).vikt;
  if(v){ w.E*=v.E; w.C*=v.C; w.A*=v.A; }
  return w;
}

/* Normaliserad blandning, med golv för nivå 1. Ett tungt pass sänker
   golvet: där är hela poängen att slippa uppvärmningen. */
const NIVA_GOLV=.10;
function levelMix(finns,area){
  const w=levelWeights(area);
  const golv=state.passTyp==="tungt" ? .04 : NIVA_GOLV;
  const order=["E","C","A"];
  order.forEach(L=>{ if(!finns[L]) w[L]=0; });
  const tot=order.reduce((x,L)=>x+w[L],0);
  if(!tot) return null;
  const mix={};
  order.forEach(L=>mix[L]=w[L]/tot);
  if(finns.E && mix.E<golv){
    const kvar=1-golv, ovrigt=mix.C+mix.A;
    mix.E=golv;
    if(ovrigt>0){ mix.C=mix.C/ovrigt*kvar; mix.A=mix.A/ovrigt*kvar; }
  }
  return mix;
}

/* I adaptivt läge bestäms området före nivån, så att varje område
   får sin egen nivåblandning. Svaga områden får lite förtur och det
   senast tränade hålls tillbaka för variationens skull. */
function chooseArea(pool){
  const cp=ensureCourseProfile();
  const areas=[...new Set(pool.map(t=>t.omr||"ovrigt"))];
  if(areas.length<2) return areas[0];
  return areas
    .map(a=>({a,k:mastery(cp.areas,a)*.5 + (a===state.lastArea?.45:0) + Math.random()}))
    .sort((x,y)=>x.k-y.k)[0].a;
}

function chooseTask(){
  // Felpasset har en färdig kö. Uppgifter som hunnit försvinna ur
  // banken hoppas över i stället för att stoppa passet.
  while(state.felKo && state.felKo.length){
    const id=state.felKo.shift();
    const t=availableTasks().find(x=>x.id===id);
    if(t) return t;
  }
  let pool=availableTasks();
  if(state.focusOmr) pool=pool.filter(t=>state.focusOmr.includes(t.omr||"ovrigt"));
  else if(state.focusArea) pool=pool.filter(t=>t.omr===state.focusArea);
  if(state.focusFamily){
    // Fokus kan vara ett enskilt delmoment eller flera valda samtidigt.
    const vill=Array.isArray(state.focusFamily)?state.focusFamily:[state.focusFamily];
    pool=pool.filter(t=>{
      const fs=Array.isArray(t.familj)?t.familj:[t.familj];
      return fs.some(f=>vill.includes(f));
    });
  }
  if(!pool.length) return null;

  const cp=ensureCourseProfile();
  const recent=new Set(state.lastIds.slice(-8));

  // 1. Bestäm område. Nivåblandningen gäller alltid ett område i taget.
  const area = state.focusArea || chooseArea(pool);
  if(!state.focusArea) pool=pool.filter(t=>(t.omr||"ovrigt")===area);

  const buckets={E:[],C:[],A:[]};
  pool.forEach(t=>buckets[levelOf(t)].push(t));

  // 2. Slumpa fram nivå enligt områdets rörliga blandning.
  const order=["E","C","A"];
  const mix=levelMix({E:!!buckets.E.length,C:!!buckets.C.length,A:!!buckets.A.length},area);
  let level=null;
  if(mix){
    let x=Math.random();
    for(const L of order){ x-=mix[L]; if(x<=0 && buckets[L].length){ level=L; break; } }
  }
  if(!level || !buckets[level].length) level=order.find(L=>buckets[L].length)||"E";

  // 3. Slumpa uppgift inom nivån, med lätt förtur för svaga familjer
  //    och utan att upprepa det som nyss visats.
  let cands=buckets[level];
  const fresh=cands.filter(t=>!recent.has(t.id));
  if(fresh.length) cands=fresh;
  const scored=cands
    .map(t=>({t,k:familyMastery(t,cp)*.6 + Math.random()*.9
      // Delar ur samma originaluppgift hålls isär när det finns annat.
      + (t.ursprungsId && state.senasteUrsprung.includes(t.ursprungsId) ? 1.5 : 0)}))
    .sort((a,b)=>a.k-b.k);
  const top=scored.slice(0,Math.max(1,Math.ceil(scored.length*.4)));
  const vald=top[Math.floor(Math.random()*top.length)].t;
  state.lastArea=vald.omr||"ovrigt";
  if(vald.ursprungsId){
    state.senasteUrsprung.push(vald.ursprungsId);
    if(state.senasteUrsprung.length>3) state.senasteUrsprung.shift();
  }
  return vald;
}

function beginSession(typ){
  state.passTyp=PASS[typ]?typ:null;
  state.ptOppen=false;
  state.felKo=null;state.sessionFel=[];
  rensaPagaendePass();
  state.sessionDone=0;state.lastIds=[];state.sessionXp=0;state.sessionCorrect=0;
  // Passtypen bestämmer längden. Punktträning och andra pass utan
  // typ landar på dagsmålet som förut.
  state.sessionTarget=(PASS[state.passTyp]||{}).antal || profile.goal || 8;
}
/* Dagens pass från tränaren. Passtypen styr både vilka områden som
   kommer upp och hur nivåblandningen förskjuts. */
function startPass(typ){
  state.focusArea=null;state.focusNamn=null;state.focusFamily=null;
  state.felKo=null;
  if(PASS[typ]?.ko){
    const ko=felUppgifter(PASS[typ].antal);
    if(!ko.length){ toast("Du har inga fel att repetera just nu."); return; }
    state.focusOmr=null;
    state.visaPassval=false;state.visaFokus=false;
    beginSession(typ);
    state.felKo=ko;
    state.sessionTarget=ko.length;
    navRecord("training");nextTask();
    return;
  }
  const omr=passOmraden(typ);
  state.focusOmr=(omr && omr.length)?omr:null;
  state.visaPassval=false;state.visaFokus=false;
  beginSession(typ);
  navRecord("training");nextTask();
}
function startAdaptive(){
  state.focusArea=null;state.focusOmr=null;state.focusNamn=null;
  state.focusFamily=null;beginSession();
  navRecord("training");nextTask();
}
function startArea(area){
  state.focusArea=area;state.focusOmr=[area];state.focusNamn=null;
  state.focusFamily=null;beginSession();
  navRecord("training");nextTask();
}
/* Ett grupperat kort tränar alla sina områden. Vilket område varje
   uppgift kommer från avgörs som i det adaptiva läget, och nivån
   räknas per område precis som annars. */
/* ==========================================================
   VÄLJ FLERA OMRÅDEN
   Ett pass kan blandas ihop av valfria områden i ett kapitel, t.ex.
   logaritmbegreppet och logaritmlagar samtidigt.
   ========================================================== */

/* Rutan används på två nivåer. På kapitelnivå väljer man områden, på
   områdesnivå delmoment inom ett enda kort. Maskineriet är detsamma:
   en mängd markerade nycklar och en knapp som startar passet. */

function ritaFlerval({lbl,rubrik,text,rutor,tomText}){
  const el=document.createElement("div");
  el.className="modal"; el.id="flervalsruta";
  el.innerHTML=`<div class="modal-kort" role="dialog" aria-label="${esc(rubrik)}">
      <div class="modal-topp">
        <div>
          <div class="lbl">${esc(lbl)}</div>
          <h2>${esc(rubrik)}</h2>
        </div>
        <button class="iconbtn" onclick="stangFlerval()" aria-label="Stäng">✕</button>
      </div>
      <p class="modal-text">${esc(text)}</p>
      ${rutor ? `<div class="valgrid">${rutor}</div>` : `<div class="empty">${esc(tomText||"")}</div>`}
      ${rutor?`<div class="modal-fot">
        <button class="btn quiet sm" onclick="valjAllaOmraden(true)">Markera alla</button>
        <button class="btn quiet sm" onclick="valjAllaOmraden(false)">Rensa</button>
        <span class="spacer"></span>
        <button class="btn primary" id="flervalStart" disabled onclick="startaFlerval()">Starta pass</button>
      </div>`:`<div class="modal-fot"><span class="spacer"></span>
        <button class="btn" onclick="stangFlerval()">Stäng</button></div>`}
    </div>`;
  document.body.appendChild(el);
  el.addEventListener("click",e=>{ if(e.target===el) stangFlerval(); });
  uppdateraFlervalKnapp();
  requestAnimationFrame(()=>el.classList.add("visa"));
}

function oppnaFlerval(kap){
  state.flervalTyp="omraden";
  state.flervalKap=String(kap);
  state.flervalKort=null;
  state.flervalValda=new Set();
  const kort=getCards().filter(k=>String(k.kap)===state.flervalKap);
  ritaFlerval({
    lbl:chapterName(kap),
    rubrik:"Träna flera områden",
    text:"Markera de områden du vill blanda i passet.",
    rutor:kort.map(k=>{
      const st=cardStatus(k);
      return `<button class="valruta ${st.tone}" data-kort="${esc(k.key)}" onclick="vaxlaVal(this)">
        <span class="kryss" aria-hidden="true"></span>
        <span class="valnamn">${esc(k.name)}</span>
        <span class="valstate">${st.label}</span>
      </button>`;
    }).join("")
  });
}

/* Punktträning: flera delmoment inom ett och samma område. */
function oppnaPunkt(kortKey){
  const kort=getCards().find(k=>k.key===kortKey);
  if(!kort) return;
  state.flervalTyp="delmoment";
  state.flervalKort=kortKey;
  state.flervalKap=null;
  state.flervalValda=new Set();
  const fam=cardFamilies(kort);
  ritaFlerval({
    lbl:kort.name,
    rubrik:"Punktträna",
    text:"Markera de delmoment du vill träna. Passet blandar bara dem.",
    tomText:"Det här området har inga separata delmoment att välja mellan. Starta området som vanligt i stället.",
    rutor:fam.length ? fam.map(f=>{
      const st=delmomentStatus(f.family);
      return `<button class="valruta ${st.tone}" data-kort="${esc(f.family)}" onclick="vaxlaVal(this)">
        <span class="kryss" aria-hidden="true"></span>
        <span class="valnamn">${esc(familyName(f.family))}</span>
        <span class="valstate">${st.label}</span>
      </button>`;
    }).join("") : ""
  });
}
function stangFlerval(){
  const el=document.getElementById("flervalsruta");
  if(!el) return;
  el.classList.remove("visa");
  setTimeout(()=>el.remove(),250);
}
function vaxlaVal(btn){
  const key=btn.dataset.kort;
  if(state.flervalValda.has(key)){ state.flervalValda.delete(key); btn.classList.remove("vald"); }
  else { state.flervalValda.add(key); btn.classList.add("vald"); }
  uppdateraFlervalKnapp();
}
function valjAllaOmraden(alla){
  document.querySelectorAll("#flervalsruta .valruta").forEach(b=>{
    b.classList.toggle("vald",alla);
    if(alla) state.flervalValda.add(b.dataset.kort); else state.flervalValda.delete(b.dataset.kort);
  });
  uppdateraFlervalKnapp();
}
function uppdateraFlervalKnapp(){
  const k=document.getElementById("flervalStart");
  if(!k) return;
  const n=state.flervalValda.size;
  const del=state.flervalTyp==="delmoment";
  const ord=del?"delmoment":(n===1?"område":"områden");
  k.disabled=n===0;
  k.textContent = n===0 ? (del?"Välj minst ett delmoment":"Välj minst ett område")
                        : `Starta pass · ${n} ${ord}`;
}
function startaFlerval(){
  const valda=[...state.flervalValda];
  if(!valda.length) return;
  if(state.flervalTyp==="delmoment") return startaPunkt(valda);
  // Ett valt kort kan rymma flera underområden. Passet tränar unionen.
  const kort=getCards().filter(k=>valda.includes(k.key));
  if(!kort.length) return;
  const namn=kort.map(k=>k.name);
  const omr=[...new Set(kort.flatMap(k=>k.omr))];
  stangFlerval();
  state.focusArea=null;
  state.focusOmr=omr;
  state.focusNamn = valda.length===1 ? namn[0] : namn.length+" områden";
  state.focusFamily=null;
  beginSession();
  navRecord("training");
  nextTask();
}

/* Ett punktpass tränar valda delmoment inom hela det elevsynliga
   området, inte bara i det underområde där uppgiften råkar ligga. */
function startaPunkt(familjer){
  const kort=getCards().find(k=>k.key===state.flervalKort);
  if(!kort) return;
  stangFlerval();
  state.focusArea=null;
  state.focusOmr=[...kort.omr];
  state.focusNamn=kort.name;
  state.focusFamily=familjer.length===1 ? familjer[0] : familjer;
  beginSession();
  navRecord("training");
  nextTask();
}

/* Hela kapitlet i ett pass. Uppgifterna hämtas från kapitlets alla
   områden, och nivån räknas per område precis som annars. */
function startChapter(kap){
  const omr=getAreas().filter(a=>String(a.kap)===String(kap)).map(a=>a.key);
  if(!omr.length) return;
  state.focusArea=null;state.focusOmr=omr;state.focusNamn=chapterName(kap);
  state.focusFamily=null;beginSession();
  navRecord("training");nextTask();
}

function startCard(key){
  const kort=getCards().find(k=>k.key===key);
  if(!kort) return startArea(key);
  if(!kort.grupp) return startArea(kort.omr[0]);
  state.focusArea=null;state.focusOmr=kort.omr;state.focusNamn=kort.name;
  state.focusFamily=null;beginSession();
  navRecord("training");nextTask();
}
/* Ett delmoment tränas inom hela det elevsynliga området, inte bara i
   det underområde där uppgiften råkar ligga. */
function startCardFamily(cardKey,family){
  const kort=getCards().find(k=>k.key===cardKey);
  if(!kort) return;
  state.focusArea=null;
  state.focusOmr=[...kort.omr];
  state.focusNamn=kort.name;
  state.focusFamily=family;
  beginSession();
  navRecord("training");
  nextTask();
}
function continueSession(){ beginSession(); navRecord("training",true); nextTask(); }
function nextTask(){
  const t=chooseTask();
  if(!t){toast("Inga uppgifter hittades.");return;}
  noteNewLevel(t);
  state.currentTask=t;state.answered=false;state.solutionShown=false;
  state.partResults=[];state.partIndex=0;state.noXp=false;state.aktivRuta=0;
  state.hintUsed=false;state.hintVisible=false;
  state.lastIds.push(t.id);
  if(state.lastIds.length>12) state.lastIds.shift();
  sparaPagaendePass();
  renderTraining();
}
/* Första gången en högre svårighetsgrad dyker upp i kursen firas det. */
function noteNewLevel(t){
  const cp=ensureCourseProfile();
  cp.sedda ||= {};
  const L=levelOf(t);
  if(L==="E" || cp.sedda[L]) return;
  cp.sedda[L]=Date.now();
  saveProfile();
  const n=NIVA[L];
  cheer(String(n),"Ny svårighetsgrad","Nivå "+n+" upplåst",
    n===2 ? "Grunderna sitter. Härifrån blandas svårare uppgifter in."
          : "Du är redo för kursens tuffaste uppgifter.");
}

function sessionLabel(){
  if(state.focusFamily){
    const f=state.focusFamily;
    if(Array.isArray(f)) return f.length===1 ? familyName(f[0]) : f.length+" delmoment";
    return familyName(f);
  }
  if(state.focusNamn) return state.focusNamn;
  if(state.passTyp && PASS[state.passTyp]) return PASS[state.passTyp].namn;
  if(state.focusArea) return areaName(state.focusArea);
