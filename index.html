/* ==========================================================
   ETT PÅGÅENDE PASS ÖVERLEVER EN OMLADDNING
   Telefonen låser sig, fliken kastas, någon trycker ladda om — och
   sju avklarade uppgifter är borta. Det som behövs för att ta upp
   tråden är litet nog att få plats i localStorage: vilken uppgift
   som låg framme, hur långt passet kommit och vad det var för pass.
   ========================================================== */
const PASS_KEY="kunskapsgymmet-pagaende-pass";
const PASS_LIVSTID=12*3600*1000;     // äldre än så är passet inte längre aktuellt

function sparaPagaendePass(){
  if(!state.currentTask || !state.course) return;
  // Ett pass utan avklarade uppgifter är inget att återuppta: att börja
  // om från början ger exakt samma sak.
  if(!state.sessionDone) return rensaPagaendePass();
  try{
    localStorage.setItem(PASS_KEY,JSON.stringify({
      at:Date.now(), kurs:state.course, track:state.track,
      uppgift:state.currentTask.id,
      done:state.sessionDone, target:state.sessionTarget,
      xp:state.sessionXp, ratt:state.sessionCorrect,
      passTyp:state.passTyp, omr:state.focusOmr, namn:state.focusNamn,
      area:state.focusArea, family:state.focusFamily,
      felKo:state.felKo||null, lastIds:(state.lastIds||[]).slice(-12)
    }));
  }catch(_){}
}
function rensaPagaendePass(){
  try{ localStorage.removeItem(PASS_KEY); }catch(_){}
}
function lasPagaendePass(){
  try{
    const d=JSON.parse(localStorage.getItem(PASS_KEY)||"null");
    if(!d || !d.kurs || !d.uppgift) return null;
    if(Date.now()-(d.at||0)>PASS_LIVSTID){ rensaPagaendePass(); return null; }
    return d;
  }catch(_){ return null; }
}
/* Körs när kursen är laddad, så att uppgiften går att slå upp i banken. */
function aterupptaPass(d){
  if(!d || d.kurs!==state.course) return false;
  if(d.track && COURSES[state.course]?.tracks?.includes(d.track)) state.track=d.track;
  const t=availableTasks().find(x=>x.id===d.uppgift);
  if(!t){ rensaPagaendePass(); return false; }   // banken har ändrats
  state.currentTask=t;
  state.sessionDone=d.done||0; state.sessionTarget=d.target||8;
  state.sessionXp=d.xp||0; state.sessionCorrect=d.ratt||0;
  state.passTyp=d.passTyp||null;
  state.focusOmr=d.omr||null; state.focusNamn=d.namn||null;
  state.focusArea=d.area||null; state.focusFamily=d.family||null;
  state.felKo=d.felKo||null;
  state.lastIds=d.lastIds||[];
  state.answered=false; state.solutionShown=false; state.noXp=false;
  state.partResults=[]; state.partIndex=0;
  state.hintUsed=false; state.hintVisible=false;
  return true;
}

/* ==========================================================
   TOPPLISTAN
   En egen tabell, "topplista", med bara det som är tänkt att synas:
   valt namn, nivå, XP, antal uppgifter, dagsstreck och medaljer.
   Den fullständiga profilen ligger kvar i "profiler" och lämnar
   aldrig kontot. Raden skrivs bara när eleven valt ett namn, och
   den syns för andra bara när eleven slagit på det själv.

   Tabellen skapas med SQL:n som ligger i README. Radsäkerheten är
   det som håller: läsning bara av rader med visa = true, skrivning
   bara av sin egen rad.
   ========================================================== */

const NAMN_MIN=3, NAMN_MAX=16;
const NAMN_MONSTER=/^[A-Za-zÅÄÖåäö0-9_-]+$/;

/* Returnerar ett felmeddelande, eller null om namnet duger. */
function namnFel(namn){
  const n=String(namn||"").trim();
  if(n.length<NAMN_MIN) return `Minst ${NAMN_MIN} tecken.`;
  if(n.length>NAMN_MAX) return `Högst ${NAMN_MAX} tecken.`;
  if(!NAMN_MONSTER.test(n)) return "Bara bokstäver, siffror, bindestreck och understreck.";
  return null;
}

/* ---------- namnet från Google ----------
   Den som loggar in med Google får sitt förnamn på listan direkt, utan
   att behöva välja något. Namnet är bara ett förnamn, och eleven kan
   både byta det och dölja sig efteråt — men den får veta att det hänt,
   i samma stund som det händer. Att tyst publicera någons namn vore
   fel även när namnet är harmlöst. */
function fornamnFranKonto(u){
  const m=u?.user_metadata||{};
  const helt=m.given_name || m.first_name
    || String(m.full_name || m.name || "").trim().split(/\s+/)[0] || "";
  // Bara tecken användarnamn får innehålla. Punkter och apostrofer i
  // namn som "J.P" eller "O'Brien" faller bort i stället för att stoppa.
  const rent=helt.replace(/[^A-Za-zÅÄÖåäö0-9_-]/g,"");
  if(rent.length<NAMN_MIN || rent.length>NAMN_MAX) return null;
  return rent;
}
/* Krockar är regel, inte undantag: i en klass finns flera Anna. Den
   första får sitt rena förnamn. För nästa slår automatiken av och
   eleven får välja själv, med förnamnet förifyllt. Alternativen vore
   Anna2, som ingen vill heta, eller efternamnets initial, som pekar ut
   en enskild elev på en lista vem som helst kan läsa. */
async function autoNamnFranGoogle(){
  if(!MOLN_PA() || !session || profile.namn) return;
  const u=await hamtaAnvandare();
  const bas=fornamnFranKonto(u);
  if(!bas) return;
  const svar=await claimaNamn(bas);
  if(svar.ok) return visaNamnBesked(bas);
  if(/upptaget/i.test(svar.fel||""))
    oppnaNamnruta(bas,`${bas} är redan taget. Välj ett namn du vill ha på listan.`);
}

function topplistaRad(id){

async function skickaTopplista(){
  if(!MOLN_PA() || !profile.namn || !await giltigSession()) return;
  const u=await hamtaAnvandare();
  if(!u) return;
  try{
    await fetch(SUPABASE_URL+"/rest/v1/topplista?on_conflict=id",{
      method:"POST",
      headers:{...sbHeaders(true),Prefer:"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify(topplistaRad(u.id))});
  }catch(_){}
}

/* Claimar namnet. Krocken fångas av det unika indexet i databasen,
   inte av en förhandskoll — två elever kan annars hinna ta samma
   namn i mellanrummet. */
async function claimaNamn(namn){
  const fel=namnFel(namn);
  if(fel) return {ok:false,fel};
  if(!MOLN_PA() || !await giltigSession()) return {ok:false,fel:"Du måste vara inloggad."};
  const u=await hamtaAnvandare();
  if(!u) return {ok:false,fel:"Kunde inte läsa kontot."};

  const forra=profile.namn;
  profile.namn=String(namn).trim();
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/topplista?on_conflict=id",{
      method:"POST",
      headers:{...sbHeaders(true),Prefer:"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify(topplistaRad(u.id))});
    if(r.status===409 || r.status===23505){
      profile.namn=forra;
      return {ok:false,fel:"Namnet är upptaget. Prova ett annat."};
    }
    if(!r.ok){
      profile.namn=forra;
      const txt=await r.text().catch(()=>"");
      if(/duplicate|unique/i.test(txt)) return {ok:false,fel:"Namnet är upptaget. Prova ett annat."};
      // Serverns eget besked är värt mer än en artig omskrivning: det
      // är skillnaden mellan "policyn släpper inte igenom" och
      // "namnet bröt mot formatet".
      let detalj="";
      try{
        const j=JSON.parse(txt);
        detalj=[j.message,j.details,j.hint].filter(Boolean).join(" · ");
      }catch(_){ detalj=txt.slice(0,160); }
      console.warn("Topplistan svarade",r.status,txt);
      return {ok:false,fel:`Fel ${r.status}. ${detalj||"Inget besked från servern."}`};
    }
  }catch(fel){
    profile.namn=forra;
    console.warn("Topplistan:",fel);
    return {ok:false,fel:"Ingen kontakt med servern."};
  }
  saveProfile();
  return {ok:true};
}

/* Slår på eller av synligheten. Av betyder att raden inte längre

/* Hämtar listan. Sorteringen görs i databasen, så vi får rätt topp

const TOPP_SORT={xp:"xp",uppgifter:"uppgifter",dagar:"dagar"};
async function hamtaTopplista(sortering,gräns=50){
  const kol=TOPP_SORT[sortering]||"xp";
  if(!MOLN_PA()) return null;
  // Listan går att läsa utloggad. Den som inte är inloggad ser samma
  // rader, bara utan sin egen — vilket är själva poängen med att visa
  // den. Raderna innehåller bara det de som står där valt att visa.
  const inloggad = !!session && await giltigSession();
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/topplista"
      +"?select=namn,xp,niva,rang,uppgifter,dagar,medaljer"
      +"&visa=eq.true&order="+kol+".desc&limit="+gräns,
      {headers:sbHeaders(inloggad)});
    if(!r.ok){
      // Vanligaste orsaken utloggad: anon saknar läsrätt på topplista.
      // Felet från PostgREST säger vilket, så det loggas i klartext.
      let txt=""; try{ txt=await r.text(); }catch(_){}

    }

/* ==========================================================
   NAVIGERING
   Varje vy blir ett steg i webbläsarens historik, så att bakåt
   på mobilen tar eleven ett steg tillbaka i stället för att
   lämna sidan. navStack speglar historiken i minnet så att
   knapparna i gränssnittet kan gå bakåt i stället för att lägga
   till ännu ett steg.
   ========================================================== */
const navStack=[];

function navDesc(view){
  return {view,course:state.course,track:state.track,
          area:state.focusArea,omr:state.focusOmr,namn:state.focusNamn,
          family:state.focusFamily,pass:state.passTyp};
}
function navRecord(view,replace){
  const st=navDesc(view);
  st.depth = replace ? (history.state?.depth||0) : (history.state?.depth??-1)+1;
  navStack.length=st.depth;
  navStack.push(st);
  const url = st.course ? "#"+st.course : location.pathname+location.search;
  try{
    if(replace) history.replaceState(st,"",url);
    else history.pushState(st,"",url);
  }catch(_){}
}
function navPrev(){
  const d=history.state?.depth||0;
  return d>0 ? navStack[d-1] : null;
}
/* Gå tillbaka till en vy: används av knapparna i gränssnittet.
   Ligger vyn redan bakom oss backar vi dit i stället för att
   stapla på ett nytt steg. */
function navBackTo(view){
  const p=navPrev();
  if(p && p.view===view && p.course===state.course){ history.back(); return true; }
  return false;
}
function backToDashboard(){
  if(navBackTo("dashboard")) return;
  navRecord("dashboard"); renderDashboard();
}

async function navRestore(st){
  // Topplistan hänger inte på en kurs, så den återskapas före kurskollen.
  if(st && st.view==="topplista"){
    if(st.course && st.course!==state.course) await selectCourse(st.course,{record:false,render:false});
    oppnaTopplista(state.toppSort,false); return;
  }
  if(!st || !st.course){
    state.course=null;state.data=null;state.track=null;state.currentTask=null;
    state.openChapters=null;applyAccent();renderHome();return;
  }
  if(st.course!==state.course){
    const ok=await selectCourse(st.course,{record:false,render:false});
    if(!ok){ renderHome(); return; }
  }
  if(st.track) state.track=st.track;
  state.focusArea=st.area||null;
  state.focusOmr=st.omr||null;
  state.focusNamn=st.namn||null;
  state.focusFamily=st.family||null;
  state.passTyp=st.pass||null;
  applyAccent();
  switch(st.view){
    case "picker":   showAreaPicker(false); break;
    case "progress": showProgress(false); break;
    case "summary":  renderSessionDone(false); break;
    // En pågående uppgift går inte att återskapa, så vi landar i kursen.
    case "training": state.currentTask?renderTraining():renderDashboard(); break;
    default:         renderDashboard();
  }
}
window.addEventListener("popstate",e=>{ navRestore(e.state); });

function loadProfileFrom(p){

  p.run||=0; p.bestRun||=0; p.aCorrect||=0; p.today||=0; p.goal||=8;

function ensureCourseProfile(){
  const c=state.course || "none";
  profile.courses[c] ||= {areas:{},families:{},history:[]};
  return profile.courses[c];
}
function mastery(map,key){
  if(!key) return .55;
  return typeof map[key]==="number" ? map[key] : .55;
}
function updateMastery(map,key,correct){
  if(!key) return;
  let s=mastery(map,key);
  s = correct ? s + .10*(1-s) : s - .16*s;
  map[key]=Math.max(.08,Math.min(.96,s));
}

/* ==========================================================
   RANGER, MILSTOLPAR OCH DAGSSTRECK
   ========================================================== */

/* Rangerna. Tolv steg i stället för sex, så att det alltid finns
   något inom räckhåll. Tätt i början, där en ny elev behöver se att
   det rör sig, och glesare uppåt, där varje steg ska betyda något.
   sym är siffran som står i märket, inte nivån. */
const RANKS=[
  {lvl:1,  name:"Nykomling",   sym:"1"},
  {lvl:2,  name:"Motionär",    sym:"2"},
  {lvl:4,  name:"Stammis",     sym:"3"},
  {lvl:6,  name:"Atlet",       sym:"4"},
  {lvl:9,  name:"Tävlande",    sym:"5"},
  {lvl:12, name:"Elitatlet",   sym:"6"},
  {lvl:16, name:"Veteran",     sym:"7"},
  {lvl:20, name:"Mästare",     sym:"8"},
  {lvl:25, name:"Stormästare", sym:"9"},
  {lvl:31, name:"Legend",      sym:"10"},
  {lvl:38, name:"Ikon",        sym:"11"},
  {lvl:46, name:"Odödlig",     sym:"12"}
];
/* Nivåkurvan. Kostnaden för nästa nivå växer kvadratiskt och sedan
   kubiskt, så en ny nivå tar allt längre tid ju högre man kommer:
   nivå 2 tar ett par uppgifter, nivå 10 en dryg vecka, nivå 30 ett
   läsår med jämn träning. Trean i nämnaren gör kurvan mjuk nog att
   de första tjugo nivåerna inte känns låsta. */
function totalXpForLevel(L){
  const n=L-1;
  return Math.round(20*n + 10*n*n + 0.6*n*n*n);
}
function levelFromXP(xp){
  let L=1;
  while(L<99 && totalXpForLevel(L+1)<=xp) L++;
  return L;
}
function rankFor(level){
  let r=RANKS[0];
  for(const x of RANKS) if(level>=x.lvl) r=x;
  return r;
}
function nextRank(level){ return RANKS.find(x=>x.lvl>level) || null; }
function levelProgress(){
  const L=levelFromXP(profile.xp);
  const base=totalXpForLevel(L), top=totalXpForLevel(L+1);
  return {level:L, into:profile.xp-base, need:top-base, pct:(profile.xp-base)/Math.max(1,top-base)};
}

function todayKey(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function yesterdayKey(){
  const d=new Date(Date.now()-864e5);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function todayCount(){ return profile.lastDay===todayKey() ? (profile.today||0) : 0; }
function currentStreak(){
  if(profile.lastDay===todayKey() || profile.lastDay===yesterdayKey()) return profile.streak||0;
  return 0;
}
function touchDay(){
  const t=todayKey();
  if(profile.lastDay===t) return;
  profile.streak = (profile.lastDay===yesterdayKey()) ? (profile.streak||0)+1 : 1;
  profile.bestStreak=Math.max(profile.bestStreak||0,profile.streak);
  profile.lastDay=t;
  profile.today=0;
}

function allAreaMasteries(){
  return Object.values(profile.courses||{}).flatMap(c=>Object.values(c.areas||{}));
}
function bestAreaMastery(){
  const v=allAreaMasteries();
  return v.length?Math.max(...v):0;
}
function touchedAreas(){ return allAreaMasteries().length; }

/* ==========================================================
   MEDALJMÄRKEN
   Ett ritat märke per medalj, i stället för tecken ur teckentabellen.
   Tecken som ◆ ▲ ⬢ ✦ renderas olika på iOS, Android och Windows, så
   utseendet gick inte att styra. Här är varje märke en streckteckning
   i samma vikt, som ärver färg av brickan den ligger i: matt bläck när
   medaljen är låst, mörk mässingsgravyr när den är tagen.

   Alla banor är ritade i rutan 24 × 24 med samma streckvikt, så att
   märkena väger lika mycket bredvid varandra.
   ========================================================== */
const MEDALJBANOR={
  /* uthållighet */
  steg:      '<path d="M5 20.5h14"/><path d="M12 16.5V5"/><path d="M7.5 9.5L12 5l4.5 4.5"/>',

function badgeState(b){
  const cur=Math.max(0,Math.min(b.max,b.cur()||0));
  return {cur,pct:cur/b.max,on:!!profile.badges[b.id]||cur>=b.max};
}
/* Åtta medaljer i sidopanelen: de senast tagna först, därefter de
   som ligger närmast att låsas upp. Då finns alltid något att jaga. */
function stripBadges(){
  const tagna=BADGES.filter(b=>badgeState(b).on)
    .sort((a,b)=>(profile.badges[b.id]||0)-(profile.badges[a.id]||0));
  const kvar=BADGES.filter(b=>!badgeState(b).on)
    .sort((a,b)=>badgeState(b).pct-badgeState(a).pct);
  return [...tagna.slice(0,4),...kvar].slice(0,8);
}

function nextBadge(){
  const locked=BADGES.filter(b=>!badgeState(b).on).map(b=>({b,s:badgeState(b)}));
  if(!locked.length) return null;
  locked.sort((x,y)=>y.s.pct-x.s.pct);
  return locked[0];
}
/* Medaljerna bokförs direkt, men hyllningen kan skjutas upp så att
   XP-mätaren hinner röra sig innan rutan lägger sig över skärmen. */
function checkBadges(fordroj=0){
  const gained=[];
  for(const b of BADGES){
    if(profile.badges[b.id]) continue;
    if((b.cur()||0)>=b.max){ profile.badges[b.id]=Date.now(); gained.push(b); }
  }
  const visa=()=>gained.forEach(b=>cheer(medaljIkon(b.icon),"Ny medalj",b.name,b.desc));
  if(gained.length){ fordroj>0 ? setTimeout(visa,fordroj) : visa(); }
  return gained;
}

/* Adressfältets färg på mobil. Måste följa både läget och kursen,
   annars syns en skarv mellan telefonens ram och sidans bakgrund. */
const ACCENT_BG={
  ljus:{a:"#F2ECF0",b:"#E6F2F1",c:"#E7EEF9",fy1:"#E4F2F4",fy2:"#EBECF8"},
  mork:{a:"#120E14",b:"#091216",c:"#090F1B",fy1:"#081217",fy2:"#0D0E1C"}
};
function accentKey(){
  if(!state.course) return "c";
  if(state.course==="fy1") return "fy1";
  if(state.course==="fy2") return "fy2";
  const m=String(state.track||"").match(/[abc]$/i);
  // Fortsättnings- och fördjupningskurserna saknar spår men ska ändå
  // ha ett ljus i rummet. De faller tillbaka på blått, som spår c.
  return m ? m[0].toLowerCase() : "c";
}
function applyAccent(){
  const k=accentKey();
  if(k) document.documentElement.dataset.accent=k;
  else delete document.documentElement.dataset.accent;
  syncThemeColor();
}
function syncThemeColor(){
  const meta=document.querySelector('meta[name="theme-color"]');
  if(!meta) return;
  const mork = document.documentElement.dataset.theme==="dark";
  const k = accentKey();
  meta.content = mork ? (ACCENT_BG.mork[k] || "#090F1B")
                      : (ACCENT_BG.ljus[k] || "#E7EEF9");
}
function setTheme(next){
  document.documentElement.dataset.theme=next;
  localStorage.setItem("kunskapsgymmet-theme",next);
  syncThemeColor();
}
(function initTheme(){
  const saved=localStorage.getItem("kunskapsgymmet-theme");
  setTheme(saved==="light" ? "light" : "dark");
})();
function toggleTheme(){
  setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
  render();
}
function themeIcon(){ return document.documentElement.dataset.theme==="dark" ? "☀" : "☾"; }

function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>el.classList.remove("show"),1800);
}
const cheerQueue=[];
function cheer(icon,label,title,desc){
  cheerQueue.push({icon,label,title,desc:desc||""});
  if(cheerQueue.length===1) pumpCheer();
}
function pumpCheer(){
  const el=document.getElementById("cheer");
  const c=cheerQueue[0];
  if(!c) return;
  el.innerHTML=`<div class="cheer-card">
      <div class="cheer-halo"><div class="cheer-medal">${c.icon}</div></div>
      <div class="cheer-label">${esc(c.label)}</div>
      <h2>${esc(c.title)}</h2>
      ${c.desc?`<p>${esc(c.desc)}</p>`:""}
      <button class="btn primary" onclick="dismissCheer()">Fortsätt</button>
    </div>`;
  el.onclick=e=>{ if(e.target===el) dismissCheer(); };
  requestAnimationFrame(()=>el.classList.add("show"));
  clearTimeout(pumpCheer._t);
  pumpCheer._t=setTimeout(dismissCheer,6000);
}
function dismissCheer(){
  const el=document.getElementById("cheer");
  if(!el.classList.contains("show")) return;
  clearTimeout(pumpCheer._t);
  el.classList.remove("show");
  cheerQueue.shift();
  setTimeout(()=>{ if(cheerQueue.length) pumpCheer(); else el.innerHTML=""; },450);
}

function ring(pct,size,stroke,color){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  const off=c*(1-Math.max(0,Math.min(1,pct||0)));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--hair)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${c.toFixed(1)}"
      data-off="${off.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}

function renderMath(root=app){
  if(typeof renderMathInElement!=="function"){ setTimeout(()=>renderMath(root),120); return; }
  try{
    renderMathInElement(root,{
      delimiters:[
        {left:"$$",right:"$$",display:true},
        {left:"\\[",right:"\\]",display:true},
        {left:"\\(",right:"\\)",display:false}
      ],
      throwOnError:false, strict:false, trust:false
    });
  }catch(err){ console.warn("KaTeX:",err); }
}

/* Spelar upp ringar, mätare och inglidning igen när ett kapitel öppnas. */
function playIn(root){
  root.querySelectorAll("[data-off]").forEach(el=>{ el.style.strokeDashoffset=el.getAttribute("stroke-dashoffset"); });
  root.querySelectorAll("[data-w]").forEach(el=>{ el.style.width="0"; });
  root.querySelectorAll(".stagger").forEach(g=>{
    [...g.children].forEach((el,i)=>{
      el.style.animation="none"; void el.offsetHeight;
      el.style.animation=""; el.style.animationDelay=Math.min(i*35,420)+"ms";
    });
  });
  requestAnimationFrame(()=>{
    root.querySelectorAll("[data-off]").forEach(el=>{ el.style.strokeDashoffset=el.dataset.off; });
    root.querySelectorAll("[data-w]").forEach(el=>{ el.style.width=el.dataset.w; });
  });
}

function toggleTip(el,ev){
  ev.stopPropagation();
  const öppen=el.classList.contains("show");
  stängTips();
  if(öppen) return;
  el.classList.add("show");
  const ruta=document.getElementById("medalinfo"), tips=el.querySelector(".mtip");
  if(ruta && tips){ ruta.innerHTML=tips.innerHTML; ruta.hidden=false; }
}
function stängTips(){
  document.querySelectorAll(".medal.show").forEach(m=>m.classList.remove("show"));
  const ruta=document.getElementById("medalinfo");
  if(ruta){ ruta.hidden=true; ruta.innerHTML=""; }
}
document.addEventListener("click",stängTips);

function toggleChapter(kap,btn){
  const key=String(kap);
  const sec=btn.closest(".chapter");   // raden ligger inuti sektionen
  const body=sec.querySelector(".chapter-body");
  const open=state.openChapters.has(key);
  if(open){
    state.openChapters.delete(key);
    btn.setAttribute("aria-expanded","false");
    sec.classList.remove("open");
    body.hidden=true;
  }else{
    state.openChapters.add(key);
    btn.setAttribute("aria-expanded","true");
    sec.classList.add("open");
    body.hidden=false;
    playIn(body);
  }
}

    });
  });
}

function namnSkrivet(){
  const f=document.getElementById("namnfalt"), h=document.getElementById("namnhjalp"),
        k=document.getElementById("namnspara");
  if(!f||!h||!k) return;
  const fel=namnFel(f.value);

  h.textContent = tomt
    ? `${NAMN_MIN}–${NAMN_MAX} tecken. Bokstäver, siffror, bindestreck och understreck.`

async function sparaNamn(){
  const f=document.getElementById("namnfalt"), h=document.getElementById("namnhjalp"),
        k=document.getElementById("namnspara");

  k.disabled=true; k.textContent="Sparar…";

   kapitel 1 och 2 som fokus. Tänkt för läraren som delar en länk i
   Classroom inför ett prov — eleven behöver inte kryssa i något. */
let onskadKapitel=null;                 // {kurs, lista}
function tolkaAdress(h){
  const [kurs,kap]=String(h||"").replace(/^#/,"").split("/");
  return {
    kurs: kurs||null,
    kapitel: kap ? kap.split(",").map(x=>x.trim()).filter(Boolean) : null
  };
}
function tillampaKapitelfokus(){
  if(!onskadKapitel || onskadKapitel.kurs!==state.course) return;
  const onskade=onskadKapitel.lista; onskadKapitel=null;
  const alla=kursensKapitel();
  // Länken skriver kapitelnummer. Nycklarna kan se ut hur som helst,
  // så både exakt träff och nummerträff godtas.
  const valda=[...new Set(onskade.map(x=>
    alla.find(k=>k===String(x) || kapNr(k)===Number(x))
  ).filter(Boolean))];
  if(!valda.length) return;
  const cp=ensureCourseProfile();
  cp.fokus=valda.sort((a,b)=>kapNr(a)-kapNr(b));
  profile.pt=null;                      // dagens pass räknas om mot nya kapitel
  saveProfile();
  setTimeout(()=>toast("Fokus: "+valda.map(k=>chapterName(k)).join(" och ")),400);
}

/* Kursens läge, räknat enbart ur profilen — banken är inte laddad på
   startsidan, så antalet områden i kursen är okänt här. Det som går
   att säga är hur mycket eleven tränat och hur väl det sitter. */
function kursLage(id){
  const cp=(profile.courses||{})[id];
  if(!cp) return null;
  const varden=Object.values(cp.areas||{}).filter(x=>typeof x==="number");
  if(!varden.length) return null;
  let uppgifter=0;
  Object.values(cp.levels||{}).forEach(a=>{
    ["E","C","A"].forEach(L=>{ uppgifter+=(a?.[L]?.n)||0; });
  });
  return {
    omraden:varden.length,
    snitt:varden.reduce((a,b)=>a+b,0)/varden.length,
    uppgifter
  };
}

async function loadScript(src){
  if(loadedScripts.has(src)) return;
  await new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    // Versionssträngen bumpas för hand när en uppgiftsbank ändras.
    // Date.now() här gjorde att bankerna laddades om från nätet vid
    // varje besök, vilket märks på ett klassrum som startar samtidigt.
    s.src=src+"?v="+BANK_VERSION;
    s.onload=()=>{loadedScripts.add(src);resolve();};
    s.onerror=()=>reject(new Error("Kunde inte ladda "+src));
    document.head.appendChild(s);
  });
}

/* ==========================================================
   MIGRERING AV FAMILJENAMN
   Banken kan ge en familj ett tydligare namn och lämna det gamla i
   familjTidigare. Då flyttas elevens progress över till det nya
   namnet. Det gamla värdet ligger kvar, så att en äldre bankversion
   fortfarande hittar sin egen progress.
   ========================================================== */
function migreraFamiljer(){
  const cp=ensureCourseProfile();
  const bank=state.data?.bank||[];
  const lista=x=>(Array.isArray(x)?x:[x]).filter(Boolean).map(String);
  let andrat=false;
  bank.forEach(t=>{
    if(!t||!t.familjTidigare||!t.familj) return;
    const gamla=lista(t.familjTidigare), nya=lista(t.familj);
    gamla.forEach(g=>{
      const v=cp.families[g];
      if(typeof v!=="number") return;
      nya.forEach(n=>{
        if(n===g) return;
        const nu=typeof cp.families[n]==="number" ? cp.families[n] : 0;
        if(v>nu){ cp.families[n]=v; andrat=true; }
      });
    });
  });
  if(andrat) saveProfile();
}

async function selectCourse(id,opts){
  const {record=true,render=true}=opts||{};
  const c=COURSES[id];
  if(!c) return false;
  const card=document.getElementById("course-"+id);
  if(card) card.classList.add("loading");
  try{
    for(const f of c.files) await loadScript(f);
    const bank=window[c.globals.bank];
    const kap=window[c.globals.kap] || {};
    // Vissa kurser har egna kapitelnamn per spår, t.ex. 1b och 1c i
    // fortsättningskursen. Finns de används de för valt spår.
    const kapSpar=window[c.globals.kapSpar] || null;
    const omr=window[c.globals.omr] || {};
    const grupp=window[c.globals.grupp] || {};
    if(!Array.isArray(bank)) throw new Error(`Globalen window.${c.globals.bank} hittades inte eller är inte en array.`);
    state.course=id;
    state.track=c.defaultTrack || (c.tracks[0]||null);
    state.data={bank,kap,kapSpar,omr,grupp};
    state.focusArea=null;state.focusOmr=null;state.focusNamn=null;
    state.focusFamily=null;state.currentTask=null;
    state.openChapters=null;
    ensureCourseProfile();
    migreraFamiljer();
    tillampaKapitelfokus();
    applyAccent();
    if(record) navRecord("dashboard");
    if(render) renderDashboard();
    return true;
  }catch(err){
    console.error(err);
    if(card) card.classList.remove("loading");
    if(render) alert("Kunde inte öppna kursen.\n\n"+err.message+"\n\nKontrollera att filerna ligger i samma mapp som index.html.");
    return false;
  }
}

/* Områden som kursen har valt bort finns kvar i banken men visas
   och tränas aldrig i Kunskapsgymmet. */
function normOmr(x){
  return String(x??"").toLowerCase().replaceAll("_"," ").replace(/\s+/g," ").replace(/[.\s]+$/,"").trim();
}
function isExcluded(t){
  const lista=COURSES[state.course]?.utanOmraden;
  if(!lista||!lista.length) return false;
  const key=t.omr||"ovrigt";
  const falt=[normOmr(areaName(key)),normOmr(key),normOmr(chapterName(t.kap))];
  return lista.some(x=>{
    const v=normOmr(x);
    if(!v) return false;
    // Prefixmatchning bägge hållen, så att "… och modeller" fångar
    // "… och modellering" utan att korta ord råkar träffa inuti andra ord.
    return falt.some(f=>f && (f===v ||
      (v.length>=6 && f.startsWith(v)) ||
      (f.length>=6 && v.startsWith(f))));
  });
}

/* ==========================================================
   SPELPOOL
   Kunskapsgymmet tränar moment, inte nödvändigtvis hela bankobjekt.
   En rutinuppgift med oberoende deluppgifter kan delas till flera
   träningsmoment, men bara när banken uttryckligen säger det med
   spelDelning. Originalobjektet lämnas orört.
   ========================================================== */

function metadataForDel(varde,index,antal){
  return Array.isArray(varde) && varde.length===antal ? varde[index] : varde;
}
function expandGameTask(t){
  if(t?.spelDelning!=="deluppgifter" || !Array.isArray(t.spelDelar) || t.spelDelar.length<2){
    return [t];
  }
  const antal=t.spelDelar.length;
  return t.spelDelar.map((del,i)=>{
    const etikett=String(del?.etikett || String.fromCharCode(97+i)).toLowerCase();
    const q={...t};
    q.ursprungsId=t.id;
    q.deluppgift=etikett;
    q.id=`${t.id}${etikett}`;
    q.t=del?.t || t.t;
    q.s=del?.s || t.s;
    // Varje del har sin egen ledtråd. Huvuduppgiftens används bara
    // som reserv, annars skulle alla delar få samma tips.
    q.ledtrad=del?.ledtrad || t.ledtrad || null;
    q.rättSvar=metadataForDel(t.rättSvar,i,antal);
    q.tolerans=metadataForDel(t.tolerans,i,antal);
    q.självrättning=metadataForDel(t.självrättning,i,antal);
    if("svarEnhet" in t) q.svarEnhet=metadataForDel(t.svarEnhet,i,antal);
    if("svarFormat" in t) q.svarFormat=metadataForDel(t.svarFormat,i,antal);
    if("manuellKomplettering" in t) q.manuellKomplettering=metadataForDel(t.manuellKomplettering,i,antal);
    // En inre lista är en lösningsmängd inom delen, inte nya deluppgifter.
    if(Array.isArray(q.rättSvar) && q.rättSvar.length>1){
      q.svarstyp="flera_delar";
      q.svarsstruktur="mängd";
      q.antalSvar=q.rättSvar.length;
    }else{
      delete q.svarsstruktur;
      delete q.svarstyp;
    }
    delete q.spelDelning;
    delete q.spelDelar;
    delete q.svarEtiketter;
    return q;
  });
}

/* Listan räknas om från hela banken varje gång: uteslutna områden,
   spel:false, uppdelning i deluppgifter och kursspår. En ritning av
   kursöversikten frågar efter den fyrtio gånger, en för varje kort och
   kapitel, så utan cache växer ritningstiden linjärt med bankens
   storlek och blir sekunder vid några tusen uppgifter.

   Nyckeln är identiteten hos bankens array plus kurs och spår. Byter
   eleven spår eller kurs pekar state.data.bank på ett nytt objekt
   eller state.track på ett nytt värde, och cachen faller av sig själv.
   Ingen anropare muterar listan — alla filtrerar om till nya arrayer. */
let _tillgCache={bank:null,track:null,kurs:null,lista:null};
function availableTasks(){
  if(!state.data) return [];
  if(_tillgCache.bank===state.data.bank
     && _tillgCache.track===state.track
     && _tillgCache.kurs===state.course) return _tillgCache.lista;
  let tasks=state.data.bank;
  const kurs=COURSES[state.course];
  if(kurs?.utanOmraden?.length) tasks=tasks.filter(t=>!isExcluded(t));
  // Uppgifter som inte passar spelet, t.ex. rita ett diagram, tas bort
  // före delningen så att inte heller deras delar kan väljas.
  tasks=tasks.filter(t=>t.spel!==false).flatMap(expandGameTask);
  if(state.track){
    tasks=tasks.filter(t=>{
      if(!t.kurs) return true;
      const k=Array.isArray(t.kurs)?t.kurs:[t.kurs];
      return k.includes(state.track);
    });
  }
  _tillgCache={bank:state.data.bank,track:state.track,kurs:state.course,lista:tasks};
  return tasks;
}
function areaName(key){
  const omr=state.data?.omr||{};
  for(const v of Object.values(omr)){
    if(v && typeof v==="object" && key in v) return v[key];
  }
  if(key in omr && typeof omr[key]==="string") return omr[key];
  return key ? key.replaceAll("_"," ") : "Övrigt";
}
/* Kapitelnummer för sortering. Kapitel "0" finns i Ma1, så noll får
   inte falla igenom som saknat värde. */
function kapNr(x){
  const n=Number(x);
  return Number.isFinite(n) ? n : 99;
}
function chapterName(kap){
  const spar=state.data?.kapSpar?.[state.track];
  if(spar && (spar[kap] ?? spar[String(kap)])) return spar[kap] ?? spar[String(kap)];
  const k=state.data?.kap||{};
  return k[kap] || k[String(kap)] || `Kapitel ${kap}`;
}
function familyName(f){
  if(!f) return "Övrigt";
  return String(f).replaceAll("_"," ").trim();
}
function abilityText(f){
  if(!f) return "";
  const a=Array.isArray(f)?f:[f];
  return a.map(x=>String(x).replaceAll("_"," ")).join(" · ");
}
/* Strukturfilen bestämmer ordningen. Områdena listas i den följd de
   står i OMR-objektet, alltså i bokens ordning, inte alfabetiskt. */
function areaOrder(){
  const omr=state.data?.omr||{};
  const ordning={};
  let n=0;
  Object.entries(omr).forEach(([kap,lista])=>{
    if(lista && typeof lista==="object")
      Object.keys(lista).forEach(key=>{ if(!(key in ordning)) ordning[key]=n++; });
  });
  return ordning;
}
function getAreas(){
  const tasks=availableTasks();
  const ordning=areaOrder();
  const by={};
  for(const t of tasks){
    const key=t.omr||"ovrigt";
    by[key] ||= {key,name:areaName(key),kap:t.kap,count:0,families:new Set()};
    by[key].count++;
    if(t.familj){
      const fs=Array.isArray(t.familj)?t.familj:[t.familj];
      fs.forEach(f=>by[key].families.add(f));
    }
  }
  return Object.values(by).sort((a,b)=>
    kapNr(a.kap)-kapNr(b.kap) ||
    (ordning[a.key] ?? 9999)-(ordning[b.key] ?? 9999) ||
    a.name.localeCompare(b.name,"sv"));
}
/* ==========================================================
   KORT PÅ KURSSIDAN
   Strukturfilens GRUPP-objekt slår ihop närbesläktade områden till
   ett kort, t.ex. alla metoder för andragradsekvationer. Områden som
   inte ingår i någon grupp blir egna kort. Ordningen följer strukturen.
   ========================================================== */

function getCards(){
  const areas=getAreas();
  const grupper=state.data?.grupp||{};
  const tagna=new Set();
  const kort=[];

  areas.forEach(a=>{
    if(tagna.has(a.key)) return;
    const gruppLista=grupper[a.kap]||[];
    const g=gruppLista.find(x=>Array.isArray(x.omr)&&x.omr.includes(a.key));
    if(g){
      // Alla gruppens områden som faktiskt har uppgifter i det här spåret.
      const med=areas.filter(x=>x.kap===a.kap && g.omr.includes(x.key));
      med.forEach(x=>tagna.add(x.key));
      kort.push({key:"g:"+g.id, name:g.namn, kap:a.kap, omr:med.map(x=>x.key),
                 delar:med, grupp:true,
                 families:new Set(med.flatMap(x=>[...x.families]))});
    }else{
      tagna.add(a.key);
      kort.push({key:a.key, name:a.name, kap:a.kap, omr:[a.key],
                 delar:[a], grupp:false, families:a.families});
    }
  });
  return kort;
}

/* Ett grupperat korts läge är medelvärdet av dess områden. Områden
   som inte tränats räknas som noll, så kortet fylls efter hand. */
function cardStatus(kort){
  const cp=ensureCourseProfile();
  const varden=kort.omr.map(k=>typeof cp.areas[k]==="number"?cp.areas[k]:null);
  const seen=varden.some(v=>v!==null);
  if(!seen) return {seen:false,m:0,label:"Ny",tone:"t-new",mcls:"m-new"};
  const m=varden.reduce((a,v)=>a+(v||0),0)/varden.length;
  if(m>=.78) return {seen:true,m,label:"Stark",tone:"t-good",mcls:""};
  if(m>=.55) return {seen:true,m,label:"På gång",tone:"t-mid",mcls:""};
  return {seen:true,m,label:"Behöver träning",tone:"t-low",mcls:""};
}

/* Samma tröskelvärden som områdena, men för ett delmoment. Listorna
   ska säga samma sak oavsett vilken nivå man tittar på. */
function delmomentStatus(family){
  const cp=ensureCourseProfile();
  const seen=typeof cp.families[family]==="number";
  const m=seen?cp.families[family]:0;
  if(!seen)   return {m:0,label:"Ny",tone:"t-new"};
  if(m>=.78)  return {m,label:"Stark",tone:"t-good"};
  if(m>=.55)  return {m,label:"På gång",tone:"t-mid"};
  return {m,label:"Behöver träning",tone:"t-low"};
}

function areaStatus(key){
  const cp=ensureCourseProfile();
  const seen=typeof cp.areas[key]==="number";
  const m=seen?cp.areas[key]:0;
  if(!seen)   return {seen:false,m:0,label:"Ny",tone:"t-new",mcls:"m-new"};
  if(m>=.78)  return {seen:true,m,label:"Stark",tone:"t-good",mcls:""};
  if(m>=.55)  return {seen:true,m,label:"På gång",tone:"t-mid",mcls:""};
  return {seen:true,m,label:"Behöver träning",tone:"t-low",mcls:""};
}
/* Öppnar en kurs direkt på ett bestämt spår, från startsidans rutor.
   selectCourse sätter alltid det förvalda spåret, så bytet måste ske
   efter laddningen men före ritningen. */
async function oppnaSpar(id,spar){
  const c=COURSES[id];
  if(!c) return;
  const ok=await selectCourse(id,{record:false,render:false});
  if(!ok) return;
  if(c.tracks.includes(spar)) state.track=spar;
  applyAccent();
  navRecord("dashboard");
  renderDashboard();
}

function setTrack(track){
  state.track=track; applyAccent(); state.openChapters=null;
  state.focusArea=null; state.focusOmr=null; state.focusNamn=null;
  state.focusFamily=null; state.currentTask=null;
  renderDashboard();
}
/* ==========================================================
   KORTET SOM ELEVENS OMRÅDE
   OMR-nycklarna i banken är tekniska underområden. De styr fortfarande
   adaptiv statistik och sparad progress, men det eleven ser och väljer
   är kortet: en GRUPP om strukturfilen har en, annars det enskilda
   området. Allt som visas för eleven ska därför byggas på getCards().
   ========================================================== */

function cardTaskPool(kort){
  return availableTasks().filter(t=>kort.omr.includes(t.omr||"ovrigt"));
}
/* Delmomenten inom ett helt kort. Räknas på availableTasks(), alltså
   efter kursspår, spel:false och uppdelning i deluppgifter — annars
   skulle antalen inte spegla vad eleven faktiskt kan träna. */
function cardFamilies(kort){
  const pool=cardTaskPool(kort);
  const counts=new Map();
  pool.forEach(t=>{
    const fs=(Array.isArray(t.familj)?t.familj:[t.familj]).filter(Boolean);
    fs.forEach(f=>counts.set(f,(counts.get(f)||0)+1));
  });
  let fam=[...counts].map(([family,count])=>({family,count}));
  // Ett delmoment måste ha en rimlig träningspool.
  fam=fam.filter(x=>x.count>=5);
  // Är kortet i praktiken en enda familj tillför knappen ingenting.
  if(fam.length===1 && fam[0].count>=pool.length*0.80) return [];
  return fam.sort((a,b)=>b.count-a.count).slice(0,10);
}

/* En familj kan förekomma i flera underområden. Den hör hemma i det
   kort där den har flest spelbara uppgifter i aktuellt spår. */
function familjIndex(){
  const kort=getCards();
  const omrTillKort={};
  kort.forEach(k=>k.omr.forEach(o=>omrTillKort[o]=k.key));
  const idx=new Map();
  availableTasks().forEach(t=>{
    const kk=omrTillKort[t.omr||"ovrigt"];
    if(!kk) return;
    const fs=(Array.isArray(t.familj)?t.familj:[t.familj]).filter(Boolean);
    fs.forEach(f=>{
      if(!idx.has(f)) idx.set(f,{total:0,kort:new Map()});
      const e=idx.get(f);
      e.total++;
      e.kort.set(kk,(e.kort.get(kk)||0)+1);
    });
  });
  return {idx,kortMap:new Map(kort.map(k=>[k.key,k]))};
}

/* Elevsynliga listor sorteras på kortets läge, inte på råa OMR. */
function rankedCards(limit,riktning){
  return getCards().map(k=>({kort:k,st:cardStatus(k)}))
    .filter(x=>x.st.seen)
    .sort((a,b)=>riktning*(a.st.m-b.st.m))
    .slice(0,limit)
    .map(x=>({key:x.kort.key,name:x.kort.name,m:x.st.m}));
}
function weakCards(limit=4){ return rankedCards(limit,1); }
function strongCards(limit=4){ return rankedCards(limit,-1); }

function weakFamilies(limit=8){
  const cp=ensureCourseProfile();
  const {idx,kortMap}=familjIndex();
  // Ett delmoment som inte gör urvalet smalare än hela kortet listas
  // inte. Samma regel som i punktträningen, så listorna säger samma sak.
  const godkanda=new Map();
  const okForCard=(k,f)=>{
    if(!godkanda.has(k.key)) godkanda.set(k.key,new Set(cardFamilies(k).map(x=>x.family)));
    return godkanda.get(k.key).has(f);
  };
  return [...idx.entries()]
    .filter(([,e])=>e.total>=5)
    .map(([family,e])=>{
      const bast=[...e.kort.entries()].sort((a,b)=>b[1]-a[1])[0];
      return {family,count:e.total,card:kortMap.get(bast[0]),m:mastery(cp.families,family)};
    })
    .filter(x=>x.card && okForCard(x.card,x.family))
    .sort((a,b)=>a.m-b.m).slice(0,limit);
}

/* ==========================================================
   TRÄNAREN
   Tränaren lägger ett pass i taget, ungefär som på gymmet: en dag
   teknik på det som skaver, en dag mängd för att få flyt, en dag
   tunga lyft. Passet slås fast en gång per dag och kurs och ligger
   kvar dagen ut — annars byter förslaget skepnad varje gång sidan
   ritas om, och då är det ingen tränare utan en tärning.

   Varje passtyp gör tre saker: väljer områden, förskjuter
   nivåblandningen och sätter passets längd. Tunga pass är korta,
   mängdpass är långa. Precis som på gymmet.
   ========================================================== */

const PASS_IKON={
  grund:      '<path d="M4 7h3.5l8 10H20"/><path d="M4 17h3.5l8-10H20"/><path d="M17.2 4.2L20 7l-2.8 2.8"/><path d="M17.2 14.2L20 17l-2.8 2.8"/>',
  teknik:     '<circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="3.6"/><circle cx="12" cy="12" r=".6"/>',
  mangd:      '<path d="M6.8 9.5v5"/><path d="M17.2 9.5v5"/><path d="M3.6 10.8v2.4"/><path d="M20.4 10.8v2.4"/><path d="M6.8 12h10.4"/>',
  tungt:      '<path d="M6.8 6.4v11.2"/><path d="M17.2 6.4v11.2"/><path d="M3.2 9.2v5.6"/><path d="M20.8 9.2v5.6"/><path d="M6.8 12h10.4"/>',
  repetition: '<path d="M20.2 12a8.2 8.2 0 1 1-2.4-5.8"/><path d="M20.2 3.8v4.8h-4.8"/>',
  fel:        '<path d="M12 3.6l8.7 15.1H3.3z"/><path d="M12 9.6v4.2"/><path d="M12 16.6h.01"/>'
};
function passIkon(id){
  const d=PASS_IKON[id]||PASS_IKON.grund;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
}

/* ---------- vad tränaren får plocka ur ----------
   Fokus är de kapitel eleven jobbar med just nu. Utan fokus skulle
   ett grundpass dra uppgifter från hela kursen, och den som ska ha
   prov på kapitel 1 och 2 vill inte möta kapitel 4.

   Inom fokus öppnar sig kapitlet dessutom i takt med eleven: bara
   områden som är påbörjade räknas som träningsbara, och ett nytt
   område släpps in först när det påbörjade håller ihop. Ett kapitel
   är en resa, inte en hög. */

const START_KRAV=3;          // uppgifter innan ett område räknas som påbörjat
const OPPNA_NYTT=.6;         // så väl måste det påbörjade sitta för att nästa ska släppas in

/* Räknaren i cp.levels överlever historikens 300 rader. */
function omradesForsok(key){
  const cp=ensureCourseProfile();
  const a=(cp.levels||{})[key];
  if(!a) return typeof cp.areas[key]==="number" ? 1 : 0;
  return (a.E?.n||0)+(a.C?.n||0)+(a.A?.n||0);
}
function kursensKapitel(){
  const sedda=new Set();
  return getAreas().map(a=>String(a.kap)).filter(k=>!sedda.has(k)&&sedda.add(k));
}
/* Har eleven inte valt något gissar tränaren utifrån var träningen
   faktiskt legat den senaste tiden. */
function autoKapitel(){
  const cp=ensureCourseProfile();
  const karta={}; getAreas().forEach(a=>karta[a.key]=String(a.kap));
  const raknare={};
  (cp.history||[]).slice(-50).forEach(h=>{
    const k=karta[h.area]; if(k) raknare[k]=(raknare[k]||0)+1;
  });
  return Object.entries(raknare).filter(([,n])=>n>=3)
    .sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>k)
    .sort((a,b)=>kapNr(a)-kapNr(b));
}
function aktivaKapitel(){
  const cp=ensureCourseProfile();
  const alla=kursensKapitel();
  const valda=(cp.fokus||[]).map(String).filter(k=>alla.includes(k));
  if(valda.length) return valda;
  const auto=autoKapitel();
  return auto.length?auto:alla.slice(0,1);
}
function fokusValt(){
  const cp=ensureCourseProfile();
  return !!(cp.fokus||[]).length;
}
function vaxlaKapitel(kap){
  const cp=ensureCourseProfile();
  const k=String(kap);
  const valda=new Set((cp.fokus||[]).map(String));
  // Utan eget val står de automatiskt valda kapitlen som utgångsläge,
  // annars skulle första klicket kasta bort dem.
  if(!valda.size) aktivaKapitel().forEach(x=>valda.add(x));
  valda.has(k) ? valda.delete(k) : valda.add(k);
  cp.fokus=[...valda].sort((a,b)=>kapNr(a)-kapNr(b));
  // Byter eleven kapitel mitt i dagen ska passet räknas om.
  profile.pt=null;
  saveProfile();
  renderDashboard();
}
function allaKapitel(){
  const cp=ensureCourseProfile();
  cp.fokus=[]; profile.pt=null; saveProfile(); renderDashboard();
}

/* Områdena tränaren får välja bland: inom fokus, påbörjade, plus på
   sin höjd ett nytt. Returnerar även vilket det nya är, så att
   tränaren kan säga det högt. */
function traningsOmraden(){
  const kap=new Set(aktivaKapitel());
  const iFokus=getAreas().filter(a=>kap.has(String(a.kap)));
  if(!iFokus.length) return {omr:getAreas().map(a=>a.key),nytt:null,kvar:0};
  const igang=iFokus.filter(a=>omradesForsok(a.key)>=START_KRAV);
  const nasta=iFokus.find(a=>omradesForsok(a.key)<START_KRAV);
  const kvar=iFokus.filter(a=>omradesForsok(a.key)<START_KRAV).length;
  if(!igang.length)
    return {omr:iFokus.slice(0,1).map(a=>a.key),nytt:iFokus[0].key,kvar:Math.max(0,kvar-1)};
  const cp=ensureCourseProfile();
  const snitt=igang.reduce((s,a)=>s+mastery(cp.areas,a.key),0)/igang.length;
  const slappIn = nasta && snitt>=OPPNA_NYTT;
  return {
    omr:[...igang.map(a=>a.key),...(slappIn?[nasta.key]:[])],
    nytt:slappIn?nasta.key:null,
    kvar:Math.max(0,kvar-(slappIn?1:0))
  };
}
function fokusNycklar(){ return traningsOmraden().omr; }

/* Passtypernas urval görs alltid inom det tränaren får plocka ur. */
function svagaInom(keys,n){
  const cp=ensureCourseProfile();
  return keys.map(k=>({k,m:mastery(cp.areas,k),sedd:typeof cp.areas[k]==="number"}))
    .filter(x=>x.sedd && x.m<.72).sort((a,b)=>a.m-b.m).slice(0,n).map(x=>x.k);
}
function starkaInom(keys,n){
  const cp=ensureCourseProfile();
  return keys.map(k=>({k,m:mastery(cp.areas,k),sedd:typeof cp.areas[k]==="number"}))
    .filter(x=>x.sedd && x.m>=.62).sort((a,b)=>b.m-a.m).slice(0,n).map(x=>x.k);
}
/* Uppgifter eleven svarat fel på och inte klarat sedan dess. Att gå
   tillbaka till sina egna misstag är den bäst belagda inlärnings-
   effekten som finns, och historiken bär redan svaret. */
function felUppgifter(gräns=10){
  const cp=ensureCourseProfile();
  const fokus=new Set(fokusNycklar());
  const senaste=new Map();
  // Historiken läses framlänges, så den sista posten per uppgift vinner.
  (cp.history||[]).forEach(h=>{ if(h && h.id) senaste.set(h.id,h); });
  const kvar=[...senaste.values()]
    .filter(h=>!h.ok && (!h.area || fokus.has(h.area)))
    .sort((a,b)=>b.at-a.at)
    .map(h=>h.id);
  if(!kvar.length) return [];
  // Bara uppgifter som fortfarande finns i banken och i valt spår.
  const finns=new Set(availableTasks().map(t=>t.id));
  return kvar.filter(id=>finns.has(id)).slice(0,gräns);
}

function senastTranad(area){
  const h=ensureCourseProfile().history||[];
  for(let i=h.length-1;i>=0;i--) if(h[i].area===area) return h[i].at;
  return null;
}
/* Områden som en gång suttit men legat orörda en vecka. Kunskap som
   inte repeteras rinner ut — det är den enda luckan som varken
   mastery eller nivågränserna fångar, eftersom båda är blinda för tid. */
function repetitionInom(keys){
  const cp=ensureCourseProfile(), nu=Date.now();
  return keys.map(k=>({k,m:mastery(cp.areas,k),at:senastTranad(k)}))
    .filter(x=>x.at && x.m>=.6 && (nu-x.at)/864e5>=7)
    .sort((a,b)=>a.at-b.at).slice(0,3).map(x=>x.k);
}

/* vikt förskjuter nivåblandningen, antal är passets längd och
   omraden väljer ut ett smalare urval ur fokus. Saknas omraden
   tränar passet hela fokus.

   Antalet är absolut, inte en andel av dagsmålet. Ett tungt pass är
   fem uppgifter för att fem tunga uppgifter är ett pass — inte för
   att dagsmålet råkar stå på åtta. */
const PASS={
  grund:{
    namn:"Grundpass", under:"Blandat inom områdena du jobbar med", niva:"Nivå efter dagsform",
    vikt:{E:1,C:1,A:1}, antal:8
  },
  teknik:{
    namn:"Teknikpass", under:"Det du har svårast för", niva:"Nivå 1–2",
    vikt:{E:3.2,C:1,A:.25}, antal:10,
    omraden:keys=>svagaInom(keys,2)
  },
  mangd:{
    namn:"Mängdpass", under:"Många uppgifter", niva:"Nivå 1–2",
    vikt:{E:2.6,C:1,A:.3}, antal:15
  },
  tungt:{
    namn:"Tungt pass", under:"Svårare uppgifter där du är starkast", niva:"Nivå 2–3",
    vikt:{E:.25,C:1.3,A:2.4}, antal:5,
    omraden:keys=>starkaInom(keys,3)
  },
  repetition:{
    namn:"Repetitionspass", under:"Sådant du inte tränat på ett tag", niva:"Nivå 1–3",
    vikt:{E:1,C:1.1,A:.7}, antal:8,
    omraden:keys=>repetitionInom(keys)
  },
  // Felpasset väljer inte område och nivå — det serverar en bestämd
  // kö av uppgifter, i den ordning de gick fel.
  fel:{
    namn:"Repetera dina fel", under:"Uppgifter du hade fel på", niva:"Dina egna fel",
    vikt:{E:1,C:1,A:1}, antal:10, ko:true
  }
};
const PASS_ORDNING=["grund","teknik","mangd","tungt","repetition","fel"];

/* Områdena ett visst pass skulle träna. Ger passtypens smalare urval
   om det finns något att välja på, annars hela fokus. */
function passOmraden(typ){
  const p=PASS[typ]||PASS.grund;
  const fokus=fokusNycklar();
  if(!p.omraden) return fokus;
  const valt=p.omraden(fokus);
  return (valt&&valt.length)?valt:fokus;
}

/* ---------- underlag för valet ---------- */

function senasteTraffsakerhet(n=12){
  const h=(ensureCourseProfile().history||[]).slice(-n);
  if(h.length<n) return null;
  return h.filter(x=>x.ok).length/h.length;
}
function redoForTungt(){
  const t=senasteTraffsakerhet();
  return t!==null && t>=.75 && starkaInom(fokusNycklar(),1).length>0;
}

/* Kandidaterna ligger i behovsordning. Den som redan använts de två
   senaste dagarna hoppas över, så att veckan får variation utan att
   valet blir slumpmässigt. */
function valjPassTyp(){
  const senaste=(profile.passLogg||[]).slice(-2).map(x=>x.typ);
  const fokus=fokusNycklar();
  const kandidater=[];
  const cp=ensureCourseProfile();
  if(felUppgifter(10).length>=4) kandidater.push("fel");
  const svag=svagaInom(fokus,1)[0];
  if(svag && mastery(cp.areas,svag)<.62) kandidater.push("teknik");
  if(repetitionInom(fokus).length) kandidater.push("repetition");
  if(redoForTungt()) kandidater.push("tungt");
  kandidater.push("mangd","grund");
  return kandidater.find(t=>!senaste.includes(t)) || kandidater[0];
}
function dagensPass(){
  const nyckel=todayKey()+"|"+state.course+"|"+aktivaKapitel().join(",");
  if(profile.pt && profile.pt.nyckel===nyckel && PASS[profile.pt.typ]) return profile.pt.typ;
  const cp=ensureCourseProfile();
  // De första uppgifterna får vara breda: tränaren behöver underlag
  // innan den börjar peka ut svagheter.
  const typ=(cp.history||[]).length<10 ? "grund" : valjPassTyp();
  profile.pt={nyckel,typ};
  profile.passLogg=[...(profile.passLogg||[]),{d:todayKey(),typ}].slice(-6);
  saveProfile();
  return typ;
}
/* Eleven får byta pass. En tränare som inte lyssnar är en app. */
function valjPass(typ){
  if(!PASS[typ]) return;
  profile.pt={nyckel:todayKey()+"|"+state.course+"|"+aktivaKapitel().join(","),typ,valt:true};
  const logg=profile.passLogg||[];
  if(logg.length && logg[logg.length-1].d===todayKey()) logg[logg.length-1].typ=typ;
  saveProfile();
  state.visaPassval=false;
  renderDashboard();
}
function vaxlaPassval(){ state.visaPassval=!state.visaPassval; state.visaFokus=false; renderDashboard(); }
function vaxlaFokusval(){ state.visaFokus=!state.visaFokus; state.visaPassval=false; renderDashboard(); }

/* ---------- tränarens röst ---------- */

function passOmradesNamn(typ){
  return passOmraden(typ).map(k=>areaName(k)).filter(Boolean);
}
function namnLista(namn,max=2){
  const n=namn.slice(0,max);
  const rest=namn.length-n.length;
  const txt = n.length===1 ? `<b>${esc(n[0])}</b>`
            : `<b>${esc(n.slice(0,-1).join(", "))}</b> och <b>${esc(n[n.length-1])}</b>`;
  return n.length ? txt+(rest>0?` (med flera)`:"") : "";
}
function passMeddelande(typ){
  const st=currentStreak(), done=todayCount(), goal=profile.goal||8;
  const t=traningsOmraden();
  const antal=(PASS[typ]||PASS.grund).antal||8;
  const lista=namnLista(passOmradesNamn(typ));
  const nytt=t.nytt?`<b>${esc(areaName(t.nytt))}</b>`:"";

  if(!profile.attempts)
    return `Vi börjar i ${nytt||"första området"}. Ett kort pass så ser jag var du ligger.`;
  if(done>=goal)
    return `Dagens mål är klart. <b>${done} uppgifter</b>${st>1?` och ${st} dagar i rad`:""}. Kör du ett till lägger jag nivån lite högre.`;

  const nyttTillagg = (t.nytt && typ!=="repetition")
    ? ` Jag släpper också in ${nytt} idag.` : "";

  switch(typ){
    case "teknik":
      return lista
        ? `Idag tränar vi det som är svårast just nu: ${lista}. Lägre nivå, fler uppgifter.`
        : `Idag tränar vi det som är svårast just nu. Lägre nivå, fler uppgifter.`;
    case "mangd":
      return `Idag kör vi mängd. ${antal} uppgifter på en nivå du klarar, så att det får sitta.${nyttTillagg}`;
    case "tungt":
      return lista
        ? `Idag kör vi tyngre. Nivå 2 och 3 i ${lista}. Bara ${antal} uppgifter, så ta den tid du behöver.`
        : `Idag kör vi tyngre. Bara ${antal} uppgifter, men på en nivå över den du är van vid.`;
    case "fel":{
      const n=felUppgifter(10).length;
      return `Du har <b>${n} uppgift${n===1?"":"er"}</b> som blev fel och som du inte klarat sedan dess. Vi tar dem igen — det är där du har mest att hämta.`;
    }
    case "repetition":{
      const gamla=repetitionInom(fokusNycklar());
      return gamla.length
        ? `${namnLista(gamla.map(k=>areaName(k)))} har du inte tränat på ett tag. Vi tar en runda där så det sitter kvar.`
        : `Inget har hunnit bli gammalt än. Vi tar en bred runda över det du jobbar med i stället.`;
    }
    default:
      return (st>1
        ? `${st} dagar i rad. Idag blandar jag inom det du jobbar med och ställer nivån efter hur det går.`
        : `Idag blandar vi inom det du jobbar med. Nivån ställs efter hur det går för dig.`)+nyttTillagg;
  }
}
/* Nivåtexten räknas fram ur den blandning passet faktiskt kommer att
   ge, inte ur en fast etikett. Ett tungt pass i en kurs där nivå 3
   ännu inte är öppen ska inte lova nivå 3.
   Bara områden eleven redan tränat vägs in — att fråga om ett orört
   område skulle skapa tomma poster i profilen. */
function passNivaSpann(typ){
  const p=PASS[typ]||PASS.grund, cp=ensureCourseProfile();
  const omr=passOmraden(typ).filter(k=>cp.levels&&cp.levels[k]);
  if(!omr.length) return p.niva;
  const gammal=state.passTyp; state.passTyp=typ;
  const sum={E:0,C:0,A:0}; let n=0;
  omr.forEach(a=>{
    const m=levelMix({E:1,C:1,A:1},a);
    if(m){ sum.E+=m.E; sum.C+=m.C; sum.A+=m.A; n++; }
  });
  state.passTyp=gammal;
  if(!n) return p.niva;
  const andel=[sum.E/n,sum.C/n,sum.A/n];
  const med=[1,2,3].filter(i=>andel[i-1]>=.18);
  if(!med.length) return p.niva;
  return med.length===1 ? `Nivå ${med[0]}` : `Nivå ${med[0]}–${med[med.length-1]}`;
}
function passChips(typ){
  const p=PASS[typ]||PASS.grund;
  if(p.ko){
    const n=felUppgifter(p.antal).length;
    return [`${n} uppgift${n===1?"":"er"}`,"Dina egna fel","Blandade områden"];
  }
  const antal=p.antal||profile.goal||8;
  const namn=passOmradesNamn(typ);
  const chips=[`${antal} uppgifter`,passNivaSpann(typ)];
  if(namn.length===1) chips.push(namn[0]);
  else if(namn.length) chips.push(`${namn.length} områden`);
  return chips;
}

/* ---------- tränarens tre lägen ----------
   Fullt kort när dagens pass ligger framför eleven. Sammandraget när
   beslutet redan är taget: mitt i ett pass, eller när dagsmålet är
   klart. Lägena styrs av läget, inte av eleven — den som fäller ihop
   kortet en trött torsdag ska inte hitta det ihopfällt på måndagen
   då den behövde en knuff. "Visa" öppnar det för stunden. */
function pagaendePass(){
  return !!(state.currentTask && state.sessionDone>0 && state.sessionDone<state.sessionTarget);
}
function fortsattPass(){
  if(!state.currentTask) return startPass(dagensPass());
  navRecord("training"); renderTraining();
}
function oppnaPt(){ state.ptOppen=true; renderDashboard(); }

function ptLitet(sort){
  const typ=dagensPass();
  const done=todayCount(), goal=profile.goal||8, st=currentStreak();
  const pagar=sort==="pagar";
  const kvot=pagar ? state.sessionDone/state.sessionTarget : Math.min(1,done/goal);
  return `
  <section class="pt pt-liten${pagar?"":" klart"}">
    <span class="pt-ikon liten">${passIkon(pagar?(state.passTyp||typ):typ)}</span>
    <span class="pt-liten-txt">
      <b><span class="pt-namn">Din personliga tränare:</span> ${pagar?esc(sessionLabel()):"Dagens mål klart"}</b>
      <small>${pagar
        ? `${state.sessionDone} av ${state.sessionTarget} uppgifter klara`
        : `${done} av ${goal} uppgifter${st>1?` · ${st} dagar i rad`:""}`}</small>
    </span>
    <span class="pt-mini"><i style="width:${Math.round(kvot*100)}%"></i></span>
    <button class="btn primary sm" onclick="${pagar?"fortsattPass()":`startPass('${typ}')`}">
      ${pagar?"Fortsätt":"Ett pass till"} <span aria-hidden="true">→</span>
    </button>
    <button class="pt-andra" onclick="oppnaPt()">Visa tränaren</button>
  </section>`;
}

function ptKort(){
  const done=todayCount(), goal=profile.goal||8;
  const klart=done>=goal && profile.attempts;
  if(!state.ptOppen){
    if(pagaendePass()) return ptLitet("pagar");
    if(klart) return ptLitet("klart");
  }
  const typ=dagensPass(), p=PASS[typ]||PASS.grund;
  const chips=passChips(typ);
  if(klart) chips.unshift("Dagens mål klart");
  const aktiva=aktivaKapitel(), t=traningsOmraden();
  const val=state.visaPassval?`
    <div class="pt-val">
      ${PASS_ORDNING.filter(id=>!PASS[id].ko || felUppgifter(PASS[id].antal).length).map(id=>`
        <button class="pt-alt${id===typ?" pa":""}" onclick="valjPass('${id}')">
          ${passIkon(id)}
          <span><b>${PASS[id].namn}</b><small>${PASS[id].under}</small></span>
        </button>`).join("")}
    </div>`:"";

  const fokusval=state.visaFokus?`
    <div class="pt-val">
      ${kursensKapitel().map(k=>{
        const pa=aktiva.includes(k);
        const antal=getCards().filter(a=>String(a.kap)===k).length;
        return `<button class="valruta${pa?" vald":""}" onclick="vaxlaKapitel('${esc(k)}')">
          <span class="kryss" aria-hidden="true"></span>
          <span class="valnamn">${esc(chapterName(k))}</span>
          <span class="valstate">${antal} områden</span>
        </button>`;
      }).join("")}
      <button class="btn quiet sm" style="grid-column:1/-1;justify-self:start" onclick="allaKapitel()">Låt tränaren välja åt mig</button>
    </div>`:"";

  return `
  <section class="pt${klart?" klart":""}">
    <div class="pt-huvud">
      <span class="pt-ikon">${passIkon(typ)}</span>
      <span class="pt-titel">
        <span class="pt-lbl">Din personliga tränare</span>
        <h2>Idag: ${p.namn}</h2>
      </span>
      <span class="pt-chips">${chips.map(c=>`<span class="pt-chip">${esc(c)}</span>`).join("")}</span>
    </div>
    <p class="pt-msg">${passMeddelande(typ)}</p>
    <div class="pt-act">
      ${pagaendePass()
        ? `<button class="btn primary" onclick="fortsattPass()">Fortsätt passet <span aria-hidden="true">→</span></button>`
        : `<button class="btn primary" onclick="startPass('${typ}')">${klart?"Kör ett pass till":"Starta passet"} <span aria-hidden="true">→</span></button>`}
      <button class="btn" onclick="vaxlaPassval()" aria-expanded="${state.visaPassval?"true":"false"}">${state.visaPassval?"Stäng":"Byt pass"}</button>
      <button class="btn quiet" onclick="showAreaPicker()">Punktträna</button>
    </div>
    <div class="pt-fokus">
      <span class="pt-fokus-lbl">Jobbar med</span>
      ${aktiva.map(k=>`<span class="pt-kap">${esc(chapterName(k))}</span>`).join("")}
      ${fokusValt()?"":`<span class="pt-auto" title="Tränaren har gissat utifrån var du tränat">vald åt dig</span>`}
      ${t.kvar?`<span class="pt-auto">${t.kvar} område${t.kvar>1?"n":""} kvar att öppna</span>`:""}
      <button class="pt-andra" onclick="vaxlaFokusval()" aria-expanded="${state.visaFokus?"true":"false"}">${state.visaFokus?"Stäng":"Ändra"}</button>
    </div>
    ${val}${fokusval}
  </section>`;
}

}
