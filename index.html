function cardTaskPool(kort){
  return availableTasks().filter(t=>kort.omr.includes(t.omr||"ovrigt"));
}

function cardFamilies(kort){
  const pool=cardTaskPool(kort);
  const counts=new Map();
  pool.forEach(t=>{
    const fs=(Array.isArray(t.familj)?t.familj:[t.familj]).filter(Boolean);
    fs.forEach(f=>counts.set(f,(counts.get(f)||0)+1));
  });
  let fam=[...counts].map(([family,count])=>({family,count}));

  fam=fam.filter(x=>x.count>=5);

  if(fam.length===1 && fam[0].count>=pool.length*0.80) return [];
  return fam.sort((a,b)=>b.count-a.count).slice(0,10);
}

function familjIndex(){
  const kort=getCards();
  const omrTillKort={};
  kort.forEach(k=>k.omr.forEach(o=>omrTillKort[o]=k.key));
  const idx=new Map();
  availableTasks().forEach(t=>{
    const kk=omrTillKort[t.omr||"ovrigt"];
    if(!kk) return;
    const fs=(Array.isArray(t.familj)?t.familj:[t.familj]).filter(Boolean);
    fs.forEach(f=>{
      if(!idx.has(f)) idx.set(f,{total:0,kort:new Map()});
      const e=idx.get(f);
      e.total++;
      e.kort.set(kk,(e.kort.get(kk)||0)+1);
    });
  });
  return {idx,kortMap:new Map(kort.map(k=>[k.key,k]))};
}

function rankedCards(limit,riktning){
  return getCards().map(k=>({kort:k,st:cardStatus(k)}))
    .filter(x=>x.st.seen)
    .sort((a,b)=>riktning*(a.st.m-b.st.m))
    .slice(0,limit)
    .map(x=>({key:x.kort.key,name:x.kort.name,m:x.st.m}));
}
function weakCards(limit=4){ return rankedCards(limit,1); }
function strongCards(limit=4){ return rankedCards(limit,-1); }

function weakFamilies(limit=8){
  const cp=ensureCourseProfile();
  const {idx,kortMap}=familjIndex();

  const godkanda=new Map();
  const okForCard=(k,f)=>{
    if(!godkanda.has(k.key)) godkanda.set(k.key,new Set(cardFamilies(k).map(x=>x.family)));
    return godkanda.get(k.key).has(f);
  };
  return [...idx.entries()]
    .filter(([,e])=>e.total>=5)
    .map(([family,e])=>{
      const bast=[...e.kort.entries()].sort((a,b)=>b[1]-a[1])[0];
      return {family,count:e.total,card:kortMap.get(bast[0]),m:mastery(cp.families,family)};
    })
    .filter(x=>x.card && okForCard(x.card,x.family))
    .sort((a,b)=>a.m-b.m).slice(0,limit);
}

const START_KRAV=3;
const OPPNA_NYTT=.6;

function omradesForsok(key){
  const cp=ensureCourseProfile();
  const a=(cp.levels||{})[key];
  if(!a) return typeof cp.areas[key]==="number" ? 1 : 0;
  return (a.E?.n||0)+(a.C?.n||0)+(a.A?.n||0);
}
function kursensKapitel(){
  const sedda=new Set();
  return getAreas().map(a=>String(a.kap)).filter(k=>!sedda.has(k)&&sedda.add(k));
}

function autoKapitel(){
  const cp=ensureCourseProfile();
  const karta={}; getAreas().forEach(a=>karta[a.key]=String(a.kap));
  const raknare={};
  (cp.history||[]).slice(-50).forEach(h=>{
    const k=karta[h.area]; if(k) raknare[k]=(raknare[k]||0)+1;
  });
  return Object.entries(raknare).filter(([,n])=>n>=3)
    .sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>k)
    .sort((a,b)=>kapNr(a)-kapNr(b));
}
function aktivaKapitel(){
  const cp=ensureCourseProfile();
  const alla=kursensKapitel();
  const valda=(cp.fokus||[]).map(String).filter(k=>alla.includes(k));
  if(valda.length) return valda;
  const auto=autoKapitel();
  return auto.length?auto:alla.slice(0,1);
}
function fokusValt(){
  const cp=ensureCourseProfile();
  return !!(cp.fokus||[]).length;
}
function vaxlaKapitel(kap){
  const cp=ensureCourseProfile();
  const k=String(kap);
  const valda=new Set((cp.fokus||[]).map(String));

  if(!valda.size) aktivaKapitel().forEach(x=>valda.add(x));
  valda.has(k) ? valda.delete(k) : valda.add(k);
  cp.fokus=[...valda].sort((a,b)=>kapNr(a)-kapNr(b));

  profile.pt=null;
  saveProfile();
  renderDashboard();
}
function allaKapitel(){
  const cp=ensureCourseProfile();
  cp.fokus=[]; profile.pt=null; saveProfile(); renderDashboard();
}

function traningsOmraden(){
  const kap=new Set(aktivaKapitel());
  const iFokus=getAreas().filter(a=>kap.has(String(a.kap)));
  if(!iFokus.length) return {omr:getAreas().map(a=>a.key),nytt:null,kvar:0};
  const igang=iFokus.filter(a=>omradesForsok(a.key)>=START_KRAV);
  const nasta=iFokus.find(a=>omradesForsok(a.key)<START_KRAV);
  const kvar=iFokus.filter(a=>omradesForsok(a.key)<START_KRAV).length;
  if(!igang.length)
    return {omr:iFokus.slice(0,1).map(a=>a.key),nytt:iFokus[0].key,kvar:Math.max(0,kvar-1)};
  const cp=ensureCourseProfile();
  const snitt=igang.reduce((s,a)=>s+mastery(cp.areas,a.key),0)/igang.length;
  const slappIn = nasta && snitt>=OPPNA_NYTT;
  return {
    omr:[...igang.map(a=>a.key),...(slappIn?[nasta.key]:[])],
    nytt:slappIn?nasta.key:null,
    kvar:Math.max(0,kvar-(slappIn?1:0))
  };
}
function fokusNycklar(){ return traningsOmraden().omr; }

function svagaInom(keys,n){
  const cp=ensureCourseProfile();
  return keys.map(k=>({k,m:mastery(cp.areas,k),sedd:typeof cp.areas[k]==="number"}))
    .filter(x=>x.sedd && x.m<.72).sort((a,b)=>a.m-b.m).slice(0,n).map(x=>x.k);
}
function starkaInom(keys,n){
  const cp=ensureCourseProfile();
  return keys.map(k=>({k,m:mastery(cp.areas,k),sedd:typeof cp.areas[k]==="number"}))
    .filter(x=>x.sedd && x.m>=.62).sort((a,b)=>b.m-a.m).slice(0,n).map(x=>x.k);
}

function felUppgifter(gräns=10){
  const cp=ensureCourseProfile();
  const fokus=new Set(fokusNycklar());
  const senaste=new Map();

  (cp.history||[]).forEach(h=>{ if(h && h.id) senaste.set(h.id,h); });
  const kvar=[...senaste.values()]
    .filter(h=>!h.ok && (!h.area || fokus.has(h.area)))
    .sort((a,b)=>b.at-a.at)
    .map(h=>h.id);
  if(!kvar.length) return [];

  const finns=new Set(availableTasks().map(t=>t.id));
  return kvar.filter(id=>finns.has(id)).slice(0,gräns);
}

function senastTranad(area){
  const h=ensureCourseProfile().history||[];
  for(let i=h.length-1;i>=0;i--) if(h[i].area===area) return h[i].at;
  return null;
}

function repetitionInom(keys){
  const cp=ensureCourseProfile(), nu=Date.now();
  return keys.map(k=>({k,m:mastery(cp.areas,k),at:senastTranad(k)}))
    .filter(x=>x.at && x.m>=.6 && (nu-x.at)/864e5>=7)
    .sort((a,b)=>a.at-b.at).slice(0,3).map(x=>x.k);
}

const PASS={
  grund:{
    namn:"Grundpass", under:"Blandat inom områdena du jobbar med", niva:"Nivå efter dagsform",
    vikt:{E:1,C:1,A:1}, antal:8
  },
  teknik:{
    namn:"Teknikpass", under:"Det du har svårast för", niva:"Nivå 1–2",
    vikt:{E:3.2,C:1,A:.25}, antal:10,
    omraden:keys=>svagaInom(keys,2)
  },
  mangd:{
    namn:"Mängdpass", under:"Många uppgifter", niva:"Nivå 1–2",
    vikt:{E:2.6,C:1,A:.3}, antal:15
  },
  tungt:{
    namn:"Tungt pass", under:"Svårare uppgifter där du är starkast", niva:"Nivå 2–3",
    vikt:{E:.25,C:1.3,A:2.4}, antal:5,
    omraden:keys=>starkaInom(keys,3)
  },
  repetition:{
    namn:"Repetitionspass", under:"Sådant du inte tränat på ett tag", niva:"Nivå 1–3",
    vikt:{E:1,C:1.1,A:.7}, antal:8,
    omraden:keys=>repetitionInom(keys)
  },

  fel:{
    namn:"Repetera dina fel", under:"Uppgifter du hade fel på", niva:"Dina egna fel",
    vikt:{E:1,C:1,A:1}, antal:10, ko:true
  }
};
const PASS_ORDNING=["grund","teknik","mangd","tungt","repetition","fel"];

function passOmraden(typ){
  const p=PASS[typ]||PASS.grund;
  const fokus=fokusNycklar();
  if(!p.omraden) return fokus;
  const valt=p.omraden(fokus);
  return (valt&&valt.length)?valt:fokus;
}

function senasteTraffsakerhet(n=12){
  const h=(ensureCourseProfile().history||[]).slice(-n);
  if(h.length<n) return null;
  return h.filter(x=>x.ok).length/h.length;
}
function redoForTungt(){
  const t=senasteTraffsakerhet();
  return t!==null && t>=.75 && starkaInom(fokusNycklar(),1).length>0;
}

const PASS_UTAN_ROTATION=["fel","teknik"];

function valjPassTyp(){
  const senaste=(profile.passLogg||[]).slice(-2).map(x=>x.typ);
  const fokus=fokusNycklar();
  const kandidater=[];
  const cp=ensureCourseProfile();

  if(felUppgifter(10).length>=2) kandidater.push("fel");
  if(svagaInom(fokus,1).length) kandidater.push("teknik");
  if(repetitionInom(fokus).length) kandidater.push("repetition");
  if(redoForTungt()) kandidater.push("tungt");
  kandidater.push("mangd","grund");
  const forst=kandidater[0];

  const dominerat = senaste.length>=2
    && PASS_UTAN_ROTATION.includes(senaste[0])
    && PASS_UTAN_ROTATION.includes(senaste[1]);
  if(PASS_UTAN_ROTATION.includes(forst) && !dominerat) return forst;
  return kandidater.find(t=>!PASS_UTAN_ROTATION.includes(t) && !senaste.includes(t))
      || kandidater.find(t=>!senaste.includes(t))
      || forst;
}
function dagensPass(){
  const nyckel=todayKey()+"|"+state.course+"|"+aktivaKapitel().join(",");
  if(profile.pt && profile.pt.nyckel===nyckel && PASS[profile.pt.typ]) return profile.pt.typ;
  const cp=ensureCourseProfile();

  const typ=(cp.history||[]).length<10 ? "grund" : valjPassTyp();
  profile.pt={nyckel,typ};
  saveProfile();
  return typ;
}

function loggaPass(typ){
  const logg=[...(profile.passLogg||[])];
  const idag=todayKey();
  if(logg.length && logg[logg.length-1].d===idag) logg[logg.length-1]={d:idag,typ};
  else logg.push({d:idag,typ});
  profile.passLogg=logg.slice(-6);
  saveProfile();
}

function valjPass(typ){
  if(!PASS[typ]) return;

  profile.pt={nyckel:todayKey()+"|"+state.course+"|"+aktivaKapitel().join(","),typ,valt:true};
  saveProfile();
  state.visaPassval=false;
  renderDashboard();
}
function vaxlaPassval(){ state.visaPassval=!state.visaPassval; state.visaFokus=false; renderDashboard(); }
function vaxlaFokusval(){ state.visaFokus=!state.visaFokus; state.visaPassval=false; renderDashboard(); }

function passOmradesNamn(typ){
  return passOmraden(typ).map(k=>areaName(k)).filter(Boolean);
}
function namnLista(namn,max=2){
  const n=namn.slice(0,max);
  const rest=namn.length-n.length;
  const txt = n.length===1 ? `<b>${esc(n[0])}</b>`
            : `<b>${esc(n.slice(0,-1).join(", "))}</b> och <b>${esc(n[n.length-1])}</b>`;
  return n.length ? txt+(rest>0?` (med flera)`:"") : "";
}
function passMeddelande(typ){
  const st=currentStreak(), done=todayCount(), goal=profile.goal||8;
  const t=traningsOmraden();
  const antal=(PASS[typ]||PASS.grund).antal||8;
  const lista=namnLista(passOmradesNamn(typ));
  const nytt=t.nytt?`<b>${esc(areaName(t.nytt))}</b>`:"";

  if(!profile.attempts)
    return `${nytt||"Första området"} · ${antal} uppgifter på grundläggande nivå.`;
  if(done>=goal)
    return `<b>${done} av ${goal}</b> uppgifter klara idag${st>1?` · ${st} dagar i rad`:""}.`;

  switch(typ){
    case "teknik":
      return lista
        ? `Fokus: ${lista}. ${antal} uppgifter på grundläggande nivå.`
        : `${antal} uppgifter på grundläggande nivå.`;
    case "mangd":
      return `${antal} blandade uppgifter för att befästa metoderna.`;
    case "tungt":
      return lista
        ? `${antal} utmanande uppgifter i ${lista}.`
        : `${antal} utmanande uppgifter på nivå 2 och 3.`;
    case "fel":{
      const n=felUppgifter(10).length;
      return `<b>${n} tidigare fel</b> att arbeta igenom med nya försök.`;
    }
    case "repetition":{
      const gamla=repetitionInom(fokusNycklar());
      return gamla.length
        ? `${namnLista(gamla.map(k=>areaName(k)))} · områden som inte tränats på ett tag.`
        : `${antal} blandade uppgifter inom dina aktiva områden.`;
    }
    default:
      return lista
        ? `${antal} blandade uppgifter i ${lista}.`
        : `${antal} blandade uppgifter inom dina aktiva områden.`;
  }
}

function passNivaSpann(typ){
  const p=PASS[typ]||PASS.grund, cp=ensureCourseProfile();
  const omr=passOmraden(typ).filter(k=>cp.levels&&cp.levels[k]);
  if(!omr.length) return p.niva;
  const gammal=state.passTyp; state.passTyp=typ;
  const sum={G:0,E:0,C:0,A:0}; let n=0;
  omr.forEach(a=>{
    const m=levelMix({G:1,E:1,C:1,A:1},a);
    if(m){ NIVAER.forEach(L=>sum[L]+=m[L]); n++; }
  });
  state.passTyp=gammal;
  if(!n) return p.niva;
  const andel=NIVAER.map(L=>sum[L]/n);
  const med=[0,1,2,3].filter(i=>andel[i]>=.18);
  if(!med.length) return p.niva;
  return med.length===1 ? `Nivå ${med[0]}` : `Nivå ${med[0]}–${med[med.length-1]}`;
}
function passChips(typ){
  const p=PASS[typ]||PASS.grund;
  if(p.ko){
    const n=felUppgifter(p.antal).length;
    return [`${n} uppgift${n===1?"":"er"}`,"Dina egna fel","Blandade områden"];
  }
  const antal=p.antal||profile.goal||8;
  const namn=passOmradesNamn(typ);
  const chips=[`${antal} uppgifter`,passNivaSpann(typ)];
  if(namn.length===1) chips.push(namn[0]);
  else if(namn.length) chips.push(`${namn.length} områden`);
  return chips;
}

const NIVA={G:0,E:1,C:2,A:3};
const NIVAER=["G","E","C","A"];
function levelOf(t){
  const n=String(t.niva||"E").toUpperCase();
  return (n==="A"||n==="C"||n==="G") ? n : "E";
}
function levelNumber(t){ return NIVA[levelOf(t)]; }
function levelChip(t){
  const n=levelNumber(t);

  if(n===0) return `<span class="tag lv lv0" title="Grundnivå – repetition inför nivå 1">
    <span class="pips" aria-hidden="true"><b class="on"></b></span>Grunder</span>`;
  const pips=[1,2,3].map(i=>`<b class="${i<=n?"on":""}"></b>`).join("");
  return `<span class="tag lv lv${n}" title="Svårighetsgrad ${n} av 3">
    <span class="pips" aria-hidden="true">${pips}</span>Nivå ${n}</span>`;
}
function familyMastery(t,cp){
  const fs=(Array.isArray(t.familj)?t.familj:[t.familj]).filter(Boolean);
  if(!fs.length) return mastery(cp.areas,t.omr);
  return Math.min(...fs.map(f=>mastery(cp.families,f)));
}

function nivaPrior(area,L){
  const cp=ensureCourseProfile();
  if(!cp.levels) return null;
  const alla=getAreas();
  const mitt=alla.find(a=>a.key===area);
  if(!mitt) return null;
  const varden=alla
    .filter(a=>a.key!==area && String(a.kap)===String(mitt.kap))
    .map(a=>cp.levels[a.key] && cp.levels[a.key][L])
    .filter(x=>x && (x.n||0)>=4)
    .map(x=>x.s);
  if(varden.length<2) return null;
  return varden.reduce((x,y)=>x+y,0)/varden.length;
}

function levelStats(area,L){
  const cp=ensureCourseProfile();
  cp.levels ||= {};
  const nyNiva=niva=>{
    const p=nivaPrior(area,niva);
    return p===null ? {s:.5,n:0} : {s:p,n:3};
  };
  if(!cp.levels[area]){

    const m = typeof cp.areas[area]==="number" ? cp.areas[area] : null;
    const n = m===null ? 0 : Math.min(8,cp.history.filter(h=>h.area===area).length);
    cp.levels[area]={
      E: m===null ? nyNiva("E") : {s:m,n},
      C: nyNiva("C"),
      A: nyNiva("A")
    };
  }
  return cp.levels[area][L] || (cp.levels[area][L]=nyNiva(L));
}
function updateLevelStat(area,L,ok){
  if(!area) return;
  const st=levelStats(area,L);

  st.s = ok ? st.s + .16*(1-st.s) : st.s - .22*st.s;
  st.s = Math.max(.06,Math.min(.97,st.s));
  st.n = (st.n||0)+1;
}

function scopeLevel(L,area){
  const st=levelStats(area,L);
  return {s:st.s,n:st.n||0};
}

const NIVA_VIKT={E:.45,C:.35,A:.20};

function levelStatRead(area,L){
  const cp=ensureCourseProfile();
  const a=cp.levels && cp.levels[area];
  if(a && a[L]) return a[L];
  if(L==="E" && typeof cp.areas[area]==="number"){
    return {s:cp.areas[area],n:Math.min(8,cp.history.filter(h=>h.area===area).length)};
  }
  return {s:.5,n:0};
}

function levelQuality(area,L){
  const st=levelStatRead(area,L);
  return st.s*Math.min(1,(st.n||0)/5);
}
function areaLevels(area){
  return {E:levelQuality(area,"E"),C:levelQuality(area,"C"),A:levelQuality(area,"A")};
}
function scoreOf(q){ return 100*(NIVA_VIKT.E*q.E + NIVA_VIKT.C*q.C + NIVA_VIKT.A*q.A); }
function meanLevels(list){
  if(!list.length) return {E:0,C:0,A:0};
  const sum={E:0,C:0,A:0};
  list.forEach(q=>{sum.E+=q.E;sum.C+=q.C;sum.A+=q.A;});
  return {E:sum.E/list.length,C:sum.C/list.length,A:sum.A/list.length};
}
function chapterProgress(){
  const by={};
  getAreas().forEach(a=>{(by[a.kap] ||= []).push(a)});
  return Object.keys(by).sort((x,y)=>kapNr(x)-kapNr(y)).map(kap=>{
    const q=meanLevels(by[kap].map(a=>areaLevels(a.key)));
    return {kap,name:chapterName(kap),antal:by[kap].length,q,score:scoreOf(q)};
  });
}
function courseProgress(){
  const q=meanLevels(getAreas().map(a=>areaLevels(a.key)));
  return {q,score:scoreOf(q)};
}
function scoreLabel(v){
  if(v<3)  return {txt:"Inte påbörjat",cls:"s-new"};
  if(v<30) return {txt:"Påbörjat",cls:"s-low"};
  if(v<55) return {txt:"Grunderna sitter",cls:"s-mid"};
  if(v<80) return {txt:"Stabilt",cls:"s-mid"};
  return {txt:"Behärskar",cls:"s-good"};
}

const behärskar = x => Math.max(0,Math.min(1,(x.s-.55)/.25)) * Math.max(0,Math.min(1,x.n/6));
const klarar    = x => x.n<2 ? .6 : Math.max(0,Math.min(1,(x.s-.35)/.30));

const NIVA0_TROSKEL=.32;
const NIVA0_MIN_SVAR=4;
const NIVA0_TAK=.65;
function grundVikt(area){
  const e=scopeLevel("E",area);
  if((e.n||0)<NIVA0_MIN_SVAR) return 0;
  if(e.s>=NIVA0_TROSKEL) return 0;
  return Math.min(NIVA0_TAK, 1.4*(NIVA0_TROSKEL-e.s)/NIVA0_TROSKEL);
}

function levelWeights(area){
  const e=scopeLevel("E",area), c=scopeLevel("C",area), a=scopeLevel("A",area);
  const m1=behärskar(e), m2=behärskar(c), k2=klarar(c), k3=klarar(a);
  const w={
    G: grundVikt(area),

    E: 1 - .90*m1*k2,
    C: m1*(.25+.75*k2),
    A: m1*m2*(.25+.75*k3)
  };

  const v=(PASS[state.passTyp]||{}).vikt;

  if(v){ w.G*=(v.G!==undefined?v.G:v.E); w.E*=v.E; w.C*=v.C; w.A*=v.A; }
  return w;
}

const NIVA_GOLV=.10;
function levelMix(finns,area){
  const w=levelWeights(area);
  const golv=state.passTyp==="tungt" ? .04 : NIVA_GOLV;
  const order=NIVAER;
  order.forEach(L=>{ if(!finns[L]) w[L]=0; });
  const tot=order.reduce((x,L)=>x+(w[L]||0),0);
  if(!tot) return null;
  const mix={};
  order.forEach(L=>mix[L]=(w[L]||0)/tot);

  if(finns.E && mix.E<golv){
    const kvar=1-golv, ovrigt=mix.G+mix.C+mix.A;
    mix.E=golv;
    if(ovrigt>0){ ["G","C","A"].forEach(L=>mix[L]=mix[L]/ovrigt*kvar); }
  }
  return mix;
}

function chooseArea(pool){
  const cp=ensureCourseProfile();
  const areas=[...new Set(pool.map(t=>t.omr||"ovrigt"))];
  if(areas.length<2) return areas[0];
  return areas
    .map(a=>({a,k:mastery(cp.areas,a)*.5 + (a===state.lastArea?.45:0) + Math.random()}))
    .sort((x,y)=>x.k-y.k)[0].a;
}

function chooseTask(){

  while(state.felKo && state.felKo.length){
    const id=state.felKo.shift();
    const t=availableTasks().find(x=>x.id===id);
    if(t) return t;
  }
  let pool=availableTasks();
  if(state.focusOmr) pool=pool.filter(t=>state.focusOmr.includes(t.omr||"ovrigt"));
  else if(state.focusArea) pool=pool.filter(t=>t.omr===state.focusArea);
  if(state.focusFamily){

    const vill=Array.isArray(state.focusFamily)?state.focusFamily:[state.focusFamily];
    pool=pool.filter(t=>{
      const fs=Array.isArray(t.familj)?t.familj:[t.familj];
      return fs.some(f=>vill.includes(f));
    });
  }
  if(!pool.length) return null;

  const cp=ensureCourseProfile();
  const recent=new Set(state.lastIds.slice(-8));

  const area = state.focusArea || chooseArea(pool);
  if(!state.focusArea) pool=pool.filter(t=>(t.omr||"ovrigt")===area);

  const buckets={G:[],E:[],C:[],A:[]};
  pool.forEach(t=>buckets[levelOf(t)].push(t));

  const order=NIVAER;
  const mix=levelMix({G:!!buckets.G.length,E:!!buckets.E.length,
                      C:!!buckets.C.length,A:!!buckets.A.length},area);
  let level=null;
  if(mix){
    let x=Math.random();
    for(const L of order){ x-=mix[L]; if(x<=0 && buckets[L].length){ level=L; break; } }
  }

  if(!level || !buckets[level].length)
    level=["E","C","A","G"].find(L=>buckets[L].length)||"E";

  let cands=buckets[level];
  const fresh=cands.filter(t=>!recent.has(t.id));
  if(fresh.length) cands=fresh;
  const scored=cands
    .map(t=>({t,k:familyMastery(t,cp)*.6 + Math.random()*.9

      + (t.ursprungsId && state.senasteUrsprung.includes(t.ursprungsId) ? 1.5 : 0)}))
    .sort((a,b)=>a.k-b.k);
  const top=scored.slice(0,Math.max(1,Math.ceil(scored.length*.4)));
  const vald=top[Math.floor(Math.random()*top.length)].t;
  state.lastArea=vald.omr||"ovrigt";
  if(vald.ursprungsId){
    state.senasteUrsprung.push(vald.ursprungsId);
    if(state.senasteUrsprung.length>3) state.senasteUrsprung.shift();
  }
  return vald;
}

function cleanDerivedAnswer(raw){
  let x=String(raw??"").trim();
  if(!x) return null;

  x=x.replace(/<br\s*\/?>/gi," ");
  x=x.replace(/<[^>]+>/g,"");
  x=x.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
  x=x.trim();

  x=x.replace(/^svar\s*:\s*/i,"").trim();

  if(x.length>120) return null;
  return x || null;
}

function mathChunksFromHTML(html){
  const s=String(html??"");
  const out=[];

  for(const m of s.matchAll(/\\\(([\s\S]*?)\\\)/g)) out.push("\\("+m[1].trim()+"\\)");

  for(const m of s.matchAll(/\\\[([\s\S]*?)\\\]/g)) out.push("\\("+m[1].trim()+"\\)");
  return out;
}

function answerCandidateFromElement(el){
  if(!el) return null;

  const strongs=[...el.querySelectorAll("strong")];
  for(let i=strongs.length-1;i>=0;i--){
    const raw=strongs[i].innerHTML.trim();
    const plain=strongs[i].textContent.trim();
    if(!raw) continue;
    if(/^(metod|mellanled|tänk så här|svar)\s*:?\s*$/i.test(plain)) continue;
    const cleaned=cleanDerivedAnswer(raw);
    if(cleaned && (mathChunksFromHTML(raw).length || /[-+−]?\d|[a-zA-Z]/.test(cleaned))){
      return cleaned;
    }
  }

  const chunks=mathChunksFromHTML(el.innerHTML);
  if(chunks.length){
    return cleanDerivedAnswer(chunks[chunks.length-1]);
  }

  return null;
}

function derivedAnswersFromSolution(t){
  const blocked=new Set(["figur","resonemang","text"]);
  const type=String(t.svarstyp||"").toLowerCase();
  if(blocked.has(type)) return null;
  if(!t.s) return null;

  const parser=new DOMParser();
  const doc=parser.parseFromString(`<div id="kg-facit-root">${t.s}</div>`,"text/html");
  const root=doc.getElementById("kg-facit-root");
  if(!root) return null;

  const partCount=inferAnswerCount(t);

  if(partCount>1 || type==="flera_delar"){
    const answers=new Array(partCount).fill(null);
    const elements=[...root.querySelectorAll("p, .deluppgifter > div, li")];

    for(const el of elements){
      const text=(el.textContent||"").trim();
      const m=text.match(/^([a-j])\)\s*/i);
      if(!m) continue;
      const idx=m[1].toLowerCase().charCodeAt(0)-97;
      if(idx<0 || idx>=partCount) continue;

      const candidate=answerCandidateFromElement(el);
      if(candidate) answers[idx]=candidate;
    }

    if(answers.every(Boolean)) return answers;
    return null;
  }

  const elements=[...root.querySelectorAll("p, li, .svar, .answer")];

  for(let i=elements.length-1;i>=0;i--){
    const txt=(elements[i].textContent||"").trim();
    if(/\bsvar\s*:/i.test(txt)){
      const cand=answerCandidateFromElement(elements[i]);
      if(cand) return [cand];
      const chunks=mathChunksFromHTML(elements[i].innerHTML);
      if(chunks.length) return [cleanDerivedAnswer(chunks[chunks.length-1])];
    }
  }

  const candidates=[];
  for(const el of root.querySelectorAll("strong")){
    const plain=(el.textContent||"").trim();
    if(/^(metod|mellanled|tänk så här|svar)\s*:?\s*$/i.test(plain)) continue;
    const cleaned=cleanDerivedAnswer(el.innerHTML);
    if(cleaned && (mathChunksFromHTML(el.innerHTML).length || /^[-+−]?\d+(?:[,.]\d+)?(?:\s*[a-zA-Z°%]+)?$/.test(cleaned))){
      candidates.push(cleaned);
    }
  }
  if(candidates.length===1) return [candidates[0]];

  return null;
}

function autoPerDel(t,antal){
  const plan=svarsPlan(t);
  if(plan) return plan.rutor.map(r=>plan.delar[r.del].auto);
  const sr=t.självrättning;
  const svar=Array.isArray(t.rättSvar)?t.rättSvar:[t.rättSvar];
  return Array.from({length:antal},(_,i)=>{
    const facit=svar[i];
    if(facit===null||facit===undefined||facit==="") return false;
    if(Array.isArray(sr)) return !!sr[i];
    return !!sr;
  });
}

const FACIT_FALLBACK_STANDARD=true;

function expectedAnswersForTask(t){

  if(t.självrättning===false){
    return {answers:[],source:"metadata",auto:false,delAuto:[]};
  }
  if(t.rättSvar!==null && t.rättSvar!==undefined){
    const plan=svarsPlan(t);
    const answers=plan ? plan.rutor.map(r=>plan.delar[r.del].svar[r.plats])
                       : (Array.isArray(t.rättSvar)?t.rättSvar:[t.rättSvar]);
    const auto=autoPerDel(t,answers.length);
    return {
      answers,
      source:"metadata",

      auto:auto.some(Boolean),
      delAuto:auto
    };
  }

  const fallbackTillaten = t.facitFallback===true
    || (t.facitFallback!==false && FACIT_FALLBACK_STANDARD);
  const derived=fallbackTillaten ? derivedAnswersFromSolution(t) : null;
  if(derived && derived.length){
    return {answers:derived,source:"facit",auto:true,
            delAuto:derived.map(()=>true)};
  }

  return {answers:[],source:"none",auto:false,delAuto:[]};
}

function inferAnswerCount(t){
  if(t.rättSvar!==null && t.rättSvar!==undefined){
    return Array.isArray(t.rättSvar) ? Math.max(1,t.rättSvar.length) : 1;
  }
  const plain=String(t.t||"")
    .replace(/<br\s*\/?>/gi,"\n")
    .replace(/<\/p>/gi,"\n")
    .replace(/<[^>]+>/g," ");
  const matches=[...plain.matchAll(/(?:^|[\s\n])([a-j])\)\s*/gi)].map(m=>m[1].toLowerCase());
  const unique=[...new Set(matches)];
  return unique.length || 1;
}

const SVAR_ORD={en:1,ett:1,"två":2,tva:2,tre:3,fyra:4,fem:5};
const SVAR_FALT=["antalSvar","antal_svar","svarsantal","antalsvar",
                 "flerSvar","fleraSvar","flersvar","tvåSvar","tvasvar","svar"];
function taggatAntalSvar(t){
  for(const k of SVAR_FALT){
    const v=t?.[k];
    if(v===undefined||v===null||v==="") continue;
    if(typeof v==="number" && v>=1) return Math.min(6,Math.round(v));
    if(v===true) return 2;
    const x=String(v).toLowerCase().trim();
    if(SVAR_ORD[x]) return SVAR_ORD[x];
    if(/^[1-6]$/.test(x)) return +x;
  }
  return 0;
}

function subtaskLetters(t){
  const plain=String(t.t||"")
    .replace(/<br\s*\/?>/gi,"\n").replace(/<\/p>/gi,"\n").replace(/<[^>]+>/g," ");
  const m=[...plain.matchAll(/(?:^|[\s\n])([a-j])\)\s*/gi)].map(x=>x[1].toLowerCase());
  return new Set(m).size;
}

function nastlat(v){ return Array.isArray(v) && v.some(x=>Array.isArray(x)); }

function faltVarde(falt,i,antal){
  if(falt===undefined||falt===null) return Array(antal).fill(undefined);
  if(!Array.isArray(falt)) return Array(antal).fill(falt);
  const v=falt[i];
  if(Array.isArray(v)) return Array.from({length:antal},(_,j)=>v[j]);
  return Array(antal).fill(v);
}
function faltFlagga(falt,i,standard){
  if(falt===undefined||falt===null) return standard;
  if(Array.isArray(falt)) return falt[i]===undefined?standard:!!falt[i];
  return !!falt;
}

function svarsPlan(t){
  if(t.rättSvar===null||t.rättSvar===undefined) return null;
  const rot=Array.isArray(t.rättSvar)?t.rättSvar:[t.rättSvar];
  const delar=rot.map((v,i)=>{
    const svar=Array.isArray(v)?v:[v];
    const enhet=faltVarde(t.svarEnhet,i,svar.length);
    const tol=faltVarde(t.tolerans,i,svar.length);
    const format=faltVarde(t.svarFormat,i,svar.length);
    const harFacit=svar.every(x=>x!==null&&x!==undefined&&x!=="");
    return {
      svar, enhet, tol, format,
      auto: harFacit && faltFlagga(t.självrättning,i,false),
      manuell: faltFlagga(t.manuellKomplettering,i,false)
    };
  });

  const rutor=[];
  delar.forEach((d,di)=>d.svar.forEach((_,si)=>rutor.push({del:di,plats:si})));
  return {delar,rutor};
}

function stadaSvar(x){
  return String(x??"").trim()
    .replace(/^svar\s*:\s*/i,"")
    .replace(/[−–—]/g,"-")
    .replace(/\u00a0/g," ");
}

function talAv(x){
  const s=stadaSvar(x).toLowerCase().replace(/\s/g,"");
  if(/^[+-]?(∞|oo|inf|infinity)$/.test(s)) return s.startsWith("-")?-Infinity:Infinity;
  const v=taltolk(s);
  return Number.isFinite(v)?v:NaN;
}
function talLika(a,b,tol){
  if(a===Infinity||b===Infinity||a===-Infinity||b===-Infinity) return a===b;
  return naraNog(a,b,tol);
}
function naraNog(a,b,tol){
  if(!Number.isFinite(a)||!Number.isFinite(b)) return false;
  const t=(typeof tol==="number")?tol:Math.max(1e-9,Math.abs(b)*1e-4);
  return Math.abs(a-b)<=t+1e-12;
}

function listaAv(x,parTvang){
  const rå=stadaSvar(x);
  const iParentes=parTvang || /^[[({].*[\])}]$/.test(rå);
  let s=rå.replace(/^[[({]\s*|\s*[\])}]$/g,"");
  s=s.replace(/\s+(eller|och)\s+/gi,";");
  if(s.includes(";")) return s.split(";").map(d=>d.trim()).filter(Boolean);
  s=s.replace(/,/g,(m,i,str)=>{
    if(iParentes) return ";";
    const f=str[i-1], e=str[i+1];

    if(/\d/.test(f||"") && e===" ") return ";";
    return (/\d/.test(f||"")&&/\d/.test(e||"")) ? "," : ";";
  });
  return s.split(";").map(d=>d.trim()).filter(Boolean);
}

function ordListaAv(x){
  const s=stadaSvar(x);
  if(!s) return null;
  if(/^[[({].*[\])}]$/.test(s)) return null;
  const delar=s.split(/\s+(?:eller|och|samt)\s+|\s*;\s*/i)
               .map(d=>d.trim()).filter(Boolean);
  return delar.length>1 ? delar : null;
}

const SPEGLA={"<":">",">":"<","<=":">=",">=":"<="};

function olikhetsDelar(x){
  const s=stadaSvar(x).replace(/≤/g,"<=").replace(/≥/g,">=");

  if(/\s(?:eller|och|samt)\s|;/i.test(s)) return null;
  const arVar=t=>/^[a-zåäö]\w*$/i.test(t.trim());

  const d=s.match(/^(.+?)(<=|<)(.+?)(<=|<)(.+)$/);
  if(d && arVar(d[3])){
    return [{v:d[3].trim(), op:SPEGLA[d[2]], tal:d[1].trim()},
            {v:d[3].trim(), op:d[4],         tal:d[5].trim()}];
  }

  const dn=s.match(/^(.+?)(>=|>)(.+?)(>=|>)(.+)$/);
  if(dn && arVar(dn[3])){
    return [{v:dn[3].trim(), op:SPEGLA[dn[2]], tal:dn[1].trim()},
            {v:dn[3].trim(), op:dn[4],         tal:dn[5].trim()}];
  }
  const m=s.match(/^(.+?)(<=|>=|<|>)(.+)$/);
  if(!m) return null;
  const vans=m[1].trim(), op=m[2], hoger=m[3].trim();
  if(arVar(vans) && !arVar(hoger)) return [{v:vans, op, tal:hoger}];
  if(arVar(hoger) && !arVar(vans)) return [{v:hoger, op:SPEGLA[op], tal:vans}];
  return null;
}

function olikhetsJamforelse(a,f,tol){
  const la=olikhetsDelar(a), lf=olikhetsDelar(f);
  if(!la || !lf) return null;
  if(la.length!==lf.length) return false;
  const kvar=[...lf];
  return la.every(x=>{
    const i=kvar.findIndex(y=>
      x.v.toLowerCase()===y.v.toLowerCase() && x.op===y.op &&
      (naraNog(talAv(x.tal),talAv(y.tal),tol) || algebraisktLika(x.tal,y.tal)===true));
    if(i<0) return false;
    kvar.splice(i,1); return true;
  });
}

function hogerled(x){
  const s=stadaSvar(x);
  const m=s.match(/^[A-Za-zåäöÅÄÖ][\w()',.\s]*=\s*(.+)$/);
  return m?m[1].trim():s;
}

function brakAv(x){
  const s=stadaSvar(x).replace(/\s*\/\s*/,"/");
  const bl=s.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);
  if(bl){ const h=+bl[1]; return h+(h<0?-1:1)*(+bl[2]/+bl[3]); }
  const m=s.match(/^(-?\d+(?:[.,]\d+)?)\/(-?\d+(?:[.,]\d+)?)$/);
  if(m) return talAv(m[1])/talAv(m[2]);
  return talAv(s);
}

function intervallAv(x){
  let s=stadaSvar(x).replace(/\s+/g,"").replace(/∈/g,"").replace(/≤/g,"<=").replace(/≥/g,">=");
  s=s.replace(/[A-Za-zåäö]+(?=[[(])/,"");
  const par=s.match(/^([[(])(.+?)[,;](.+?)([\])])$/);
  if(par){
    return {min:talAv(par[2]),max:talAv(par[3]),
            minOpen:par[1]==="(",maxOpen:par[4]===")"};
  }
  const dubbel=s.match(/^(-?[\d.,]+|-?oo|-?∞)(<=|<)([A-Za-zåäö]+)(<=|<)([+-]?[\d.,]+|[+-]?oo|[+-]?∞)$/);
  if(dubbel){
    return {min:talAv(dubbel[1]),max:talAv(dubbel[5]),
            minOpen:dubbel[2]==="<",maxOpen:dubbel[4]==="<"};
  }
  const enkel=s.match(/^([A-Za-zåäö]+)(<=|<|>=|>)([+-]?[\d.,]+|[+-]?oo|[+-]?∞)$/);
  if(enkel){
    const v=talAv(enkel[3]);
    return enkel[2][0]==="<" ? {min:-Infinity,max:v,minOpen:true,maxOpen:enkel[2]==="<"}
                             : {min:v,max:Infinity,minOpen:enkel[2]===">",maxOpen:true};
  }
  return null;
}
function sammaIntervall(a,b,tol){
  if(!a||!b) return false;
  return talLika(a.min,b.min,tol)&&talLika(a.max,b.max,tol)
      && !!a.minOpen===!!b.minOpen && !!a.maxOpen===!!b.maxOpen;
}

function minuterAv(x){
  const s=stadaSvar(x).toLowerCase();
  let m=s.match(/^(\d+)\s*[:.]\s*(\d{1,2})$/);
  if(m) return +m[1]*60 + +m[2];
  m=s.match(/^(?:(\d+(?:[.,]\d+)?)\s*(?:h|tim|timmar|timme))?\s*(?:(\d+(?:[.,]\d+)?)\s*(?:min|minuter))?$/);
  if(m && (m[1]||m[2])) return (m[1]?talAv(m[1])*60:0)+(m[2]?talAv(m[2]):0);
  return talAv(s);
}

function sekunderAv(x){
  const s=stadaSvar(x).toLowerCase();
  let m=s.match(/^(\d+)\s*[:.]\s*(\d{1,2})$/);
  if(m) return +m[1]*60 + +m[2];
  m=s.match(/^(?:(\d+)\s*(?:min|m))?\s*(?:(\d+(?:[.,]\d+)?)\s*(?:s|sek))?$/);
  if(m && (m[1]||m[2])) return (m[1]?+m[1]*60:0)+(m[2]?talAv(m[2]):0);
  return talAv(s);
}

function skalaAv(x){
  const s=stadaSvar(x).replace(/\s/g,"");
  const m=s.match(/^(\d+(?:[.,]\d+)?)\s*[:/]\s*(\d+(?:[.,]\d+)?)$/);
  if(m) return talAv(m[1])/talAv(m[2]);
  return talAv(s);
}
function textNyckel(x){
  return stadaSvar(x).toLowerCase()
    .replace(/["'`´’]/g,"")
    .replace(/[.,;:!?]/g," ")
    .replace(/\s+/g," ").trim();
}

function algebraisktLika(a,b){
  try{
    if(typeof window.nerdamer!=="function") return null;
    return algebraicallyEquivalent(String(a),String(b))===true;
  }catch(_){ return null; }
}

const ORDNADE_FORMAT=new Set(["punkt","talpar","vektor","koordinat"]);
const MANGD_FORMAT=new Set(["lösningsmängd","losningsmangd","mängd","mangd"]);

function formatRatt(anv,facit,meta){
  const format=String(meta.format||"").toLowerCase();
  const tol=meta.tolerans;
  const a=stadaSvar(anv), f=stadaSvar(facit);
  if(!a) return false;

  switch(format){
    case "heltal": {
      const v=talAv(hogerled(a));
      return Number.isInteger(v) ? v===Math.round(talAv(f)) : naraNog(v,talAv(f),tol);
    }
    case "numeriskt": {

      return naraNog(talAv(hogerled(a)),talAv(f),tol);
    }
    case "procent": {
      const v=talAv(hogerled(a.replace(/%/g,""))), fv=talAv(String(f).replace(/%/g,""));
      return naraNog(v,fv,tol) || naraNog(v*100,fv,tol) || naraNog(v,fv*100,tol);
    }
    case "bråk": case "brak": case "kvot":
      return naraNog(brakAv(hogerled(a)),brakAv(f),tol);
    case "grader": {
      const v=talAv(hogerled(a.replace(/[°]/g,""))), fv=talAv(String(f).replace(/[°]/g,""));
      return naraNog(v,fv,tol);
    }
    case "skala":
      return naraNog(skalaAv(a),skalaAv(f),tol);
    case "tid": case "tidlängd": case "tidlangd":
      return naraNog(minuterAv(a),minuterAv(f),tol);
    case "minuter_sekunder":
      return naraNog(sekunderAv(a),sekunderAv(f),tol);
    case "vinst_forlust": case "vinst_förlust": {
      const v=talAv(hogerled(a)), fv=talAv(f);
      if(!naraNog(Math.abs(v),Math.abs(fv),tol)) return false;
      return Math.sign(v)===Math.sign(fv) || /förlust|forlust|minus/i.test(a)===(fv<0);
    }
    case "kort_text": case "text":
      return textNyckel(a)===textNyckel(f);
    case "kalkylbladsformel": {
      const norm=x=>textNyckel(x).replace(/\s/g,"").replace(/^=/,"").replace(/;/g,",");
      return norm(a)===norm(f);
    }
    case "punkt": case "talpar": case "vektor": case "koordinat": {
      const la=listaAv(a,true), lf=listaAv(f,true);
      if(la.length!==lf.length) return false;
      return la.every((v,i)=>naraNog(talAv(v),talAv(lf[i]),tol) || algebraisktLika(v,lf[i])===true);
    }
    case "lösningsmängd": case "losningsmangd": case "mängd": case "mangd": {
      const la=listaAv(a).map(hogerled), lf=listaAv(f).map(hogerled);
      if(la.length!==lf.length) return false;
      const kvar=[...lf];
      return la.every(v=>{
        const i=kvar.findIndex(k=>naraNog(talAv(v),talAv(k),tol)||algebraisktLika(v,k)===true);
        if(i<0) return false;
        kvar.splice(i,1); return true;
      });
    }
    case "intervall": case "intervall_tal": {
      const ia=intervallAv(a), ifa=intervallAv(f);
      if(ia&&ifa) return sammaIntervall(ia,ifa,tol);
      return textNyckel(a)===textNyckel(f);
    }
    case "uttryck": case "uttryck_med_villkor": {
      const rensa=x=>String(x).split(/,(?![^()]*\))|\s+där\s+|\s+om\s+/i)[0];
      const r=algebraisktLika(hogerled(rensa(a)),hogerled(rensa(f)));
      if(r!==null) return r;
      return textNyckel(a)===textNyckel(f);
    }
  }
  return null;
}

function delSvarRatt(anv,facit,enhet,tol,t,idx,format){
  const meta={format,tolerans:tol,enhet};
  if(format){
    const r=formatRatt(anv,facit,meta);
    if(r!==null) return r;
  }
  if(enhet!==undefined&&enhet!==null&&enhet!==""){
    const r=enhetsJamforelse(anv,facit,enhet,tol);
    if(r!==null) return r;
  }

  if(numerisktSvar(facit) || typeof facit==="number"){
    if(naraNog(talAv(hogerled(anv)),talAv(facit),tol)) return true;
  }
  const kopia = (typeof tol==="number") ? Object.assign({},t,{tolerans:tol}) : t;

  const enDel=(x,y)=>{
    const o=olikhetsJamforelse(x,y,tol);
    return (o!==null) ? o : oneAnswerCorrect(x,y,kopia,idx);
  };

  const lu=ordListaAv(anv), lf=ordListaAv(facit);
  if(lu && lf && lu.length===lf.length){
    const kvar=[...lf];
    const alla=lu.every(v=>{
      const i=kvar.findIndex(k=>enDel(v,k));
      if(i<0) return false;
      kvar.splice(i,1); return true;
    });
    if(alla) return true;
  }

  return enDel(anv,facit);
}

function answerLayout(t){
  const info=expectedAnswersForTask(t);
  const taggat=taggatAntalSvar(t);
  const bokstaver=subtaskLetters(t);

  const plan=svarsPlan(t);
  const struktur=String(t.svarsstruktur||"").toLowerCase();
  const etiketter=Array.isArray(t.svarEtiketter)?t.svarEtiketter:null;

  const mangdTaggat=["mängd","mangd","lösningsmängd","losningsmangd"].includes(struktur);
  const delarTaggat = mangdTaggat ? false : (
       ["ordnad","deluppgifter","delar","flera_delar"].includes(struktur)
    || ["flera_delar","flera delar","deluppgifter"].includes(String(t.svarstyp||"").toLowerCase())
    || nastlat(t.rättSvar)
    || (etiketter && etiketter.length>1)
    || (plan && plan.delar.some(d=>d.manuell)));
  const harFacit = t.rättSvar!==null && t.rättSvar!==undefined;
  const n = plan ? plan.rutor.length
          : info.auto ? Math.max(1,info.answers.length)
          : Math.max(1,taggat||bokstaver||1);
  const ordnad = mangdTaggat ? false
               : delarTaggat ? n>1
               : (!taggat && bokstaver>1 && n>1);

  const delAuto = plan
    ? plan.rutor.map(r=>plan.delar[r.del].auto)
    : Array.from({length:n},(_,i)=>info.delAuto ? !!info.delAuto[i] : !!info.auto);
  return {info,plan,n,ordnad,flersvar:n>1&&!ordnad,taggat,delarTaggat,delAuto,
          etiketter,struktur,
          blandad:delAuto.some(Boolean)&&delAuto.some(x=>!x)};
}

const SI_PREFIX={T:1e12,G:1e9,M:1e6,k:1e3,h:1e2,da:1e1,

};

const ENHET_ALIAS={h:"tim",timme:"tim",timmar:"tim",sek:"s",sekunder:"s",
  grader:"°",gr:"°",procent:"%",liter:"l",gram:"g",meter:"m",newton:"N",joule:"J",watt:"W"};

function tolkaEnhetsord(sym){
  if(!sym) return null;
  const namn=ENHETER[sym] ? sym : (ENHET_ALIAS[sym]||ENHET_ALIAS[sym.toLowerCase()]||sym);
  if(ENHETER[namn]) return {f:ENHETER[namn].f,b:ENHETER[namn].b};

  for(const p of ["da","T","G","M","k","h","d","c","m","µ","μ","u","n","p","f"]){
    if(namn.length>p.length && namn.startsWith(p)){
      const rest=namn.slice(p.length);
      const e=ENHETER[rest];
      if(e) return {f:SI_PREFIX[p]*e.f, b:e.b};
    }
  }
  return null;
}

function tolkaEnhet(str){
  if(str===null||str===undefined) return null;
  let x=String(str).trim()
    .replace(/[⋅∙·×x]/g,"*").replace(/²/g,"^2").replace(/³/g,"^3")
    .replace(/\s+/g,"");
  if(!x) return {f:1,d:{}};
  const delar=x.split("/");
  const res={f:1,d:{}};
  for(let i=0;i<delar.length;i++){
    const tecken=i===0?1:-1;
    if(!delar[i]) continue;
    for(const bit of delar[i].split("*")){
      if(!bit) continue;
      const m=bit.match(/^([^\^\d]+)(?:\^?(-?\d+))?$/);
      if(!m) return null;
      const e=tolkaEnhetsord(m[1]);
      if(!e) return null;
      const exp=(m[2]?parseInt(m[2],10):1)*tecken;
      res.f*=Math.pow(e.f,exp);
      res.d[e.b]=(res.d[e.b]||0)+exp;
    }
  }
  Object.keys(res.d).forEach(k=>{ if(!res.d[k]) delete res.d[k]; });
  return res;
}
function sammaDimension(a,b){
  const ka=Object.keys(a.d).sort(), kb=Object.keys(b.d).sort();
  if(ka.length!==kb.length) return false;
  return ka.every((k,i)=>k===kb[i] && a.d[k]===b.d[k]);
}

function taltolk(str){
  if(typeof str==="number") return str;
  let x=String(str).trim().toLowerCase()
    .replace(/^svar\s*:\s*/,"")
    .replace(/[−–—]/g,"-")
    .replace(/[⋅∙·×]/g,"*")
    .replace(/\s+/g,"");
  x=x.replace(/(\d),(\d)/g,"$1.$2");

  const UPP={"\u2070":"0","\u00b9":"1","\u00b2":"2","\u00b3":"3","\u2074":"4",
             "\u2075":"5","\u2076":"6","\u2077":"7","\u2078":"8","\u2079":"9",
             "\u207b":"-"};
  x=x.replace(/[\u2070\u00b9\u00b2\u00b3\u2074-\u2079\u207b]+/g,
    m=>"^"+[...m].map(c=>UPP[c]).join(""));

  x=x.replace(/(\*?)10\^\(?(-?\d+)\)?/g,(m,stjarna,exp,off,str)=>{
    const fore=str[off-1];

    return (stjarna || (fore && /[\d.]/.test(fore))) ? "e"+exp : "1e"+exp;
  });
  const m=x.match(/^[-+]?\d*\.?\d+(?:e[-+]?\d+)?/);
  if(!m) return NaN;
  const v=Number(m[0]);
  return Number.isFinite(v)?v:NaN;
}

function delaTalEnhet(str){
  const tal=taltolk(str);
  if(!Number.isFinite(tal)) return {tal:NaN,enhet:""};

  const x=String(str).replace(/^\s*[Ss]var\s*:\s*/,"").replace(/[−–—]/g,"-").trim();
  const m=x.match(/^[-+]?[\d\s.,]+(?:\s*(?:[⋅∙·×*]\s*10\s*\^?\s*\(?-?\d+\)?|[eE][-+]?\d+))?/);
  const rest=m ? x.slice(m[0].length).trim() : "";
  return {tal,enhet:rest.replace(/^[·*]\s*/,"").trim()};
}

function enhetsJamforelse(anv,facit,enhet,tol){
  const f=delaTalEnhet(facit);
  const fTal=Number.isFinite(f.tal)?f.tal:taltolk(facit);
  if(!Number.isFinite(fTal)) return null;
  const a=delaTalEnhet(anv);
  if(!Number.isFinite(a.tal)) return null;

  const facitEnhet=tolkaEnhet(enhet||f.enhet||"");
  const anvEnhet=a.enhet?tolkaEnhet(a.enhet):null;
  if(!facitEnhet) return null;
  if(a.enhet && !anvEnhet) return false;
  if(anvEnhet && !sammaDimension(facitEnhet,anvEnhet)) return false;

  const fBas=fTal*facitEnhet.f;
  const aBas=a.tal*(anvEnhet?anvEnhet.f:facitEnhet.f);
  const tolBas=(typeof tol==="number"?tol:Math.max(1e-12,Math.abs(fTal)*1e-4))*facitEnhet.f;

  if(Math.abs(aBas-fBas)<=tolBas+1e-12) return true;

  const ärProcent=facitEnhet.d["%"]===1;
  if(ärProcent && !a.enhet){
    if(Math.abs(a.tal*100-fTal)<=(typeof tol==="number"?tol:Math.abs(fTal)*1e-4)) return true;
  }
  return false;
}

function numerisktSvar(facit){
  if(facit===null||facit===undefined) return false;
  const x=String(facit).trim().replace(",",".");
  return /^\d+(\.\d+)?$/.test(x);
}

function latexToPlain(s){
  let x=String(s??"");

  x=x.replace(/<br\s*\/?>/gi," ");
  x=x.replace(/<[^>]+>/g," ");

  x=x.replace(/\\\(|\\\)|\\\[|\\\]|\$\$/g,"");

  for(let i=0;i<4;i++){
    x=x.replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g,"(($1)/($2))");
    x=x.replace(/\\dfrac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g,"(($1)/($2))");
    x=x.replace(/\\sqrt\s*\{([^{}]+)\}/g,"sqrt($1)");
  }
  x=x.replace(/\\left|\\right/g,"");

  for(let i=0;i<4;i++){
    x=x.replace(/\^\s*\{([^{}]*)\}/g,"^($1)");
    x=x.replace(/_\s*\{([^{}]*)\}/g,"_$1");
  }
  x=x.replace(/\\cdot|\\times/g,"*");
  x=x.replace(/\\pi/g,"pi");
  x=x.replace(/\\,/g,"");
  x=x.replace(/\\text\s*\{([^{}]*)\}/g," $1 ");

  x=x.replace(/[−–—]/g,"-");
  x=x.replace(/[×·⋅]/g,"*");
  x=x.replace(/÷/g,"/");
  x=x.replace(/π/g,"pi");
  x=x.replace(/\u00a0/g," ");

  x=x.replace(/²/g,"^2").replace(/³/g,"^3").replace(/⁴/g,"^4")
     .replace(/⁵/g,"^5").replace(/⁶/g,"^6").replace(/⁷/g,"^7")
     .replace(/⁸/g,"^8").replace(/⁹/g,"^9");

  return x.trim();
}

function normalizeDecimalComma(x){

  let prev;
  do{
    prev=x;
    x=x.replace(/(\d),(\d)/g,"$1.$2");
  }while(x!==prev);
  return x;
}

function normalizeMathInput(s){
  let x=latexToPlain(s).toLowerCase();

  x=x.replace(/^svar\s*:\s*/,"");
  x=normalizeDecimalComma(x);

  x=x.replace(/(\d|\))\s*:\s*(\d|\()/g,"$1/$2");

  x=x.replace(/√\s*\(([^()]+)\)/g,"sqrt($1)");
  x=x.replace(/√\s*([a-z]\w*|\d+(?:\.\d+)?)/g,"sqrt($1)");

  x=x.replace(/(\d+(?:\.\d+)?)\s*%/g,"($1/100)");

  x=x.replace(/\b(arcsin|arccos|arctan|sinh|cosh|tanh|asin|acos|atan|sqrt|log10|log|sin|cos|tan|ln|lg|exp)\s+([a-z0-9.]+(?:\^[a-z0-9.]+)?)/g,"$1($2)");

  x=x.replace(/\b(arcsin|arccos|arctan|sinh|cosh|tanh|asin|acos|atan|sqrt|log10|log|sin|cos|tan|ln|lg|exp)([a-z])(?![a-z0-9])/g,"$1($2)");

  x=x.replace(/(\d)\s+(?=\d{3}(?:\D|$))/g,"$1");
  x=x.replace(/\s+/g,"");

  x=x.replace(/[.;]$/,"");

  return x;
}

function normalizeAnswer(s){
  return normalizeMathInput(s);
}

const MATTEFUNKTIONER=["arcsin","arccos","arctan","sinh","cosh","tanh",
  "asin","acos","atan","sqrt","log10","log","sin","cos","tan","ln","lg",
  "exp","abs","pi"];

function explicitMultiplikation(x){
  const token=new RegExp("("+MATTEFUNKTIONER.join("|")+")|(\\d+(?:\\.\\d+)?)|([a-z])|([\\s\\S])","g");
  let ut="", forra=null, m;
  while((m=token.exec(x))){
    const typ = m[1]?"fn" : m[2]?"tal" : m[3]?"bok" : "ovr";
    const txt = m[0];
    if(forra){
      const p=forra.typ, pt=forra.txt;
      const stjarna =
           (p==="tal" && (typ==="bok"||typ==="fn"||txt==="("))
        || (p==="bok" && (typ==="bok"||typ==="fn"))

        || (p==="bok" && txt==="(" && !"fgh".includes(pt))
        || (pt===")"  && (typ==="bok"||typ==="tal"||typ==="fn"||txt==="("));
      if(stjarna) ut+="*";
    }
    ut+=txt; forra={typ,txt};
  }
  return ut;
}

function tillNerdamer(x){
  return explicitMultiplikation(x)
    .replace(/(?<![a-z0-9_])(log10|lg|log|ln)\s*\(/g,
      (m,f)=> (f==="ln"?"log":"log10")+"(");
}

function firstNumber(s){
  const x=normalizeMathInput(s);
  const m=x.match(/[-+]?(?:\d+(?:\.\d+)?|\.\d+)/);
  return m?Number(m[0]):NaN;
}

function isPureNumberExpression(s){

  const x=explicitMultiplikation(normalizeMathInput(s));
  if(!x) return false;
  const scrub=x
    .replace(/\b(?:arcsin|arccos|arctan|sinh|cosh|tanh|sqrt|sin|cos|tan|asin|acos|atan|log10|lg|ln|log|abs|exp|pi|e)\b/g,"")
    .replace(/[0-9.+\-*/^(),]/g,"");
  return scrub==="";
}

function nerd(expr){
  if(typeof window.nerdamer!=="function") return null;
  try{return window.nerdamer(expr);}catch(_){return null;}
}

function symbolicZero(expr){
  if(typeof window.nerdamer!=="function") return false;
  try{
    const r=window.nerdamer(`simplify(${expr})`).toString();
    return r==="0";
  }catch(_){
    try{
      const r=window.nerdamer(expr).expand().toString();
      return r==="0";
    }catch(__){return false;}
  }
}

function numericValue(expr){
  if(typeof window.nerdamer!=="function") return NaN;
  try{
    const v=window.nerdamer(expr).evaluate().text("decimals");
    const n=Number(v);
    return Number.isFinite(n)?n:NaN;
  }catch(_){return NaN;}
}

function splitEquation(expr){
  const parts=String(expr).split("=");
  return parts.length===2 && parts[0] && parts[1] ? parts : null;
}

function equationResidual(expr){
  const p=splitEquation(expr);
  return p ? `((${p[0]})-(${p[1]}))` : null;
}

function expressionVariables(expr){
  const e=nerd(expr);
  if(!e) return [];
  try{
    const vars=e.variables();
    return Array.isArray(vars)?vars.map(String):[];
  }catch(_){return [];}
}

function equationsEquivalent(user,expected){
  const ur=equationResidual(user);
  const er=equationResidual(expected);
  if(!ur || !er) return false;

  if(symbolicZero(`(${ur})-(${er})`)) return true;
  if(symbolicZero(`(${ur})+(${er})`)) return true;

  try{
    const ratio=window.nerdamer(`simplify((${ur})/(${er}))`);
    const vars=ratio.variables();
    if(Array.isArray(vars) && vars.length===0){
      const n=Number(ratio.evaluate().text("decimals"));
      if(Number.isFinite(n) && Math.abs(n)>1e-12) return true;
    }
  }catch(_){}

  return false;
}

function algebraicallyEquivalent(user,expected){
  const u=tillNerdamer(normalizeMathInput(user));
  const e=tillNerdamer(normalizeMathInput(expected));
  if(!u || !e) return false;
  if(u===e) return true;
  if(typeof window.nerdamer!=="function") return false;

  const ue=splitEquation(u);
  const ee=splitEquation(e);

  if(ue && ee) return equationsEquivalent(u,e);

  if(ue && !ee && isPureNumberExpression(e)){
    const left=ue[0],right=ue[1];
    if(/^[a-z]\w*$/.test(left) && algebraicallyEquivalent(right,e)) return true;
    if(/^[a-z]\w*$/.test(right) && algebraicallyEquivalent(left,e)) return true;
  }
  if(!ue && ee && isPureNumberExpression(u)){
    const left=ee[0],right=ee[1];
    if(/^[a-z]\w*$/.test(left) && algebraicallyEquivalent(u,right)) return true;
    if(/^[a-z]\w*$/.test(right) && algebraicallyEquivalent(u,left)) return true;
  }

  if(ue || ee) return false;

  if(/[<>≤≥]/.test(u) || /[<>≤≥]/.test(e)) return false;

  if(symbolicZero(`((${u})-(${e}))`)) return true;

  try{
    const diff=window.nerdamer(`(${u})-(${e})`).expand().toString();
    if(symbolicZero(`(${diff})`)) return true;
  }catch(_){}

  return false;
}

function oneAnswerCorrect(user,expected,t,delIndex){
  const u=normalizeAnswer(user), e=normalizeAnswer(expected);
  if(!u) return false;

  if(u===e) return true;

  if(explicitMultiplikation(u)===explicitMultiplikation(e)) return true;

  if(algebraicallyEquivalent(user,expected)) return true;

  const algebraisktU=!isPureNumberExpression(user);
  const algebraisktE=!isPureNumberExpression(expected);
  if(algebraisktU && algebraisktE) return false;

  let un=NaN,en=NaN;
  if(isPureNumberExpression(user)) un=numericValue(tillNerdamer(normalizeMathInput(user)));
  if(isPureNumberExpression(expected)) en=numericValue(tillNerdamer(normalizeMathInput(expected)));

  if(!Number.isFinite(un)) un=firstNumber(user);
  if(!Number.isFinite(en)) en=firstNumber(expected);

  if(Number.isFinite(un)&&Number.isFinite(en)){

    const rå=Array.isArray(t.tolerans) ? t.tolerans[delIndex||0] : t.tolerans;
    const tol=typeof rå==="number"
      ? rå
      : Math.max(1e-9,Math.abs(en)*1e-4);
    if(Math.abs(un-en)<=tol) return true;
  }

  return false;
}

function xpRuta(){
  return document.getElementById("xpmeter") || document.querySelector(".topbar .pill");
}

let xpTween=null;
function xpSkrivTal(into,need){
  const num=document.getElementById("xpnum");
  if(!num) return;

  const kort=!!num.closest(".pill");
  num.innerHTML=`${into}<span class="sep">/</span>${need}${kort?"":" XP"}`;
}
function xpRaknaUpp(fran,till,need,ms){
  cancelAnimationFrame(xpTween);
  const t0=performance.now();
  const steg=nu=>{
    const k=Math.min(1,(nu-t0)/ms);
    const e=1-Math.pow(1-k,3);
    xpSkrivTal(Math.round(fran+(till-fran)*e),need);
    if(k<1) xpTween=requestAnimationFrame(steg);
  };
  xpTween=requestAnimationFrame(steg);
}

function xpStall(xp,animeraTal,fran){
  const fill=document.getElementById("xpfill"), lvl=document.getElementById("xplvl"),
        meter=xpRuta();
  if(!fill) return;
  const L=levelFromXP(xp), bas=totalXpForLevel(L), topp=totalXpForLevel(L+1);
  const into=xp-bas, need=Math.max(1,topp-bas);
  fill.style.width=Math.round(100*into/need)+"%";
  if(lvl) lvl.textContent=L;

  const r=rankFor(L);
  const rk=document.getElementById("xprank"), rd=document.getElementById("xprankdot");
  if(rk) rk.textContent=r.name;
  if(rd) rd.innerHTML=r.sym;
  if(meter){
    meter.title=`Nivå ${L} · ${esc(r.name)} · ${into} av ${need} XP till nivå ${L+1}`;
    meter.setAttribute("aria-label",`Nivå ${L}, ${into} av ${need} XP till nästa nivå`);
  }
  if(animeraTal) xpRaknaUpp(fran,into,need,900); else xpSkrivTal(into,need);
}

function animeraXp(fore,efter){
  const meter=xpRuta(), fill=document.getElementById("xpfill"),
        lvl=document.getElementById("xplvl"), gain=document.getElementById("xpgain");
  if(!meter||!fill) return;
  const vunnet=efter-fore;

  if(gain){
    gain.textContent=vunnet>0?"+"+vunnet+" XP":"0 XP";
    gain.style.color=vunnet>0?"var(--gold)":"var(--ink3)";
    gain.classList.remove("fly"); void gain.offsetWidth; gain.classList.add("fly");
  }
  if(vunnet>0){
    meter.classList.remove("tick"); void meter.offsetWidth; meter.classList.add("tick");
    setTimeout(()=>meter.classList.remove("tick"),1100);
  }
  if(vunnet<=0){ xpStall(efter,false); return; }

  const Lfore=levelFromXP(fore), Lefter=levelFromXP(efter);
  const intoFore=fore-totalXpForLevel(Lfore);
  const needFore=Math.max(1,totalXpForLevel(Lfore+1)-totalXpForLevel(Lfore));

  if(Lefter>Lfore){
    fill.style.width="100%";
    xpRaknaUpp(intoFore,needFore,needFore,600);
    setTimeout(()=>{
      const f=document.getElementById("xpfill");
      if(!f) return;
      f.style.transition="none"; f.style.width="0%";
      if(lvl){ lvl.classList.remove("upp"); void lvl.offsetWidth; lvl.classList.add("upp"); }
      requestAnimationFrame(()=>{
        f.style.transition="";
        requestAnimationFrame(()=>xpStall(efter,true,0));
      });
    },720);
  }else{
    requestAnimationFrame(()=>xpStall(efter,true,intoFore));
  }
}

      <div class="corr" id="corr-${i}" hidden></div>
      <div class="delfacit" id="delfacit-${i}" hidden></div>
    </div>`).join("");

  const antalDelar = plan ? plan.delar.length : inputCount;
  const partLine = stepwise
    ? `<div class="partline" id="partline">
        ${Array.from({length:inputCount},(_,i)=>`<i class="${i===0?'now':''}"></i>`).join("")}
        <span id="partlabel">Deluppgift a av ${antalDelar}</span>
      </div>`
    : layout.flersvar
      ? `<div class="partline"><span>${inputCount===2?"Två svar":inputCount+" svar"} · ordningen spelar ingen roll</span></div>`
      : "";

  const dots=Array.from({length:state.sessionTarget},(_,i)=>
    `<i class="${i<state.sessionDone?'done':(i===state.sessionDone?'now':'')}"></i>`).join("");

  app.innerHTML=`
    <div class="tshell view">
      <div class="ttop">
        <button class="crumb" onclick="backToDashboard()"><span aria-hidden="true">←</span> Avsluta</button>
        <div class="spacer"></div>
        ${xpMeterHtml()}
        <span class="tag" style="background:transparent;border-color:var(--hair)">${esc(sessionLabel())}</span>
        <div class="dots" title="${state.sessionDone} av ${state.sessionTarget}">${dots}</div>
        <button class="iconbtn" onclick="toggleTheme()" title="Byt färgläge">${themeIcon()}</button>
      </div>
      <article class="task">
        <div class="tmeta">${meta}<span class="tid">#${esc(t.ursprungsId||t.id)}${t.deluppgift?" · del "+esc(t.deluppgift):""}</span></div>
        <div class="tbody">${t.t||""}</div>
        <div class="azone" id="answer-zone">
          <div class="notice"><b aria-hidden="true">✎</b><span>Skriv ner fullständiga lösningar med papper och penna innan du skriver in svaren här.</span></div>
          <h3>Ditt svar</h3>
          ${partLine}
          <div class="ainputs">${fieldHtml}</div>
          ${isLongAnswer?"":symbolrad(t)}
          <div id="ledtrad-holder">${state.hintVisible?ledtradRuta(t):""}</div>
          <div class="aacts">
            ${canAuto
              ? `<button class="btn primary" onclick="checkAnswer()">Kontrollera</button>
                 ${t.ledtrad&&!state.hintVisible?`<button class="btn" id="ledtradknapp" onclick="visaLedtrad()">Visa ledtråd</button>`:""}
                 <button class="btn" onclick="showSolution()">Visa lösning</button>`
              : `${t.ledtrad&&!state.hintVisible?`<button class="btn" id="ledtradknapp" onclick="visaLedtrad()">Visa ledtråd</button>`:""}
                 <button class="btn primary" onclick="showSolution()">Visa facit och jämför</button>`}
          </div>
          ${canAuto
            ? (layout.blandad
                ? `<div class="hint">Delar utan entydigt svar bedömer du själv mot facit.</div>`
                : "")
            : `<div class="hint">Den här uppgiften bedömer du själv efter att du sett facit.</div>`}
          <div id="answer-result" role="status" aria-live="polite"></div>
          <div id="solution-holder"></div>
        </div>
      </article>
    </div>`;
  afterRender();
  setTimeout(()=>document.getElementById("ans-0")?.focus(),60);
}

function checkAnswer(){
  if(state.answered) return;
  const t=state.currentTask;
  const info=expectedAnswersForTask(t);
  const expected=info.answers;
  if(!info.auto || !expected.length){
    toast("Den här uppgiften behöver självbedömas.");
    return;
  }
  const layout=answerLayout(t);

  if(layout.flersvar){
    const svar=expected.map((_,i)=>document.getElementById("ans-"+i)?.value||"");
    if(svar.some(x=>!x.trim())){ toast("Fyll i alla svar först."); return; }
    const kvar=expected.map((v,i)=>({v,i}));
    const res=svar.map(anv=>{
      const träff=kvar.findIndex(k=>delSvarRatt(anv,k.v,
        Array.isArray(t.svarEnhet)?t.svarEnhet[k.i]:t.svarEnhet,
        Array.isArray(t.tolerans)?t.tolerans[k.i]:t.tolerans,
        t,k.i,
        Array.isArray(t.svarFormat)?t.svarFormat[k.i]:t.svarFormat));
      if(träff<0) return false;
      kvar.splice(träff,1);
      return true;
    });
    res.forEach((ok,i)=>markPart(i,ok,ok?null:kvar.map(k=>k.v).join(" eller ")));
    state.partResults=res;
    finishAttempt(res);
    return;
  }

  const plan=layout.plan;
  if(plan){
    const del=plan.rutor[state.partIndex]?.del;
    if(del===undefined) return;
    const rutor=plan.rutor.map((r,idx)=>({...r,idx})).filter(r=>r.del===del);
    const d=plan.delar[del];

    if(!d.auto){ visaDelfacit(rutor[0].idx,del); return; }

    const varden=rutor.map(r=>document.getElementById("ans-"+r.idx)?.value||"");
    if(varden.some(x=>!x.trim())){ toast("Fyll i alla svar för deluppgiften."); return; }

    const kvar=d.svar.map((v,j)=>({v,j}));
    const utfall=varden.map(anv=>{
      const träff=kvar.findIndex(k=>delSvarRatt(anv,k.v,d.enhet[k.j],d.tol[k.j],t,k.j,d.format[k.j]));
      if(träff<0) return false;
      kvar.splice(träff,1);
      return true;
    });
    utfall.forEach((ok,j)=>markPart(rutor[j].idx,ok,ok?null:facitText(d,kvar)));
    rutor.forEach((r,j)=>{ state.partResults[r.idx]=utfall[j]; });

    if(d.manuell && utfall.every(Boolean)){
      visaDelfacit(rutor[rutor.length-1].idx,del,true);
      return;
    }
    gaVidare(rutor[rutor.length-1].idx+1,layout.n);
    return;
  }

  const i=state.partIndex;
  const el=document.getElementById("ans-"+i);
  const svar=el ? el.value : "";
  if(!svar.trim()){ toast("Skriv ett svar först."); return; }

  if(!layout.delAuto[i]){
    visaDelfacit(i);
    return;
  }

  const enkelFormat=Array.isArray(t.svarFormat)?t.svarFormat[i]:t.svarFormat;
  const enkelEnhet=Array.isArray(t.svarEnhet)?t.svarEnhet[i]:t.svarEnhet;
  const enkelTol=Array.isArray(t.tolerans)?t.tolerans[i]:t.tolerans;
  const ok=delSvarRatt(svar,expected[i],enkelEnhet,enkelTol,t,i,enkelFormat);
  registreraDel(i,ok,expected[i]);
}

function facitText(d,kvar){
  return (kvar.length?kvar:d.svar.map((v,j)=>({v,j})))
    .map(k=>String(k.v)+(d.enhet[k.j]?" "+d.enhet[k.j]:""))
    .join(" eller ");
}
function gaVidare(nasta,total){
  state.partIndex=nasta;
  if(state.partIndex>=total) finishAttempt(state.partResults.slice(0,total));
  else openPart(state.partIndex,total);
}

function registreraDel(i,ok,facit){
  state.partResults[i]=ok;
  markPart(i,ok,facit);
  gaVidare(i+1,answerLayout(state.currentTask).n);
}

function visaDelfacit(i,delIndex,komplettering){
  const t=state.currentTask;
  const rad=document.getElementById("part-"+i);
  if(!rad) return;
  const inp=document.getElementById("ans-"+i);
  if(inp) inp.readOnly=true;
  const ruta=document.getElementById("delfacit-"+i);
  if(ruta){
    const nyckel = delIndex!==undefined ? delIndex : i;
    ruta.hidden=false;
    ruta.innerHTML=`<div class="lbl">${komplettering?"Jämför med facit":"Facit för den här delen"}</div>
      <div class="delfacit-txt">${delfacitText(t,nyckel)}</div>
      ${komplettering?`<div class="hint" style="margin-top:8px">Uträkningen stämmer. Stämmer även din motivering?</div>`:""}
      <div class="aacts">
        <button class="btn soft sm" onclick="bedomDel(${i},true,${delIndex??-1})">${komplettering?"Ja, den stämmer":"Jag hade rätt"}</button>
        <button class="btn sm" onclick="bedomDel(${i},false,${delIndex??-1})">${komplettering?"Nej, inte riktigt":"Jag behöver träna mer"}</button>
      </div>`;
    renderMath(ruta);
  }
}

function delfacitText(t,i){
  const d=t.delfacit||t.facitDelar||t.delsvar;
  if(Array.isArray(d)&&d[i]) return d[i];
  return t.s||"Facit saknas.";
}
function bedomDel(i,ok,delIndex){
  const ruta=document.getElementById("delfacit-"+i);
  if(ruta){ ruta.hidden=true; ruta.innerHTML=""; }
  const layout=answerLayout(state.currentTask);
  const plan=layout.plan;
  if(plan && delIndex!==undefined && delIndex>=0){
    const rutor=plan.rutor.map((r,idx)=>({...r,idx})).filter(r=>r.del===delIndex);
    rutor.forEach(r=>{

      const redan=state.partResults[r.idx];
      const nytt = redan===undefined ? ok : (redan && ok);
      state.partResults[r.idx]=nytt;
      if(!ok) markPart(r.idx,nytt,null);
    });
    gaVidare(rutor[rutor.length-1].idx+1,layout.n);
    return;
  }
  registreraDel(i,ok,null);
}

function markPart(i,ok,facit){
  const row=document.getElementById("part-"+i);
  if(!row) return;
  row.classList.add(ok?"ok":"no");
  const mark=row.querySelector(".mark");
  if(mark) mark.textContent=ok?"✓":"✕";
  const inp=document.getElementById("ans-"+i);
  if(inp) inp.readOnly=true;
  const dot=document.querySelectorAll("#partline i")[i];
  if(dot) dot.className=ok?"done":"miss";
  if(!ok && facit){
    const c=document.getElementById("corr-"+i);
    if(c){ c.hidden=false; c.innerHTML=`Rätt svar: <b>${facit}</b>`; renderMath(c); }
  }
}

function openPart(i,total){
  const plan=answerLayout(state.currentTask).plan;

  const syskon = plan
    ? plan.rutor.map((r,idx)=>({...r,idx})).filter(r=>r.del===plan.rutor[i]?.del)
    : [{idx:i}];
  syskon.forEach((r,n)=>{
    const row=document.getElementById("part-"+r.idx);
    if(row) row.classList.remove("upcoming");
    const inp=document.getElementById("ans-"+r.idx);
    if(inp){ inp.disabled=false; if(n===0) setTimeout(()=>inp.focus(),40); }
  });
  const line=document.getElementById("partline");
  if(line){
    [...line.querySelectorAll("i")].forEach((d,n)=>{
      d.className = n<i ? (state.partResults[n]?"done":"miss") : (n===i?"now":"");
    });
    const lbl=document.getElementById("partlabel");
    const delNr = plan ? plan.rutor[i]?.del ?? 0 : i;
    const antal = plan ? plan.delar.length : total;
    if(lbl) lbl.textContent=`Deluppgift ${String.fromCharCode(97+delNr)} av ${antal}`;
  }
}

function giveUp(){
  if(state.answered) return;
  const info=expectedAnswersForTask(state.currentTask);
  const n=Math.max(1,info.answers.length);
  finishAttempt(Array.from({length:n},(_,i)=>state.partResults[i]===true));
}

const XP_NIVA={G:4, E:8, C:20, A:50};

const SERIETRAPPA=[[12,1.6],[8,1.4],[5,1.25],[3,1.15]];
function seriefaktor(run){
  for(const [gräns,f] of SERIETRAPPA) if(run>=gräns) return f;
  return 1;
}

function seriebonus(run){ return Math.round((seriefaktor(run)-1)*100); }

/* Efter återkommande fel kan eleven få en enda relevant väg vidare. Förslaget
   visas aldrig efter ett enstaka misstag och samma område har 48 timmars paus. */
function hittaGenomgangForslag(t,cp){
  if(!t?.omr || !cp?.history?.length) return null;
  const nu=Date.now(), tvaVeckor=14*24*60*60*1000;
  const senaste=cp.history.filter(h=>h.area===t.omr && nu-(h.at||0)<tvaVeckor).slice(-4);
  if(senaste.length<2 || senaste.filter(h=>!h.ok).length<2) return null;

  const kort=getCards().find(k=>k.omr.includes(t.omr) && harKunskapKort(k));
  if(!kort) return null;
  const steg=kunskapSteg(kort.kap,kort.key);
  if(!steg.length) return null;

  const familjer=(Array.isArray(t.familj)?t.familj:[t.familj]).filter(Boolean);
  const relevant=steg.find(s=>s.traningsfamilj && familjer.includes(s.traningsfamilj));
  const mal=relevant || steg.find(s=>!ggLast(s.familj)) || steg[0];
  if(!mal) return null;

  const nyckel=[state.course,state.track||"",t.omr].join("|");
  const senastVisad=profile.ggForslagVisade?.[nyckel]||0;
  if(nu-senastVisad<48*60*60*1000) return null;
  profile.ggForslagVisade ||= {};
  profile.ggForslagVisade[nyckel]=nu;
  return {kap:String(kort.kap),kortNyckel:kort.key,familj:mal.familj,
    omrade:kort.name,rubrik:mal.genomgang?.rubrik||"genomgången"};
}
function oppnaForeslagenGenomgang(){
  const f=state.ggForslag;
  if(!f) return;
  state.ggForslag=null;
  oppnaKunskap(f.kap,f.kortNyckel,f.familj);
}
function avvisaGenomgangForslag(){
  state.ggForslag=null;
  document.getElementById("gg-forslag")?.remove();
}

// Poängreglerna måste hållas förenliga med serverns gränser vid ändringar.
function xpFor(niva,correct,run){
  if(!correct) return 2;
  const n=String(niva||"E").toUpperCase();
  return Math.round((XP_NIVA[n]||XP_NIVA.E)*seriefaktor(run));
}

function finishAttempt(resultat){
  if(state.answered) return;
  const t=state.currentTask;
  const delar=Array.isArray(resultat)?resultat.map(Boolean):[!!resultat];
  const ratt=delar.filter(Boolean).length;
  const andel=ratt/delar.length;
  const correct=ratt===delar.length;
  state.answered=true; state.sessionDone++;
  if(!correct){ (state.sessionFel ||= []).push(t); }
  sparaPagaendePass();

  const xpBefore=totalXp();
  const levelBefore=levelFromXP(xpBefore);
  const goal=profile.goal||8;
  const beforeToday=todayCount();

  touchDay();
  profile.attempts++;
  if(correct){
    profile.correct++;
    profile.run=(profile.run||0)+1;
    profile.bestRun=Math.max(profile.bestRun||0,profile.run);
    if(String(t.niva||"").toUpperCase()==="A") profile.aCorrect=(profile.aCorrect||0)+1;
  }else{
    profile.run=0;
  }
  const bas=xpFor(t.niva,true,profile.run);
  let xp = correct ? bas : Math.max(2,Math.round(bas*andel));

  if(state.hintUsed) xp=Math.max(1,Math.round(xp*.5));
  if(state.noXp) xp=0;
  profile.xp+=xp;
  profile.today=(profile.today||0)+1;
  state.sessionXp+=xp;
  if(correct) state.sessionCorrect++;

  const cp=ensureCourseProfile();
  const fs=Array.isArray(t.familj)?t.familj:[t.familj].filter(Boolean);
  const niva=levelOf(t);
  delar.forEach(d=>{
    const v=state.noXp?false:d;
    updateMastery(cp.areas,t.omr,v);
    updateLevelStat(t.omr,niva,v);
    fs.forEach(f=>updateMastery(cp.families,f,v));
  });

  if(correct && !state.noXp){
    let forra=null;
    for(let i=cp.history.length-1;i>=0;i--) if(cp.history[i].id===t.id){ forra=cp.history[i]; break; }
    if(forra && !forra.ok) profile.reparerade=(profile.reparerade||0)+1;
  }
  cp.history.push({id:t.id,ok:correct,at:Date.now(),area:t.omr,family:t.familj,
    hint:!!state.hintUsed,
    ...(t.ursprungsId?{ursprungsId:t.ursprungsId,deluppgift:t.deluppgift}:{})});
  cp.history=cp.history.slice(-300);
  const genomgangForslag=correct ? null : hittaGenomgangForslag(t,cp);
  state.ggForslag=genomgangForslag;

  if(correct && !state.noXp && !state.solutionShown) profile.utanFacit=(profile.utanFacit||0)+1;
  if(new Date().getHours()<7) profile.morgon=1;
  if(state.data){
    const bkap=Math.max(0,...chapterProgress().map(c=>c.score));
    profile.bestKapitel=Math.max(profile.bestKapitel||0,Math.round(bkap));
    profile.bestKurs=Math.max(profile.bestKurs||0,Math.round(courseProgress().score));
    const b3=Math.max(0,...Object.values(cp.levels||{})
      .map(a=>a&&a.A ? a.A.s*Math.min(1,(a.A.n||0)/5) : 0));
    profile.bestNiva3=Math.max(profile.bestNiva3||0,Math.round(b3*100));
  }

  const HYLLNING=1500;
  const nyaMedaljer=checkBadges(HYLLNING);
  state.sessionXp+=MEDALJ_XP*nyaMedaljer.length;
  const xpAfter=totalXp();
  const levelAfter=levelFromXP(xpAfter);
  const rankBefore=rankFor(levelBefore), rankAfter=rankFor(levelAfter);
  saveProfile();

  animeraXp(xpBefore,xpAfter);
  setTimeout(()=>{
    if(levelAfter>levelBefore){
      if(rankAfter.name!==rankBefore.name) cheer(rankAfter.sym,"Ny rang",rankAfter.name,"Du har klättrat ett steg på stegen.");
      else cheer(medaljIkon("nivaupp"),"Ny nivå","Nivå "+levelAfter,"Din träning ger resultat.");
    }
    if(beforeToday<goal && todayCount()>=goal) cheer(medaljIkon("dagsmal"),"Dagens mål","Klart för idag",`${goal} uppgifter avklarade.`);
  },HYLLNING);
  saveProfile();

  const last=state.sessionDone>=state.sessionTarget;
  const bonus = seriebonus(profile.run);
  const runTxt = correct && profile.run>=3
    ? `<span class="tag" style="margin-left:6px">${profile.run} i rad${bonus?` · +${bonus}\u00a0%`:""}</span>`
    : "";
  const flera=delar.length>1;
  const rubrik = correct ? (flera?"Alla rätt!":"Rätt!")
               : ratt ? `${ratt} av ${delar.length} rätt`
               : "Inte riktigt.";
  const under = state.noXp
      ? "Lösningen var redan visad, så den här uppgiften ger ingen XP."
      : correct ? "Bra jobbat — nästa uppgift anpassas efter det här."
      : ratt ? "Titta på lösningen för de delar som inte stämde."
      : "Titta på lösningen och hitta steget som gick fel.";
  const box=document.getElementById("answer-result");
  if(box){
    box.innerHTML=`
      <div class="result ${correct?'good':'bad'}">
        <div class="txt">
          <strong>${rubrik}${runTxt}</strong>
          <small>${under}</small>
        </div>
        <span class="xpchip"${state.noXp?' style="background:var(--surface3);color:var(--ink3);box-shadow:none"':""}>${state.noXp?"0 XP":"+"+xp+" XP"}</span>
        ${(state.hintUsed && !state.noXp)?`<span class="xplapp">halverat · ledtråd</span>`:""}
      </div>
      <div class="aacts">
        ${!correct?`<button class="btn" onclick="showSolution()">Visa lösning</button>`:""}
        <button class="btn primary" id="nextbtn" onclick="${last?'renderSessionDone()':'nextTask()'}">
          ${last?"Se passrapport":"Nästa uppgift"} <span aria-hidden="true">→</span>
        </button>
      </div>
      ${genomgangForslag?`<aside class="gg-forslag" id="gg-forslag">
        ${KUNSKAP_IKON}
        <div class="gg-forslag-text"><strong>Vill du reda ut det här först?</strong>
          <small>Du har haft flera missar inom ${esc(genomgangForslag.omrade)}. Läs den korta genomgången ”${esc(genomgangForslag.rubrik)}”.</small></div>
        <div class="gg-forslag-knappar">
          <button class="btn sm primary" onclick="oppnaForeslagenGenomgang()">Läs genomgången</button>
          <button class="btn sm quiet" onclick="avvisaGenomgangForslag()">Inte nu</button>
        </div>
      </aside>`:""}`;
    setTimeout(()=>document.getElementById("nextbtn")?.focus(),80);
  }
}

function ledtradRuta(t){

  return `<div class="ledtrad"><b>Ledtråd</b><div class="ltxt">${t.ledtrad||""}</div>
    <span class="lkost">Halv XP för den här uppgiften</span></div>`;
}
function visaLedtrad(){
  const t=state.currentTask;
  if(!t || !t.ledtrad || state.hintVisible) return;
  state.hintUsed=true; state.hintVisible=true;
  const h=document.getElementById("ledtrad-holder");
  if(h){ h.innerHTML=ledtradRuta(t); renderMath(h); }
  document.getElementById("ledtradknapp")?.remove();
}

function showSolution(){
  const t=state.currentTask;
  const auto=expectedAnswersForTask(t).auto;
  state.solutionShown=true;

  if(auto && !state.answered) state.noXp=true;
  const holder=document.getElementById("solution-holder");
  if(holder){
    holder.innerHTML=`<div class="sol"><div class="lbl">Lösning</div><div style="margin-top:10px">${t.s||"Facit saknas."}</div></div>
      ${state.answered?"":auto
        ? `<div class="hint">Lösningen är visad, så uppgiften ger ingen XP. Du kan ändå skriva klart svaren.</div>
           <div class="aacts"><button class="btn" onclick="giveUp()">Gå vidare</button></div>`
        : `<div class="aacts">
             <button class="btn soft" onclick="selfGrade(true)">Jag hade rätt</button>
             <button class="btn" onclick="selfGrade(false)">Jag behöver träna mer</button>
           </div>`}`;
    renderMath(holder);
  }
}
function selfGrade(ok){ if(!state.answered) finishAttempt(ok); }

function passRapport(acc){
  const typ=state.passTyp;
  if(typ==="tungt")
    return acc>=70 ? "Bra jobbat. Du klarade de tunga uppgifterna, så nivån följer med upp."
         : acc>=40 ? "Så ska ett tungt pass kännas. Det är där nivån flyttas."
                   : "Det var tungt idag. Nästa pass blir lättare.";
  if(typ==="teknik")
    return acc>=70 ? "Det börjar sitta. Vi tar samma område igen om några dagar."
                   : "Det här området behöver mer tid. Vi kör det igen.";
  if(typ==="fel")
    return acc>=70 ? "Det satt den här gången. Det är precis så man lär sig av ett fel."
                   : "Några sitter fortfarande inte. De ligger kvar och kommer tillbaka i nästa felpass.";
  if(typ==="repetition")
    return acc>=70 ? "Det satt kvar. Bra."
                   : "Bra att vi tog det nu och inte veckan före provet.";
  if(typ==="mangd")
    return acc>=70 ? "Bra flyt hela vägen."
                   : "Många uppgifter avklarade. Vi håller nivån ett tag till.";
  return acc>=80 ? "Starkt genomfört."
       : acc>=50 ? "Bra jobbat. Blandningen av rätt och fel är där du lär dig mest."
                 : "Tuffa uppgifter idag. Nästa pass blir bättre anpassat.";
}

function felLista(){
  const fel=state.sessionFel||[];
  if(!fel.length) return "";
  return `
    <div class="felruta">
      <div class="sec"><h2>Det här blev fel</h2></div>
      ${fel.map((t,i)=>`
        <div class="felrad">
          <div class="felrubrik">

            <span class="feltext">${esc(kortText(t))}</span>
            <button class="btn sm" onclick="vaxlaFelLosning(${i},this)">Visa lösning</button>
          </div>

function kortText(t){
  const d=document.createElement("div");
  d.innerHTML=String(t.t||"");
  const txt=(d.textContent||"").replace(/\s+/g," ").trim();
  return txt.length>70 ? txt.slice(0,70).replace(/\s\S*$/,"")+"…" : txt;
}
function vaxlaFelLosning(i,btn){
  const t=(state.sessionFel||[])[i];
  const box=document.getElementById("fellosning-"+i);
  if(!t||!box) return;
  if(!box.hidden){ box.hidden=true; btn.textContent="Visa lösning"; return; }
  if(!box.dataset.fylld){
    box.innerHTML=t.s || "<p>Den här uppgiften saknar lösning i banken.</p>";
    box.dataset.fylld="1";
    renderMath(box);
  }
  box.hidden=false; btn.textContent="Dölj";
}

function renderSessionDone(record){

    state.rekord=false; state.gamlaRekordet=gammalt;
    if(tot>=4 && (!gammalt || pct>gammalt.pct ||
       (pct===gammalt.pct && state.sessionCorrect>gammalt.ratt))){

          <small>${b.pct} % · ${b.ratt} av ${b.total} rätt${nytt&&state.gamlaRekordet?` · slog ${state.gamlaRekordet.pct} %`:""}</small>
        </span>

    <div class="card pad" style="text-align:left">

        </div>

function oppnaTopplista(sortering,record){
  document.getElementById("kontomeny")?.remove();
  state.toppSort=TOPP_FLIKAR[sortering]?sortering
    :(TOPP_FLIKAR[state.toppSort]?state.toppSort:"dag");

  state.view="topplista";
  ritaTopplista(true);

}

function ritaTopplista(laddar,svar){
  const s=TOPP_FLIKAR[state.toppSort]?state.toppSort:"dag";
  const rader=svar?.rader, placering=svar?.plats;
  const fuskare=Array.isArray(svar?.fuskare)?svar.fuskare:[];
  const jagFuskare=!!(profile.namn && fuskare.some(f=>f.namn===profile.namn));
  const flik=id=>`<button class="fliknapp${s===id?" pa":""}" role="tab"
    aria-selected="${s===id?"true":"false"}"
    onclick="oppnaTopplista('${id}',false)">${TOPP_FLIKAR[id].txt}</button>`;

  const egen = !session
    ? `<div class="toppnotis">
         <b>Du är inte med och tävlar.</b>
         <span>Logga in så kan du ställa dig på listan och se hur du ligger till mot andra. Din sparade kontoprofil hämtas när du loggar in.</span>
         <button class="btn sm primary" onclick="loggaIn()">Logga in</button>
       </div>`
    : !profile.namn
    ? `<div class="toppnotis">
         <b>Du är inte med än.</b>
         <span>Välj ett användarnamn så kommer du med på listan. Du kan dölja dig igen när du vill.</span>
         <button class="btn sm" onclick="oppnaNamnruta()">Välj användarnamn</button>
       </div>`
    : !profile.visaTopplista
      ? `<div class="toppnotis">
           <b>Du är dold.</b>
           <span>Du tränar som vanligt, men ingen annan ser dig här. Du kan slå på och av det när du vill.</span>
           <button class="btn sm primary" onclick="snabbVisa(true)">Visa mig på listan</button>
         </div>`
      : jagFuskare
      ? `<div class="toppnotis fusk">
           <b>Du tävlar inte just nu.</b>
           <span>Din profil har markerats för misstänkt fusk, så din XP räknas inte på topplistan. Tror du att det är fel? Prata med din lärare.</span>
         </div>`
      : `<div class="toppnotis pa">
           <b>Du syns som ${esc(profile.namn)}${placering?` · plats ${placering}`:""}.</b>
           <span>Andra ser ditt namn, din nivå, dina medaljer och hur mycket du tränat.</span>
           <button class="btn sm" onclick="snabbVisa(false)">Dölj mig</button>
         </div>`;

  let lista;
  if(laddar){
    lista=`<div class="toppladdar">Hämtar listan…</div>`;
  }else if(svar?.saknas){
    lista=`<div class="empty">Den här listan är inte aktiverad än. Prova fliken All time high så länge.</div>`;
  }else if(!rader){
    lista=`<div class="empty">Kunde inte hämta topplistan just nu. Försök igen om en stund.</div>`;
  }else if(!rader.length && !fuskare.length){
    lista = s==="alla"
      ? `<div class="empty">Ingen har ställt sig på listan än.${session?" Du kan bli först.":" Logga in så kan du bli först."}</div>`
      : `<div class="empty">Ingen har samlat XP ${{dag:"idag",vecka:"den här veckan",manad:"den här månaden"}[s]} än.${session?" Du kan bli först.":""}</div>`;
  }else{
    lista=`<ol class="topplista">${rader.map((rad,i)=>{
      const jag = profile.namn && rad.namn===profile.namn;
      const medaljer=Array.isArray(rad.medaljer)?rad.medaljer:[];
      const visade=medaljer.slice(0,5).map(id=>{
        const b=BADGES.find(x=>x.id===id);
        return b?`<span class="tmedalj" title="${esc(b.name)}">${medaljIkon(b.icon)}</span>`:"";
      }).join("");
      const xp=Number(rad.xp)||0, uppg=Number(rad.uppgifter)||0;
      const tot=Number(rad.totalxp);
      const niva=Number.isFinite(tot)?levelFromXP(tot):(rad.niva||1);
      const rang=Number.isFinite(tot)?rankFor(niva).name:rad.rang;
      return `<li class="topprad${jag?" jag":""}${i<3?" pall":""}">
        <span class="plats">${i+1}</span>
        <span class="tnamn">
          <b>${esc(rad.namn||"")}</b>
          <small>Nivå ${niva}${rang?" · "+esc(rang):""}</small>

        <span class="tmedaljer">${visade}${medaljer.length>5?`<span class="tfler">+${medaljer.length-5}</span>`:""}</span>
        <span class="tuppg" title="Uppgifter">${uppg}<small>uppg.</small></span>
        <span class="tvarde" title="XP">${xp}<small>XP</small></span>
      </li>`;
    }).join("")}${fuskare.map(rad=>{
      const jag = profile.namn && rad.namn===profile.namn;
      return `<li class="topprad fuskrad${jag?" jag":""}">
        <span class="plats" aria-hidden="true">–</span>
        <span class="tnamn">
          <b>${esc(rad.namn||"")}</b>

        </span>
      </li>`;
    }).join("")}</ol>
    <p class="toppfot">${TOPP_FLIKAR[s].fot}, sorterat på XP. Varje medalj ger ${MEDALJ_XP} XP. Bara de som själva valt att synas står med.</p>`;
  }

  app.innerHTML=topbar()+`<main class="shell view" style="padding-bottom:60px">
    <div class="chead">
      <div class="t">
        <button class="crumb" onclick="tillbakaFranTopplista()"><span aria-hidden="true">←</span> Tillbaka</button>
        <h1>Topplistan</h1>
        <p>Alla som tränar på Kunskapsgymmet och valt att synas.</p>
      </div>
    </div>
    ${egen}
    <div class="flikar" role="tablist">${Object.keys(TOPP_FLIKAR).map(flik).join("")}</div>
    <div class="card pad" style="margin-top:14px">${lista}</div>
  </main>`;
  afterRender();
}

function goHome(){
  if(navBackTo("home")) return;
  state.course=null;state.data=null;state.track=null;state.currentTask=null;
  state.openChapters=null;applyAccent();
  navRecord("home");
  renderHome();
}

function render(){
  if(state.view==="gate") renderGate();
  else if(state.view==="dashboard"&&state.course) renderDashboard();
  else if(state.view==="training"&&state.currentTask) renderTraining();
  else if(state.view==="progress"&&state.course) showProgress();
  else if(state.view==="picker"&&state.course) showAreaPicker();
  else if(state.view==="summary"&&state.course) renderSessionDone();
  else if(state.view==="topplista") oppnaTopplista(state.toppSort,false);
  else renderHome();
}

  const nyInloggning=MOLN_PA() && fangaInloggning();

  {
    const adr=tolkaAdress(location.hash);
    onskadKurs=adr.kurs;

  }

  if(inloggningsTyp==="recovery"){ gateLage="nytt"; renderGate(); navRecord("home",true); return; }
  if(visaGate()){ renderGate(); navRecord("home",true); return; }
  if(MOLN_PA() && session) await synkaProfil();

  const avbrutet=lasPagaendePass();
  if(avbrutet && !onskadKurs && COURSES[avbrutet.kurs]){
    renderHome(); navRecord("home",true);

  if(MOLN_PA() && session){

});
