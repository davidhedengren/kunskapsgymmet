<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f5f9">
<script>
/* Sätter färgläget före första målningen så att sidan aldrig blinkar. */
(function(){
  var saved=null;
  try{ saved=localStorage.getItem("kunskapsgymmet-theme"); }catch(_){}
  var sys=window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  var t=(saved==="dark"||saved==="light") ? saved : (sys?"dark":"light");
  document.documentElement.dataset.theme=t;
  var m=document.querySelector('meta[name="theme-color"]');
  if(m) m.content = t==="dark" ? "#0a1119" : "#f2f5f9";
})();
</script>
<title>Kunskapsgymmet</title>

<!-- Favicon. Filerna ligger i repots root. -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<!-- KaTeX: snygg matematisk rendering av \( ... \) och \[ ... \] -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>

<!-- Symbolisk algebra för ekvivalenskontroll av elevsvar -->
<script defer src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/all.min.js"></script>

<style>
/* ==========================================================
   DESIGNSYSTEM
   ========================================================== */
:root{
  color-scheme:light;
  --bg:#f1f5f9;
  --glow1:rgba(88,158,224,.20);
  --glow2:rgba(150,190,235,.16);
  --surface:#ffffff;
  --surface2:#f7fafc;
  --surface3:#eef4fa;
  --glass:rgba(247,250,253,.78);
  --ink:#0d1a24;
  --ink2:#4b5f6e;
  --ink3:#8698a5;
  --hair:rgba(13,45,72,.09);
  --hair2:rgba(13,45,72,.17);
  --acc:#1b7fd0;
  --acc2:#0f5f9f;
  --accInk:#0f5f9f;
  --accSoft:rgba(27,127,208,.10);
  --gold:#96701c;
  --gold2:#d3a544;
  --goldSoft:rgba(190,145,50,.13);
  --good:#0f7a59;
  --goodSoft:rgba(15,122,89,.10);
  --warn:#9a6a12;
  --warnSoft:rgba(180,125,25,.12);
  --bad:#b04a4d;
  --badSoft:rgba(176,74,77,.10);
  --e1:0 1px 2px rgba(11,33,51,.05),0 10px 26px -12px rgba(11,33,51,.20);
  --e2:0 2px 5px rgba(11,33,51,.06),0 30px 70px -24px rgba(11,33,51,.30);
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
/* Bokens färg styr ljusa läget: a = rött, b = grönt, c = blått,
   Fysik 1 = turkos, Fysik 2 = blålila. */
html[data-theme="light"][data-accent="a"]{
  --bg:#faf3f2;--glow1:rgba(203,108,98,.20);--glow2:rgba(219,152,142,.15);
  --surface2:#fdf8f7;--surface3:#f7ebe9;--glass:rgba(253,247,246,.78);
  --hair:rgba(74,26,24,.10);--hair2:rgba(74,26,24,.18);
  --acc:#bf453f;--acc2:#98322d;--accInk:#98322d;--accSoft:rgba(191,69,63,.10);
}
html[data-theme="light"][data-accent="b"]{
  --bg:#f1f8f3;--glow1:rgba(74,160,116,.18);--glow2:rgba(130,190,155,.15);
  --surface2:#f7fcf9;--surface3:#e9f5ee;--glass:rgba(247,252,249,.78);
  --hair:rgba(14,60,40,.10);--hair2:rgba(14,60,40,.18);
  --acc:#2c8b61;--acc2:#1d6b49;--accInk:#1d6b49;--accSoft:rgba(44,139,97,.10);
}
html[data-theme="light"][data-accent="fy1"]{
  --bg:#eff8f8;--glow1:rgba(50,160,155,.18);--glow2:rgba(120,195,190,.15);
  --surface2:#f6fcfc;--surface3:#e6f4f4;--glass:rgba(246,252,252,.78);
  --hair:rgba(10,58,58,.10);--hair2:rgba(10,58,58,.18);
  --acc:#159490;--acc2:#0b716e;--accInk:#0b716e;--accSoft:rgba(21,148,144,.10);
}
html[data-theme="light"][data-accent="fy2"]{
  --bg:#f4f4fc;--glow1:rgba(110,110,205,.18);--glow2:rgba(155,155,220,.15);
  --surface2:#f9f9fd;--surface3:#ececf8;--glass:rgba(249,249,253,.78);
  --hair:rgba(34,32,80,.10);--hair2:rgba(34,32,80,.18);
  --acc:#5b5fc7;--acc2:#43469f;--accInk:#43469f;--accSoft:rgba(91,95,199,.11);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a1119;
  --glow1:rgba(52,120,180,.20);
  --glow2:rgba(40,90,140,.16);
  --surface:#131e28;
  --surface2:#17242f;
  --surface3:#1d2e3b;
  --glass:rgba(15,24,33,.76);
  --ink:#e8f1f8;
  --ink2:#a9bdca;
  --ink3:#7c93a2;
  --hair:rgba(160,205,235,.13);
  --hair2:rgba(160,205,235,.24);
  --acc:#4aa3e8;
  --acc2:#7cc2f5;
  --accInk:#9ad3fa;
  --accSoft:rgba(74,163,232,.14);
  --gold:#e2bb72;
  --gold2:#f0d296;
  --goldSoft:rgba(226,187,114,.14);
  --good:#5cc39d;
  --goodSoft:rgba(92,195,157,.13);
  --warn:#dcb268;
  --warnSoft:rgba(220,178,104,.13);
  --bad:#e0898c;
  --badSoft:rgba(224,137,140,.13);
  --e1:0 1px 2px rgba(0,0,0,.30),0 12px 30px -14px rgba(0,0,0,.55);
  --e2:0 2px 6px rgba(0,0,0,.35),0 34px 80px -28px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--ui);
  background:var(--bg);-webkit-font-smoothing:antialiased;
  letter-spacing:-.011em;
}
body:before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 640px at 8% -14%,var(--glow1),transparent 62%),
    radial-gradient(900px 560px at 102% 4%,var(--glow2),transparent 60%);
}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
[hidden]{display:none!important}
::selection{background:var(--accSoft)}
.shell{width:min(1160px,calc(100% - 40px));margin:0 auto}
.stack{display:grid}

/* ---------- rörelse ---------- */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.92)}60%{transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:200% 0}}
.view{animation:rise .5s var(--ease) both}
.stagger>*{animation:rise .55s var(--ease) both}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ---------- toppfält ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  background:var(--glass);border-bottom:1px solid transparent;transition:border-color .3s ease;
}
.topbar.scrolled{border-bottom-color:var(--hair)}
.topbar .inner{height:66px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:16.5px;letter-spacing:-.03em;color:var(--ink)}
.brandmark{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(160deg,var(--acc),var(--acc2));
  box-shadow:0 4px 14px -5px rgba(11,33,51,.55),inset 0 1px 0 rgba(255,255,255,.35);
  font-size:15px;font-weight:700;
}
.spacer{flex:1}

/* ---------- knappar ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--hair);border-radius:13px;background:var(--surface);
  padding:10px 16px;font-weight:600;font-size:14.5px;color:var(--ink);
  transition:transform .2s var(--ease),background .2s ease,border-color .2s ease,box-shadow .2s ease,color .2s ease;
  box-shadow:0 1px 2px rgba(11,33,51,.04);
}
.btn:hover{border-color:var(--hair2);background:var(--surface2)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.btn.primary{
  background:linear-gradient(180deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;
  box-shadow:0 8px 20px -9px rgba(11,33,51,.55),inset 0 1px 0 rgba(255,255,255,.28);
}
.btn.primary:hover{filter:brightness(1.05)}
.btn.soft{background:var(--accSoft);border-color:transparent;color:var(--accInk)}
.btn.soft:hover{background:var(--accSoft);filter:brightness(.97)}
.btn.gold{background:var(--goldSoft);border-color:transparent;color:var(--gold)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.quiet:hover{background:var(--surface3);color:var(--ink)}
.btn.wide{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.iconbtn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:15px;
  border:1px solid var(--hair);background:var(--surface);color:var(--ink2);
  transition:.2s var(--ease);
}
.iconbtn:hover{background:var(--surface3);color:var(--ink)}
.iconbtn:active{transform:scale(.94)}

.pill{
  display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border-radius:99px;
  border:1px solid var(--hair);background:var(--surface);font-size:12.5px;font-weight:600;
  transition:.2s var(--ease);
}
.pill:hover{border-color:var(--hair2)}
.pill .rankdot{
  width:20px;height:20px;border-radius:7px;display:grid;place-items:center;font-size:9px;font-weight:700;
  color:#3b2c07;background:linear-gradient(160deg,#f0d296,#c79a3c);font-family:var(--mono);
}
.flame{color:var(--gold);font-weight:700}

/* ---------- typografi ---------- */
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
}
.eyebrow:before{content:"";width:18px;height:1.5px;background:var(--acc);border-radius:9px;opacity:.75}
h1,h2,h3{letter-spacing:-.04em;margin:0}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 14px}
.sec h2{font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:22px;box-shadow:var(--e1)}
.pad{padding:22px}

/* ---------- hem ---------- */
.hero{padding:56px 4px 34px;max-width:760px}
.hero h1{font-size:clamp(34px,5.4vw,58px);line-height:1.02;letter-spacing:-.05em;margin:18px 0 0}
.hero h1 em{font-style:normal;color:var(--ink3)}
.hero p{margin:16px 0 0;color:var(--ink2);font-family:var(--read);font-size:16.5px;line-height:1.55;max-width:520px;letter-spacing:0}
.course-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-bottom:60px}
.course-card{
  position:relative;overflow:hidden;text-align:left;padding:20px;min-height:150px;
  border:1px solid var(--hair);border-radius:22px;background:var(--surface);box-shadow:var(--e1);
  display:flex;flex-direction:column;gap:14px;
  transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s ease;
}
.course-card:before{
  content:"";position:absolute;inset:0;opacity:0;transition:opacity .35s ease;
  background:radial-gradient(420px 190px at 12% -30%,var(--tint),transparent 70%);
}
.course-card:hover{transform:translateY(-3px);box-shadow:var(--e2);border-color:var(--hair2)}
.course-card:hover:before{opacity:.9}
.course-card:active{transform:translateY(-1px) scale(.995)}
.course-card>*{position:relative}
.mono-tile{
  align-self:flex-start;height:48px;min-width:48px;padding:0 16px;border-radius:16px;
  display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;color:#fff;
  font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.01em;
  box-shadow:0 8px 18px -9px var(--tintStrong),inset 0 1px 0 rgba(255,255,255,.32);
}
.course-card h3{font-size:18.5px;line-height:1.15;letter-spacing:-.035em}
.course-card .sub{margin-top:5px;font-size:12.5px;color:var(--ink3);font-weight:500}
.course-card .go{
  margin-top:auto;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink3);
  transition:color .25s ease,gap .25s var(--ease);
}
.course-card:hover .go{color:var(--accInk);gap:10px}
.course-card.loading{pointer-events:none}
.course-card.loading .go:after{content:"";width:13px;height:13px;border-radius:50%;border:2px solid var(--hair2);border-top-color:var(--acc);animation:spin .7s linear infinite}

/* ---------- kurshuvud ---------- */
.chead{padding:26px 2px 22px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px}
.chead .t{flex:1;min-width:250px}
.chead h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.05em;margin:10px 0 0}
.chead p{margin:8px 0 0;color:var(--ink3);font-size:14.5px}
.crumb{display:inline-flex;align-items:center;gap:7px;color:var(--ink3);font-size:13px;font-weight:500;padding:6px 0;transition:color .2s}
.crumb:hover{color:var(--accInk)}
.tracks{display:flex;gap:6px;flex-wrap:wrap}
.track{
  padding:8px 14px;border-radius:11px;border:1px solid var(--hair);background:var(--surface);
  font-size:13px;font-weight:600;font-family:var(--mono);color:var(--ink2);transition:.2s var(--ease);
}
.track:hover{border-color:var(--hair2)}
.track.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:20px;align-items:start;padding-bottom:24px}
.side{position:sticky;top:82px;display:grid;gap:12px}
.chapter{margin-bottom:8px}
.chapter.open{margin-bottom:24px}
.chapter-head{
  width:100%;display:flex;align-items:center;gap:11px;padding:11px 4px;text-align:left;color:var(--ink3);
  border-radius:12px;transition:color .2s ease,background .2s ease;
}
.chapter-head:hover{color:var(--ink);background:var(--toneHover,transparent)}
.chapter-head .chev{
  flex:none;width:15px;height:15px;color:var(--ink3);
  transition:transform .32s var(--ease),color .2s ease;
}
.chapter-head[aria-expanded="true"] .chev{transform:rotate(90deg);color:var(--acc)}
.chapter-head:hover .chev{color:var(--acc)}
.chapter-head .name{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;
  transition:color .2s ease;
}
.chapter-head[aria-expanded="true"] .name{color:var(--ink2)}
.chapter-head .rule{flex:1;height:1px;background:var(--hair)}
.chapter-head .n{font-family:var(--mono);font-size:10px;opacity:.75;min-width:14px;text-align:right}
.kdots{display:flex;gap:4px;transition:opacity .3s ease}
.chapter.open .kdots{opacity:0}
.kdots i{width:6px;height:6px;border-radius:50%;background:var(--d);box-shadow:0 0 0 2px var(--bg)}
.chapter-body{padding:4px 0 2px}
.chapter-label{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  margin:0 0 11px 4px;display:flex;align-items:center;gap:10px;font-weight:600;
}
.chapter-label:after{content:"";flex:1;height:1px;background:var(--hair)}
.area-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.area{
  --tone:#7d93a2;--toneWash:rgba(125,147,162,.10);--toneEdge:rgba(125,147,162,.26);
  --toneDisc:rgba(125,147,162,.12);--toneGlow:rgba(11,33,51,.34);
  position:relative;overflow:hidden;text-align:left;padding:16px 18px;border-radius:20px;
  border:1px solid var(--toneEdge);
  background:
    linear-gradient(158deg,var(--toneWash) 0%,transparent 62%),
    linear-gradient(168deg,var(--surface) 0%,var(--surface2) 100%);
  box-shadow:
    0 1px 1.5px rgba(11,33,51,.06),
    0 12px 24px -16px var(--toneGlow),
    inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .22s ease;
  display:flex;align-items:center;gap:15px;min-height:88px;
}
.area:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;transition:opacity .35s ease;
  background:radial-gradient(210px 150px at 112% -25%,var(--toneWash),transparent 74%);
}
.area:hover{
  transform:translateY(-3px);
  box-shadow:
    0 2px 3px rgba(11,33,51,.07),
    0 26px 38px -20px var(--toneGlow),
    inset 0 1px 0 rgba(255,255,255,.95);
}
.area:hover:before{opacity:1}
.area:active{transform:translateY(-1px) scale(.99)}
.area.t-good{--tone:var(--good);--toneWash:rgba(15,122,89,.13);--toneEdge:rgba(15,122,89,.28);
  --toneDisc:rgba(15,122,89,.13);--toneGlow:rgba(15,122,89,.55)}
.area.t-mid{--tone:var(--acc);--toneWash:var(--accSoft);--toneEdge:rgba(27,127,208,.30);
  --toneDisc:var(--accSoft);--toneGlow:rgba(27,127,208,.55)}
.area.t-low{--tone:var(--warn);--toneWash:rgba(176,124,25,.15);--toneEdge:rgba(176,124,25,.32);
  --toneDisc:rgba(176,124,25,.15);--toneGlow:rgba(150,105,20,.55)}
html[data-theme="dark"] .area{
  --toneEdge:var(--hair2);
  background:
    linear-gradient(158deg,var(--toneWash) 0%,transparent 60%),
    linear-gradient(168deg,var(--surface2) 0%,var(--surface) 100%);
  box-shadow:0 1px 1px rgba(0,0,0,.28),0 14px 28px -18px #000,inset 0 1px 0 rgba(255,255,255,.06);
}
html[data-theme="dark"] .area.t-good{--toneWash:rgba(92,195,157,.15);--toneEdge:rgba(92,195,157,.28)}
html[data-theme="dark"] .area.t-mid{--toneWash:rgba(74,163,232,.16);--toneEdge:rgba(74,163,232,.30)}
html[data-theme="dark"] .area.t-low{--toneWash:rgba(220,178,104,.15);--toneEdge:rgba(220,178,104,.28)}
html[data-theme="dark"] .area:hover{box-shadow:0 2px 4px rgba(0,0,0,.32),0 28px 44px -22px #000,inset 0 1px 0 rgba(255,255,255,.08)}
.area-ring{position:relative;width:46px;height:46px;flex:none;display:grid;place-items:center}
.area-ring:before{
  content:"";position:absolute;inset:0;border-radius:50%;background:var(--toneDisc);
  box-shadow:inset 0 1px 2px rgba(11,33,51,.10),inset 0 -1px 0 rgba(255,255,255,.5);
}
.area-ring .ring{position:relative}
.area-ring .pip{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--tone);opacity:.4}
.area.t-new .ring circle:first-child{stroke-dasharray:0.1 6;stroke-linecap:round;stroke-width:3.4}
.area-txt{min-width:0;display:flex;flex-direction:column;gap:4px}
.area strong{font-size:14.5px;font-weight:600;line-height:1.25;letter-spacing:-.02em}
.area .state{font-size:11.5px;font-weight:600;letter-spacing:.005em;color:var(--tone)}
.area.stack{flex-direction:column;align-items:stretch;gap:11px;min-height:96px}
.area.stack .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.meter{height:5px;border-radius:99px;background:var(--hair);overflow:hidden;flex:1;max-width:80px;
  box-shadow:inset 0 1px 2px rgba(11,33,51,.10)}
.meter i{display:block;height:100%;border-radius:99px;width:0;transition:width 1.1s var(--ease);
  background:linear-gradient(90deg,var(--tone),var(--tone));
  box-shadow:0 0 8px -2px var(--tone);}
.meter.m-new{background:repeating-linear-gradient(90deg,var(--hair) 0 4px,transparent 4px 8px);box-shadow:none}

/* ---------- rang / gamification ---------- */

.badgestrip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

  position:relative;aspect-ratio:1;border-radius:15px;display:grid;place-items:center;font-size:17px;

}

}

.verktygsikoner{display:inline-flex;align-items:center;gap:5px;flex:none}

}

/* Räknaren med snedstreck tonas neutralt så att den inte förväxlas med

  flex:1;min-width:0;border:1px solid var(--hair2);background:var(--surface);border-radius:13px;

.result strong{display:block;font-size:15px}

.xpchip{
  font-family:var(--mono);font-size:12px;font-weight:600;padding:6px 11px;border-radius:99px;

}
.sol{
  margin-top:12px;padding:20px;border:1px solid var(--hair);border-radius:18px;background:var(--surface);
  font-family:var(--read);font-size:16px;line-height:1.62;letter-spacing:0;animation:rise .35s var(--ease) both;
}

/* ---------- passrapport ---------- */
.summary{width:min(620px,calc(100% - 32px));margin:0 auto;padding:40px 0 60px;text-align:center}
.summary .ringwrap{width:132px;height:132px;margin:0 auto}
.summary .ringwrap .num{font-size:32px}
.summary h1{font-size:30px;margin-top:22px;letter-spacing:-.045em}

/* ---------- toast / hyllning ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:11px 16px;border-radius:13px;background:var(--ink);color:var(--bg);box-shadow:var(--e2);
  transition:.25s var(--ease);z-index:60;font-size:13.5px;font-weight:500;
}

  position:fixed;left:50%;top:80px;transform:translate(-50%,-14px) scale(.94);opacity:0;pointer-events:none;
  z-index:70;display:flex;align-items:center;gap:14px;padding:14px 20px 14px 14px;border-radius:20px;
  background:var(--surface);border:1px solid var(--hair);box-shadow:var(--e2);transition:.4s var(--ease);
}

@media(max-width:960px){
  .dash{grid-template-columns:1fr}

}

  .shell{width:calc(100% - 26px)}
  .course-grid{grid-template-columns:1fr}
  .side{grid-template-columns:1fr}

  .hero{padding:34px 2px 26px}
  .tbody{font-size:17px;padding:22px 18px}

}

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="cheer" class="cheer"></div>

<script>
/* ==========================================================
   KUNSKAPSGYMMET
   All UI, CSS och träningslogik ligger i denna index.html.
   Struktur- och uppgiftsfilerna ligger separat i rooten.
   ========================================================== */

const COURSES = {
  fy1:{
    name:"Fysik nivå 1", code:"Fy1", subject:"Fysik",
    files:["struktur.js","uppgifter.js"],
    globals:{bank:"BANK",kap:"KAPNAMN",omr:"OMR"},
    tracks:[], tint:"#159490"
  },
  fy2:{
    name:"Fysik nivå 2", code:"Fy2", subject:"Fysik",
    files:["struktur2.js","uppgifter2.js"],
    globals:{bank:"BANK2",kap:"KAPNAMN2",omr:"OMR2"},
    tracks:[], tint:"#5b5fc7"
  },
  ma1:{
    name:"Matematik nivå 1", code:"Ma1", subject:"Matematik",
    files:["strukturma1.js","uppgifterma1.js"],
    globals:{bank:"BANKMA1",kap:"KAPNAMNMA1",omr:"OMRMA1"},
    tracks:["1a","1b","1c"], defaultTrack:"1c", tint:"#3f92db",
    // Stryks helt ur Kunskapsgymmet. Matchas mot kapitlets namn,
    // områdets namn eller områdets nyckel.
    utanOmraden:["digitala verktyg, problemlösning och modellering"]
  },
  ma2:{
    name:"Matematik nivå 2", code:"Ma2", subject:"Matematik",
    files:["strukturma2.js","uppgifterma2.js"],
    globals:{bank:"BANKMA2",kap:"KAPNAMNMA2",omr:"OMRMA2"},
    tracks:["2a","2b","2c"], defaultTrack:"2c", tint:"#2f7fc9"
  },
  mato1:{
    name:"Matematik – fortsättning nivå 1", code:"Ma forts 1", subject:"Matematik",
    files:["strukturmato1.js","uppgiftermato1.js"],
    globals:{bank:"BANKMATO1",kap:"KAPNAMNMATO1",omr:"OMRMATO1"},
    tracks:["1b","1c"], defaultTrack:"1c", tint:"#4f9ad0"
  },
  mato2:{
    name:"Matematik – fortsättning nivå 2", code:"Ma forts 2", subject:"Matematik",
    files:["strukturmato2.js","uppgiftermato2.js"],
    globals:{bank:"BANKMATO2",kap:"KAPNAMNMATO2",omr:"OMRMATO2"},
    tracks:["2c"], defaultTrack:"2c", tint:"#4288bd"
  },
  matf1:{
    name:"Matematik – fördjupning nivå 1", code:"Ma fördj 1", subject:"Matematik",
    files:["strukturmatf1.js","uppgiftermatf1.js"],
    globals:{bank:"BANKMATF1",kap:"KAPNAMNMATF1",omr:"OMRMATF1"},
    tracks:[], tint:"#4a7fc9"
  }
};

const COURSE_ORDER=["ma1","ma2","mato1","mato2","matf1","fy1","fy2"];
const app=document.getElementById("app");

const state={
  course:null, track:null, data:null, view:"home",
  focusArea:null, focusFamily:null,
  currentTask:null, sessionDone:0, sessionTarget:8, sessionXp:0, sessionCorrect:0,
  openChapters:null,
  lastIds:[], solutionShown:false, answered:false
};

const loadedScripts=new Set();
const PROFILE_KEY="kunskapsgymmet-profile-v1";
let profile=loadProfile();

function loadProfile(){
  let p;
  try{ p=JSON.parse(localStorage.getItem(PROFILE_KEY)); }catch(_){ p=null; }
  p = p || {};
  p.xp||=0; p.attempts||=0; p.correct||=0; p.streak||=0; p.bestStreak||=0;
  p.run||=0; p.bestRun||=0; p.aCorrect||=0; p.today||=0; p.goal||=8;
  p.lastDay ??= null;
  p.courses ||= {}; p.badges ||= {};
  return p;
}
function saveProfile(){ try{ localStorage.setItem(PROFILE_KEY,JSON.stringify(profile)); }catch(_){} }
function ensureCourseProfile(){
  const c=state.course || "none";
  profile.courses[c] ||= {areas:{},families:{},history:[]};
  return profile.courses[c];
}
function mastery(map,key){
  if(!key) return .55;
  return typeof map[key]==="number" ? map[key] : .55;
}
function updateMastery(map,key,correct){
  if(!key) return;
  let s=mastery(map,key);
  s = correct ? s + .10*(1-s) : s - .16*s;
  map[key]=Math.max(.08,Math.min(.96,s));
}

/* ==========================================================
   RANGER, MILSTOLPAR OCH DAGSSTRECK
   ========================================================== */

const RANKS=[
  {lvl:1,  name:"Nykomling", sym:"I"},
  {lvl:3,  name:"Motionär",  sym:"II"},
  {lvl:6,  name:"Atlet",     sym:"III"},
  {lvl:10, name:"Elitatlet", sym:"IV"},
  {lvl:15, name:"Mästare",   sym:"V"},
  {lvl:22, name:"Legend",    sym:"VI"}
];
function totalXpForLevel(L){ return 30*(L-1)+12*(L-1)*(L-1); }
function levelFromXP(xp){
  let L=1;
  while(L<99 && totalXpForLevel(L+1)<=xp) L++;
  return L;
}
function rankFor(level){
  let r=RANKS[0];
  for(const x of RANKS) if(level>=x.lvl) r=x;
  return r;
}
function nextRank(level){ return RANKS.find(x=>x.lvl>level) || null; }
function levelProgress(){
  const L=levelFromXP(profile.xp);
  const base=totalXpForLevel(L), top=totalXpForLevel(L+1);
  return {level:L, into:profile.xp-base, need:top-base, pct:(profile.xp-base)/Math.max(1,top-base)};
}

function todayKey(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function yesterdayKey(){
  const d=new Date(Date.now()-864e5);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function todayCount(){ return profile.lastDay===todayKey() ? (profile.today||0) : 0; }
function currentStreak(){
  if(profile.lastDay===todayKey() || profile.lastDay===yesterdayKey()) return profile.streak||0;
  return 0;
}
function touchDay(){
  const t=todayKey();
  if(profile.lastDay===t) return;
  profile.streak = (profile.lastDay===yesterdayKey()) ? (profile.streak||0)+1 : 1;
  profile.bestStreak=Math.max(profile.bestStreak||0,profile.streak);
  profile.lastDay=t;
  profile.today=0;
}

function allAreaMasteries(){
  return Object.values(profile.courses||{}).flatMap(c=>Object.values(c.areas||{}));
}
function bestAreaMastery(){
  const v=allAreaMasteries();
  return v.length?Math.max(...v):0;
}
function touchedAreas(){ return allAreaMasteries().length; }

const BADGES=[
  {id:"start", icon:"◆", name:"Första steget",   desc:"Träna din första uppgift",    max:1,   cur:()=>profile.attempts},
  {id:"warm",  icon:"▲", name:"Uppvärmd",        desc:"10 tränade uppgifter",        max:10,  cur:()=>profile.attempts},
  {id:"form",  icon:"●", name:"Formstark",       desc:"100 tränade uppgifter",       max:100, cur:()=>profile.attempts},
  {id:"serie", icon:"✦", name:"Perfekt serie",   desc:"10 rätt i rad",               max:10,  cur:()=>profile.bestRun},
  {id:"vecka", icon:"◈", name:"Sju raka dagar",  desc:"Träna 7 dagar i följd",       max:7,   cur:()=>profile.bestStreak},
  {id:"omr",   icon:"★", name:"Områdesmästare",  desc:"Nå 85 % i ett område",        max:85,  cur:()=>Math.round(bestAreaMastery()*100)},
  {id:"bredd", icon:"⬢", name:"Allsidig",        desc:"Träna i 8 olika områden",     max:8,   cur:()=>touchedAreas()},
  {id:"topp",  icon:"▲", name:"Höjdhoppare",     desc:"25 rätt på A-nivå",           max:25,  cur:()=>profile.aCorrect}
];
function badgeState(b){
  const cur=Math.max(0,Math.min(b.max,b.cur()||0));
  return {cur,pct:cur/b.max,on:!!profile.badges[b.id]||cur>=b.max};
}
function nextBadge(){
  const locked=BADGES.filter(b=>!badgeState(b).on).map(b=>({b,s:badgeState(b)}));
  if(!locked.length) return null;
  locked.sort((x,y)=>y.s.pct-x.s.pct);
  return locked[0];
}
function checkBadges(){
  const gained=[];
  for(const b of BADGES){
    if(profile.badges[b.id]) continue;
    if((b.cur()||0)>=b.max){ profile.badges[b.id]=Date.now(); gained.push(b); }
  }
  gained.forEach(b=>cheer(b.icon,"Bragd upplåst",b.name));
  return gained;
}

const ACCENT_BG={a:"#faf3f2",b:"#f1f8f3",c:"#f1f5f9",fy1:"#eff8f8",fy2:"#f4f4fc"};
function accentKey(){
  if(!state.course) return "";
  if(state.course==="fy1") return "fy1";
  if(state.course==="fy2") return "fy2";
  const m=String(state.track||"").match(/[abc]$/i);
  return m ? m[0].toLowerCase() : "";
}
function applyAccent(){
  const k=accentKey();
  if(k) document.documentElement.dataset.accent=k;
  else delete document.documentElement.dataset.accent;
  syncThemeColor();
}
function syncThemeColor(){
  const meta=document.querySelector('meta[name="theme-color"]');
  if(!meta) return;
  meta.content = document.documentElement.dataset.theme==="dark"
    ? "#0a1119"
    : (ACCENT_BG[accentKey()] || "#f1f5f9");
}
function setTheme(next){
  document.documentElement.dataset.theme=next;
  localStorage.setItem("kunskapsgymmet-theme",next);
  syncThemeColor();
}
(function initTheme(){
  const saved=localStorage.getItem("kunskapsgymmet-theme");
  if(saved==="dark"||saved==="light"){ setTheme(saved); return; }
  const mq=window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
  setTheme(mq && mq.matches ? "dark" : "light");
  // Följ datorns inställning så länge eleven inte valt själv.
  if(mq && mq.addEventListener) mq.addEventListener("change",e=>{
    if(!localStorage.getItem("kunskapsgymmet-theme")){
      document.documentElement.dataset.theme=e.matches?"dark":"light";
      render();
    }
  });
})();
function toggleTheme(){
  setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
  render();
}
function themeIcon(){ return document.documentElement.dataset.theme==="dark" ? "☀" : "☾"; }

function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>el.classList.remove("show"),1800);
}
const cheerQueue=[];
function cheer(icon,label,title){
  cheerQueue.push({icon,label,title});
  if(cheerQueue.length===1) pumpCheer();
}
function pumpCheer(){
  const el=document.getElementById("cheer");
  const c=cheerQueue[0];
  if(!c){ return; }
  el.innerHTML=`<div class="medal on">${c.icon}</div><div><b>${esc(c.title)}</b><small>${esc(c.label)}</small></div>`;
  el.classList.add("show");
  setTimeout(()=>{
    el.classList.remove("show");
    cheerQueue.shift();
    if(cheerQueue.length) setTimeout(pumpCheer,420);
  },2600);
}

function ring(pct,size,stroke,color){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  const off=c*(1-Math.max(0,Math.min(1,pct||0)));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--hair)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${c.toFixed(1)}"
      data-off="${off.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}

function renderMath(root=app){
  if(typeof renderMathInElement!=="function"){ setTimeout(()=>renderMath(root),120); return; }
  try{
    renderMathInElement(root,{
      delimiters:[
        {left:"$$",right:"$$",display:true},
        {left:"\\[",right:"\\]",display:true},
        {left:"\\(",right:"\\)",display:false}
      ],
      throwOnError:false, strict:false, trust:false
    });
  }catch(err){ console.warn("KaTeX:",err); }
}

const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';

const TONE_VAR={"t-good":"var(--good)","t-mid":"var(--acc)","t-low":"var(--warn)","t-new":"var(--hair2)"};

function chapterHead(kap,namn,omraden){
  const open=state.openChapters.has(String(kap));
  // Prickarna sammanfattar kapitlets läge när det är hopfällt.
  const dots=omraden.slice(0,10)
    .map(a=>`<i style="--d:${TONE_VAR[areaStatus(a.key).tone]}"></i>`).join("");
  return `<button class="chapter-head" aria-expanded="${open}" onclick="toggleChapter('${esc(String(kap))}',this)">
    ${CHEV}<span class="name">${esc(namn)}</span><span class="rule"></span>
    <span class="kdots">${dots}</span><span class="n">${omraden.length}</span>
  </button>`;
}

/* Spelar upp ringar, mätare och inglidning igen när ett kapitel öppnas. */
function playIn(root){
  root.querySelectorAll("[data-off]").forEach(el=>{ el.style.strokeDashoffset=el.getAttribute("stroke-dashoffset"); });
  root.querySelectorAll("[data-w]").forEach(el=>{ el.style.width="0"; });
  root.querySelectorAll(".stagger").forEach(g=>{
    [...g.children].forEach((el,i)=>{
      el.style.animation="none"; void el.offsetHeight;
      el.style.animation=""; el.style.animationDelay=Math.min(i*35,420)+"ms";
    });
  });
  requestAnimationFrame(()=>{
    root.querySelectorAll("[data-off]").forEach(el=>{ el.style.strokeDashoffset=el.dataset.off; });
    root.querySelectorAll("[data-w]").forEach(el=>{ el.style.width=el.dataset.w; });
  });
}

function toggleChapter(kap,btn){
  const key=String(kap);
  const sec=btn.closest(".chapter");
  const body=sec.querySelector(".chapter-body");
  const open=state.openChapters.has(key);
  if(open){
    state.openChapters.delete(key);
    btn.setAttribute("aria-expanded","false");
    sec.classList.remove("open");
    body.hidden=true;
  }else{
    state.openChapters.add(key);
    btn.setAttribute("aria-expanded","true");
    sec.classList.add("open");
    body.hidden=false;
    playIn(body);
  }
}

function afterRender(){
  renderMath(app);
  requestAnimationFrame(()=>{
    app.querySelectorAll("[data-off]").forEach(el=>{ el.style.strokeDashoffset=el.dataset.off; });
    app.querySelectorAll("[data-w]").forEach(el=>{ el.style.width=el.dataset.w; });
    app.querySelectorAll(".stagger").forEach(g=>{
      [...g.children].forEach((el,i)=>{ el.style.animationDelay=Math.min(i*35,420)+"ms"; });
    });
  });
}

async function loadScript(src){
  if(loadedScripts.has(src)) return;
  await new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src=src+"?v="+Date.now();
    s.onload=()=>{loadedScripts.add(src);resolve();};
    s.onerror=()=>reject(new Error("Kunde inte ladda "+src));
    document.head.appendChild(s);
  });
}

async function selectCourse(id){
  const c=COURSES[id];
  if(!c) return;
  const card=document.getElementById("course-"+id);
  if(card) card.classList.add("loading");
  try{
    for(const f of c.files) await loadScript(f);
    const bank=window[c.globals.bank];
    const kap=window[c.globals.kap] || {};
    const omr=window[c.globals.omr] || {};
    if(!Array.isArray(bank)) throw new Error(`Globalen window.${c.globals.bank} hittades inte eller är inte en array.`);
    state.course=id;
    state.track=c.defaultTrack || (c.tracks[0]||null);
    state.data={bank,kap,omr};
    state.focusArea=null;state.focusFamily=null;state.currentTask=null;
    state.openChapters=null;
    ensureCourseProfile();
    applyAccent();
    history.replaceState(null,"","#"+id);
    renderDashboard();
  }catch(err){
    console.error(err);
    if(card) card.classList.remove("loading");
    alert("Kunde inte öppna kursen.\n\n"+err.message+"\n\nKontrollera att filerna ligger i samma mapp som index.html.");
  }
}

/* Områden som kursen har valt bort finns kvar i banken men visas
   och tränas aldrig i Kunskapsgymmet. */
function normOmr(x){
  return String(x??"").toLowerCase().replaceAll("_"," ").replace(/\s+/g," ").replace(/[.\s]+$/,"").trim();
}
function isExcluded(t){
  const lista=COURSES[state.course]?.utanOmraden;
  if(!lista||!lista.length) return false;
  const key=t.omr||"ovrigt";
  const falt=[normOmr(areaName(key)),normOmr(key),normOmr(chapterName(t.kap))];
  return lista.some(x=>{
    const v=normOmr(x);
    if(!v) return false;
    // Prefixmatchning bägge hållen, så att "… och modeller" fångar
    // "… och modellering" utan att korta ord råkar träffa inuti andra ord.
    return falt.some(f=>f && (f===v ||
      (v.length>=6 && f.startsWith(v)) ||
      (f.length>=6 && v.startsWith(f))));
  });
}

function availableTasks(){
  if(!state.data) return [];
  let tasks=state.data.bank;
  const kurs=COURSES[state.course];
  if(kurs?.utanOmraden?.length) tasks=tasks.filter(t=>!isExcluded(t));
  if(state.track){
    tasks=tasks.filter(t=>{
      if(!t.kurs) return true;
      const k=Array.isArray(t.kurs)?t.kurs:[t.kurs];
      return k.includes(state.track);
    });
  }
  return tasks;
}
function areaName(key){
  const omr=state.data?.omr||{};
  for(const v of Object.values(omr)){
    if(v && typeof v==="object" && key in v) return v[key];
  }
  if(key in omr && typeof omr[key]==="string") return omr[key];
  return key ? key.replaceAll("_"," ") : "Övrigt";
}
function chapterName(kap){
  const k=state.data?.kap||{};
  return k[kap] || k[String(kap)] || `Kapitel ${kap}`;
}
function familyName(f){
  if(!f) return "Övrigt";
  return String(f).replaceAll("_"," ").trim();
}
function abilityText(f){
  if(!f) return "";
  const a=Array.isArray(f)?f:[f];
  return a.map(x=>String(x).replaceAll("_"," ")).join(" · ");
}
function getAreas(){
  const tasks=availableTasks();
  const by={};
  for(const t of tasks){
    const key=t.omr||"ovrigt";
    by[key] ||= {key,name:areaName(key),kap:t.kap,count:0,families:new Set()};
    by[key].count++;
    if(t.familj){
      const fs=Array.isArray(t.familj)?t.familj:[t.familj];
      fs.forEach(f=>by[key].families.add(f));
    }
  }
  return Object.values(by).sort((a,b)=>(+a.kap||99)-(+b.kap||99)||a.name.localeCompare(b.name,"sv"));
}
function areaStatus(key){
  const cp=ensureCourseProfile();
  const seen=typeof cp.areas[key]==="number";
  const m=seen?cp.areas[key]:0;
  if(!seen)   return {seen:false,m:0,label:"Ny",tone:"t-new",mcls:"m-new"};
  if(m>=.78)  return {seen:true,m,label:"Stark",tone:"t-good",mcls:""};
  if(m>=.55)  return {seen:true,m,label:"På gång",tone:"t-mid",mcls:""};
  return {seen:true,m,label:"Behöver träning",tone:"t-low",mcls:""};
}
function setTrack(track){
  state.track=track; applyAccent(); state.openChapters=null; state.focusArea=null; state.focusFamily=null; state.currentTask=null;
  renderDashboard();
}
function weakAreas(limit=4){
  const cp=ensureCourseProfile();
  return getAreas().filter(a=>typeof cp.areas[a.key]==="number")
    .map(a=>({...a,m:cp.areas[a.key]})).sort((a,b)=>a.m-b.m).slice(0,limit);
}
function strongAreas(limit=4){
  const cp=ensureCourseProfile();
  return getAreas().filter(a=>typeof cp.areas[a.key]==="number")
    .map(a=>({...a,m:cp.areas[a.key]})).sort((a,b)=>b.m-a.m).slice(0,limit);
}
function weakFamilies(limit=8){
  const cp=ensureCourseProfile();
  const seen=new Map();
  availableTasks().forEach(t=>{
    if(!t.familj) return;
    const fs=Array.isArray(t.familj)?t.familj:[t.familj];
    fs.forEach(f=>{ if(!seen.has(f)) seen.set(f,{family:f,area:t.omr,count:0}); seen.get(f).count++; });
  });
  return [...seen.values()].map(x=>({...x,m:mastery(cp.families,x.family)}))
    .sort((a,b)=>a.m-b.m).slice(0,limit);
}

function coachAdvice(){
  const done=todayCount(), goal=profile.goal||8, st=currentStreak();
  const weak=weakAreas(1)[0];
  const areas=getAreas();

  if(!profile.attempts){
    return {msg:"Vi börjar brett. Ett kort pass så lär jag känna din nivå — sedan blir förslagen träffsäkra.",
            btn:"Starta första passet", act:"startAdaptive()"};
  }
  if(done>=goal){
    return {msg:`Dagens mål är avklarat. <b>${done} uppgifter</b> idag${st>1?` och ${st} dagar i rad`:""}. Vill du fortsätta väljer jag lite svårare uppgifter.`,
            btn:"Ett pass till", act:"startAdaptive()"};
  }
  if(weak && weak.m<.62){
    return {msg:`Idag föreslår jag <b>${esc(weak.name)}</b>. Där sitter det inte riktigt än, och det är där du växer snabbast.`,
            btn:"Träna området", act:`startArea('${esc(weak.key)}')`};
  }
  if(weak && areas.length && strongAreas(99).length<Math.min(6,areas.length)){
    return {msg:`Du är stabil i det du tränat. Prova ett område du inte rört än — bredd ger bättre resultat på provet.`,
            btn:"Låt mig välja", act:"startAdaptive()"};
  }
  return {msg:`Formen är god. Jag blandar repetition med tuffare uppgifter så att det fortsätter kännas lagom svårt.`,
          btn:"Starta dagens pass", act:"startAdaptive()"};
}

function showAreaPicker(){
  state.view="picker";
  const areas=getAreas();
  const grouped={};
  areas.forEach(a=>{(grouped[a.kap] ||= []).push(a)});
  const kapitel=Object.keys(grouped).sort((a,b)=>(+a||99)-(+b||99));
  if(!state.openChapters) state.openChapters=new Set(kapitel.length>1?[String(kapitel[0])]:kapitel.map(String));
  app.innerHTML=topbar()+`<main class="shell view" style="padding-bottom:60px">
    <div class="chead">
      <div class="t">
        <button class="crumb" onclick="renderDashboard()"><span aria-hidden="true">←</span> Tillbaka</button>
        <h1>Punktträna</h1>
        <p>Välj område, eller en enskild uppgiftstyp för smalare träning.</p>
      </div>
    </div>
    ${kapitel.map(kap=>{
      const open=state.openChapters.has(String(kap));

                <strong>${esc(a.name)}</strong>

              ${a.families.size?`<div style="display:flex;gap:5px;flex-wrap:wrap">
                ${[...a.families].slice(0,14).map(f=>`<button class="tag" style="cursor:pointer"
                  onclick="startFamily('${esc(a.key)}','${esc(f)}')">${esc(familyName(f))}</button>`).join("")}
              </div>`:""}
              <span class="foot">
                <span class="meter ${s.mcls}"><i data-w="${Math.round(s.m*100)}%"></i></span>

/* ==========================================================
   URVAL OCH PASS
   ========================================================== */

function levelOf(t){
  const n=String(t.niva||"E").toUpperCase();
  return (n==="A"||n==="C") ? n : "E";
}
function familyMastery(t,cp){
  const fs=(Array.isArray(t.familj)?t.familj:[t.familj]).filter(Boolean);
  if(!fs.length) return mastery(cp.areas,t.omr);
  return Math.min(...fs.map(f=>mastery(cp.families,f)));
}

/* Hur mycket eleven har visat i det som tränas just nu:
   både hur väl det går och hur mycket som är gjort. */
function scopeStats(){
  const cp=ensureCourseProfile();
  if(state.focusArea){
    const m=typeof cp.areas[state.focusArea]==="number" ? cp.areas[state.focusArea] : .5;
    const c=cp.history.filter(h=>h.area===state.focusArea).length;
    return {m,c};
  }
  const vals=Object.values(cp.areas);
  const m=vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : .5;
  return {m,c:cp.history.length};
}

/* Alla börjar på E. C öppnar när det börjar sitta, A först därefter.
   Går det sämre stängs de högre nivåerna ned igen. */
function levelWeights(){
  const {m,c}=scopeStats();
  const r=.55*m + .45*Math.min(1,c/16);
  return {
    E: Math.max(.22, 1 - r),
    C: r<.38 ? 0 : Math.min(.55,(r-.34)*1.3),
    A: r<.66 ? 0 : Math.min(.38,(r-.64)*1.2)
  };
}

function chooseTask(){
  let pool=availableTasks();
  if(state.focusArea) pool=pool.filter(t=>t.omr===state.focusArea);
  if(state.focusFamily) pool=pool.filter(t=>{
    const fs=Array.isArray(t.familj)?t.familj:[t.familj];
    return fs.includes(state.focusFamily);
  });
  if(!pool.length) return null;

  const cp=ensureCourseProfile();
  const recent=new Set(state.lastIds.slice(-8));
  const buckets={E:[],C:[],A:[]};
  pool.forEach(t=>buckets[levelOf(t)].push(t));

  // 1. Slumpa fram nivå enligt vikterna, bland de nivåer som finns i urvalet.
  const w=levelWeights();
  const order=["E","C","A"];
  const avail=order.filter(L=>buckets[L].length && w[L]>0);
  let level=null;
  if(avail.length){
    const total=avail.reduce((a,L)=>a+w[L],0);
    let x=Math.random()*total;
    for(const L of avail){ x-=w[L]; if(x<=0){ level=L; break; } }
    level=level||avail[avail.length-1];
  }
  if(!level || !buckets[level].length) level=order.find(L=>buckets[L].length)||"E";

  // 2. Slumpa uppgift inom nivån, med lätt förtur för svaga familjer
  //    och utan att upprepa det som nyss visats.
  let cands=buckets[level];
  const fresh=cands.filter(t=>!recent.has(t.id));
  if(fresh.length) cands=fresh;
  const scored=cands
    .map(t=>({t,k:familyMastery(t,cp)*.6 + Math.random()*.9}))
    .sort((a,b)=>a.k-b.k);
  const top=scored.slice(0,Math.max(1,Math.ceil(scored.length*.4)));
  return top[Math.floor(Math.random()*top.length)].t;
}

function beginSession(){
  state.sessionDone=0;state.lastIds=[];state.sessionXp=0;state.sessionCorrect=0;
  state.sessionTarget=profile.goal||8;
}
function startAdaptive(){
  state.focusArea=null;state.focusFamily=null;beginSession();nextTask();
}
function startArea(area){
  state.focusArea=area;state.focusFamily=null;beginSession();nextTask();
}
function startFamily(area,family){
  state.focusArea=area;state.focusFamily=family;beginSession();nextTask();
}
function continueSession(){ beginSession(); nextTask(); }
function nextTask(){
  const t=chooseTask();
  if(!t){toast("Inga uppgifter hittades.");return;}
  state.currentTask=t;state.answered=false;state.solutionShown=false;
  state.lastIds.push(t.id);
  if(state.lastIds.length>12) state.lastIds.shift();
  renderTraining();
}
function sessionLabel(){
  if(state.focusFamily) return familyName(state.focusFamily);
  if(state.focusArea) return areaName(state.focusArea);
  return "Adaptivt pass";
}

/* ==========================================================
   SÄKER FACITFALLBACK
   Många äldre uppgifter har ett tydligt slutligt svar i facit men
   rättSvar:null. För rutinuppgifter kan Kunskapsgymmet då plocka ut
   det slutliga svaret med strikta regler.

   Viktigt:
   - figur/resonemang/text öppnas aldrig för automatisk rättning här
   - för flerdelsuppgifter måste ALLA delars slutsvar kunna hittas
   - ett tydligt <strong>...</strong> i respektive slutrad prioriteras
   - annars accepteras sista matematikuttrycket i en ren a)/b)/c)-rad
   ========================================================== */

function cleanDerivedAnswer(raw){
  let x=String(raw??"").trim();
  if(!x) return null;

  // Om innehållet är HTML, behåll text/LaTeX men ta bort taggar.
  x=x.replace(/<br\s*\/?>/gi," ");
  x=x.replace(/<[^>]+>/g,"");
  x=x.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
  x=x.trim();

  // Ta bort "Svar:" men inte själva svaret.
  x=x.replace(/^svar\s*:\s*/i,"").trim();

  // Väldigt långa textstycken är inte ett säkert maskinsvar.
  if(x.length>120) return null;
  return x || null;
}

function mathChunksFromHTML(html){
  const s=String(html??"");
  const out=[];
  // \( ... \)
  for(const m of s.matchAll(/\\\(([\s\S]*?)\\\)/g)) out.push("\\("+m[1].trim()+"\\)");
  // \[ ... \]
  for(const m of s.matchAll(/\\\[([\s\S]*?)\\\]/g)) out.push("\\("+m[1].trim()+"\\)");
  return out;
}

function answerCandidateFromElement(el){
  if(!el) return null;

  // Prioritera sista <strong> som faktiskt ser ut som ett svar.
  const strongs=[...el.querySelectorAll("strong")];
  for(let i=strongs.length-1;i>=0;i--){
    const raw=strongs[i].innerHTML.trim();
    const plain=strongs[i].textContent.trim();
    if(!raw) continue;
    if(/^(metod|mellanled|tänk så här|svar)\s*:?\s*$/i.test(plain)) continue;
    const cleaned=cleanDerivedAnswer(raw);
    if(cleaned && (mathChunksFromHTML(raw).length || /[-+−]?\d|[a-zA-Z]/.test(cleaned))){
      return cleaned;
    }
  }

  // Om raden i sig är en ren deluppgiftsrad kan sista matematikuttrycket
  // vara slutsvaret, t.ex. <div>a) \(-14\)</div>.
  const chunks=mathChunksFromHTML(el.innerHTML);
  if(chunks.length){
    return cleanDerivedAnswer(chunks[chunks.length-1]);
  }

  return null;
}

function derivedAnswersFromSolution(t){
  const blocked=new Set(["figur","resonemang","text"]);
  const type=String(t.svarstyp||"").toLowerCase();
  if(blocked.has(type)) return null;
  if(!t.s) return null;

  const parser=new DOMParser();
  const doc=parser.parseFromString(`<div id="kg-facit-root">${t.s}</div>`,"text/html");
  const root=doc.getElementById("kg-facit-root");
  if(!root) return null;

  const partCount=inferAnswerCount(t);

  if(partCount>1 || type==="flera_delar"){
    const answers=new Array(partCount).fill(null);
    const elements=[...root.querySelectorAll("p, .deluppgifter > div, li")];

    for(const el of elements){
      const text=(el.textContent||"").trim();
      const m=text.match(/^([a-j])\)\s*/i);
      if(!m) continue;
      const idx=m[1].toLowerCase().charCodeAt(0)-97;
      if(idx<0 || idx>=partCount) continue;

      const candidate=answerCandidateFromElement(el);
      if(candidate) answers[idx]=candidate; // senare/final rad får ersätta mellanled
    }

    // Samtliga deluppgifter måste ha ett säkert hittat svar.
    if(answers.every(Boolean)) return answers;
    return null;
  }

  // Enkelsvar: använd bara tydliga svarsrader.
  const elements=[...root.querySelectorAll("p, li, .svar, .answer")];

  // 1) Prioritera en rad som uttryckligen innehåller "Svar:".
  for(let i=elements.length-1;i>=0;i--){
    const txt=(elements[i].textContent||"").trim();
    if(/\bsvar\s*:/i.test(txt)){
      const cand=answerCandidateFromElement(elements[i]);
      if(cand) return [cand];
      const chunks=mathChunksFromHTML(elements[i].innerHTML);
      if(chunks.length) return [cleanDerivedAnswer(chunks[chunks.length-1])];
    }
  }

  // 2) Om exakt ett svarsliknande <strong> finns i hela facit.
  const candidates=[];
  for(const el of root.querySelectorAll("strong")){
    const plain=(el.textContent||"").trim();
    if(/^(metod|mellanled|tänk så här|svar)\s*:?\s*$/i.test(plain)) continue;
    const cleaned=cleanDerivedAnswer(el.innerHTML);
    if(cleaned && (mathChunksFromHTML(el.innerHTML).length || /^[-+−]?\d+(?:[,.]\d+)?(?:\s*[a-zA-Z°%]+)?$/.test(cleaned))){
      candidates.push(cleaned);
    }
  }
  if(candidates.length===1) return [candidates[0]];

  return null;
}

function expectedAnswersForTask(t){
  if(t.rättSvar!==null && t.rättSvar!==undefined){
    return {
      answers:Array.isArray(t.rättSvar)?t.rättSvar:[t.rättSvar],
      source:"metadata",
      auto:!!t.självrättning
    };
  }

  const derived=derivedAnswersFromSolution(t);
  if(derived && derived.length){
    return {answers:derived,source:"facit",auto:true};
  }

  return {answers:[],source:"none",auto:false};
}

function inferAnswerCount(t){
  if(t.rättSvar!==null && t.rättSvar!==undefined){
    return Array.isArray(t.rättSvar) ? Math.max(1,t.rättSvar.length) : 1;
  }
  const plain=String(t.t||"")
    .replace(/<br\s*\/?>/gi,"\n")
    .replace(/<\/p>/gi,"\n")
    .replace(/<[^>]+>/g," ");
  const matches=[...plain.matchAll(/(?:^|[\s\n])([a-j])\)\s*/gi)].map(m=>m[1].toLowerCase());
  const unique=[...new Set(matches)];
  return unique.length || 1;
}

/* ==========================================================
   SVARSKONTROLL
   - Punkt och decimalcomma behandlas lika: 1,5 = 1.5
   - Unicode-minus, multiplikationstecken, pi, roten ur m.m. normaliseras
   - Numeriska svar använder tolerans
   - Algebraiska uttryck jämförs symboliskt med Nerdamer
   - Ekvationer kan skrivas med omkastade led och skalade led
     t.ex. x=2, 2=x och 2x=4 betraktas som ekvivalenta
   ========================================================== */

function latexToPlain(s){
  let x=String(s??"");

  // Ta bort HTML men behåll själva texten.
  x=x.replace(/<br\s*\/?>/gi," ");
  x=x.replace(/<[^>]+>/g," ");

  // Ta bort vanliga matematik-delimiters.
  x=x.replace(/\\\(|\\\)|\\\[|\\\]|\$\$/g,"");

  // Några vanliga LaTeX-kommandon från banken/svar.
  // Kör flera varv så även enkla nästlade bråk hinner lösas.
  for(let i=0;i<4;i++){
    x=x.replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g,"(($1)/($2))");
    x=x.replace(/\\dfrac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g,"(($1)/($2))");
    x=x.replace(/\\sqrt\s*\{([^{}]+)\}/g,"sqrt($1)");
  }
  x=x.replace(/\\left|\\right/g,"");
  x=x.replace(/\\cdot|\\times/g,"*");
  x=x.replace(/\\pi/g,"pi");
  x=x.replace(/\\,/g,"");
  x=x.replace(/\\text\s*\{([^{}]*)\}/g," $1 ");

  // Typografiska tecken till maskinläsbara.
  x=x.replace(/[−–—]/g,"-");
  x=x.replace(/[×·⋅]/g,"*");
  x=x.replace(/÷/g,"/");
  x=x.replace(/π/g,"pi");
  x=x.replace(/\u00a0/g," ");

  // Unicode-potenser.
  x=x.replace(/²/g,"^2").replace(/³/g,"^3").replace(/⁴/g,"^4")
     .replace(/⁵/g,"^5").replace(/⁶/g,"^6").replace(/⁷/g,"^7")
     .replace(/⁸/g,"^8").replace(/⁹/g,"^9");

  return x.trim();
}

function normalizeDecimalComma(x){
  // Svensk decimalcomma: 1,25 -> 1.25.
  // Kommatecken som inte ligger mellan siffror lämnas orörda.
  let prev;
  do{
    prev=x;
    x=x.replace(/(\d),(\d)/g,"$1.$2");
  }while(x!==prev);
  return x;
}

function normalizeMathInput(s){
  let x=latexToPlain(s).toLowerCase();

  x=x.replace(/^svar\s*:\s*/,"");
  x=normalizeDecimalComma(x);

  // Acceptera svensk divisionsnotation "6:3".
  x=x.replace(/(\d|\))\s*:\s*(\d|\()/g,"$1/$2");

  // Enkel roten-ur-notation: √9, √x, √(x+1)
  x=x.replace(/√\s*\(([^()]+)\)/g,"sqrt($1)");
  x=x.replace(/√\s*([a-z]\w*|\d+(?:\.\d+)?)/g,"sqrt($1)");

  // Procenttal: 12% -> (12/100)
  x=x.replace(/(\d+(?:\.\d+)?)\s*%/g,"($1/100)");

  // Ta bort tusentalsmellanrum mellan siffror, därefter övriga blanksteg.
  x=x.replace(/(\d)\s+(?=\d{3}(?:\D|$))/g,"$1");
  x=x.replace(/\s+/g,"");

  // Avslutande skiljetecken är inte en del av svaret.
  x=x.replace(/[.;]$/,"");

  return x;
}

function normalizeAnswer(s){
  return normalizeMathInput(s);
}

function firstNumber(s){
  const x=normalizeMathInput(s);
  const m=x.match(/[-+]?(?:\d+(?:\.\d+)?|\.\d+)/);
  return m?Number(m[0]):NaN;
}

function isPureNumberExpression(s){
  // Tillåt siffror, pi/e, parenteser och elementära operatorer/funktioner,
  // men inga fria variabler.
  const x=normalizeMathInput(s);
  if(!x) return false;
  const scrub=x
    .replace(/\b(?:sqrt|sin|cos|tan|asin|acos|atan|ln|log|abs|exp|pi|e)\b/g,"")
    .replace(/[0-9.+\-*/^(),]/g,"");
  return scrub==="";
}

function nerd(expr){
  if(typeof window.nerdamer!=="function") return null;
  try{return window.nerdamer(expr);}catch(_){return null;}
}

function symbolicZero(expr){
  if(typeof window.nerdamer!=="function") return false;
  try{
    const r=window.nerdamer(`simplify(${expr})`).toString();
    return r==="0";
  }catch(_){
    try{
      const r=window.nerdamer(expr).expand().toString();
      return r==="0";
    }catch(__){return false;}
  }
}

function numericValue(expr){
  if(typeof window.nerdamer!=="function") return NaN;
  try{
    const v=window.nerdamer(expr).evaluate().text("decimals");
    const n=Number(v);
    return Number.isFinite(n)?n:NaN;
  }catch(_){return NaN;}
}

function splitEquation(expr){
  const parts=String(expr).split("=");
  return parts.length===2 && parts[0] && parts[1] ? parts : null;
}

function equationResidual(expr){
  const p=splitEquation(expr);
  return p ? `((${p[0]})-(${p[1]}))` : null;
}

function expressionVariables(expr){
  const e=nerd(expr);
  if(!e) return [];
  try{
    const vars=e.variables();
    return Array.isArray(vars)?vars.map(String):[];
  }catch(_){return [];}
}

function equationsEquivalent(user,expected){
  const ur=equationResidual(user);
  const er=equationResidual(expected);
  if(!ur || !er) return false;

  // Samma residual eller motsatt residual.
  if(symbolicZero(`(${ur})-(${er})`)) return true;
  if(symbolicZero(`(${ur})+(${er})`)) return true;

  // Samma ekvation multiplicerad med en icke-noll konstant:
  // x=2 och 2x=4.
  try{
    const ratio=window.nerdamer(`simplify((${ur})/(${er}))`);
    const vars=ratio.variables();
    if(Array.isArray(vars) && vars.length===0){
      const n=Number(ratio.evaluate().text("decimals"));
      if(Number.isFinite(n) && Math.abs(n)>1e-12) return true;
    }
  }catch(_){}

  return false;
}

function algebraicallyEquivalent(user,expected){
  const u=normalizeMathInput(user);
  const e=normalizeMathInput(expected);
  if(!u || !e) return false;
  if(u===e) return true;
  if(typeof window.nerdamer!=="function") return false;

  const ue=splitEquation(u);
  const ee=splitEquation(e);

  // Två ekvationer.
  if(ue && ee) return equationsEquivalent(u,e);

  // Om facit är ett rent tal accepteras även t.ex. "x=2".
  if(ue && !ee && isPureNumberExpression(e)){
    const left=ue[0],right=ue[1];
    if(/^[a-z]\w*$/.test(left) && algebraicallyEquivalent(right,e)) return true;
    if(/^[a-z]\w*$/.test(right) && algebraicallyEquivalent(left,e)) return true;
  }
  if(!ue && ee && isPureNumberExpression(u)){
    const left=ee[0],right=ee[1];
    if(/^[a-z]\w*$/.test(left) && algebraicallyEquivalent(u,right)) return true;
    if(/^[a-z]\w*$/.test(right) && algebraicallyEquivalent(u,left)) return true;
  }

  // Ett uttryck ska normalt inte jämföras direkt med en ospecificerad ekvation.
  if(ue || ee) return false;

  // Symbolisk förenkling är huvudkontrollen.
  if(symbolicZero(`((${u})-(${e}))`)) return true;

  // Extra kontroll efter expansion, användbart för parenteser/polynom.
  try{
    const diff=window.nerdamer(`(${u})-(${e})`).expand().toString();
    if(symbolicZero(`(${diff})`)) return true;
  }catch(_){}

  return false;
}

function oneAnswerCorrect(user,expected,t){
  const u=normalizeAnswer(user), e=normalizeAnswer(expected);
  if(!u) return false;

  // 1. Exakt efter normalisering.
  if(u===e) return true;

  // 2. Algebraisk/symbolisk ekvivalens.
  //    Exempel: 11y+3 = 3+11y, (x+1)^2 = x^2+2x+1.
  if(algebraicallyEquivalent(user,expected)) return true;

  // 3. Numerisk jämförelse med tolerans.
  //    Både punkt och komma fungerar genom normalizeMathInput().
  let un=NaN,en=NaN;
  if(isPureNumberExpression(user)) un=numericValue(normalizeMathInput(user));
  if(isPureNumberExpression(expected)) en=numericValue(normalizeMathInput(expected));

  // Fallback om Nerdamer inte hunnit laddas eller uttrycket är enkelt.
  if(!Number.isFinite(un)) un=firstNumber(user);
  if(!Number.isFinite(en)) en=firstNumber(expected);

  if(Number.isFinite(un)&&Number.isFinite(en)){
    const tol=typeof t.tolerans==="number"
      ? t.tolerans
      : Math.max(1e-9,Math.abs(en)*1e-4);
    if(Math.abs(un-en)<=tol) return true;
  }

  return false;
}

function renderTraining(){
  state.view="training";
  const t=state.currentTask;
  if(!t) return renderDashboard();
  const family=Array.isArray(t.familj)?t.familj.join(" · "):t.familj;
  const expectedInfo=expectedAnswersForTask(t);
  const canAuto=expectedInfo.auto;
  const answers=expectedInfo.answers;
  const inferredParts=inferAnswerCount(t);
  const inputCount=answers.length || inferredParts || 1;

  // Nivå, område och familj visas inte för eleven under passet.
  // Hjälpmedlen visas däremot, som ikoner före uppgiften.
  const meta=toolIcons(t);

  const isLongAnswer=["resonemang","text"].includes(String(t.svarstyp||"").toLowerCase());
  const fieldHtml=Array.from({length:inputCount},(_,i)=>`
    <div class="aline">
      <label>${inputCount>1?String.fromCharCode(97+i)+")":""}</label>
      ${isLongAnswer
        ? `<textarea id="ans-${i}" autocomplete="off" placeholder="Skriv ditt svar här"></textarea>`
        : `<input id="ans-${i}" autocomplete="off" inputmode="text" placeholder="${inputCount>1?'Svar '+String.fromCharCode(97+i):'Ditt svar'}" onkeydown="if(event.key==='Enter' && ${canAuto})checkAnswer()">`
      }
    </div>`).join("");

  const dots=Array.from({length:state.sessionTarget},(_,i)=>
    `<i class="${i<state.sessionDone?'done':(i===state.sessionDone?'now':'')}"></i>`).join("");

  app.innerHTML=`
    <div class="tshell view">
      <div class="ttop">
        <button class="crumb" onclick="renderDashboard()"><span aria-hidden="true">←</span> Avsluta</button>
        <div class="spacer"></div>
        <span class="tag" style="background:transparent;border-color:var(--hair)">${esc(sessionLabel())}</span>
        <div class="dots" title="${state.sessionDone} av ${state.sessionTarget}">${dots}</div>
        <button class="iconbtn" onclick="toggleTheme()" title="Byt färgläge">${themeIcon()}</button>
      </div>
      <article class="task">
        <div class="tmeta">${meta}<span class="tid">#${esc(t.id)}</span></div>
        <div class="tbody">${t.t||""}</div>
        <div class="azone" id="answer-zone">
          <div class="notice"><b aria-hidden="true">✎</b><span>Skriv ner fullständiga lösningar med papper och penna innan du skriver in svaren här.</span></div>
          <h3>Ditt svar</h3>
          <div class="ainputs">${fieldHtml}</div>
          <div class="aacts">
            ${canAuto
              ? `<button class="btn primary" onclick="checkAnswer()">Kontrollera</button>
                 <button class="btn" onclick="showSolution()">Visa lösning</button>`
              : `<button class="btn primary" onclick="showSolution()">Visa facit och jämför</button>`}
          </div>
          ${canAuto?"":`<div class="hint">Den här uppgiften bedömer du själv efter att du sett facit.</div>`}
          <div id="answer-result"></div>

}

/* ==========================================================
   RÄTTNING OCH BELÖNING
   ========================================================== */

function checkAnswer(){
  if(state.answered) return;
  const t=state.currentTask;
  const info=expectedAnswersForTask(t);
  const expected=info.answers;
  if(!info.auto || !expected.length){
    toast("Den här uppgiften behöver självbedömas.");
    return;
  }
  const users=expected.map((_,i)=>document.getElementById("ans-"+i)?.value||"");
  if(users.some(x=>!x.trim())){toast("Fyll i alla svar först.");return;}
  const flags=expected.map((e,i)=>oneAnswerCorrect(users[i],e,t));
  finishAttempt(flags.every(Boolean));
}

function xpFor(niva,correct,run){
  if(!correct) return 2;
  const n=String(niva||"E").toUpperCase();
  let xp = n==="A"?28:n==="C"?18:10;
  if(run>=3) xp+=4;   // seriebonus
  if(run>=6) xp+=4;
  return xp;
}

function finishAttempt(correct){
  if(state.answered) return;
  const t=state.currentTask;
  state.answered=true; state.sessionDone++;

  const levelBefore=levelFromXP(profile.xp);
  const goal=profile.goal||8;
  const beforeToday=todayCount();

  touchDay();
  profile.attempts++;
  if(correct){
    profile.correct++;
    profile.run=(profile.run||0)+1;
    profile.bestRun=Math.max(profile.bestRun||0,profile.run);
    if(String(t.niva||"").toUpperCase()==="A") profile.aCorrect=(profile.aCorrect||0)+1;
  }else{
    profile.run=0;
  }
  const xp=xpFor(t.niva,correct,profile.run);
  profile.xp+=xp;
  profile.today=(profile.today||0)+1;
  state.sessionXp+=xp;
  if(correct) state.sessionCorrect++;

  const cp=ensureCourseProfile();
  updateMastery(cp.areas,t.omr,correct);
  const fs=Array.isArray(t.familj)?t.familj:[t.familj].filter(Boolean);
  fs.forEach(f=>updateMastery(cp.families,f,correct));
  cp.history.push({id:t.id,ok:correct,at:Date.now(),area:t.omr,family:t.familj});
  cp.history=cp.history.slice(-300);

  const levelAfter=levelFromXP(profile.xp);
  const rankBefore=rankFor(levelBefore), rankAfter=rankFor(levelAfter);
  saveProfile();

  if(levelAfter>levelBefore){
    if(rankAfter.name!==rankBefore.name) cheer(rankAfter.sym,"Ny rang",rankAfter.name);
    else cheer("▲","Ny nivå","Nivå "+levelAfter);
  }
  if(beforeToday<goal && todayCount()>=goal) cheer("◈","Dagens mål","Klart för idag");
  checkBadges();
  saveProfile();

  const last=state.sessionDone>=state.sessionTarget;
  const runTxt = correct && profile.run>=3 ? `<span class="tag" style="margin-left:6px">${profile.run} i rad</span>` : "";
  const box=document.getElementById("answer-result");
  if(box){
    box.innerHTML=`
      <div class="result ${correct?'good':'bad'}">
        <div class="txt">
          <strong>${correct?"Rätt!":"Inte riktigt."}${runTxt}</strong>
          <small>${correct?"Bra jobbat — nästa uppgift anpassas efter det här.":"Titta på lösningen och hitta steget som gick fel."}</small>
        </div>
        <span class="xpchip">+${xp} XP</span>
      </div>
      <div class="aacts">
        ${!correct?`<button class="btn" onclick="showSolution()">Visa lösning</button>`:""}
        <button class="btn primary" id="nextbtn" onclick="${last?'renderSessionDone()':'nextTask()'}">
          ${last?"Se passrapport":"Nästa uppgift"} <span aria-hidden="true">→</span>
        </button>
      </div>`;
    setTimeout(()=>document.getElementById("nextbtn")?.focus(),80);
  }
}

function showSolution(){
  const t=state.currentTask;
  state.solutionShown=true;
  const holder=document.getElementById("solution-holder");
  if(holder){
    holder.innerHTML=`<div class="sol"><div class="lbl">Lösning</div><div style="margin-top:10px">${t.s||"Facit saknas."}</div></div>
      ${!state.answered?`<div class="aacts">
        <button class="btn soft" onclick="selfGrade(true)">Jag hade rätt</button>
        <button class="btn" onclick="selfGrade(false)">Jag behöver träna mer</button>
      </div>`:""}`;
    renderMath(holder);
  }
}
function selfGrade(ok){ if(!state.answered) finishAttempt(ok); }

  app.innerHTML=topbar()+`<main class="summary view">
    <div class="ringwrap">
      ${ring(state.sessionCorrect/total,132,9,"var(--acc)")}
      <div class="num">${acc}<small>% rätt</small></div>
    </div>
    <h1>Passet är klart</h1>
    <p>${acc>=80?"Starkt genomfört. Den nivån bär hela vägen till provet."

      <div class="card tile" style="background:var(--surface)"><span>Idag</span><strong>${done} / ${goal}</strong></div>
    </div>

    <div class="card pad" style="text-align:left">

          ${ring(lp.pct,58,5,"#c79a3c")}
          <div class="num" style="font-size:16px">${lp.level}</div>
        </div>
        <div style="flex:1">
          <div class="rankname">${esc(rank.name)}</div>
          <div class="rankmeta">${nxt?`${toNext} XP till nivå ${lp.level+1} · ${esc(nxt.name)} vid nivå ${nxt.lvl}`:`${toNext} XP till nivå ${lp.level+1}`}</div>

    <div class="aacts" style="justify-content:center;margin-top:22px">
      <button class="btn primary" onclick="continueSession()">Fortsätt träna <span aria-hidden="true">→</span></button>
      <button class="btn" onclick="renderDashboard()">Till kursen</button>
      <button class="btn quiet" onclick="showProgress()">Min utveckling</button>
    </div>
  </main>`;
  afterRender();
}

function goHome(){
  state.course=null;state.data=null;state.track=null;state.currentTask=null;
  applyAccent();
  history.replaceState(null,"",location.pathname+location.search);
  renderHome();
}

function render(){
  if(state.view==="dashboard"&&state.course) renderDashboard();
  else if(state.view==="picker"&&state.course) showAreaPicker();
  else if(state.view==="training"&&state.currentTask) renderTraining();
  else if(state.view==="progress"&&state.course) showProgress();
  else if(state.view==="summary"&&state.course) renderSessionDone();
  else renderHome();
}

window.KG_TEST_ANSWER_CHECKER=function(){
  const cases=[
    ["11y+3","3+11y",true],
    ["5y-y+2y","6y",true],
    ["(x+1)^2","x^2+2x+1",true],
    ["2(x+3)","2x+6",true],
    ["1,5","1.5",true],
    ["3/4","0,75",true],
    ["x=2","2=x",true],
    ["2x=4","x=2",true],
    ["x+1","x+2",false]
  ];
  const result=cases.map(([u,e,want])=>{
    const got=algebraicallyEquivalent(u,e) || oneAnswerCorrect(u,e,{});
    return {elevsvar:u,facit:e,förväntat:want,resultat:got,ok:got===want};
  });
  console.table(result);
  return result.every(x=>x.ok);
};
