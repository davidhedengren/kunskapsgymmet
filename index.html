function renderTraining(){
  state.view="training";
  const t=state.currentTask;
  if(!t) return renderDashboard();
  if(arAlt(t)) return renderAltTask(t);
  const family=Array.isArray(t.familj)?t.familj.join(" · "):t.familj;
  const layout=answerLayout(t);
  const expectedInfo=layout.info;
  const canAuto=expectedInfo.auto;
  const inputCount=layout.n;

  const meta=levelChip(t)+toolIcons(t);

  const isLongAnswer=["resonemang","text"].includes(String(t.svarstyp||"").toLowerCase());

  const stepwise=canAuto && inputCount>1 && layout.ordnad;
  const bedomsSjalv=i=>!layout.delAuto[i];
  const plan=layout.plan;

  const rutEtikett=i=>{
    const del = plan ? plan.rutor[i].del : i;

    if(layout.etiketter && layout.etiketter[del]!==undefined){
      const namn=String(layout.etiketter[del]);
      const flera=plan && plan.delar[del].svar.length>1;
      return flera ? namn+" "+(plan.rutor[i].plats+1) : namn;
    }
    if(inputCount<2) return "";
    if(!plan) return layout.ordnad?String.fromCharCode(97+i)+")":(i+1)+".";
    const r=plan.rutor[i], flera=plan.delar[r.del].svar.length>1;
    const bok=String.fromCharCode(97+r.del);
    return layout.ordnad ? (flera?bok+(r.plats+1):bok+")") : (i+1)+".";
  };
  const rutEnhet=i=>plan ? (plan.delar[plan.rutor[i].del].enhet[plan.rutor[i].plats]||"") : "";

  const laasta=i=>{
    if(!stepwise) return false;
    if(!plan) return i>0;
    return plan.rutor[i].del !== plan.rutor[0].del;
  };
  const fieldHtml=Array.from({length:inputCount},(_,i)=>{
    const etikett=rutEtikett(i);
    const bred=String(etikett).replace(/<[^>]*>/g,"").trim().length>4;
    return `
    <div class="apart${laasta(i)?" upcoming":""}${bedomsSjalv(i)?" egen":""}${bred?" bred":""}${etikett?"":" utan-etikett"}" id="part-${i}">
      <div class="aline">
        ${etikett?`<label for="ans-${i}">${etikett}</label>`:""}
        ${isLongAnswer
          ? `<textarea id="ans-${i}" name="kgsvar${i}" autocomplete="off" autocorrect="off"
              autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore
              data-form-type="other"${etikett?"":` aria-label="Ditt svar"`} placeholder="Skriv ditt svar här"${laasta(i)?" disabled":""} onfocus="state.aktivRuta=${i}"></textarea>`
          : `<input id="ans-${i}" name="kgsvar${i}" autocomplete="off" autocorrect="off"
              autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore
              data-form-type="other" type="text"${etikett?"":` aria-label="Ditt svar"`}
              inputmode="${sifferlage(expectedInfo.answers[i],rutEnhet(i))?"decimal":"text"}"
              placeholder="${
                rutEnhet(i) ? "Svar i "+esc(rutEnhet(i))
                : inputCount<2 ? (arRotLista(expectedInfo.answers[i]) ? "Alla lösningar, t.ex. x = 1, 4" : "Ditt svar")
                : layout.ordnad ? "Svar "+String.fromCharCode(97+i) : "Svar "+(i+1)
              }"${laasta(i)?" disabled":""}
              onfocus="state.aktivRuta=${i}"
              onkeydown="if(event.key==='Enter' && ${canAuto})checkAnswer()">`
        }
        ${canAuto?`<span class="mark" aria-hidden="true"></span>`:""}
      </div>
      <div class="corr" id="corr-${i}" hidden></div>
      <div class="delfacit" id="delfacit-${i}" hidden></div>
    </div>`;
  }).join("");

  const antalDelar = plan ? plan.delar.length : inputCount;
  const partLine = stepwise
    ? `<div class="partline" id="partline">
        ${Array.from({length:inputCount},(_,i)=>`<i class="${i===0?'now':''}"></i>`).join("")}
        <span id="partlabel">Deluppgift a av ${antalDelar}</span>
      </div>`
    : layout.flersvar
      ? `<div class="partline"><span>${inputCount===2?"Två svar":inputCount+" svar"} · ordningen spelar ingen roll</span></div>`
      : "";

  const dots=Array.from({length:state.sessionTarget},(_,i)=>
    `<i class="${i<state.sessionDone?'done':(i===state.sessionDone?'now':'')}"></i>`).join("");

  app.innerHTML=`
    <div class="tshell view">
      <div class="ttop">
        <button class="crumb" onclick="backToDashboard()"><span aria-hidden="true">←</span> Avsluta</button>
        ${xpMeterHtml()}
        <span class="tag" style="background:transparent;border-color:var(--hair)">${esc(sessionLabel())}</span>
        <div class="dots" title="${state.sessionDone} av ${state.sessionTarget}">${dots}</div>
        <button class="iconbtn" onclick="toggleTheme()" title="Byt färgläge">${themeIcon()}</button>
      </div>
      <article class="task">
        <div class="tmeta">${meta}${felFlaggaHtml(t)}</div>
        <div class="tbody">${t.t||""}</div>
        <div class="azone" id="answer-zone">
          <div class="notice"><b aria-hidden="true">✎</b><span>Skriv ner fullständiga lösningar med papper och penna innan du skriver in svaren här.</span></div>
          <h3>Ditt svar</h3>
          ${partLine}
          <div class="ainputs">${fieldHtml}</div>
          ${isLongAnswer?"":symbolrad(t)}
          <div id="ledtrad-holder">${state.hintVisible?ledtradRuta(t):""}</div>
          <div class="aacts">
            ${canAuto
              ? `<button class="btn primary" id="kollaknapp" onclick="checkAnswer()">Kontrollera</button>
                 ${t.ledtrad&&!state.hintVisible?`<button class="btn" id="ledtradknapp" onclick="visaLedtrad()">Visa ledtråd</button>`:""}
                 <button class="btn" onclick="showSolution()">Visa lösning</button>`
              : `${t.ledtrad&&!state.hintVisible?`<button class="btn" id="ledtradknapp" onclick="visaLedtrad()">Visa ledtråd</button>`:""}
                 <button class="btn primary" onclick="showSolution()">Visa facit och jämför</button>`}
            <span class="hm-grupp">${hjalpKnappar(t)}</span>
          </div>
          ${canAuto
            ? (layout.blandad
                ? `<div class="hint">Delar utan entydigt svar bedömer du själv mot facit.</div>`
                : "")
            : `<div class="hint">Den här uppgiften bedömer du själv efter att du sett facit.</div>`}
          <div id="answer-result" role="status" aria-live="polite"></div>
          <div id="solution-holder"></div>
        </div>
      </article>
    </div>`;
  afterRender();
  setTimeout(()=>document.getElementById("ans-0")?.focus(),60);
}

/* =======================================================================
   Alternativuppgifter (flervalsfrågor med flera möjliga rätta svar)

   Banken skriver:
     svarstyp:"alternativ",
     alternativ:[
       {txt:"...", ratt:true, kommentar:"...", miss:"tendens_som_diskvalificering"},
       ...
     ]
   Poäng: antalet rätt markerade minus antalet felaktigt markerade, delat
   med antalet rätta alternativ. Den andelen går in i den vanliga
   XP- och färdighetsmotorn som en lista deluppgifter, så ett rätt av två
   ger halva poängen och alla rätt ger full.
   ===================================================================== */
/* =======================================================================
   Källor i egen ruta

   En uppgift kan bära med sig sina källor:

     kallor:[{ bet:"A", titel:"...", typ:"Brev, 1719",
               akthet:"autentisk" | "konstruerad",
               text:`<p>...</p>`,          // hela källan, inte ett referat
               om:`<p>...</p>`,            // vad eleven vet om tillkomsten
               referens:"..." }]

   Poängen är att källan ska gå att läsa i sin helhet medan uppgiften
   besvaras. En källa som bara sammanfattas i frågetexten går inte att
   analysera — då återstår bara att känna igen etiketten.
   ===================================================================== */
function kallorFor(t){
  const k=t?.kallor;
  return Array.isArray(k) ? k.filter(Boolean) : [];
}
function kallBeteckning(k,i){ return String(k.bet || String.fromCharCode(65+i)); }

function kallRad(t,plats){
  const kallor=kallorFor(t);
  if(!kallor.length) return "";
  return `<div class="kallrad">${kallor.map((k,i)=>`
    <button class="kallknapp" type="button" onclick="oppnaKalla(${i})"
      title="Öppna källan i eget fönster">
      <span class="kallbet" aria-hidden="true">${esc(kallBeteckning(k,i))}</span>
      <span>
        <span class="kallnamn">${esc(k.titel||("Källa "+kallBeteckning(k,i)))}</span>
        ${k.typ?`<span class="kallmeta">${esc(k.typ)}</span>`:""}
      </span>
    </button>`).join("")}</div>`;
}

function oppnaKalla(i){
  const t=state.currentTask;
  const kallor=kallorFor(t);
  if(!kallor.length) return;
  stangKalla();
  state.kalla={i:Math.max(0,Math.min(i|0,kallor.length-1)),uppgift:t.id};
  const el=document.createElement("div");
  el.className="modal"; el.id="kallruta";
  el.innerHTML=`<div class="modal-kort kallkort" role="dialog" aria-modal="true"
      aria-label="Källa">
      <div class="modal-topp">
        <div>
          <div class="lbl kall-lbl"></div>
          <h2 class="kall-rubrik"></h2>
        </div>
        <button class="iconbtn" onclick="stangKalla()" aria-label="Stäng">✕</button>
      </div>
      <div class="kall-innehall"></div>
      <div class="modal-fot">
        <span class="spacer"></span>
        <button class="btn primary" onclick="stangKalla()">Tillbaka till frågan</button>
      </div>
    </div>`;
  document.body.appendChild(el);
  el.addEventListener("click",e=>{ if(e.target===el) stangKalla(); });
  ritaKalla();
  requestAnimationFrame(()=>el.classList.add("visa"));
}
function stangKalla(){
  state.kalla=null;
  const el=document.getElementById("kallruta");
  if(!el) return;
  el.removeAttribute("id");
  el.classList.remove("visa");
  setTimeout(()=>el.remove(),250);
}
function kallGa(i){
  if(!state.kalla) return;
  state.kalla.i=i;
  ritaKalla();
  const kort=document.querySelector("#kallruta .modal-kort");
  if(kort) kort.scrollTop=0;
}
function ritaKalla(){
  const ruta=document.getElementById("kallruta");
  const st=state.kalla;
  if(!ruta||!st) return;
  const host=ruta.querySelector(".kall-innehall");
  if(!host) return;
  const kallor=kallorFor(state.currentTask);
  const k=kallor[st.i];
  if(!k) return;
  const bet=kallBeteckning(k,st.i);
  const lbl=ruta.querySelector(".kall-lbl");
  const rub=ruta.querySelector(".kall-rubrik");
  if(lbl) lbl.textContent="Källa "+bet+(k.typ?" · "+k.typ:"");
  if(rub) rub.textContent=k.titel||("Källa "+bet);

  /* Äkthetsmärkningen är till för läraren lika mycket som för eleven:
     en konstruerad källa får aldrig passera som ett autentiskt citat. */
  const stampel = k.akthet==="autentisk"
    ? `<span class="kall-stampel autentisk">Autentisk källa</span>`
    : k.akthet==="konstruerad"
      ? `<span class="kall-stampel konstruerad">Konstruerad källa</span>`
      : "";

  const flikar = kallor.length>1
    ? `<div class="kall-flik">${kallor.map((x,i)=>
        `<button class="${i===st.i?"nu":""}" onclick="kallGa(${i})">Källa ${
          esc(kallBeteckning(x,i))}</button>`).join("")}</div>`
    : "";

  host.innerHTML=`
    ${flikar}
    ${stampel?`<div style="margin-bottom:12px">${stampel}</div>`:""}
    <div class="kall-text">${k.text||""}</div>
    ${k.om?`<div class="kall-om">
      <span class="kall-omlbl">Det här vet du om källan</span>${k.om}</div>`:""}
    ${k.referens?`<p class="kall-referens">${esc(k.referens)}</p>`:""}`;
  renderMath(host);
}

function arAlt(t){
  return String(t?.svarstyp||"").toLowerCase()==="alternativ"
      && Array.isArray(t.alternativ) && t.alternativ.length>0;
}
function altRader(t){
  return t.alternativ.map(a=>(typeof a==="string"?{txt:a}:a||{}))
    .map(a=>({txt:String(a.txt??a.text??""),ratt:!!a.ratt,
              kommentar:a.kommentar||"",miss:a.miss||null,sist:!!a.sist}));
}
/* Alternativen blandas per uppgift. Annars blir platsen i listan en ledtråd
   i sig, och eleven kan lära sig ordningen i stället för innehållet.
   Ett alternativ märkt sist:true hålls kvar längst ner — dit hör t.ex.
   "Detta är inte ett exempel på ett historiebruk", som ska ligga på samma
   ställe varje gång så att eleven vet att möjligheten alltid finns. */
function altOrdna(t){
  const rader=altRader(t);
  const rorliga=rader.map((r,i)=>i).filter(i=>!rader[i].sist);
  const fasta=rader.map((r,i)=>i).filter(i=>rader[i].sist);
  for(let i=rorliga.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [rorliga[i],rorliga[j]]=[rorliga[j],rorliga[i]];
  }
  return rorliga.concat(fasta);
}
function altLista(t){
  const rader=altRader(t);
  if(state.altOrdningId!==t.id){
    state.altOrdningId=t.id;
    state.altOrdning=altOrdna(t);
  }
  const ord=state.altOrdning||rader.map((_,i)=>i);
  return ord.map(i=>rader[i]).filter(Boolean);
}
function altAntalRatt(t){ return altLista(t).filter(a=>a.ratt).length || 1; }

function vaxlaAlt(i){
  if(state.answered) return;
  state.altValda ||= new Set();
  state.altValda.has(i) ? state.altValda.delete(i) : state.altValda.add(i);
  const el=document.getElementById("alt-"+i);
  if(el){
    el.classList.toggle("vald",state.altValda.has(i));
    el.setAttribute("aria-pressed",state.altValda.has(i)?"true":"false");
  }
  const knapp=document.getElementById("altknapp");
  if(knapp) knapp.disabled=state.altValda.size===0;
  const fot=document.getElementById("altfot");
  if(fot) fot.textContent=state.altValda.size
    ? `${state.altValda.size} markerade`
    : "Markera det eller de alternativ du bedömer som riktiga.";
}

function renderAltTask(t){
  const lista=altLista(t);
  state.altValda ||= new Set();
  const dots=Array.from({length:state.sessionTarget},(_,i)=>
    `<i class="${i<state.sessionDone?'done':(i===state.sessionDone?'now':'')}"></i>`).join("");

  const alternativ=lista.map((a,i)=>`
    <button class="alt" id="alt-${i}" type="button" aria-pressed="false"
      onclick="vaxlaAlt(${i})">
      <span class="ruta" aria-hidden="true">✓</span>
      <span class="alttxt">${a.txt}<span class="kommentar" id="altkom-${i}" hidden></span></span>
    </button>`).join("");

  app.innerHTML=`
    <div class="tshell view">
      <div class="ttop">
        <button class="crumb" onclick="backToDashboard()"><span aria-hidden="true">←</span> Avsluta</button>
        ${xpMeterHtml()}
        <span class="tag" style="background:transparent;border-color:var(--hair)">${esc(sessionLabel())}</span>
        <div class="dots" title="${state.sessionDone} av ${state.sessionTarget}">${dots}</div>
        <button class="iconbtn" onclick="toggleTheme()" title="Byt färgläge">${themeIcon()}</button>
      </div>
      <article class="task">
        <div class="tmeta">${levelChip(t)}${felFlaggaHtml(t)}</div>
        <div class="tbody">${t.t||""}${kallRad(t)}</div>
        <div class="azone" id="answer-zone">
          <h3>Ditt svar</h3>
          <div class="altfot" id="altfot">Markera det eller de alternativ du bedömer som riktiga.</div>
          <div class="altlista">${alternativ}</div>
          <div id="ledtrad-holder">${state.hintVisible?ledtradRuta(t):""}</div>
          <div class="aacts">
            <button class="btn primary" id="altknapp" onclick="kollaAlt()" disabled>Kontrollera</button>
            ${t.ledtrad&&!state.hintVisible?`<button class="btn" id="ledtradknapp" onclick="visaLedtrad()">Visa ledtråd</button>`:""}
            <button class="btn" onclick="showSolution()">Visa svar</button>
            <span class="hm-grupp">${hjalpKnappar(t)}</span>
          </div>
          <div id="answer-result" role="status" aria-live="polite"></div>
          <div id="solution-holder"></div>
        </div>
      </article>
    </div>`;
  afterRender();
}

function kollaAlt(){
  if(state.answered) return;
  const t=state.currentTask;
  const lista=altLista(t);
  const valda=state.altValda||new Set();
  if(!valda.size){ toast("Markera minst ett alternativ."); return; }

  const antalRatt=altAntalRatt(t);
  let traffar=0, missar=0;
  const miss=[];

  lista.forEach((a,i)=>{
    const el=document.getElementById("alt-"+i);
    const kom=document.getElementById("altkom-"+i);
    const vald=valda.has(i);
    if(el){
      el.disabled=true;
      el.classList.remove("vald");
      if(vald && a.ratt) el.classList.add("ratt");
      else if(vald && !a.ratt) el.classList.add("fel");
      else if(!vald && a.ratt) el.classList.add("ratt","missad");
      const ruta=el.querySelector(".ruta");
      if(ruta) ruta.textContent = a.ratt ? "✓" : (vald?"✕":"");
    }
    /* Kommentaren visas för det eleven tog ställning till och för de rätta
       hen missade — inte för alternativ som varken valdes eller var rätta. */
    if(kom && a.kommentar && (vald||a.ratt)){ kom.hidden=false; kom.innerHTML=a.kommentar; }
    if(vald && a.ratt) traffar++;
    if(vald && !a.ratt){ missar++; if(a.miss) miss.push(a.miss); }
  });

  state.altMiss=miss;
  const poang=Math.max(0,traffar-missar)/antalRatt;
  const delar=Array.from({length:antalRatt},(_,i)=>i<Math.round(poang*antalRatt));

  const knapp=document.getElementById("altknapp");
  if(knapp) knapp.remove();
  const fot=document.getElementById("altfot");
  if(fot) fot.textContent = `${traffar} av ${antalRatt} rätta markerade`
    + (missar?` · ${missar} felaktig${missar===1?"t":"a"} val`:"");

  finishAttempt(delar);
  renderMath(document.getElementById("answer-zone"));
}

function checkAnswer(){
  if(state.answered) return;
  const t=state.currentTask;
  const info=expectedAnswersForTask(t);
  const expected=info.answers;
  if(!info.auto || !expected.length){
    toast("Den här uppgiften behöver självbedömas.");
    return;
  }
  const layout=answerLayout(t);

  if(layout.flersvar){
    const svar=expected.map((_,i)=>document.getElementById("ans-"+i)?.value||"");
    if(svar.some(x=>!x.trim())){ toast("Fyll i alla svar först."); return; }
    const kvar=expected.map((v,i)=>({v,i}));
    const res=svar.map(anv=>{
      const träff=kvar.findIndex(k=>delSvarRatt(anv,k.v,
        Array.isArray(t.svarEnhet)?t.svarEnhet[k.i]:t.svarEnhet,
        Array.isArray(t.tolerans)?t.tolerans[k.i]:t.tolerans,
        t,k.i,
        Array.isArray(t.svarFormat)?t.svarFormat[k.i]:t.svarFormat));
      if(träff<0) return false;
      kvar.splice(träff,1);
      return true;
    });
    res.forEach((ok,i)=>markPart(i,ok,ok?null:kvar.map(k=>k.v).join(" eller ")));
    state.partResults=res;
    finishAttempt(res);
    return;
  }

  const plan=layout.plan;
  if(plan){
    const del=plan.rutor[state.partIndex]?.del;
    if(del===undefined) return;
    const rutor=plan.rutor.map((r,idx)=>({...r,idx})).filter(r=>r.del===del);
    const d=plan.delar[del];

    if(!d.auto){ visaDelfacit(rutor[0].idx,del); return; }

    const varden=rutor.map(r=>document.getElementById("ans-"+r.idx)?.value||"");
    if(varden.some(x=>!x.trim())){ toast("Fyll i alla svar för deluppgiften."); return; }

    const kvar=d.svar.map((v,j)=>({v,j}));
    const utfall=varden.map(anv=>{
      const träff=kvar.findIndex(k=>delSvarRatt(anv,k.v,d.enhet[k.j],d.tol[k.j],t,k.j,d.format[k.j]));
      if(träff<0) return false;
      kvar.splice(träff,1);
      return true;
    });
    utfall.forEach((ok,j)=>markPart(rutor[j].idx,ok,ok?null:facitText(d,kvar)));
    rutor.forEach((r,j)=>{ state.partResults[r.idx]=utfall[j]; });

    if(d.manuell && utfall.every(Boolean)){
      visaDelfacit(rutor[rutor.length-1].idx,del,true);
      return;
    }
    gaVidare(rutor[rutor.length-1].idx+1,layout.n);
    return;
  }

  const i=state.partIndex;
  const el=document.getElementById("ans-"+i);
  const svar=el ? el.value : "";
  if(!svar.trim()){ toast("Skriv ett svar först."); return; }

  if(!layout.delAuto[i]){
    visaDelfacit(i);
    return;
  }

  const enkelFormat=Array.isArray(t.svarFormat)?t.svarFormat[i]:t.svarFormat;
  const enkelEnhet=Array.isArray(t.svarEnhet)?t.svarEnhet[i]:t.svarEnhet;
  const enkelTol=Array.isArray(t.tolerans)?t.tolerans[i]:t.tolerans;
  const ok=delSvarRatt(svar,expected[i],enkelEnhet,enkelTol,t,i,enkelFormat);
  registreraDel(i,ok,visatFacitUttryck(visatFacitTal(expected[i],enkelTol),enkelFormat));
}

/* Ett facit som 34.657359027997266 visas avrundat som uppgiften ber om ("34,7" vid
   "en decimal", tre värdesiffror vid "tre värdesiffror"), annars med högst fyra decimaler. */
/* Utan instruktion om decimaler/värdesiffror avrundas facit efter toleransen: så få decimaler
   som möjligt men ändå inom toleransen (0,51 kring 33,333 visas som 33,3). */
function visatFacitTal(v,tol){
  if(typeof v!=="number" || !Number.isFinite(v) || Number.isInteger(v)) return String(v);
  const txt=String(state.currentTask?.t||"").replace(/<[^>]+>/g," ");
  const ord={en:1,ett:1,två:2,tre:3,fyra:4};
  const md=txt.match(/(en|två|tre|fyra|[1-4])\s+decimal/i);
  const mv=txt.match(/(en|två|tre|fyra|[1-5])\s+värdesiffr/i);
  let s;
  if(md) s=v.toFixed(ord[md[1].toLowerCase()]||+md[1]);
  else if(mv){ const n=ord[mv[1].toLowerCase()]||+mv[1]; s=Math.abs(v)>=1e-4&&Math.abs(v)<1e6 ? String(Number(v.toPrecision(n))) : v.toPrecision(n); }
  else if(typeof tol==="number" && tol>0 && Math.abs(v)>=1e-4){
    const d=Math.max(-12,Math.min(4,Math.ceil(-Math.log10(tol))));
    const steg=Math.pow(10,-d);
    s=d>=0 ? String(Number(v.toFixed(d))) : String(Math.round(v/steg)*steg);
  }
  else s=String(Math.abs(v)>=1e-4 ? Number(v.toFixed(4)) : Number(v.toPrecision(4)));
  return s.replace(".",",");
}
/* Facit som lagrats i maskinform visas som eleven skulle skriva det:
   lösningsmängden "{30,150}" som "30, 150" och "(9)/(5)-(7)/(5)*i" som "9/5-7/5·i". */
function visatFacitUttryck(v,format){
  let s=String(v);
  if(MANGD_FORMAT.has(format) && /^\s*\{[^{}]*\}\s*$/.test(s) && !/\\/.test(s))
    s=s.trim().slice(1,-1).split(",").map(x=>x.trim()).join(", ");
  if(!/\\/.test(s)) s=s.replace(/\((\d+(?:\.\d+)?)\)(?=\/)|(?<=\/)\((\d+(?:\.\d+)?)\)/g,(m,a,b)=>a??b)
                        .replace(/(?<=\d)\*(?=[a-zπ])/gi,"·");
  return s;
}
function facitText(d,kvar){
  return (kvar.length?kvar:d.svar.map((v,j)=>({v,j})))
    .map(k=>{
      /* LaTeX-facit (\frac, \sin ...) visas som formel i stället för som rå kod. */
      /* "<" i olikheter (1<x<=7) skulle annars tolkas som en HTML-tagg. */
      const v=visatFacitUttryck(visatFacitTal(k.v,d.tol?.[k.j]),d.format?.[k.j]).replace(/<(?!\/?(?:sup|sub|b|i|em|strong|br)\b)/g,"&lt;");
      const text=(/\\[a-zA-Z]/.test(v) && !v.includes("\\(")) ? "\\("+v+"\\)" : v;
      return text+(d.enhet[k.j]?" "+d.enhet[k.j]:"");
    })
    .join(" eller ");
}
function gaVidare(nasta,total){
  state.partIndex=nasta;
  if(state.partIndex>=total) finishAttempt(state.partResults.slice(0,total));
  else openPart(state.partIndex,total);
}

function registreraDel(i,ok,facit){
  state.partResults[i]=ok;
  markPart(i,ok,facit);
  gaVidare(i+1,answerLayout(state.currentTask).n);
}

function visaDelfacit(i,delIndex,komplettering){
  const t=state.currentTask;
  const rad=document.getElementById("part-"+i);
  if(!rad) return;
  const inp=document.getElementById("ans-"+i);
  if(inp) inp.readOnly=true;
  const ruta=document.getElementById("delfacit-"+i);
  if(ruta){
    const nyckel = delIndex!==undefined ? delIndex : i;
    ruta.hidden=false;
    ruta.innerHTML=`<div class="lbl">${komplettering?"Jämför med facit":"Facit för den här delen"}</div>
      <div class="delfacit-txt">${delfacitText(t,nyckel)}</div>
      ${komplettering?`<div class="hint" style="margin-top:8px">Uträkningen stämmer. Stämmer även din motivering?</div>`:""}
      <div class="aacts">
        <button class="btn soft sm" onclick="bedomDel(${i},true,${delIndex??-1})">${komplettering?"Ja, den stämmer":"Jag hade rätt"}</button>
        <button class="btn sm" onclick="bedomDel(${i},false,${delIndex??-1})">${komplettering?"Nej, inte riktigt":"Jag behöver träna mer"}</button>
      </div>`;
    renderMath(ruta);
  }
}

function delfacitText(t,i){
  const d=t.delfacit||t.facitDelar||t.delsvar;
  if(Array.isArray(d)&&d[i]) return d[i];
  return t.s||"Facit saknas.";
}
function bedomDel(i,ok,delIndex){
  const ruta=document.getElementById("delfacit-"+i);
  if(ruta){ ruta.hidden=true; ruta.innerHTML=""; }
  const layout=answerLayout(state.currentTask);
  const plan=layout.plan;
  if(plan && delIndex!==undefined && delIndex>=0){
    const rutor=plan.rutor.map((r,idx)=>({...r,idx})).filter(r=>r.del===delIndex);
    rutor.forEach(r=>{

      const redan=state.partResults[r.idx];
      const nytt = redan===undefined ? ok : (redan && ok);
      state.partResults[r.idx]=nytt;
      if(!ok) markPart(r.idx,nytt,null);
    });
    gaVidare(rutor[rutor.length-1].idx+1,layout.n);
    return;
  }
  registreraDel(i,ok,null);
}

function markPart(i,ok,facit){
  const row=document.getElementById("part-"+i);
  if(!row) return;
  row.classList.add(ok?"ok":"no");
  const mark=row.querySelector(".mark");
  if(mark) mark.textContent=ok?"✓":"✕";
  const inp=document.getElementById("ans-"+i);
  if(inp) inp.readOnly=true;
  const dot=document.querySelectorAll("#partline i")[i];
  if(dot) dot.className=ok?"done":"miss";
  if(!ok && facit){
    const c=document.getElementById("corr-"+i);
    if(c){ c.hidden=false; c.innerHTML=`Rätt svar: <b>${facit}</b>`; renderMath(c); }
  }
}

function openPart(i,total){
  const plan=answerLayout(state.currentTask).plan;

  const syskon = plan
    ? plan.rutor.map((r,idx)=>({...r,idx})).filter(r=>r.del===plan.rutor[i]?.del)
    : [{idx:i}];
  syskon.forEach((r,n)=>{
    const row=document.getElementById("part-"+r.idx);
    if(row) row.classList.remove("upcoming");
    const inp=document.getElementById("ans-"+r.idx);
    if(inp){ inp.disabled=false; if(n===0) setTimeout(()=>inp.focus(),40); }
  });
  const line=document.getElementById("partline");
  if(line){
    [...line.querySelectorAll("i")].forEach((d,n)=>{
      d.className = n<i ? (state.partResults[n]?"done":"miss") : (n===i?"now":"");
    });
    const lbl=document.getElementById("partlabel");
    const delNr = plan ? plan.rutor[i]?.del ?? 0 : i;
    const antal = plan ? plan.delar.length : total;
    if(lbl) lbl.textContent=`Deluppgift ${String.fromCharCode(97+delNr)} av ${antal}`;
  }
}

function giveUp(){
  if(state.answered) return;
  const info=expectedAnswersForTask(state.currentTask);
  const n=Math.max(1,info.answers.length);
  finishAttempt(Array.from({length:n},(_,i)=>state.partResults[i]===true));
}

const XP_TRANING={1:6,2:8,3:12,4:18,5:26};
/* Bonus för ett helt genomfört pass med minst PASS_BONUS_MIN uppgifter.
   Bonusen ges i proportion till andelen rätt i passet, så att ett pass
   med bara fel svar inte ger någon XP. Servern har ett eget tak:
   kg_profile släpper igenom högst 100 XP per pass och räknar högst ett
   pass per 4 försök, bokfört i
   kg_private.state.pass_bonus_paid. Ändras siffrorna här måste de ändras i
   kg_profile också, annars stämplas eleven för score_delta. */
const PASS_BONUS_XP=100;
const PASS_BONUS_MIN=4;

const SERIETRAPPA=[[12,1.6],[8,1.4],[5,1.25],[3,1.15]];
function seriefaktor(run){
  for(const [gräns,f] of SERIETRAPPA) if(run>=gräns) return f;
  return 1;
}

function seriebonus(run){ return Math.round((seriefaktor(run)-1)*100); }

/* Metoder hämtas från aktuell uppgiftsdata även för äldre svarhistorik.
   Två fel på samma metod behövs; fel på andra kombinationsuppgifter räcker
   inte för att rekommendera en specialiserad genomgång. */
function genomgangMetoderForSvar(svar){
  const id=String(svar?.id||"").replace(/:([a-z])$/,"$1");
  const task=state.data?.bank?.find(t=>t.id===id)
    || availableTasks().find(t=>t.id===id);
  return Array.isArray(task?.metoder)?task.metoder:[];
}
function metodGenomgang(steg,historik){
  const fel={};
  for(const h of historik){
    if(h.ok!==false) continue;
    for(const m of new Set(genomgangMetoderForSvar(h))) fel[m]=(fel[m]||0)+1;
  }
  for(const m of Object.keys(fel).sort((a,b)=>fel[b]-fel[a])){
    if(fel[m]<2) continue;
    const mal=steg.find(s=>s.metoder?.includes(m));
    if(mal) return mal;
  }
  return null;
}

/* Efter återkommande fel kan eleven få en enda relevant väg vidare. Förslaget
   visas aldrig efter ett enstaka misstag och samma område har 48 timmars paus. */
function hittaGenomgangForslag(t,cp){
  if(!t?.omr || !cp?.history?.length) return null;
  const nu=Date.now(), tvaVeckor=14*24*60*60*1000;
  const senaste=cp.history.filter(h=>h.area===t.omr && nu-(h.at||0)<tvaVeckor).slice(-4);
  if(senaste.length<2 || senaste.filter(h=>!h.ok).length<2) return null;

  const kort=getCards().find(k=>k.omr.includes(t.omr) && harKunskapKort(k));
  if(!kort) return null;
  const steg=kunskapSteg(kort.kap,kort.key);
  if(!steg.length) return null;

  const familjer=(Array.isArray(t.familj)?t.familj:[t.familj]).filter(Boolean);
  const relevant=steg.find(s=>!s.metoder?.length && s.traningsfamilj && familjer.includes(s.traningsfamilj));
  const mal=metodGenomgang(steg,senaste) || relevant
    || steg.find(s=>!s.metoder?.length && !ggLast(s.familj)) || steg.find(s=>!s.metoder?.length) || steg[0];
  if(!mal) return null;
  const last=(profile.genomgangar||{})[ggNyckel(mal.familj)];
  if(mal.metoder?.length && typeof last==="number" && nu-last<2*864e5) return null;

  const nyckel=[state.course,state.track||"",t.omr].join("|");
  const senastVisad=profile.ggForslagVisade?.[nyckel]||0;
  if(nu-senastVisad<48*60*60*1000) return null;
  profile.ggForslagVisade ||= {};
  profile.ggForslagVisade[nyckel]=nu;
  return {kap:String(kort.kap),kortNyckel:kort.key,familj:mal.familj,
    omrade:kort.name,rubrik:mal.genomgang?.rubrik||"genomgången"};
}
/* Tränaren föreslår genomgången i chattbubblan under passet. Bubblan
   ligger kvar tills eleven väljer eller stänger den. */
function tranarForeslarGenomgang(f){
  if(!f || state.ggForslag!==f) return;
  tranarenSager(`Du har haft några missar i <b>${esc(f.omrade)}</b>. Vill du läsa den korta genomgången ”${esc(f.rubrik)}” innan vi fortsätter?`
    +`<span class="tchat-knappar"><button class="btn sm primary" onclick="tchatStang();oppnaForeslagenGenomgang()">Läs genomgången</button>`
    +`<button class="btn sm quiet" onclick="tchatStang();avvisaGenomgangForslag()">Inte nu</button></span>`,{html:true,kvar:true});
}
function oppnaForeslagenGenomgang(){
  const f=state.ggForslag;
  if(!f) return;
  state.ggForslag=null;
  oppnaKunskap(f.kap,f.kortNyckel,f.familj);
}
function avvisaGenomgangForslag(){
  state.ggForslag=null;
  document.getElementById("gg-forslag")?.remove();
}

// Poängreglerna måste hållas förenliga med serverns gränser vid ändringar.
function arbetsfaktor(t){
  // Bedöms redaktionellt; varken antal svarsrutor eller elevens tid styr XP.
  const w=t?.arbetsinsats;
  return w===2?2:w===3?3:1;
}
function xpFor(traningsniva,correct,run,t){
  if(!correct) return 2;
  const L=Math.max(1,Math.min(5,Number(traningsniva)||2));
  const bas=XP_TRANING[L]||XP_TRANING[2];
  const xp=Math.round(bas*arbetsfaktor(t)*seriefaktor(run));
  return Math.min(80,xp);
}

function finishAttempt(resultat){
  if(state.answered) return;
  const t=state.currentTask;
  const delar=Array.isArray(resultat)?resultat.map(Boolean):[!!resultat];
  const ratt=delar.filter(Boolean).length;
  const andel=ratt/delar.length;
  const correct=ratt===delar.length;
  state.answered=true; state.sessionDone++;
  if(!correct){ (state.sessionFel ||= []).push(t); }
  sparaPagaendePass();

  const xpBefore=profile.xp;
  const levelBefore=levelFromXP(profile.xp);
  const goal=profile.goal||8;
  const beforeToday=todayCount();

  touchDay();
  profile.attempts++;
  /* Räknas före serien uppdateras: gjorde eleven den här uppgiften direkt
     efter ett fel? Då är det ett försök till som inte gavs upp. */
  if(profile.sistFel) profile.fortsatt=(profile.fortsatt||0)+1;
  profile.sistFel=!correct;

  if(correct){
    profile.correct++;
    profile.run=(profile.run||0)+1;
    profile.bestRun=Math.max(profile.bestRun||0,profile.run);
    if(levelNumber(t)>=3) profile.aCorrect=(profile.aCorrect||0)+1;
  }else{
    profile.run=0;
  }
  const bas=xpFor(levelNumber(t),true,profile.run,t);
  /* Helt fel svar ger ingen XP. Tidigare gav det två, vilket gjorde att
     mätaren rörde sig även när ingenting satt, och det underminerar vad
     mätaren är till för. Delvis rätt ger fortfarande XP i proportion, så
     att flerdelade uppgifter lönar sig att kämpa med. */
  let xp = correct ? bas
         : andel>0 ? Math.max(1,Math.round(bas*andel))
         : 0;

  if(state.hintUsed && xp) xp=Math.max(1,Math.round(xp*.5));
  if(state.noXp) xp=0;
  profile.xp+=xp;
  // Fire-and-forget: global + aggregerad adminstatistik får aldrig blockera ett svar.
  kgRegistreraForsok(correct,xp,state.course,!!state.hintUsed);
  profile.today=(profile.today||0)+1;
  state.sessionXp+=xp;
  if(correct) state.sessionCorrect++;

  const cp=ensureCourseProfile();
  const fs=Array.isArray(t.familj)?t.familj:[t.familj].filter(Boolean);
  const niva=levelOf(t);
  const kriterier=(Array.isArray(t.kriterier)?t.kriterier:[t.kriterier]).filter(Boolean);
  if(state.course==="hist") cp.histSkills ||= {};
  /* Rätt med ledtråd räknas som halvt bevis på behärskning. */
  const ledVikt=state.hintUsed ? LEDTRAD_VIKT : 1;
  const nivaFore=tranarNivaLage(t.omr);
  delar.forEach(d=>{
    const v=state.noXp?false:d;
    updateMastery(cp.areas,t.omr,v,ledVikt);
    updateLevelStat(t.omr,niva,v,ledVikt);
    fs.forEach(f=>updateMastery(cp.families,f,v,ledVikt));
    if(state.course==="hist") kriterier.forEach(k=>updateMastery(cp.histSkills,k,v));
  });

  let lagat=false;
  if(correct && !state.noXp){
    let forra=null;
    for(let i=cp.history.length-1;i>=0;i--) if(cp.history[i].id===t.id){ forra=cp.history[i]; break; }
    if(forra && !forra.ok){ profile.reparerade=(profile.reparerade||0)+1; lagat=true; }
  }
  cp.history.push({id:t.id,ok:correct,at:Date.now(),area:t.omr,family:t.familj,
    hint:!!state.hintUsed,
    ...(kriterier.length?{criteria:kriterier.slice(0,6)}:{}),
    ...(state.altMiss&&state.altMiss.length?{miss:state.altMiss.slice(0,4)}:{}),
    ...(t.ursprungsId?{ursprungsId:t.ursprungsId,deluppgift:t.deluppgift}:{})});
  cp.history=cp.history.slice(-300);
  uppdragSvar(t,correct,lagat);
  if(state.prov) provRegistrera(t,correct);
  const genomgangForslag=correct ? null : hittaGenomgangForslag(t,cp);
  state.ggForslag=genomgangForslag;
  tranarKommentar(t,nivaFore,tranarNivaLage(t.omr),genomgangForslag);

  if(correct && !state.noXp && !state.solutionShown) profile.utanFacit=(profile.utanFacit||0)+1;
  if(new Date().getHours()<7) profile.morgon=1;
  if(state.data){
    const bkap=Math.max(0,...chapterProgress().map(c=>c.score));
    profile.bestKapitel=Math.max(profile.bestKapitel||0,Math.round(bkap));
    profile.bestKurs=Math.max(profile.bestKurs||0,Math.round(courseProgress().score));
    const b3=Math.max(0,...getAreas().map(a=>levelQuality(a.key,"3")));
    profile.bestNiva3=Math.max(profile.bestNiva3||0,Math.round(b3*100));
  }

  const levelAfter=levelFromXP(profile.xp);
  const rankBefore=rankFor(levelBefore), rankAfter=rankFor(levelAfter);
  saveProfile();
  kgLoggaHandelse(t,{andel,correct,xp});

  animeraXp(xpBefore,profile.xp);
  const HYLLNING=1500;
  setTimeout(()=>{
    if(levelAfter>levelBefore){
      if(rankAfter.name!==rankBefore.name) cheer(rankAfter.sym,"Ny rank",rankAfter.name,"Du har klättrat ett steg på stegen.");
      else cheer(medaljIkon("nivaupp"),"Ny nivå","Nivå "+levelAfter,"Din träning ger resultat.");
    }
    if(beforeToday<goal && todayCount()>=goal) cheer(goal,"Dagens mål","Klart för idag",`${goal} uppgifter avklarade.`,"dag");
  },HYLLNING);
  checkBadges(HYLLNING);
  saveProfile();

  const last=state.sessionDone>=state.sessionTarget;
  const bonus = seriebonus(profile.run);
  const runTxt = correct && profile.run>=3
    ? `<span class="tag" style="margin-left:6px">${profile.run} i rad${bonus?` · +${bonus}\u00a0%`:""}</span>`
    : "";
  const flera=delar.length>1;
  const rubrik = correct ? (flera?"Alla rätt!":"Rätt!")
               : ratt ? `${ratt} av ${delar.length} rätt`
               : "Inte riktigt.";
  const under = state.noXp
      ? "Lösningen var redan visad, så den här uppgiften ger ingen XP."
      : correct ? "Bra jobbat. Nästa uppgift anpassas efter det här."
      : ratt ? "Titta på lösningen för de delar som inte stämde."
      : "Titta på lösningen och hitta steget som gick fel. Uppgiften kommer tillbaka.";
  const box=document.getElementById("answer-result");
  if(box){
    /* Finns Kontrollera-knappen blir den Nästa (se nedan). Då behövs inga egna knappar i resultatrutan:
       Visa lösning finns redan bredvid. */
    const kolla=document.getElementById("kollaknapp");
    box.innerHTML=`
      <div class="result ${correct?'good':'bad'}">
        <div class="txt">
          <strong>${rubrik}${runTxt}</strong>
          <small>${under}</small>
        </div>
        <span class="xpchip"${xp?"":' style="background:var(--surface3);color:var(--ink3);box-shadow:none"'}>${xp?"+"+xp+" XP":"0 XP"}</span>
        ${(state.hintUsed && !state.noXp)?`<span class="xplapp">halverat · ledtråd</span>`:""}
        ${(arbetsfaktor(t)>1 && ratt>0 && !state.noXp)?`<span class="xplapp">extra XP för arbetsinsats</span>`:""}
      </div>
      ${kolla?"":`<div class="aacts">
        ${!correct?`<button class="btn" onclick="showSolution()">Visa lösning</button>`:""}
        <button class="btn primary" id="nextbtn" onclick="${last?'renderSessionDone()':'nextTask()'}">
          ${last?"Se passrapport":"Nästa uppgift"} <span aria-hidden="true">→</span>
        </button>
      </div>`}`;
    /* Kontrollera-knappen blir Nästa, så att man inte behöver scrolla ned till resultatet. */
    if(kolla){
      kolla.textContent=last?"Se passrapport →":"Nästa uppgift →";
      kolla.onclick=()=>last?renderSessionDone():nextTask();
    }
    setTimeout(()=>(kolla||document.getElementById("nextbtn"))?.focus({preventScroll:true}),80);
    if(genomgangForslag) setTimeout(()=>tranarForeslarGenomgang(genomgangForslag),700);
  }
}

/* Vilka feltänk återkommer? Läses av framtida adaptiv logik och av
   läraren via konsolen: vanligaMiss(). */
function vanligaMiss(gräns=25){
  const cp=ensureCourseProfile();
  const r={};
  (cp.history||[]).slice(-gräns*4).forEach(h=>{
    (h.miss||[]).forEach(m=>{ r[m]=(r[m]||0)+1; });
  });
  return Object.entries(r).sort((a,b)=>b[1]-a[1]).slice(0,gräns);
}

function ledtradRuta(t){

  return `<div class="ledtrad"><b>Ledtråd</b><div class="ltxt">${t.ledtrad||""}</div>
    <span class="lkost">Halv XP för den här uppgiften</span></div>`;
}
function visaLedtrad(){
  const t=state.currentTask;
  if(!t || !t.ledtrad || state.hintVisible) return;
  state.hintUsed=true; state.hintVisible=true;
  const h=document.getElementById("ledtrad-holder");
  if(h){ h.innerHTML=ledtradRuta(t); renderMath(h); skrivFram(h.querySelector(".ltxt")); }
  document.getElementById("ledtradknapp")?.remove();
}

function showSolution(){
  const t=state.currentTask;
  const auto=expectedAnswersForTask(t).auto;
  state.solutionShown=true;

  if(auto && !state.answered) state.noXp=true;
  /* Avslöjas svaret på en alternativuppgift låses knapparna direkt,
     annars skulle facit ligga kvar bredvid en klickbar fråga. */
  if(arAlt(t) && !state.answered){
    altLista(t).forEach((a,i)=>{
      const el=document.getElementById("alt-"+i);
      if(el){
        el.disabled=true;
        if(a.ratt){
          el.classList.add("ratt");
          const ruta=el.querySelector(".ruta");
          if(ruta) ruta.textContent="✓";
        }
      }
      const kom=document.getElementById("altkom-"+i);
      if(kom && a.kommentar && a.ratt){ kom.hidden=false; kom.innerHTML=a.kommentar; }
    });
    document.getElementById("altknapp")?.remove();
  }
  const holder=document.getElementById("solution-holder");
  if(holder){
    holder.innerHTML=`<div class="sol"><div class="lbl">Lösning</div><div style="margin-top:10px">${t.s||"Facit saknas."}</div></div>
      ${state.answered?"":auto
        ? `<div class="hint">Lösningen är visad, så uppgiften ger ingen XP. Du kan ändå skriva klart svaren.</div>
           <div class="aacts"><button class="btn" onclick="giveUp()">Gå vidare</button></div>`
        : `<div class="aacts">
             <button class="btn soft" onclick="selfGrade(true)">Jag hade rätt</button>
             <button class="btn" onclick="selfGrade(false)">Jag behöver träna mer</button>
           </div>`}`;
    renderMath(holder);
  }
}
function selfGrade(ok){ if(!state.answered) finishAttempt(ok); }

function passRapport(acc){
  const typ=state.passTyp;
  if(typ==="tungt")
    return acc>=70 ? "Bra jobbat. Du klarade de tunga uppgifterna, så nivån följer med upp."
         : acc>=40 ? "Så ska ett tungt pass kännas. Det är där nivån flyttas."
                   : "Det var tungt idag. Nästa pass blir lättare.";
  if(typ==="teknik")
    return acc>=70 ? "Det börjar sitta. Vi tar samma område igen om några dagar."
                   : "Det här området behöver mer tid. Vi kör det igen.";
  if(typ==="fel")
    return acc>=70 ? "Det satt den här gången. Det är precis så man lär sig av ett fel."
                   : "Några sitter fortfarande inte. De ligger kvar och kommer tillbaka i nästa felpass.";
  if(typ==="repetition")
    return acc>=70 ? "Det satt kvar. Bra."
                   : "Bra att vi tog det nu och inte veckan före provet.";
  if(typ==="mangd")
    return acc>=70 ? "Bra flyt hela vägen."
                   : "Många uppgifter avklarade. Vi håller nivån ett tag till.";
  return acc>=80 ? "Starkt genomfört."
       : acc>=50 ? "Bra jobbat. Blandningen av rätt och fel är där du lär dig mest."
                 : "Tuffa uppgifter idag. Nästa pass blir bättre anpassat.";
}

function felLista(){
  const fel=state.sessionFel||[];
  if(!fel.length) return "";
  return `
    <div class="felruta">
      <div class="sec"><h2>Det här blev fel</h2></div>
      ${fel.map((t,i)=>`
        <div class="felrad">
          <div class="felrubrik">
            <span class="felnr">${esc(t.ursprungsId||t.id)}${t.deluppgift?" · "+esc(t.deluppgift):""}</span>
            <span class="feltext">${esc(kortText(t))}</span>
            <button class="btn sm" onclick="vaxlaFelLosning(${i},this)">Visa lösning</button>
          </div>
          <div class="fellosning" id="fellosning-${i}" hidden></div>
        </div>`).join("")}
    </div>`;
}

function kortText(t){
  const d=document.createElement("div");
  d.innerHTML=String(t.t||"");
  const txt=(d.textContent||"").replace(/\s+/g," ").trim();
  return txt.length>70 ? txt.slice(0,70).replace(/\s\S*$/,"")+"…" : txt;
}
function vaxlaFelLosning(i,btn){
  const t=(state.sessionFel||[])[i];
  const box=document.getElementById("fellosning-"+i);
  if(!t||!box) return;
  if(!box.hidden){ box.hidden=true; btn.textContent="Visa lösning"; return; }
  if(!box.dataset.fylld){
    box.innerHTML=t.s || "<p>Den här uppgiften saknar lösning i banken.</p>";
    box.dataset.fylld="1";
    renderMath(box);
  }
  box.hidden=false; btn.textContent="Dölj";
}

function renderSessionDone(record){

  let xpForeBonus=null;
  if(record!==false && !state.passAvslutat){
    state.passAvslutat=true;
    navRecord("summary",true);
    profile.pass=(profile.pass||0)+1;
    state.passBonus=0;
    if(state.sessionDone>=state.sessionTarget && state.sessionDone>=PASS_BONUS_MIN){
      const bonus=Math.round(PASS_BONUS_XP*Math.min(1,state.sessionCorrect/state.sessionDone));
      if(bonus){
        xpForeBonus=profile.xp;
        const lvlFore=levelFromXP(profile.xp);
        profile.xp+=bonus; state.sessionXp+=bonus; state.passBonus=bonus;
        const lvlEfter=levelFromXP(profile.xp);
        if(lvlEfter>lvlFore){
          const rf=rankFor(lvlFore), re=rankFor(lvlEfter);
          if(re.name!==rf.name) cheer(re.sym,"Ny rank",re.name,"Du har klättrat ett steg på stegen.");
          else cheer(medaljIkon("nivaupp"),"Ny nivå","Nivå "+lvlEfter,"Din träning ger resultat.");
        }
      }
    }
    if(state.sessionDone && state.sessionCorrect>=state.sessionDone)
      profile.felfria=(profile.felfria||0)+1;
    const tot=state.sessionDone||1;
    const pct=Math.round(state.sessionCorrect/tot*100);
    const gammalt=profile.bastaPass;

    state.rekord=false; state.gamlaRekordet=gammalt;
    if(tot>=4 && (!gammalt || pct>gammalt.pct ||
       (pct===gammalt.pct && state.sessionCorrect>gammalt.ratt))){
      state.rekord=!!gammalt;
      profile.bastaPass={pct,ratt:state.sessionCorrect,total:tot,at:Date.now()};
    }
    saveProfile();
    checkBadges();
    if(state.rekord) cheer(medaljIkon("provklar"),"Nytt rekord",pct+" % på ett pass",
      `Ditt bästa hittills var ${gammalt.pct} %.`);
  }
  rensaPagaendePass();
  state.view="summary";
  const total=state.sessionDone||1;
  const acc=Math.round(state.sessionCorrect/total*100);
  const lp=levelProgress(), rank=rankFor(lp.level), nxt=nextRank(lp.level);
  const st=currentStreak(), done=todayCount(), goal=profile.goal||8;
  const toNext=Math.max(0,totalXpForLevel(lp.level+1)-profile.xp);

  app.innerHTML=topbar()+`<main class="summary view">
    <div class="ringwrap passring">
      ${ring(state.sessionCorrect/total,132,9,"var(--acc)")}
      <div class="num"><b>${acc}<i>%</i></b><small>rätt</small></div>
    </div>
    <h1>Passet är klart</h1>
    <p>${passRapport(acc)}</p>

    <div class="sumtiles">
      <div class="card tile" style="background:var(--surface)"><span>Uppgifter</span><strong>${state.sessionCorrect} / ${total}</strong></div>
      <div class="card tile" style="background:var(--surface)"><span>Intjänat</span><strong>+${state.sessionXp} XP</strong>${state.passBonus?`<em class="tilebonus">varav +${state.passBonus} för helt pass</em>`:""}</div>
      <div class="card tile" style="background:var(--surface)"><span>Idag</span><strong>${done} / ${goal}</strong></div>
    </div>

    ${felLista()}

    ${(()=>{
      const b=profile.bastaPass;
      if(!b) return "";
      const nytt=state.rekord;
      return `<div class="rekord${nytt?" ny":""}">
        <span class="ikon" aria-hidden="true">${medaljIkon(nytt?"provklar":"skiva")}</span>
        <span class="txt">
          <b>${nytt?"Nytt rekord!":"Bästa passet hittills"}</b>
          <small>${b.pct} % · ${b.ratt} av ${b.total} rätt${nytt&&state.gamlaRekordet?` · slog ${state.gamlaRekordet.pct} %`:""}</small>
        </span>
      </div>`;
    })()}

    <div class="card pad" style="text-align:left">
      <div class="rankrow">
        <div class="ringwrap" style="width:58px;height:58px">
          ${ring(lp.pct,58,5,"#c79a3c")}
          <div class="num" style="font-size:16px">${lp.level}</div>
        </div>
        <div style="flex:1">
          <div class="rankname">${esc(rank.name)}</div>
          <div class="rankmeta">${nxt?`${toNext} XP till nivå ${lp.level+1} · ${esc(nxt.name)} vid nivå ${nxt.lvl}`:`${toNext} XP till nivå ${lp.level+1}`}</div>
        </div>
        ${st?`<span class="pill"><span class="flame">${st}</span> dagar i rad</span>`:""}
      </div>
      <div class="rankbar"><i data-w="${Math.round(lp.pct*100)}%"></i></div>
    </div>

    ${(()=>{const nb=nextBadge(); if(!nb) return "";
      return `<div class="badge-row" style="margin-top:10px;background:var(--surface);border-color:var(--hair)">
        <div class="medal">${medaljIkon(nb.b.icon)}</div>
        <div class="txt">
          <b>Nästa medalj: ${esc(nb.b.name)}</b>
          <small>${esc(nb.b.desc)} · ${nb.s.cur} av ${nb.b.max}</small>
          <div class="prog"><i data-w="${Math.round(nb.s.pct*100)}%"></i></div>
        </div>
      </div>`;})()}

    <div class="aacts" style="justify-content:center;margin-top:22px">
      <button class="btn primary" onclick="continueSession()">Fortsätt träna <span aria-hidden="true">→</span></button>
      <button class="btn" onclick="backToDashboard()">Till kursen</button>
      <button class="btn quiet" onclick="showProgress()">Min utveckling</button>
    </div>
  </main>`;
  afterRender();
  if(xpForeBonus!==null){
    const efter=profile.xp;
    xpStall(xpForeBonus,false);
    setTimeout(()=>animeraXp(xpForeBonus,efter),500);
  }
}

function oppnaTopplista(sortering,record){
  document.getElementById("kontomeny")?.remove();
  state.toppSort=TOPP_FLIKAR[sortering]?sortering
    :(TOPP_FLIKAR[state.toppSort]?state.toppSort:"dag");
  if(record!==false) navRecord("topplista");
  state.view="topplista";
  ritaTopplista(true);
  laddaTopplista();
}

    : !profile.namn

         <b>Du är inte med än.</b>

    : !profile.visaTopplista
      ? `<div class="toppnotis">
           <b>Du är dold.</b>

           <button class="btn sm primary" onclick="snabbVisa(true)">Visa mig på listan</button>

      : jagFuskare

           <b>Du tävlar inte just nu.</b>
           <span>Din profil har markerats för misstänkt fusk, så din XP räknas inte på topplistan. Tror du att det är fel? Prata med din lärare.</span>

      : `<div class="toppnotis pa">

    </div>`;

  let lista;

    lista=`<div class="toppladdar">Hämtar listan…</div>`;

  }else if(svar?.saknas){

  }else if(!rader){
    lista=`<div class="empty">Kunde inte hämta topplistan just nu. Försök igen om en stund.</div>`;
  }else if(!rader.length && !fuskare.length){
    lista = s==="alla"
      ? `<div class="empty">Ingen har ställt sig på listan än.${session?" Du kan bli först.":" Logga in så kan du bli först."}</div>`

  }else{
    lista=`<ol class="topplista">${rader.map((rad,i)=>{

      const medaljer=Array.isArray(rad.medaljer)?rad.medaljer:[];
      /* Alla medaljer ritas ut. passaMedaljer() döljer sedan de som inte

      <button class="${klassvy?"":"pa"}" role="tab" aria-selected="${klassvy?"false":"true"}" onclick="bytToppVy('elever')">Elever</button>
      <button class="${klassvy?"pa":""}" role="tab" aria-selected="${klassvy?"true":"false"}" onclick="bytToppVy('klasser')">Klasser</button>
    </div>

    <div class="card pad" style="margin-top:14px">${lista}</div>

  afterRender();
  passaMedaljer();
}

/* Hur många medaljer som ryms beror på radens bredd, så det mäts efter
   att listan ritats — och om igen när fönstret ändrar storlek. Två rader
   är taket; blir det fler tas sista platsen av räknaren. */
function passaMedaljer(){
  document.querySelectorAll(".topplista .tmedaljer").forEach(box=>{
    const markeringar=Array.from(box.querySelectorAll(".tmedalj"));
    const fler=box.querySelector(".tfler");
    if(fler) fler.hidden=true;
    markeringar.forEach(m=>{ m.hidden=false; });
    if(!markeringar.length) return;

    const bredd=box.clientWidth;
    const storlek=markeringar[0].offsetWidth;
    if(!bredd || !storlek) return;          // kolumnen är dold (mobil)

    const st=getComputedStyle(box);
    const glapp=parseFloat(st.columnGap||st.gap)||4;
    const perRad=Math.max(1,Math.floor((bredd+glapp)/(storlek+glapp)));
    const tak=perRad*2;
    if(markeringar.length<=tak) return;

    const plats=Math.max(1,tak-1);          // sista rutan går till räknaren
    markeringar.forEach((m,i)=>{ m.hidden=i>=plats; });
    if(fler){
      fler.textContent="+"+(markeringar.length-plats);
      fler.hidden=false;
    }
  });
}

let medaljTimer=null;
window.addEventListener("resize",()=>{
  clearTimeout(medaljTimer);
  medaljTimer=setTimeout(passaMedaljer,120);
});

let toppAnrop=0;
async function laddaTopplista(){
  const s=state.toppSort, vy=state.toppVy, nr=++toppAnrop;
  if(session && state.minKlass===undefined) laddaMinKlass().then(()=>{
    if(state.view==="topplista" && nr===toppAnrop && document.querySelector(".toppladdar")===null) ritaTopplista(false,state.toppSvar);
  });
  const svar=vy==="klasser" ? await hamtaKlasstopplista(s) : await hamtaTopplista(s);
  if(state.view!=="topplista" || nr!==toppAnrop || s!==state.toppSort || vy!==state.toppVy) return;
  state.toppSvar=svar;
  ritaTopplista(false,svar);
}
function bytToppVy(vy){
  if(state.toppVy===vy) return;
  state.toppVy=vy; state.toppSvar=null;
  ritaTopplista(true); laddaTopplista();
}
function klassListaHTML(svar,s){
  if(svar?.saknas) return `<div class="empty">Klasserna är inte aktiverade än.</div>`;
  if(!svar) return `<div class="empty">Kunde inte hämta klasserna just nu. Försök igen om en stund.</div>`;
  if(!svar.rader.length) return `<div class="empty">Ingen klass har några elever än.${session?" Välj din klass så kommer den med.":""}</div>`;
  return `<ol class="topplista klasslista">${svar.rader.map((k,i)=>{
      const min=svar.minKlass!=null && Number(svar.minKlass)===Number(k.id);
      return `<li class="kblock">
        <button class="topprad krad${min?" jag":""}${i<3?" pall":""}" data-klass="${Number(k.id)}" aria-expanded="false"
            onclick="vaxlaKlassElever(${Number(k.id)})">
          <span class="plats">${i+1}</span>
          <span class="tnamn"><b>${esc(k.namn)}</b><small>${Number(k.aktiva)||0} av ${Number(k.elever)||0} har tränat${k.larare?" · lärarlaget":""}</small></span>
          <span class="tvarde" title="${svar.summa?"Klassens samlade XP":"Snitt-XP per elev"}">${Number(k.poang)||0}<small>${svar.summa?"XP":"XP/elev"}</small></span>
          <span class="mu-chev" aria-hidden="true"></span>
        </button>
        <div class="klasselever" id="klasselever-${Number(k.id)}" hidden></div>
      </li>`;
    }).join("")}</ol>
    <p class="toppfot">${TOPP_FLIKAR[s].fot}. ${svar.summa
      ? `Poängen är klassens samlade XP, där varje elev räknas med högst ${Number(svar.tak)||0} XP. Ju fler som tränar, desto högre kommer klassen.`
      : `Poängen är snitt-XP per elev i klassen, där varje elev räknas med högst ${Number(svar.tak)||0} XP. Alla som tränar lyfter klassen.`} Tryck på en klass för att se eleverna som valt att synas.${TOPP_FLIKAR[s].lag?` Klassen som leder när perioden är slut, med minst tre som tränat, ger medaljen ${TOPP_FLIKAR[s].lag} till alla i klassen som tränat under perioden.`:""}</p>`;
}

/* Förklaringsrutan. Den här vyn är full av härledda tal, och utan den
   här texten är de omöjliga att tolka — då blir mätarna dekoration i
   stället för vägledning. */
/* Hovertext finns inte på pekskärm, och det är där eleverna sitter.
   Samma text visas därför i en rad under mätaren när man trycker. */
function visaNivainfo(el){
  const rad=el.closest(".kaprad");
  const ruta=rad?.querySelector(".kapinfo");
  if(!ruta) return;
  const redanVald=el.classList.contains("vald");
  rad.querySelectorAll(".kapbar span").forEach(x=>x.classList.remove("vald"));
  if(redanVald){ ruta.hidden=true; return; }
  el.classList.add("vald");
  ruta.innerHTML=`<b>${esc(el.dataset.kort||"")}</b> ${esc(el.dataset.lang||"")}`;
  ruta.hidden=false;
}

function stangMatarhjalp(){
  const el=document.getElementById("matarhjalp");
  if(!el) return;
  el.removeAttribute("id");
  el.classList.remove("visa");
  setTimeout(()=>el.remove(),250);
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && document.getElementById("matarhjalp")) stangMatarhjalp();
});

function showProgress(record){
  if(!state.course) return renderHome();
  if(record!==false) navRecord("progress");
  state.view="progress";
  const strong=sakraKort(5), families=delmomentAttTrana(5);
  const lp=levelProgress(), rank=rankFor(lp.level), nxt=nextRank(lp.level);
  const acc=profile.attempts?Math.round(profile.correct/profile.attempts*100):0;
  const st=currentStreak();

  const finns=omradesNivaer(), alla=getAreas();
  const lage=stegLage(alla,finns), kursPct=kursRing(lage);
  const kap=chapterProgress();
  const tranat=kap.some(c=>NIVAER.some(L=>c.stat[L].n));

/* Medaljerna är många och tar över vyn. Första raden räcker som
   överblick; resten fälls ut på begäran. Hur många som ryms beror på
   bredden, så raden mäts i stället för att antas. */
let medaljerUtfallda=false;
function passaMedaljrutor(){
  const grid=document.getElementById("badgegrid");
  const fot=document.getElementById("badgemer");
  const knapp=document.getElementById("badgeknapp");
  if(!grid||!fot||!knapp) return;

  const rutor=Array.from(grid.children);
  rutor.forEach(r=>{ r.hidden=false; });
  if(!rutor.length){ fot.hidden=true; return; }

  const forstaRad=rutor[0].offsetTop;
  const ryms=rutor.filter(r=>r.offsetTop<=forstaRad).length;
  const dolda=rutor.length-ryms;

  if(dolda<=0 || !ryms){ fot.hidden=true; grid.classList.remove("hopfalld"); return; }

  fot.hidden=false;
  grid.classList.toggle("hopfalld",!medaljerUtfallda);
  if(!medaljerUtfallda) rutor.forEach((r,i)=>{ r.hidden=i>=ryms; });
  knapp.textContent=medaljerUtfallda?"Visa färre":`Visa alla ${rutor.length} medaljer`;
  knapp.setAttribute("aria-expanded",String(medaljerUtfallda));
}
function vaxlaMedaljer(){
  medaljerUtfallda=!medaljerUtfallda;
  passaMedaljrutor();
}

/* ═══════════════ Träningspass ═══════════════
   Läraren anger vad passet omfattar (kurs, spår, områden, nivåer, omfattning)
   och vilka av sina grupper som ska få det. Kunskapsgymmets vanliga
   träningsmotor väljer sedan uppgifterna, så två elever i samma pass får
   olika uppgifter beroende på hur det går. Databasdelen finns i
   sql/2026-10-02-provtraning.sql och sql/2026-10-03-larargrupper.sql.
   (Funktionerna heter prov… av historiska skäl: funktionen hette först
   "Plugga inför prov".) */
const PROV_VANT_KEY="kunskapsgymmet-prov-kod";
const PROV_LOKAL_KEY="kunskapsgymmet-prov-v1:";
const PROV_PASS=10;
const PROV_OMFATTNING=[{n:15,namn:"Kort"},{n:30,namn:"Normal"},{n:50,namn:"Grundlig"}];
let provLista=null;           /* elevens träningspass; false = inte installerat i databasen */
let provRapportTimer=null;
let provSkapa=null;           /* lärarens formulär under arbete */
let provLararLista=[];        /* lärarens pass, för bekräftelsetexter */

function provRpc(namn,kropp={}){ return klassRpc(namn,kropp,true); }
function provDatum(d){
  if(!d) return "";
  const x=new Date(d+"T12:00:00");
  return Number.isNaN(x.getTime()) ? String(d) : x.toLocaleDateString("sv-SE",{day:"numeric",month:"long"});
}
function provLokal(id){
  try{
    const d=JSON.parse(localStorage.getItem(PROV_LOKAL_KEY+ggAgare()+":"+id)||"null");
    if(d && typeof d==="object") return {klara:d.klara|0,ratt:d.ratt|0,omr:d.omr||{},fel:Array.isArray(d.fel)?d.fel:[],gjorda:Array.isArray(d.gjorda)?d.gjorda:[]};
  }catch(_){}
  return {klara:0,ratt:0,omr:{},fel:[],gjorda:[]};
}
function provSparaLokal(id,d){
  try{ localStorage.setItem(PROV_LOKAL_KEY+ggAgare()+":"+id,JSON.stringify(d)); }catch(_){}
}
/* Servern och den här enheten kan ligga olika långt fram; det största gäller. */
function provKlara(p){ return Math.max(Number(p?.klara)||0, provLokal(p.id).klara); }

async function provHamtaMina(){
  if(!MOLN_PA() || !session){ provLista=null; return null; }
  const r=await provRpc("kg_prov_for_mig");

  return provLista;
}

async function provDolj(id){
  const p=(provLista||[]).find(x=>Number(x.id)===Number(id)); if(!p) return;
  const ok=await larBekrafta("Ta bort träningspasset?",
    `<b>${esc(p.titel)}</b> försvinner från din startsida för gott och går inte att få tillbaka. Det du redan har tränat finns kvar.`,
    "Ta bort", true);
  if(!ok) return;
  const r=await provRpc("kg_prov_dolj",{p_prov:Number(id)});
  if(r?.saknas){ toast("Det går inte att ta bort pass än."); return; }
  if(!r?.ok){ toast("Kunde inte ta bort passet."); return; }
  provLista=(provLista||[]).filter(x=>Number(x.id)!==Number(id));
  provRitaBanner();
  toast("Passet är borttaget från din startsida.");
}

/* ── Gå med via kod eller länk (?kod=KOD eller ?prov=KOD) ──
   Koden kan gå till en lärares grupp eller till ett träningspass. */
function provLasAdress(){
  try{
    const q=new URLSearchParams(location.search);
    const kod=q.get("kod")||q.get("prov");
    if(!kod) return;
    localStorage.setItem(PROV_VANT_KEY,kod.trim().slice(0,40));
    q.delete("kod"); q.delete("prov");
    const s=q.toString();
    history.replaceState(history.state,"",location.pathname+(s?"?"+s:"")+location.hash);
  }catch(_){}
}
async function provAnslutKod(kod){
  let r=await provRpc("kg_anslut_kod",{p_kod:kod});
  if(r?.saknas){
    const p=await provRpc("kg_prov_anslut",{p_kod:kod});
    r = p?.saknas ? p : (p?.ok ? {...p,typ:"prov"} : p);
  }

/* Områdesval i träningspasset: teckna en väg genom passets områden i lärarens
   ordning, men låt svaga områden komma tillbaka oftare och de eleven redan
   behärskar komma mer sällan. */
function provValjOmrade(pool){
  const p=state.prov, cp=ensureCourseProfile(), d=provLokal(p.id);
  const finns=[...new Set(pool.map(t=>t.omr||"ovrigt"))];
  if(finns.length<2) return finns[0];
  const ordning=p.omraden.filter(o=>finns.includes(o));
  const n=ordning.length;
  const tot=ordning.reduce((s,o)=>s+(d.omr[o]?.f||0),0);
  const framsteg=Math.min(.999,provKlara(p)/(Number(p.antal)||30));
  const vantat=Math.floor(framsteg*n);
  return ordning.map((o,i)=>{
      const f=d.omr[o]?.f||0, r=d.omr[o]?.r||0;
      const andel=tot?f/tot:0;
      const traffsakerhet=f?r/f:.6;
      const k = (andel-1/n)*2.2                 /* jämn täckning */
              + Math.abs(i-vantat)*.22          /* lärarens ordning som en röd tråd */
              + mastery(cp.areas,o)*.6          /* starka områden mer sällan */
              + traffsakerhet*.3
              + (o===state.lastArea?.35:0)
              + Math.random()*.35;
      return {o,k};
    }).sort((a,b)=>a.k-b.k)[0].o;
}
/* Var fjärde uppgift kan vara en uppgift som eleven tidigare missat i passet. */
function provRepetera(){
  const p=state.prov; if(!p || p.alla) return;
  if(state.felKo && state.felKo.length) return;
  if(state.sessionDone<2 || state.sessionDone%4!==3) return;
  const d=provLokal(p.id);
  const id=d.fel.find(x=>!state.lastIds.includes(x));
  if(id) state.felKo=[id];
}
/* I passet ska eleven möta alla nivåer läraren valt. När eleven klarar ett
   område bra i passet lyfts uppgiften ibland till C- eller A-nivå, även om
   den vanliga nivåstegen ännu inte hunnit dit. */
function provNivaKandidater(pool,area){
  const p=state.prov; if(!p) return null;
  const x=provLokal(p.id).omr[area]||{f:0,r:0};
  if(x.f<3) return null;
  const andel=x.r/x.f;
  let mal=null;
  if(p.nivaer.includes("A") && x.f>=5 && andel>=.8 && Math.random()<.3) mal="A";
  else if(p.nivaer.includes("C") && andel>=.65 && Math.random()<.45) mal="C";
  if(!mal) return null;
  const lista=pool.filter(t=>assessmentLevelOf(t)===mal);
  return lista.length?lista:null;
}
function provRegistrera(t,correct){
  const p=state.prov; if(!p||!t) return;
  const d=provLokal(p.id);
  const fore=d.klara;
  const ny=!p.alla || !d.gjorda.includes(t.id);
  if(ny){ d.klara+=1; if(correct) d.ratt+=1; }
  if(p.alla && ny) d.gjorda.push(t.id);
  const o=t.omr||"ovrigt";
  d.omr[o] ||= {f:0,r:0};
  d.omr[o].f+=1; if(correct) d.omr[o].r+=1;
  const id=t.id;
  d.fel=d.fel.filter(x=>x!==id);
  if(!correct){ d.fel.push(id); if(d.fel.length>30) d.fel=d.fel.slice(-30); }
  provSparaLokal(p.id,d);
  const antal=Number(p.antal)||30;
  if(fore<antal && d.klara>=antal)
    setTimeout(()=>cheer("📚","Träningspasset klart",p.titel,`Du har gjort alla ${antal} uppgifter. Fortsätt gärna och repetera.`),1900);
  clearTimeout(provRapportTimer);
  provRapportTimer=setTimeout(()=>provRapportera(p.id),3000);
}

  const d=provLokal(id);
  await provRpc("kg_prov_rapportera",{p_prov:Number(id),p_klara:d.klara,p_ratt:d.ratt,p_omr:d.omr});

/* Kursens struktur och bank för formuläret, utan att byta kurs för läraren. */
async function provKursData(id){
  const c=COURSES[id]; if(!c) throw new Error("okänd kurs");
  for(const f of c.files) await loadScript(f);
  const bank=window[c.globals.bank]||[];
  const omr=window[c.globals.omr]||{};
  const kap=window[c.globals.kap]||{};
  const kapSpar=window[c.globals.kapSpar]||null;
  const namn={}, kapitel=[];
  Object.keys(omr).sort((a,b)=>Number(a)-Number(b)).forEach(k=>{
    const lista=Object.entries(omr[k]||{}).map(([key,n])=>{ namn[key]=n; return key; });
    if(lista.length) kapitel.push({kap:k,omraden:lista});
  });
  return {bank,omr,kap,kapSpar,namn,kapitel};
}
function provKapNamn(kd,kap,spar){
  const s=spar&&kd.kapSpar&&kd.kapSpar[spar];
  return (s&&s[kap]) || kd.kap[kap] || ("Kapitel "+kap);
}
function provRakna(kd,spar,nivaer){
  const per={}, perNiva={E:0,C:0,A:0};
  kd.bank.forEach(t=>{
    if(t.spel===false) return;
    if(spar && t.kurs){ const k=Array.isArray(t.kurs)?t.kurs:[t.kurs]; if(!k.includes(spar)) return; }
    const L=assessmentLevelOf(t);
    if(L==="G") return;
    const o=t.omr||"ovrigt";
    per[o] ||= {E:0,C:0,A:0,alla:0};
    per[o][L]+=1;
    if(nivaer.includes(L)) per[o].alla+=1;
  });
  return per;
}
function provForslagKod(){
  const s=provSkapa; const c=COURSES[s.kurs];
  const bas=(s.spar?(c.code.replace(/\s.*$/,"")+s.spar.replace(/^\d/,"")):c.code).replace(/[^A-Za-z0-9]/g,"").toUpperCase();
  const ord=((s.titel||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase()
    .split(/[^A-Z0-9]+/).filter(w=>w.length>2 && w!=="PROV" && !/^\d+$/.test(w))[0])||"PASS";
  const d=s.datum?new Date(s.datum+"T12:00:00"):null;
  const dat=d&&!Number.isNaN(d.getTime())?d.getDate()+["JAN","FEB","MAR","APR","MAJ","JUN","JUL","AUG","SEP","OKT","NOV","DEC"][d.getMonth()]:"";
  return [bas,ord,dat].filter(Boolean).join("-");
}

        <button type="button" class="valruta${s.alla?" vald":""}" onclick="provSkapa.alla=true;provRitaSkapa()"><span class="kryss" aria-hidden="true"></span><span class="valnamn">Alla – ${totAlla} uppgifter</span></button></div></div>

    <div class="provfalt"><span>Välj innehåll</span>
      ${kd?kd.kapitel.map(k=>{
        const synliga=k.omraden.filter(o=>per[o]);
        if(!synliga.length) return "";
        const alla=synliga.every(o=>s.omraden.includes(o));
        return `<div class="provkap">
          <button type="button" class="provkap-rubrik" onclick="provVaxlaKapitel('${esc(k.kap)}')">
            <span class="kryss${alla?" pa":""}" aria-hidden="true"></span>${esc(provKapNamn(kd,k.kap,s.spar))}</button>
          <div class="valgrid">${synliga.map(o=>{
            const n=per[o]?.alla||0;
            return `<button type="button" class="valruta${s.omraden.includes(o)?" vald":""}${n<8?" t-low":""}" onclick="provVaxlaOmrade('${esc(o)}')">
              <span class="kryss" aria-hidden="true"></span><span class="valnamn">${esc(kd.namn[o]||o)}</span>
              <span class="valstate">${n}</span></button>`;}).join("")}</div></div>`;}).join("")
        :`<div class="empty">Kursen kunde inte läsas in.</div>`}

    <div class="provkontroll" id="provkontroll">${provKontrollHtml(per)}</div>

    <div class="modal-fot">
      <button class="btn quiet" onclick="provRitaLararlista()">Tillbaka</button><span class="spacer"></span>
      <button class="btn primary" onclick="provSkapaSkicka()">${s.redigeraId?"Spara ändringar":"Skapa träningspass"}</button></div>
  </div>`;
}
function provKontrollHtml(per){
  const s=provSkapa, kd=s.kd;
  if(!s.omraden.length) return `<b>Innehållskontroll</b><p class="menytext">Välj minst ett område.</p>`;
  const sum={E:0,C:0,A:0}; let tot=0;
  const rader=s.omraden.map(o=>{
    const x=per[o]||{E:0,C:0,A:0,alla:0};
    ["E","C","A"].forEach(L=>{ if(s.nivaer.includes(L)) sum[L]+=x[L]; });
    tot+=x.alla;
    const tunn=x.alla<10;
    return `<li${tunn?' class="tunn"':""}><span>${esc(kd?.namn[o]||o)}</span><b>${x.alla}</b>${tunn?`<small>tunn täckning</small>`:""}</li>`;
  }).join("");
  const niv=["E","C","A"].map(L=>!s.nivaer.includes(L)?`<span class="provniva av">${L}: –</span>`
    : `<span class="provniva ${sum[L]>=5?"ok":"varn"}">${L}: ${sum[L]>=5?"✓":"⚠"} ${sum[L]}</span>`).join("");
  return `<b>Passet innehåller</b>
    <ul class="provkontroll-lista">${rader}</ul>
    <div class="provkontroll-niva">${niv}</div>
    <p class="menytext">${s.alla?`${tot} uppgifter. Varje elev får alla i blandad ordning, och ingen uppgift kommer två gånger innan alla är gjorda.`
      :`${tot} möjliga uppgifter. ${tot<s.antal?"Det är färre än omfattningen, så uppgifter kommer att upprepas.":"Varje elev får sitt eget urval."}`}</p>`;
}
function provVaxlaGrupp(id){
  const s=provSkapa; id=Number(id);
  s.grupper=s.grupper.includes(id)?s.grupper.filter(x=>x!==id):[...s.grupper,id];
  provRitaSkapa();
}
function provVaxlaOmrade(o){
  const s=provSkapa;
  s.omraden=s.omraden.includes(o)?s.omraden.filter(x=>x!==o):[...s.omraden,o];
  provSorteraOmraden(); provRitaSkapa();
}
function provVaxlaKapitel(kap){
  const s=provSkapa, k=s.kd?.kapitel.find(x=>String(x.kap)===String(kap)); if(!k) return;
  const per=provRakna(s.kd,s.spar,s.nivaer);
  const synliga=k.omraden.filter(o=>per[o]);
  const alla=synliga.every(o=>s.omraden.includes(o));
  s.omraden=alla?s.omraden.filter(o=>!synliga.includes(o)):[...new Set([...s.omraden,...synliga])];
  provSorteraOmraden(); provRitaSkapa();
}
/* Områdena sparas i kursens ordning, som också blir träningens röda tråd. */
function provSorteraOmraden(){
  const s=provSkapa; if(!s.kd) return;
  const ord=s.kd.kapitel.flatMap(k=>k.omraden);
  s.omraden=s.omraden.filter(o=>ord.includes(o));
  s.omraden.sort((a,b)=>ord.indexOf(a)-ord.indexOf(b));
}
function provVaxlaNiva(L){
  const s=provSkapa;
  s.nivaer=s.nivaer.includes(L)?s.nivaer.filter(x=>x!==L):[...s.nivaer,L].sort((a,b)=>"ECA".indexOf(a)-"ECA".indexOf(b));
  provRitaSkapa();
}
async function provBytKurs(id){
  provSkapa.kurs=id; provSkapa.spar=COURSES[id].defaultTrack||null; provSkapa.omraden=[];
  await provSkapaLaddaKurs(); provRitaSkapa();
}
async function provSkapaSkicka(){
  const s=provSkapa;
  s.titel=(document.getElementById("prov-titel")?.value||s.titel||"").trim();
  if(s.titel.length<2){ toast("Ge passet ett namn."); return; }
  if(!s.omraden.length){ toast("Välj minst ett område."); return; }
  if(!s.nivaer.length){ toast("Välj minst en nivå."); return; }
  const per=s.kd?provRakna(s.kd,s.spar,s.nivaer):{};
  const antal=s.alla ? Math.max(1,s.omraden.reduce((a,o)=>a+(per[o]?.alla||0),0)) : s.antal;
  const gem={p_titel:s.titel,p_spar:s.spar,p_omraden:s.omraden,p_nivaer:s.nivaer,p_antal:antal,
             p_alla:!!s.alla,p_datum:s.datum||null,p_grupper:s.grupper};
  const r = s.redigeraId
    ? await provRpc("kg_prov_andra",{p_prov:s.redigeraId,...gem})
    : await provRpc("kg_prov_skapa",{...gem,p_kurs:s.kurs,p_kod:provForslagKod()});
  if(r?.saknas){ toast("Funktionen är inte aktiverad i databasen än. Kör sql/2026-10-04-skolor-och-larare.sql."); return; }
  if(!r?.ok){
    const fel={titel:"Namnet ska vara 2–60 tecken.",omraden:"Välj minst ett område.",nivaer:"Välj minst en nivå.",
      larare_kravs:"Bara lärarkonton kan skapa träningspass.",okand_grupp:"En av grupperna finns inte längre.",
      okand:"Passet finns inte längre."}[r?.code];
    toast(fel||"Kunde inte spara träningspasset."); return;
  }
  if(s.redigeraId){ toast("Träningspasset är uppdaterat."); provRitaLararlista(); window.scrollTo(0,0); return; }
  const kropp=document.getElementById("provlarare-kropp"); if(!kropp) return;
  const valda=s.grupplista.filter(g=>s.grupper.includes(Number(g.id))).map(g=>g.namn);
  kropp.innerHTML=`<div class="provklar">
      <p class="modal-text">Träningspasset <b>${esc(s.titel)}</b> är skapat.${valda.length?` Eleverna i ${esc(valda.join(", "))} ser det direkt på sin startsida.`:""}
        Du kan också dela koden eller länken, till exempel i Classroom eller Teams.</p>
      <div class="provkodbox stor"><span>Kod</span><b>${esc(r.kod)}</b></div>
      <div class="provlank">${esc(provLank(r.kod))}</div>
      <div class="modal-fot">
        <button class="btn" onclick="provKopiera('${esc(r.kod)}',false)">Kopiera kod</button>
        <button class="btn" onclick="provKopiera('${esc(r.kod)}',true)">Kopiera länk</button>
        <span class="spacer"></span>
        <button class="btn primary" onclick="provRitaLararlista()">Klar</button></div>
    </div>`;
}

function larNar(t){
  if(!t) return "–";
  const d=new Date(t); if(Number.isNaN(d.getTime())) return "–";
  const idag=new Date(); idag.setHours(0,0,0,0);
  const dag=new Date(d); dag.setHours(0,0,0,0);
  const n=Math.round((idag-dag)/864e5);
  if(n<=0) return "idag";
  if(n===1) return "igår";
  if(n<7) return n+" dagar sedan";
  return d.toLocaleDateString("sv-SE",{day:"numeric",month:"short"});
}
function larPct(r,f){ return f ? Math.round(r/f*100)+" %" : "–"; }

function larBekrafta(rubrik,text,knapp,farlig){
  return new Promise(res=>{
    document.getElementById("larbekrafta")?.remove();
    const el=document.createElement("div");
    el.className="modal"; el.id="larbekrafta";
    el.innerHTML=`<div class="modal-kort" role="alertdialog" aria-modal="true" aria-label="${esc(rubrik)}" style="width:min(440px,100%)">
        <div class="modal-topp"><div><h2>${esc(rubrik)}</h2></div></div>
        <p class="modal-text">${text}</p>
        <div class="modal-fot"><span class="spacer"></span>
          <button class="btn" data-svar="nej">Avbryt</button>
          <button class="btn ${farlig?"farlig":"primary"}" data-svar="ja">${esc(knapp)}</button></div>
      </div>`;
    const klar=svar=>{ stangModal("larbekrafta"); res(svar); };
    el.addEventListener("click",e=>{
      if(e.target===el) return klar(false);
      const b=e.target.closest("[data-svar]"); if(b) klar(b.dataset.svar==="ja");
    });
    document.body.appendChild(el);
    requestAnimationFrame(()=>el.classList.add("visa"));
    setTimeout(()=>el.querySelector('[data-svar="nej"]')?.focus(),60);
  });
}

/* ── Mina grupper ── */
async function larHamtaGrupper(){
  const r=await klassRpc("kg_lar_grupper");
  if(r?.saknas) return "saknas";
  if(!r?.ok) return null;
  larData.grupper=r.grupper||[];
  return larData.grupper;
}
async function larRitaGrupper(){
  const kropp=document.getElementById("larkropp"); if(!kropp) return;
  if(state.larGrupp && state.larElev) return larRitaElev();
  if(state.larGrupp) return larRitaGrupp();
  const g=await larHamtaGrupper();
  if(!document.getElementById("larkropp")) return;
  if(g==="saknas"){ kropp.innerHTML=larSaknasHtml(); return; }
  if(!g){ kropp.innerHTML=`<div class="empty">Kunde inte hämta dina grupper. Är kontot godkänt som lärare?</div>`; return; }
  kropp.innerHTML=`<p class="lartext">Skapa en grupp och dela koden eller länken med eleverna. När en elev har gått med
      ser du elevens träning här. Eleven får veta att du kan följa träningen.</p>
    <div class="larny">
      <input class="admin-sok" id="lar-nyklass" maxlength="40" placeholder="Gruppens namn, t.ex. NA24b Ma2c"
        onkeydown="if(event.key==='Enter')larSkapaGrupp()">
      <button class="btn primary" onclick="larSkapaGrupp()">Skapa grupp</button>

    ${g.length?`<div class="largrid">${g.map(x=>`<button class="larkort" onclick="larValjGrupp(${Number(x.id)})">

      </button>`).join("")}</div>`
      :`<div class="empty">Du har inga grupper än. Skapa den första ovan.</div>`}`;
}
async function larSkapaGrupp(){
  const f=document.getElementById("lar-nyklass");
  const namn=(f?.value||"").trim();
  if(namn.length<2){ toast("Ge gruppen ett namn."); f?.focus(); return; }

const LAR_SORT={
  namn:  {txt:"Elev",              f:(a,b)=>String(a.namn||"").localeCompare(String(b.namn||""),"sv")},
  vecka: {txt:"Senaste 7 dagarna", f:(a,b)=>(b.vecka||0)-(a.vecka||0)},
  ratt:  {txt:"Andel rätt",        f:(a,b)=>((b.senaste_ratt||0)/Math.max(1,b.senaste||0))-((a.senaste_ratt||0)/Math.max(1,a.senaste||0))},
  totalt:{txt:"Totalt",            f:(a,b)=>(b.uppgifter||0)-(a.uppgifter||0)},
  senast:{txt:"Senast aktiv",      f:(a,b)=>new Date(b.senast||0)-new Date(a.senast||0)}
};
async function larRitaElever(ladda=true){
  const box=document.getElementById("largruppkropp"); if(!box) return;
  const id=state.larGrupp, g=larGrupp();
  if(ladda || !larData.elever[id]){
    const r=await klassRpc("kg_lar_elever",{p_grupp:id});
    if(!document.getElementById("largruppkropp")) return;
    if(!r?.ok){ box.innerHTML=`<div class="empty">Kunde inte hämta eleverna.</div>`; return; }
    larData.elever[id]=r.elever||[];
  }
  const lista=[...larData.elever[id]];
  if(!lista.length){
    box.innerHTML=`<div class="empty">Inga elever har gått med än. Dela koden <b>${esc(g?.kod||"")}</b> eller länken med gruppen.</div>`;
    return;
  }
  const s=LAR_SORT[state.larSort]?state.larSort:"namn";
