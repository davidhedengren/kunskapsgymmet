/* Startar ett kort pass i ett område på bestämda träningsnivåer.
   Används av återkopplingen i Träna mer på. */
function startCardLevel(key,nivaer){
  const kort=getCards().find(k=>k.key===key);
  if(!kort) return;
  const L=String(nivaer).split(",").filter(x=>NIVAER.includes(x));
  if(!L.length) return startCard(key);
  state.focusArea=null; state.focusOmr=[...kort.omr];
  state.focusNamn=`${kort.name} · nivå ${L.length>1?L[0]+"–"+L[L.length-1]:L[0]}`;
  state.focusFamily=null;
  beginSession();
  state.focusNiva=L; state.sessionTarget=6;
  navRecord("training"); nextTask();
}
function continueSession(){ const niva=state.focusNiva; beginSession(state.prov?"prov":undefined); state.focusNiva=niva; navRecord("training",true); nextTask(); }
function nextTask(){
  tchatStang();
  const t=chooseTask();
  if(!t){toast("Inga uppgifter hittades.");return;}
  noteNewLevel(t);
  state.currentTask=t;state.answered=false;state.solutionShown=false;
  state.partResults=[];state.partIndex=0;state.noXp=false;state.aktivRuta=0;
  state.hintUsed=false;state.hintVisible=false;
  state.altValda=new Set();state.altMiss=null;
  state.altOrdning=null;state.altOrdningId=null;
  stangKalla();
  state.lastIds.push(t.id);
  if(state.lastIds.length>60) state.lastIds.shift();
  noteraSedd(t.id);
  sparaPagaendePass();
  renderTraining();
  /* Påminnelsen kommer när eleven har kommit in i passet, inte i vägen
     för den första uppgiften. */
  if(state.sessionDone>=PAPPER_EFTER) setTimeout(visaPapperspaminnelse,500);
}

function noteNewLevel(t){
  const cp=ensureCourseProfile();
  cp.sedda ||= {};
  const L=levelOf(t);
  const nyckel=`T${L}`;
  if(L==="1" || cp.sedda[nyckel]) return;
  cp.sedda[nyckel]=Date.now();
  saveProfile();
  const n=Number(L);
  const text=n<=2 ? "Du får nu mer variation inom de grundläggande metoderna."
    : n===3 ? "Nu blandas mer eget metodval och tolkning in."
    : n===4 ? "Nu krävs oftare strategival och kopplingar mellan idéer."
    : "Nu möter du de mest självständiga och generaliserande uppgifterna.";
  cheer(String(n),"Ny träningsnivå",`Nivå ${n} upplåst`,text);
}

function sessionLabel(){
  if(state.prov) return provEtikett();
  if(state.focusFamily){
    const f=state.focusFamily;
    if(Array.isArray(f)) return f.length===1 ? familyName(f[0]) : f.length+" delmoment";
    return familyName(f);
  }
  if(state.focusNamn) return state.focusNamn;
  if(state.passTyp && PASS[state.passTyp]) return PASS[state.passTyp].namn;
  if(state.focusArea) return areaName(state.focusArea);
  return "Adaptivt pass";
}

function cleanDerivedAnswer(raw){
  let x=String(raw??"").trim();
  if(!x) return null;

  x=x.replace(/<br\s*\/?>/gi," ");
  x=x.replace(/<[^>]+>/g,"");
  x=x.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
  x=x.trim();

  x=x.replace(/^svar\s*:\s*/i,"").trim();

  if(x.length>120) return null;
  return x || null;
}

function mathChunksFromHTML(html){
  const s=String(html??"");
  const out=[];

  for(const m of s.matchAll(/\\\(([\s\S]*?)\\\)/g)) out.push("\\("+m[1].trim()+"\\)");

  for(const m of s.matchAll(/\\\[([\s\S]*?)\\\]/g)) out.push("\\("+m[1].trim()+"\\)");
  return out;
}

function answerCandidateFromElement(el){
  if(!el) return null;

  const strongs=[...el.querySelectorAll("strong")];
  for(let i=strongs.length-1;i>=0;i--){
    const raw=strongs[i].innerHTML.trim();
    const plain=strongs[i].textContent.trim();
    if(!raw) continue;
    if(/^(metod|mellanled|tänk så här|svar)\s*:?\s*$/i.test(plain)) continue;
    const cleaned=cleanDerivedAnswer(raw);
    if(cleaned && (mathChunksFromHTML(raw).length || /[-+−]?\d|[a-zA-Z]/.test(cleaned))){
      return cleaned;
    }
  }

  const chunks=mathChunksFromHTML(el.innerHTML);
  if(chunks.length){
    return cleanDerivedAnswer(chunks[chunks.length-1]);
  }

  return null;
}

function derivedAnswersFromSolution(t){
  const blocked=new Set(["figur","resonemang","text"]);
  const type=String(t.svarstyp||"").toLowerCase();
  if(blocked.has(type)) return null;
  if(!t.s) return null;

  const parser=new DOMParser();
  const doc=parser.parseFromString(`<div id="kg-facit-root">${t.s}</div>`,"text/html");
  const root=doc.getElementById("kg-facit-root");
  if(!root) return null;

  const partCount=inferAnswerCount(t);

  if(partCount>1 || type==="flera_delar"){
    const answers=new Array(partCount).fill(null);
    const elements=[...root.querySelectorAll("p, .deluppgifter > div, li")];

    for(const el of elements){
      const text=(el.textContent||"").trim();
      const m=text.match(/^([a-j])\)\s*/i);
      if(!m) continue;
      const idx=m[1].toLowerCase().charCodeAt(0)-97;
      if(idx<0 || idx>=partCount) continue;

      const candidate=answerCandidateFromElement(el);
      if(candidate) answers[idx]=candidate;
    }

    if(answers.every(Boolean)) return answers;
    return null;
  }

  const elements=[...root.querySelectorAll("p, li, .svar, .answer")];

  for(let i=elements.length-1;i>=0;i--){
    const txt=(elements[i].textContent||"").trim();
    if(/\bsvar\s*:/i.test(txt)){
      const cand=answerCandidateFromElement(elements[i]);
      if(cand) return [cand];
      const chunks=mathChunksFromHTML(elements[i].innerHTML);
      if(chunks.length) return [cleanDerivedAnswer(chunks[chunks.length-1])];
    }
  }

  const candidates=[];
  for(const el of root.querySelectorAll("strong")){
    const plain=(el.textContent||"").trim();
    if(/^(metod|mellanled|tänk så här|svar)\s*:?\s*$/i.test(plain)) continue;
    const cleaned=cleanDerivedAnswer(el.innerHTML);
    if(cleaned && (mathChunksFromHTML(el.innerHTML).length || /^[-+−]?\d+(?:[,.]\d+)?(?:\s*[a-zA-Z°%]+)?$/.test(cleaned))){
      candidates.push(cleaned);
    }
  }
  if(candidates.length===1) return [candidates[0]];

  return null;
}

function autoPerDel(t,antal){
  const plan=svarsPlan(t);
  if(plan) return plan.rutor.map(r=>plan.delar[r.del].auto);
  const sr=t.självrättning;
  const svar=Array.isArray(t.rättSvar)?t.rättSvar:[t.rättSvar];
  return Array.from({length:antal},(_,i)=>{
    const facit=svar[i];
    if(facit===null||facit===undefined||facit==="") return false;
    if(Array.isArray(sr)) return !!sr[i];
    return !!sr;
  });
}

const FACIT_FALLBACK_STANDARD=true;

function expectedAnswersForTask(t){
  /* Alternativuppgifter rättas av sin egen motor (kollaAlt), inte av
     textjämförelsen. auto:true gör att "Visa lösning" nollar XP som vanligt. */
  if(arAlt(t)) return {answers:[],source:"alternativ",auto:true,delAuto:[true]};

  if(t.självrättning===false){
    return {answers:[],source:"metadata",auto:false,delAuto:[]};
  }
  if(t.rättSvar!==null && t.rättSvar!==undefined){
    const plan=svarsPlan(t);
    const answers=plan ? plan.rutor.map(r=>plan.delar[r.del].svar[r.plats])
                       : (Array.isArray(t.rättSvar)?t.rättSvar:[t.rättSvar]);
    const auto=autoPerDel(t,answers.length);
    return {
      answers,
      source:"metadata",

      auto:auto.some(Boolean),
      delAuto:auto
    };
  }

  const fallbackTillaten = t.facitFallback===true
    || (t.facitFallback!==false && FACIT_FALLBACK_STANDARD);
  const derived=fallbackTillaten ? derivedAnswersFromSolution(t) : null;
  if(derived && derived.length){
    return {answers:derived,source:"facit",auto:true,
            delAuto:derived.map(()=>true)};
  }

  return {answers:[],source:"none",auto:false,delAuto:[]};
}

function inferAnswerCount(t){
  if(t.rättSvar!==null && t.rättSvar!==undefined){
    return Array.isArray(t.rättSvar) ? Math.max(1,t.rättSvar.length) : 1;
  }
  const plain=String(t.t||"")
    .replace(/<br\s*\/?>/gi,"\n")
    .replace(/<\/p>/gi,"\n")
    .replace(/<[^>]+>/g," ");
  const matches=[...plain.matchAll(/(?:^|[\s\n])([a-j])\)\s*/gi)].map(m=>m[1].toLowerCase());
  const unique=[...new Set(matches)];
  return unique.length || 1;
}

const SPEGLA={"<":">",">":"<","<=":">=",">=":"<="};

function intervallAv(x){

    t=t.trim().replace(/\s+/g,"").replace(/,/g,".");
    if(/^[+-]?(?:∞|oo|inf|infinity)$/i.test(t)) return t[0]==="-"?-Infinity:Infinity;
    const n="[+-]?(?:\\d+(?:\\.\\d+)?|\\.\\d+)";

    const f=t.match(new RegExp("^("+n+")/("+n+")$"));
    if(f) return Number(f[2])!==0?Number(f[1])/Number(f[2]):NaN;

    &&r.min!==Infinity&&r.max!==-Infinity&&r.min<=r.max
    &&!(r.min===r.max&&(r.minOpen||r.maxOpen))
    &&!(r.min===-Infinity&&!r.minOpen)&&!(r.max===Infinity&&!r.maxOpen);

  if(!villkor.length||villkor.some(d=>!d)||new Set(villkor.map(d=>d.v.toLowerCase())).size!==1)return null;

/* Numeriska svar måste vara fullständiga tal, inte bara börja med rätt tal.
   Enheten får utelämnas eller anges enligt uppgiftens enhetsmetadata. */
function rentNumerisktSvar(anv,facit,meta){
  const text=stadaSvar(hogerled(anv)).replace(/\s+/g,"")
    .replace(/[⋅∙·×]/g,"*");
  const upp={"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5",
             "⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁻":"-"};
  const normal=text.replace(/10([⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+)/g,
    (_,exp)=>"10^"+[...exp].map(c=>upp[c]).join("")).replace(/^([+-]?)10\^(\(?[+-]?\d+\)?)/,
      (_,sign,exp)=>sign+"1*10^"+exp);
  const m=normal.match(/^([+-]?(?:\d+(?:[.,]\d+)?|[.,]\d+)(?:(?:e[+-]?\d+)|(?:\*10\^\(?[+-]?\d+\)?))?)(.*)$/i);
  if(!m) return false;
  let taltext=m[1],enhet=m[2];
  // Ren tiopotens, exempelvis 10^-3, har ingen separat koefficient.
  if(/^[+-]?10$/.test(taltext) && /^\^\(?[+-]?\d+\)?$/.test(enhet)){
    taltext+=enhet; enhet="";
  }
  /* Facit som exakt tal ("-2/5", "15/4") värderas helt; talAv läser bara det inledande talet. */
  const fs=String(facit);
  const v=taltolk(taltext),f=(/[\/√^π]|sqrt|pi|ln|lg|log|sin|cos|tan/i.test(fs) && isPureNumberExpression(fs))
    ? numericValue(tillNerdamer(normalizeMathInput(fs))) : talAv(facit);
  if(!Number.isFinite(v)||!Number.isFinite(f)) return false;
  if(String(meta.format).toLowerCase()==="heltal" && !Number.isInteger(v)) return false;
  if(!enhet) return naraNog(v,f,meta.tolerans);
  const avsedd=String(meta.enhet??"").replace(/\s+/g,"");
  if(!avsedd) return false;
  if(enhet===avsedd) return naraNog(v,f,meta.tolerans);
  return enhetsJamforelse(normal,facit,meta.enhet,meta.tolerans)===true;

/* Bråksvar ska vara ett helt svar, inte bara börja med ett korrekt tal.
   Likvärdiga bråk och exakt decimalform godtas i värdeuppgifter. */
function rentBrakSvar(anv,facit,meta){
  let s=stadaSvar(hogerled(anv)).replace(/^\\\(|\\\)$/g,"").trim();
  s=s.replace(/\\(?:d?frac)\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g,"$1/$2");

    if(!b) return false;
    v=(blandat[1].startsWith("-")?-1:1)*(Math.abs(h)+a/b);

  if(format==="decimalform")
    return formatRatt(enhetMedOrd(anv),facit,{format,tolerans:tol,enhet});
  /* Med svarsenheten % lagras facit i procent. Ett uttryckligt %-tecken
     får inte tas bort och därefter skalas igen av den generella talrättningen. */
  if(enhet==="%" && (format==="numeriskt" || format==="procent")){
    const r=enhetsJamforelse(enhetMedOrd(anv),facit,enhet,tol);
    if(r!==null) return r;
  }
  /* Facit som kedja av likvärdiga former: "f(x)=(x+2)(x-4)=x^2-2x-8", "(6)/(4)=(3)/(2)".
     Svaret godkänns om det stämmer med någon av formerna, men bara när formerna verkligen är
     lika. En ekvation som "x^2-8x+12=0" har olika led och berörs inte. */
  if(typeof facit==="string" && !/[<>≤≥]/.test(facit)){
    const ren=facit.replace(/\\[()\[\]]/g,"").trim();
    const delar=ren.split("=").map(d=>d.trim()).filter(Boolean);
    if(delar.length>=2 && ren.split("=").length===delar.length){
      const etikett=/^(?:y|[a-zA-Z]\s*\(\s*[a-z]\s*\))$/.test(delar[0]);
      const former=etikett?delar.slice(1):delar;
      const lika=(p,q)=>{
        const a=numerisktSvar(p)?talAv(p):NaN, b=numerisktSvar(q)?talAv(q):NaN;
        if(Number.isFinite(a)&&Number.isFinite(b)) return naraNog(a,b,1e-9);
        const pv=isPureNumberExpression(p)?numericValue(tillNerdamer(normalizeMathInput(p))):NaN;
        const qv=isPureNumberExpression(q)?numericValue(tillNerdamer(normalizeMathInput(q))):NaN;
        if(Number.isFinite(pv)&&Number.isFinite(qv)) return naraNog(pv,qv,1e-9);
        return algebraisktLika(p,q)===true;
      };
      /* Bara formkedjor med en variabel ("lg1000=3" frågar efter skrivsättet, inte värdet). */
      const harVariabel=former.some(f=>/[a-z]/i.test(f.replace(/\\?(?:sin|cos|tan|ln|lg|log|sqrt|pi|frac|cdot|left|right)/g,"").replace(/e\^/g,"")));
      if(harVariabel && former.length>=2 && former.slice(1).every(f=>lika(former[0],f))){
        for(const f of former){
          if(delSvarRatt(anv,etikett?`${delar[0]}=${f}`:f,enhet,tol,t,idx,format)) return true;
          if(delSvarRatt(anv,f,enhet,tol,t,idx,format)) return true;
        }
      }
    }
  }
  /* Facit "g(-1)=6" när uppgiften ber om g(-1): bara värdet "6" räcker också.
     Gäller inte när uppgiften ber eleven skriva själva likheten (då står g(-1) inte i frågan). */
  if(typeof facit==="string" && !/[a-zåäö]\s*\(/i.test(String(anv).split("=")[0]||"") && !String(anv).includes("=")){
    const mf=facit.replace(/\\[()\[\]]/g,"").trim().match(/^([a-zA-Z][a-zA-Z0-9_']*\s*\((?:[^()]|\([^()]*\))*\))\s*=\s*([^=<>]+)$/);
    if(mf){
      const bort=s=>String(s).replace(/\\[()\[\]]/g,"").replace(/\\left|\\right/g,"").replace(/[\s{}]/g,"").replace(/−/g,"-");
      const fraga=bort(String(t?.t||"").replace(/<[^>]+>/g," "));
      if(fraga.includes(bort(mf[1])) && /bestäm|beräkna|ange|vad är|vilket värde|räkna ut/i.test(String(t?.t||""))
         && delSvarRatt(anv,mf[2].trim(),enhet,tol,t,idx,format)) return true;
    }
  }
  /* Facit som funktionsuttryck "P(t)=120+35t": funktionens namn står ofta inte i frågan.
     Högerledet räcker, och vänsterledet får vara y, en bokstav eller ett annat funktionsnamn
     med samma variabel ("y=120+35t", "A(t)=120+35t", "120+35t"). */
  if(typeof facit==="string"){
    const ff=facit.replace(/\\[()\[\]]/g,"").trim().match(/^[a-zA-Z]\s*\(\s*([a-z])\s*\)\s*=\s*([^=<>]+)$/);
    if(ff && ff[2].includes(ff[1])){
      const a=String(anv).replace(/\\[()\[\]]/g,"").trim();
      const fa=a.match(/^(?:([a-zA-Z])|[a-zA-Z]\s*\(\s*([a-z])\s*\))\s*=\s*([^=<>]+)$/);
      let hl=null;
      if(!a.includes("=")) hl=a;
      else if(fa && (fa[2] ? fa[2]===ff[1] : fa[1]!==ff[1])) hl=fa[3];
      if(hl && hl.trim() && delSvarRatt(hl.trim(),ff[2].trim(),enhet,tol,t,idx,format)) return true;
    }
  }
  /* Facit "(x,y)=(2,1)": talen jämförs ett och ett. "(2, 1)", "2, 1", "x=2, y=1" och
     "y=1 och x=2" godtas. Utan detta lästes "(5,3,3)" som decimaltalet 5,3 och godtogs mot (5,3,2). */
  if(typeof facit==="string"){
    const fp=facit.replace(/\\[()\[\]]/g,"").trim().match(/^\(\s*([a-z](?:\s*,\s*[a-z]){1,2})\s*\)\s*=\s*\((.+)\)$/);
    if(fp){
      const namn=fp[1].split(",").map(s=>s.trim());
      /* Komma utan mellanslag kan vara decimalkomma: dela först på alla komman, annars på ", " och ";". */
      const dela=s=>{
        const x=String(s).split(",").map(v=>v.trim());
        if(x.length===namn.length && x.every(Boolean)) return x;
        const y=String(s).split(/,\s+|\s*;\s*/).map(v=>v.trim());
        return y.length===namn.length && y.every(Boolean) ? y : null;
      };
      const fv=dela(fp[2]);
      const a=String(anv).replace(/\\[()\[\]]/g,"").trim();
      let sv=null;
      const lhs=a.match(/^\(\s*([a-z](?:\s*,\s*[a-z])*)\s*\)\s*=\s*\((.+)\)$/i);
      if(lhs){
        /* "(y,x)=(1,2)": talen ordnas efter elevens variabelordning. */
        const egna=lhs[1].replace(/\s/g,"").toLowerCase().split(","), v=dela(lhs[2]);
        if(v && egna.length===namn.length && namn.every(n=>egna.includes(n))) sv=namn.map(n=>v[egna.indexOf(n)]);
        else return false;
      } else if(/[a-z]\s*=/i.test(a)){
        const par={};
        const re=/([a-z])\s*=\s*(.+?)(?=\s*(?:[,;]|\boch\b)?\s*[a-z]\s*=|\s*$)/gi;
        let m, rest=a;
        while((m=re.exec(a))){ par[m[1].toLowerCase()]=m[2].replace(/\s*(?:[,;]|\boch\b)\s*$/,"").trim(); rest=rest.replace(m[0],""); }
        if(namn.every(n=>par[n]) && Object.keys(par).length===namn.length
          && !/[a-z0-9]/i.test(rest.replace(/\boch\b/g,""))) sv=namn.map(n=>par[n]);
      } else {
        sv=dela(a.replace(/^\((.*)\)$/,"$1"));
      }
      if(fv && sv) return sv.every((v,k)=>delSvarRatt(v,fv[k],enhet,tol,t,idx,format));
    }
  }
  /* Positionsord: "7 tiondelar", "9 tusendelar", "4 hundratal" när facit är ett tal. */
  if(typeof facit==="number" || numerisktSvar(facit)){
    const m=stadaSvar(anv).toLowerCase().match(/^(\d+(?:[.,]\d+)?)\s*(ental|tiotal|hundratal|tusental|tiondel(?:ar)?|hundradel(?:ar)?|tusendel(?:ar)?)$/);
    if(m){
      const f={ental:1,tiotal:10,hundratal:100,tusental:1000,tiondel:0.1,hundradel:0.01,tusendel:0.001}[m[2].replace(/ar$/,"")];
      if(delSvarRatt(String(talAv(m[1])*f),facit,enhet,tol,t,idx,format)) return true;
    }
  }
  /* Exakt facit (11/3, 3/ln2, 2π) och ett korrekt avrundat decimalsvar med minst tre värdesiffror,
     när uppgiften inte kräver exakt svar: "3,67" eller "3,667" för 11/3, men inte "3,7". */
  if(typeof facit==="string" && /[\/√^π]|sqrt|pi|ln|lg|log|sin|cos|tan|e/i.test(facit)
     && !/exakt|algebraiskt|bråkform/i.test(String(t?.t||""))){
    const a=stadaSvar(anv).replace(/\s/g,"");
    const m=a.match(/^-?(\d+)(?:[.,](\d+))?$/);
    if(m && isPureNumberExpression(facit)){
      const val=numericValue(tillNerdamer(normalizeMathInput(facit)));
      const d=(m[2]||"").length;
      const siffror=(m[1].replace(/^0+/,"")+(m[2]||"")).replace(/^0+/,"").length;
      if(Number.isFinite(val) && siffror>=3 && Math.abs(talAv(a)-val)<=0.5*Math.pow(10,-d)*(1+1e-9)) return true;
    }
  }
  /* Funktionsformel: "y = 3x − 1", "f(x) = 3x − 1" och bara "3x − 1" betyder samma sak. */
  if(typeof facit==="string"){
    const fvl=/^\s*(?:y|[a-zA-Z]\s*\(\s*x\s*\))\s*=\s*([^=]+)$/;
    const mf=facit.replace(/\\[()\[\]]/g,"").trim().match(fvl);
    if(mf){
      const a=stadaSvar(anv), ma=a.match(fvl);
      const hl=ma ? ma[1] : (a.includes("=") ? null : a);
      if(hl!==null && /x/.test(hl) && algebraisktLika(hl,mf[1])===true) return true;
    }
  }
  /* Förändring med ord: "13,8 % minskning" eller "minskar med 9 %" när facit är negativt,
     "ökning med 5 %" när det är positivt. Frågar uppgiften efter en minskning räknas
     "20 % minskning" mot ett positivt facit. */
  if(typeof facit==="number" || numerisktSvar(facit)){
    const NEG=/^(minskning|minskningen|minskar|minskat|minskade|sänkning|sänks|sänkt|nedgång)$/i;
    const POS=/^(ökning|ökningen|ökar|ökat|ökade|höjning|höjs|höjt|uppgång)$/i;
    const FYLL=/^(den|det|en|med|på|är|blir|av|ca|cirka)$/i;
    const ord=stadaSvar(anv).replace(/[.!]$/,"").split(/\s+/).filter(Boolean).map(w=>/^procent$/i.test(w)?"%":w);
    const neg=ord.some(w=>NEG.test(w)), pos=ord.some(w=>POS.test(w));
    const rest=ord.filter(w=>!NEG.test(w)&&!POS.test(w)&&!FYLL.test(w)).join(" ");
    if(neg!==pos && rest && /^\d/.test(rest) && !/\p{L}{3,}/u.test(rest)){
      if(delSvarRatt((neg?"-":"")+rest,facit,enhet,tol,t,idx,format)) return true;
      const tt=String(t?.t||"");
      if(neg && /minsk|sänk|lägre/i.test(tt) && !/ök|höj/i.test(tt) && delSvarRatt(rest,facit,enhet,tol,t,idx,format)) return true;
    }
  }
  /* Ett tal med enhet efter när facit är ett rent tal utan angiven enhet ("1,65 kg", "48 kr"). */
  if((enhet===undefined||enhet===null||enhet==="") && (typeof facit==="number" || numerisktSvar(facit))){
    const m=String(anv).trim().match(/^(.*?\d)\s*([a-zåäöµΩ°%][a-zåäöµΩ°%²³/·*()^0-9]*)\s*$/i);
    if(m && !/^(e|pi|x|y|i)$/i.test(m[2]) && delSvarRatt(m[1],facit,null,tol,t,idx,format)) return true;
  }
  /* Med facits enhet utskriven efter svaret, även när svaret är ett uttryck. */
  if(typeof enhet==="string" && enhet.trim()){
    const utan=utanEnhet(anv,enhet);
    if(utan!==null && delSvarRatt(utan,facit,null,tol,t,idx,format)) return true;
    /* Enhet skriven med ord: "90 kronor per timme" för kr/h. */
    const ord=enhetMedOrd(anv);
    const utan2=ord!==String(anv) ? utanEnhet(ord,enhet) : null;
    if(utan2!==null && delSvarRatt(utan2,facit,null,tol,t,idx,format)) return true;
    /* Normaliserad enhet med prefix ("5 kpa" → "5 kPa" mot facit i Pa) rättas som vanligt.
       enhetMedOrd ändrar inte ett redan normaliserat svar, så anropet når inte hit igen. */
    if(ord!==String(anv) && delSvarRatt(ord,facit,enhet,tol,t,idx,format)) return true;
  }
  const meta={format,tolerans:tol,enhet};
  /* Alla primitiva funktioner (facit slutar på +C): konstanten får heta något annat, t.ex. +K eller +D. */
  if(/\+\s*C\s*(?:\\\))?\s*$/.test(String(facit)) && /\+\s*[A-DF-WYZa-df-wyz]\s*$/.test(String(anv)))
    anv=String(anv).replace(/\+\s*[A-Za-z]\s*$/,"+C");
  // Lösningsmängder godkänns oavsett ordning och skrivsätt. Kontrollen kan bara godkänna.
  if(rotListaRatt(anv,facit,tol)) return true;
  /* Ordfacit utan angivet format ("nej", "moturs", "avtagande"). */
  if(!format && typeof facit==="string" && /^[a-zåäö][a-zåäö \-]*$/i.test(facit.trim()) && textSvarRatt(anv,facit)) return true;
  if(format){
    const r=formatRatt(anv,facit,meta);
    if(r!==null) return r;
  }
  if(enhet!==undefined&&enhet!==null&&enhet!==""){
    const r=enhetsJamforelse(anv,facit,enhet,tol);
    if(r!==null) return r;
  }

  if(numerisktSvar(facit) || typeof facit==="number"){
    if(naraNog(talAv(hogerled(anv)),talAv(facit),tol)) return true;
  }
  const kopia = (typeof tol==="number") ? Object.assign({},t,{tolerans:tol}) : t;

  const enDel=(x,y)=>{
    const o=olikhetsJamforelse(x,y,tol);
    return (o!==null) ? o : oneAnswerCorrect(x,y,kopia,idx);
  };

  const lu=ordListaAv(anv), lf=ordListaAv(facit);
  if(lu && lf && lu.length===lf.length){
    const kvar=[...lf];
    const alla=lu.every(v=>{
      const i=kvar.findIndex(k=>enDel(v,k));
      if(i<0) return false;
      kvar.splice(i,1); return true;
    });
    if(alla) return true;
  }

  return enDel(anv,facit);
}

function answerLayout(t){
  const info=expectedAnswersForTask(t);
  const taggat=taggatAntalSvar(t);
  const bokstaver=subtaskLetters(t);

  const plan=svarsPlan(t);
  const struktur=String(t.svarsstruktur||"").toLowerCase();
  const etiketter=Array.isArray(t.svarEtiketter)?t.svarEtiketter:null;

  const mangdTaggat=["mängd","mangd","lösningsmängd","losningsmangd"].includes(struktur);
  const delarTaggat = mangdTaggat ? false : (
       ["ordnad","deluppgifter","delar","flera_delar"].includes(struktur)
    || ["flera_delar","flera delar","deluppgifter"].includes(String(t.svarstyp||"").toLowerCase())
    || nastlat(t.rättSvar)
    || (etiketter && etiketter.length>1)
    || (plan && plan.delar.some(d=>d.manuell)));
  const harFacit = t.rättSvar!==null && t.rättSvar!==undefined;
  const n = plan ? plan.rutor.length
          : info.auto ? Math.max(1,info.answers.length)
          : Math.max(1,taggat||bokstaver||1);
  const ordnad = mangdTaggat ? false
               : delarTaggat ? n>1
               : (!taggat && bokstaver>1 && n>1);

  const delAuto = plan
    ? plan.rutor.map(r=>plan.delar[r.del].auto)
    : Array.from({length:n},(_,i)=>info.delAuto ? !!info.delAuto[i] : !!info.auto);
  return {info,plan,n,ordnad,flersvar:n>1&&!ordnad,taggat,delarTaggat,delAuto,
          etiketter,struktur,
          blandad:delAuto.some(Boolean)&&delAuto.some(x=>!x)};
}

const SI_PREFIX={T:1e12,G:1e9,M:1e6,k:1e3,h:1e2,da:1e1,
                 d:1e-1,c:1e-2,m:1e-3,"µ":1e-6,"μ":1e-6,u:1e-6,n:1e-9,p:1e-12,f:1e-15};

const ENHETER={
  m:{b:"m",f:1}, g:{b:"g",f:1}, s:{b:"s",f:1}, A:{b:"A",f:1}, K:{b:"K",f:1},
  mol:{b:"mol",f:1}, cd:{b:"cd",f:1},
  N:{b:"N",f:1}, J:{b:"J",f:1}, W:{b:"W",f:1}, V:{b:"V",f:1}, C:{b:"C",f:1},
  Pa:{b:"Pa",f:1}, Hz:{b:"Hz",f:1}, T:{b:"T",f:1}, F:{b:"F",f:1}, H:{b:"H",f:1},
  "Ω":{b:"Ω",f:1}, ohm:{b:"Ω",f:1}, S:{b:"S",f:1}, Wb:{b:"Wb",f:1}, Bq:{b:"Bq",f:1},
  Sv:{b:"Sv",f:1}, Gy:{b:"Gy",f:1}, lm:{b:"lm",f:1}, lx:{b:"lx",f:1},
  min:{b:"s",f:60}, tim:{b:"s",f:3600}, dygn:{b:"s",f:86400},
  "år":{b:"s",f:31557600},
  l:{b:"l",f:1}, L:{b:"l",f:1},
  ton:{b:"g",f:1e6}, t:{b:"g",f:1e6}, mil:{b:"m",f:1e4}, bar:{b:"Pa",f:1e5}, atm:{b:"Pa",f:101325},
  eV:{b:"J",f:1.602176634e-19}, u:{b:"g",f:1.66053906660e-24},
  Wh:{b:"J",f:3600}, Ah:{b:"C",f:3600}, kWh:{b:"J",f:3.6e6},
  "°":{b:"°",f:1}, rad:{b:"rad",f:1}, "%":{b:"%",f:1}
};

const ENHET_ALIAS={h:"tim",timme:"tim",timmar:"tim",sek:"s",sekunder:"s",
  sekund:"s",minut:"min",minuter:"min",dag:"dygn",dagar:"dygn",
  grader:"°",gr:"°",procent:"%",liter:"l",gram:"g",meter:"m",newton:"N",joule:"J",watt:"W"};

function tolkaEnhetsord(sym){
  if(!sym) return null;
  const namn=ENHETER[sym] ? sym : (ENHET_ALIAS[sym]||ENHET_ALIAS[sym.toLowerCase()]||sym);
  if(ENHETER[namn]) return {f:ENHETER[namn].f,b:ENHETER[namn].b};

  for(const p of ["da","T","G","M","k","h","d","c","m","µ","μ","u","n","p","f"]){
    if(namn.length>p.length && namn.startsWith(p)){
      const rest=namn.slice(p.length);
      const e=ENHETER[rest];
      if(e) return {f:SI_PREFIX[p]*e.f, b:e.b};
    }
  }
  return null;
}

function tolkaEnhet(str){
  if(str===null||str===undefined) return null;
  // Bränsleförbrukning: 100 km är en sträcka, inte en enhet med exponent 100.
  if(/^(?:l|liter)\s*(?:per|\/)\s*100\s*km$/i.test(String(str).trim()))
    return expanderaEnhet({f:1/100000,d:{l:1,m:-1}});
  let x=String(str).trim()
    .replace(/[⋅∙·×x]/g,"*").replace(/²/g,"^2").replace(/³/g,"^3")
    .replace(/[()]/g,"")   // "J/(kg·K)": allt efter "/" är redan nämnare
    .replace(/\s+/g,"")
    .replace(/^varv(?:per|\/)(?:s|sek|sekund)$/i,"Hz");   // "varv/s", "varv per sekund"
  if(!x) return {f:1,d:{}};
  const delar=x.split("/");
  const res={f:1,d:{}};
  for(let i=0;i<delar.length;i++){
    const tecken=i===0?1:-1;
    if(!delar[i]) continue;
    for(const bit of delar[i].split("*")){
      if(!bit || bit==="1") continue;   // "1/s", "1/K"
      const m=bit.match(/^([^\^\d]+)(?:\^?(-?\d+))?$/);
      if(!m) return null;
      const e=tolkaEnhetsord(m[1]);
      const ord=e ? [e] : delaSammansattEnhet(m[1]);
      if(!ord) return null;
      const exp=(m[2]?parseInt(m[2],10):1)*tecken;
      for(const o of ord){
        res.f*=Math.pow(o.f,exp);
        res.d[o.b]=(res.d[o.b]||0)+exp;
      }
    }
  }
  return expanderaEnhet(res);
}
// Sammanskrivna enheter utan multiplikationstecken, t.ex. "Ns", "kNs", "Nm", "kgm".
function delaSammansattEnhet(sym){
  for(let i=1;i<sym.length;i++){
    const a=tolkaEnhetsord(sym.slice(0,i)), b=tolkaEnhetsord(sym.slice(i));
    if(a && b) return [a,b];
  }
  return null;
}
// Härledda enheter jämförs i grundenheter, så att t.ex. Ns = kg·m/s och l = dm³.
const HARLEDDA_ENHETER={
  N:{f:1e3,d:{g:1,m:1,s:-2}}, J:{f:1e3,d:{g:1,m:2,s:-2}}, W:{f:1e3,d:{g:1,m:2,s:-3}},
  Pa:{f:1e3,d:{g:1,m:-1,s:-2}}, Hz:{f:1,d:{s:-1}}, l:{f:1e-3,d:{m:3}}
};
function expanderaEnhet(res){
  const ut={f:res.f,d:{}};
  for(const [k,v] of Object.entries(res.d)){
    const h=HARLEDDA_ENHETER[k];
    if(h){
      ut.f*=Math.pow(h.f,v);
      for(const [kk,vv] of Object.entries(h.d)) ut.d[kk]=(ut.d[kk]||0)+vv*v;
    } else ut.d[k]=(ut.d[k]||0)+v;
  }
  Object.keys(ut.d).forEach(k=>{ if(!ut.d[k]) delete ut.d[k]; });
  return ut;
}
function sammaDimension(a,b){
  const ka=Object.keys(a.d).sort(), kb=Object.keys(b.d).sort();
  if(ka.length!==kb.length) return false;
  return ka.every((k,i)=>k===kb[i] && a.d[k]===b.d[k]);
}

function taltolk(str){
  if(typeof str==="number") return str;
  let x=String(str).trim().toLowerCase()
    .replace(/^svar\s*:\s*/,"")
    .replace(/[−–—]/g,"-")
    .replace(/[⋅∙·×]/g,"*")
    .replace(/\s+/g,"");
  x=x.replace(/(\d),(\d)/g,"$1.$2");

  const UPP={"\u2070":"0","\u00b9":"1","\u00b2":"2","\u00b3":"3","\u2074":"4",
             "\u2075":"5","\u2076":"6","\u2077":"7","\u2078":"8","\u2079":"9",
             "\u207b":"-"};
  x=x.replace(/[\u2070\u00b9\u00b2\u00b3\u2074-\u2079\u207b]+/g,
    m=>"^"+[...m].map(c=>UPP[c]).join(""));

  x=x.replace(/(\*?)10\^\(?(-?\d+)\)?/g,(m,stjarna,exp,off,str)=>{
    const fore=str[off-1];

    return (stjarna || (fore && /[\d.]/.test(fore))) ? "e"+exp : "1e"+exp;
  });
  const m=x.match(/^[-+]?\d*\.?\d+(?:e[-+]?\d+)?/);
  if(!m) return NaN;
  const v=Number(m[0]);
  return Number.isFinite(v)?v:NaN;
}

function delaTalEnhet(str){
  const tal=taltolk(str);
  if(!Number.isFinite(tal)) return {tal:NaN,enhet:""};

  const x=String(str).replace(/^\s*[Ss]var\s*:\s*/,"").replace(/[−–—]/g,"-").trim();
  const m=x.match(/^[-+]?[\d\s.,]+(?:\s*(?:[⋅∙·×*]\s*10\s*\^?\s*\(?-?\d+\)?|[eE][-+]?\d+))?/);
  const rest=m ? x.slice(m[0].length).trim() : "";
  return {tal,enhet:rest.replace(/^[·*]\s*/,"").trim()};
}

function enhetsJamforelse(anv,facit,enhet,tol){
  const f=delaTalEnhet(facit);
  const fTal=Number.isFinite(f.tal)?f.tal:taltolk(facit);
  if(!Number.isFinite(fTal)) return null;
  const a=delaTalEnhet(anv);
  if(!Number.isFinite(a.tal)) return null;

  const facitEnhet=tolkaEnhet(enhet||f.enhet||"");
  const anvEnhet=a.enhet?tolkaEnhet(a.enhet):null;
  if(!facitEnhet) return null;
  if(a.enhet && !anvEnhet) return false;
  if(anvEnhet && !sammaDimension(facitEnhet,anvEnhet)) return false;

  const fBas=fTal*facitEnhet.f;
  const aBas=a.tal*(anvEnhet?anvEnhet.f:facitEnhet.f);
  const tolBas=(typeof tol==="number"?tol:(fTal!==0?Math.abs(fTal)*1e-4:1e-12))*facitEnhet.f;

  if(Math.abs(aBas-fBas)<=tolBas+(fBas!==0?Math.abs(fBas)*1e-9:1e-12)) return true;

  const ärProcent=facitEnhet.d["%"]===1;
  if(ärProcent && !a.enhet){
    if(Math.abs(a.tal*100-fTal)<=(typeof tol==="number"?tol:Math.abs(fTal)*1e-4)) return true;
  }
  return false;
}

function numerisktSvar(facit){
  if(facit===null||facit===undefined) return false;
  const x=String(facit).trim().replace(",",".");
  return /^\d+(\.\d+)?$/.test(x);
}

function latexToPlain(s){
  let x=String(s??"");

  x=x.replace(/<br\s*\/?>/gi," ");
  x=x.replace(/<[^>]+>/g," ");

  x=x.replace(/\\\(|\\\)|\\\[|\\\]|\$\$/g,"");
  /* Jämförelsetecken först, innan \sqrt2 och liknande skrivs om ("\le\sqrt2"). */
  x=x.replace(/\\(?:leq?|leqslant)(?![a-zA-Z])/g,"≤").replace(/\\(?:geq?|geqslant)(?![a-zA-Z])/g,"≥");
  x=x.replace(/\\lt(?![a-zA-Z])/g,"<").replace(/\\gt(?![a-zA-Z])/g,">").replace(/\\neq?(?![a-zA-Z])/g,"≠");
  x=x.replace(/\\pm(?![a-zA-Z])/g,"±").replace(/\\infty(?![a-zA-Z])/g,"∞");

  for(let i=0;i<4;i++){
    x=x.replace(/\^\s*\{([^{}]*)\}/g,"^($1)");   // exponenter först, så att \frac{e^{x}}{2} kan läsas
    x=x.replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g,"(($1)/($2))");
    x=x.replace(/\\dfrac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g,"(($1)/($2))");
    x=x.replace(/\\sqrt\s*\{([^{}]+)\}/g,"sqrt($1)");
  }

  /* Vanliga kortformer som elever kan klistra in från LaTeX. */
  x=x.replace(/\\(?:d?frac)\s*\{([^{}]+)\}\s*([+-]?\d)/g,"(($1)/($2))");
  x=x.replace(/\\(?:d?frac)\s*([+-]?\d)\s*\{([^{}]+)\}/g,"(($1)/($2))");
  x=x.replace(/\\(?:d?frac)\s*([+-]?\d)\s*([+-]?\d)/g,"(($1)/($2))");
  x=x.replace(/\\sqrt\s*([0-9]+(?:\.[0-9]+)?|[a-z])/gi,"sqrt($1)");
  x=x.replace(/\\sqrt(?=\s*\()/g,"sqrt");

  x=x.replace(/\\left|\\right/g,"");
  /* LaTeX-funktionsnamn förekommer i bankens rättSvar. Gör dem till
     samma plain-text-form som elever normalt skriver i svarsrutan. */
  /* \frac\pi4 utan klamrar. */
  x=x.replace(/\\(?:d?frac)\s*\\pi\s*([+-]?\d)/g,"((\\pi)/($1))");
  /* (?![a-zA-Z]) i stället för \b: i "\cos5x" finns ingen ordgräns mellan s och 5.
     Mellanslaget före namnet hindrar att "i\sin0" blir ordet "isin0". */
  x=x.replace(/\\(arcsin|arccos|arctan|asin|acos|atan|sinh|cosh|tanh|sin|cos|tan|ln|log|exp|abs)(?![a-zA-Z])/g," $1");

  for(let i=0;i<4;i++){
    x=x.replace(/\^\s*\{([^{}]*)\}/g,"^($1)");
    x=x.replace(/_\s*\{([^{}]*)\}/g,"_$1");
  }
  x=x.replace(/\\cdot|\\times/g,"*");
  x=x.replace(/\\pi/g,"pi");
  x=x.replace(/\\(arcsin|arccos|arctan|sinh|cosh|tanh|sin|cos|tan|ln|log|exp)(?![a-zA-Z])/g," $1");
  x=x.replace(/\\,/g,"");
  x=x.replace(/\\text\s*\{([^{}]*)\}/g," $1 ");

  x=x.replace(/[−–—]/g,"-");
  x=x.replace(/[×·⋅]/g,"*");
  x=x.replace(/÷/g,"/");
  x=x.replace(/π/g,"pi");
  x=x.replace(/\u00a0/g," ");

  x=x.replace(/²/g,"^2").replace(/³/g,"^3").replace(/⁴/g,"^4")
     .replace(/⁵/g,"^5").replace(/⁶/g,"^6").replace(/⁷/g,"^7")
     .replace(/⁸/g,"^8").replace(/⁹/g,"^9");

  return x.trim();
}

function normalizeDecimalComma(x){

  let prev;
  do{
    prev=x;
    x=x.replace(/(\d),(\d)/g,"$1.$2");
  }while(x!==prev);
  return x;
}

function normalizeMathInput(s){
  let x=latexToPlain(s).toLowerCase();

  x=x.replace(/^svar\s*:\s*/,"");
  x=normalizeDecimalComma(x);

  x=x.replace(/(\d|\))\s*:\s*(\d|\()/g,"$1/$2");

  x=x.replace(/√\s*\(([^()]+)\)/g,"sqrt($1)");
  x=x.replace(/√\s*([a-z]\w*|\d+(?:\.\d+)?)/g,"sqrt($1)");

  x=x.replace(/(\d+(?:\.\d+)?)\s*%/g,"($1/100)");

  /*
   * I svensk notation betyder sin^2 x, cos^2 x och tan^2 x
   * (sin x)^2, (cos x)^2 respektive (tan x)^2.
   * Normalisera funktionspotensen innan vanlig funktionsnotation tolkas.
   * Negativa exponenter tas inte här eftersom sin^-1 x kan avse arcsin.
   */
  const trigPow=/(?<![a-z_])(sin|cos|tan)\s*\^\s*([2-9]\d*)/g;
  x=x.replace(new RegExp(trigPow.source+"\\s*\\(([^()]*)\\)","g"),
    (_,f,p,arg)=>`${f}(${arg})^${p}`);
  x=x.replace(new RegExp(trigPow.source+"\\s*((?:\\d+(?:\\.\\d+)?)?[a-z]|pi(?:\\/\\d+)?)\\b","g"),
    (_,f,p,arg)=>`${f}(${arg})^${p}`);

  /* (?<![a-z_]) i stället för \b: i "-7sin x" och "-7sinx" står en siffra direkt före. */
  x=x.replace(/(?<![a-df-su-wyz_])(arcsin|arccos|arctan|sinh|cosh|tanh|asin|acos|atan|sqrt|log10|log|sin|cos|tan|ln|lg|exp)\s+([a-z0-9.]+(?:\^[a-z0-9.]+)?)/g,"$1($2)");

  /* "cosxsinx", "lnxcosx": funktion av en ensam variabel direkt följd av nästa funktion. */
  x=x.replace(/(?<![a-df-su-wyz_])(sin|cos|tan|ln|lg)([xte])(?=(?:sin|cos|tan|ln|lg|sqrt|arc))/g,"$1($2)*");
  /* Acceptera även vanliga kompaktformer som sin2x och cos3x. */
  x=x.replace(/(?<![a-df-su-wyz_])(arcsin|arccos|arctan|sinh|cosh|tanh|asin|acos|atan|sin|cos|tan)(\d+(?:\.\d+)?[a-z]?|pi)\b/g,"$1($2)");

  x=x.replace(/(?<![a-df-su-wyz_])(arcsin|arccos|arctan|sinh|cosh|tanh|asin|acos|atan|sqrt|log10|log|sin|cos|tan|ln|lg|exp)([a-z])(?![a-z0-9])/g,"$1($2)");

  x=x.replace(/(\d)\s+(?=\d{3}(?:\D|$))/g,"$1");
  x=x.replace(/\s+/g,"");

  /* ln3 och lg100 utan parentes, även direkt efter en variabel som i
     3^xln3. Annars tolkas ln3 som ett variabelnamn och ln(3) underkänns. */
  x=x.replace(/(ln|lg)(\d+(?:\.\d+)?)(?![\d.a-z(^])/g,"$1($2)");

  x=x.replace(/[.;]$/,"");

  return x;
}

function normalizeAnswer(s){
  return normalizeMathInput(s);
}

const MATTEFUNKTIONER=["arcsin","arccos","arctan","sinh","cosh","tanh",
  "asin","acos","atan","sqrt","log10","log","sin","cos","tan","ln","lg",
  "exp","abs","pi"];

function explicitMultiplikation(x){
  const token=new RegExp("("+MATTEFUNKTIONER.join("|")+")|(\\d+(?:\\.\\d+)?)|([a-z])|([\\s\\S])","g");
  let ut="", forra=null, m;
  while((m=token.exec(x))){
    /* pi är en konstant, inte en funktion: 2pisin(pix) ska bli 2*pi*sin(pi*x). */
    const typ = m[1]==="pi"?"konst" : m[1]?"fn" : m[2]?"tal" : m[3]?"bok" : "ovr";
    const txt = m[0];
    if(forra){
      const p=forra.typ, pt=forra.txt;
      const stjarna =
           (p==="tal" && (typ==="bok"||typ==="fn"||typ==="konst"||txt==="("))
        || (p==="bok" && (typ==="bok"||typ==="fn"||typ==="konst"))
        /* Den imaginära enheten följd av ett tal: e^(i2π/3) är e^(i·2π/3), inte variabeln "i2". */
        || (p==="bok" && pt==="i" && typ==="tal")

        || (p==="bok" && txt==="(" && !"fgh".includes(pt))
        || (p==="konst" && (typ==="bok"||typ==="fn"||typ==="konst"||typ==="tal"||txt==="("))
        || (pt===")"  && (typ==="bok"||typ==="tal"||typ==="fn"||typ==="konst"||txt==="("));
      if(stjarna) ut+="*";
    }
    ut+=txt; forra={typ,txt};
  }
  return ut;
}

function tillNerdamer(x){
  return explicitMultiplikation(x)
    .replace(/\barcsin\(/g,"asin(")
    .replace(/\barccos\(/g,"acos(")
    .replace(/\barctan\(/g,"atan(")
    .replace(/(?<![a-z0-9_])(log10|lg|log|ln)\s*\(/g,
      (m,f)=> (f==="ln"?"log":"log10")+"(");
}

function firstNumber(s){
  const x=normalizeMathInput(s);
  const m=x.match(/[-+]?(?:\d+(?:\.\d+)?|\.\d+)/);
  return m?Number(m[0]):NaN;
}

function isPureNumberExpression(s){

  const x=explicitMultiplikation(normalizeMathInput(s));
  if(!x) return false;
  const scrub=x
    .replace(/\b(?:arcsin|arccos|arctan|sinh|cosh|tanh|sqrt|sin|cos|tan|asin|acos|atan|log10|lg|ln|log|abs|exp|pi|e)\b/g,"")
    .replace(/[0-9.+\-*/^(),]/g,"");
  return scrub==="";
}

function nerd(expr){
  if(typeof window.nerdamer!=="function") return null;
  try{return window.nerdamer(expr);}catch(_){return null;}
}

function symbolicZero(expr){
  if(typeof window.nerdamer!=="function") return false;
  try{
    const r=window.nerdamer(`simplify(${expr})`).toString();
    return r==="0";
  }catch(_){
    try{
      const r=window.nerdamer(expr).expand().toString();
      return r==="0";
    }catch(__){return false;}
  }
}

function numericValue(expr){
  if(typeof window.nerdamer==="function"){
    try{
      const n=Number(window.nerdamer(expr).evaluate().text("decimals"));
      if(Number.isFinite(n)) return n;
    }catch(_){}
  }
  // Exakta talsvar ska fungera även om den externa algebrafilen inte laddats.
  // Återanvänd räknarens parser, med strikta parenteser och radianer.
  if(typeof expr!=="string" || expr.length>1000 || !isPureNumberExpression(expr)) return NaN;
  try{
    const calculatorExpr=expr.replace(/\b(log10|log)\s*\(/g, (_,name)=>(name==="log10"?"log":"ln")+"(");
    const n=raknTolka(calculatorExpr,{grader:false,strict:true});
    return Number.isFinite(n)?n:NaN;
  }catch(_){return NaN;}
}

function splitEquation(expr){
  const parts=String(expr).split("=");
  return parts.length===2 && parts[0] && parts[1] ? parts : null;
}

function equationResidual(expr){
  const p=splitEquation(expr);
  return p ? `((${p[0]})-(${p[1]}))` : null;
}

function expressionVariables(expr){
  const e=nerd(expr);
  if(!e) return [];
  try{
    const vars=e.variables();
    return Array.isArray(vars)?vars.map(String):[];
  }catch(_){return [];}
}

function equationsEquivalent(user,expected){
  const ur=equationResidual(user);
  const er=equationResidual(expected);
  if(!ur || !er) return false;

  if(symbolicZero(`(${ur})-(${er})`)) return true;
  if(symbolicZero(`(${ur})+(${er})`)) return true;

  try{
    const ratio=window.nerdamer(`simplify((${ur})/(${er}))`);
    const vars=ratio.variables();
    if(Array.isArray(vars) && vars.length===0){
      const n=Number(ratio.evaluate().text("decimals"));
      if(Number.isFinite(n) && Math.abs(n)>1e-12) return true;
    }
  }catch(_){}

  return false;
}

function algebraicallyEquivalent(user,expected){
  const u=tillNerdamer(normalizeMathInput(user));
  const e=tillNerdamer(normalizeMathInput(expected));
  if(!u || !e) return false;
  if(u===e) return true;
  if(typeof window.nerdamer!=="function") return false;

  const ue=splitEquation(u);
  const ee=splitEquation(e);

  if(ue && ee) return equationsEquivalent(u,e);

  if(ue && !ee && isPureNumberExpression(e)){
    const left=ue[0],right=ue[1];
    if(/^[a-z]\w*$/.test(left) && algebraicallyEquivalent(right,e)) return true;
    if(/^[a-z]\w*$/.test(right) && algebraicallyEquivalent(left,e)) return true;
  }
  if(!ue && ee && isPureNumberExpression(u)){
    const left=ee[0],right=ee[1];
    if(/^[a-z]\w*$/.test(left) && algebraicallyEquivalent(u,right)) return true;
    if(/^[a-z]\w*$/.test(right) && algebraicallyEquivalent(u,left)) return true;
  }

  if(ue || ee) return false;

  if(/[<>≤≥]/.test(u) || /[<>≤≥]/.test(e)) return false;

  if(symbolicZero(`((${u})-(${e}))`)) return true;

  try{
    const diff=window.nerdamer(`(${u})-(${e})`).expand().toString();
    if(symbolicZero(`(${diff})`)) return true;
  }catch(_){}

  return numeriskLika(u,e);
}

/* När den symboliska förenklingen inte räcker (t.ex. 3^n/3 mot 3^(n-1)) jämförs uttrycken i
   flera fasta punkter. Båda måste ha samma variabler; punkterna är positiva för att undvika
   definitionsproblem med ln och rötter. */
function numeriskLika(u,e){
  try{
    const vu=expressionVariables(u).sort(), ve=expressionVariables(e).sort();
    if(!vu.length || vu.length>3 || vu.join()!==ve.join()) return false;
    const punkter=[0.37,1.29,2.13,0.71,1.83,2.47,0.53,1.61];
    let ok=0;
    for(let k=0;k<punkter.length;k++){
      const sub={};
      vu.forEach((v,j)=>{ sub[v]=String(punkter[(k+3*j)%punkter.length]); });
      const a=Number(window.nerdamer(u,sub).evaluate().text("decimals"));
      const b=Number(window.nerdamer(e,sub).evaluate().text("decimals"));
      if(!Number.isFinite(a)||!Number.isFinite(b)) continue;
      if(Math.abs(a-b)>1e-8*Math.max(1,Math.abs(a),Math.abs(b))) return false;
      ok++;
    }
    return ok>=5;
  }catch(_){ return false; }
}

function oneAnswerCorrect(user,expected,t,delIndex){
  const u=normalizeAnswer(user), e=normalizeAnswer(expected);
  if(!u) return false;

  if(u===e) return true;

  if(explicitMultiplikation(u)===explicitMultiplikation(e)) return true;

  if(algebraicallyEquivalent(user,expected)) return true;

  const algebraisktU=!isPureNumberExpression(user);
  const algebraisktE=!isPureNumberExpression(expected);
  if(algebraisktU && algebraisktE) return false;

  let un=NaN,en=NaN;
  if(isPureNumberExpression(user)) un=numericValue(tillNerdamer(normalizeMathInput(user)));
  if(isPureNumberExpression(expected)) en=numericValue(tillNerdamer(normalizeMathInput(expected)));

  /* "g(-1)=6": talet är högerledet, inte argumentet -1. */
  const hl=x=>{ const s=String(x).replace(/\\[()\[\]]/g,""); return /[=≈]/.test(s) ? s.split(/[=≈]/).pop() : x; };
  if(!Number.isFinite(un)) un=firstNumber(hl(user));
  if(!Number.isFinite(en)) en=firstNumber(hl(expected));

  if(Number.isFinite(un)&&Number.isFinite(en)){

    const rå=Array.isArray(t.tolerans) ? t.tolerans[delIndex||0] : t.tolerans;
    const tol=typeof rå==="number"
      ? rå
      : (en!==0?Math.abs(en)*1e-4:1e-9);
    if(Math.abs(un-en)<=tol) return true;
  }

  return false;
}

function xpRuta(){
  return document.getElementById("xpmeter") || document.querySelector(".topbar .pill");
}

let xpTween=null;
function xpSkrivTal(into,need){
  const num=document.getElementById("xpnum");
  if(!num) return;
  num.innerHTML=`${into}<span class="sep">/</span>${need} XP`;
}
function xpRaknaUpp(fran,till,need,ms){
  cancelAnimationFrame(xpTween);
  const t0=performance.now();
  const steg=nu=>{
    const k=Math.min(1,(nu-t0)/ms);
    const e=1-Math.pow(1-k,3);
    xpSkrivTal(Math.round(fran+(till-fran)*e),need);
    if(k<1) xpTween=requestAnimationFrame(steg);
  };
  xpTween=requestAnimationFrame(steg);
}

function xpStall(xp,animeraTal,fran){
  const fill=document.getElementById("xpfill"), lvl=document.getElementById("xplvl"),
        meter=xpRuta();
  if(!fill) return;
  const L=levelFromXP(xp), bas=totalXpForLevel(L), topp=totalXpForLevel(L+1);
  const into=xp-bas, need=Math.max(1,topp-bas);
  fill.style.width=Math.round(100*into/need)+"%";
  if(lvl) lvl.textContent=L;

  const r=rankFor(L);
  const rk=document.getElementById("xprank"), rd=document.getElementById("xprankdot");
  if(rk) rk.textContent=r.name;
  if(rd) rd.innerHTML=r.sym;
  if(meter){
    meter.title=`Nivå ${L} · ${esc(r.name)} · ${into} av ${need} XP till nivå ${L+1}`;
    meter.setAttribute("aria-label",`Nivå ${L}, ${into} av ${need} XP till nästa nivå`);
  }
  if(animeraTal) xpRaknaUpp(fran,into,need,900); else xpSkrivTal(into,need);
}

/* Markerar sträckan mellan gammalt och nytt läge och låter den blinka.
   Bredderna räknas i procent av den aktuella nivåns spann. */
function blinkaVunnet(franPct,tillPct){
  /* Både toppmenyns mätare och träningsvyns kan ligga i DOM:en samtidigt.
     Ta lagret som hör till den mätare xpRuta() pekar ut, annars faller
     blinket på en mätare eleven inte tittar på. */
  const ruta=xpRuta();
  const ny=ruta && ruta.querySelector(".xpny");
  if(!ny) return;
  const a=Math.max(0,Math.min(100,franPct)), b=Math.max(0,Math.min(100,tillPct));
  if(b-a<=0.3) return;
  ny.style.left=a+"%";
  ny.style.width=(b-a)+"%";
  ny.classList.remove("blink"); void ny.offsetWidth; ny.classList.add("blink");
  setTimeout(()=>{ ny.classList.remove("blink"); ny.style.width="0%"; },1300);
}

function animeraXp(fore,efter){
  const meter=xpRuta(), fill=document.getElementById("xpfill"),
        lvl=document.getElementById("xplvl"), gain=document.getElementById("xpgain");
  if(!meter||!fill) return;
  const vunnet=efter-fore;

  if(gain){
    gain.textContent=vunnet>0?"+"+vunnet+" XP":"0 XP";
    gain.style.color=vunnet>0?"var(--gold)":"var(--ink3)";
    gain.classList.remove("fly"); void gain.offsetWidth; gain.classList.add("fly");
  }
  if(vunnet>0){
    meter.classList.remove("tick"); void meter.offsetWidth; meter.classList.add("tick");
    setTimeout(()=>meter.classList.remove("tick"),1100);
  }
  if(vunnet<=0){ xpStall(efter,false); return; }

  const Lfore=levelFromXP(fore), Lefter=levelFromXP(efter);
  const intoFore=fore-totalXpForLevel(Lfore);
  const needFore=Math.max(1,totalXpForLevel(Lfore+1)-totalXpForLevel(Lfore));

  if(Lefter>Lfore){
    blinkaVunnet(100*intoFore/needFore,100);
    fill.style.width="100%";
    xpRaknaUpp(intoFore,needFore,needFore,600);
    setTimeout(()=>{
      const f=document.getElementById("xpfill");
      if(!f) return;
      f.style.transition="none"; f.style.width="0%";
      if(lvl){ lvl.classList.remove("upp"); void lvl.offsetWidth; lvl.classList.add("upp"); }
      requestAnimationFrame(()=>{
        f.style.transition="";
        requestAnimationFrame(()=>{
          xpStall(efter,true,0);
          const Ln=levelFromXP(efter), basN=totalXpForLevel(Ln);
          const needN=Math.max(1,totalXpForLevel(Ln+1)-basN);
          blinkaVunnet(0,100*(efter-basN)/needN);
        });
      });
    },720);
  }else{
    blinkaVunnet(100*intoFore/needFore,100*(efter-totalXpForLevel(Lfore))/needFore);
    requestAnimationFrame(()=>xpStall(efter,true,intoFore));
  }
}

/* =======================================================================
   Felrapportering

   Eleven klickar på flaggan i uppgiftens huvud. Ingen beskrivning krävs –
   en rapport räcker för att uppgiften ska hamna i lärarens logg. Valfria
   taggar och en rad text följer med om eleven vill.

   Rapporten sparas alltid lokalt först och skickas sedan till Supabase
   (rpc kg_rapportera_fel). Misslyckas nätet ligger den kvar i kön och
   skickas nästa gång sidan öppnas. Lärarens logg öppnas med ?felrapporter=1
   eller KG_FELRAPPORTER() i konsolen, och läser rpc kg_felrapport_logg.
   ===================================================================== */
const FEL_KO_KEY="kunskapsgymmet-felrapporter";
const FEL_ENHET_KEY="kunskapsgymmet-enhet";
/* XP som eleven får när en rapporterad uppgift faktiskt åtgärdas av läraren.
   Belöningen delas ut en gång per uppgift och kvitteras i profile.felBelonade,
   så den följer med i molnsynken och kan inte tas ut två gånger.

   Servern har ett eget tak: kg_profile räknar antalet åtgärdade rapporter
   kontot har skickat in och släpper igenom högst 50 XP per rapport, bokfört
   i kg_private.state.bonus_paid. Ändras siffran här måste den ändras i
   kg_profile också, annars stämplas eleven för score_delta. */
const FEL_BONUS_XP=50;
const FEL_BELONAD_KEY="kunskapsgymmet-felbelonade";
function felBelonadeLokalt(){
  try{ const x=JSON.parse(localStorage.getItem(FEL_BELONAD_KEY)||"{}");
       return (x && typeof x==="object") ? x : {}; }
  catch(_){ return {}; }
}
function felSkrivBelonade(o){
  try{ localStorage.setItem(FEL_BELONAD_KEY,JSON.stringify(o)); }catch(_){}
}
/* Vem som rapporterar skrivs först i kommentaren, "[Lärare: Namn]" eller "[Elev: Namn]",
   eftersom servern inte sparar rapportören. Äldre rapporter har "[Lärare]" eller ingen märkning. */
function felRapportorNamn(){
  const u=session?.user;
  return String(u?.user_metadata?.full_name || u?.email || profile?.namn || "").replace(/[\[\]]/g,"").trim();
}
function felRapportorMarkering(){
  const roll=arNagonLarare()?"Lärare":"Elev";
  const namn=felRapportorNamn();
  return (namn || roll==="Lärare") ? `[${roll}${namn?": "+namn:""}]` : "";
}
/* Delar loggens kommentarer i lärarnas och elevernas, med namn när det finns. */
function felDelaKommentarer(lista){
  const elev=[], larare=[];
  for(const k of (lista||[]).filter(Boolean)){
    const m=String(k).match(/^\[(Lärare|Elev)(?::\s*([^\]]*))?\]\s*([\s\S]*)$/);
    const post=m ? {namn:(m[2]||"").trim(), text:m[3].trim()} : {namn:"", text:String(k).trim()};
    (m && m[1]==="Lärare" ? larare : elev).push(post);
  }
  return {elev,larare};
}
/* "Namn: text", "Namn (utan kommentar)" eller bara texten. */
function felPostText(p,citat){
  const t=p.text ? (citat?'"'+p.text+'"':p.text) : "(utan kommentar)";
  return p.namn ? `${p.namn}: ${t}` : t;
}
const FEL_TAGGAR=[
  {id:"facit",     txt:"Fel svar i facit"},
  {id:"otydlig",   txt:"Frågan är otydlig"},
  {id:"bild",      txt:"Bild eller figur saknas"},
  {id:"losning",   txt:"Fel i lösningen"},
  {id:"annat",     txt:"Något annat"}
];

function felEnhetsId(){
  try{
    let id=localStorage.getItem(FEL_ENHET_KEY);
    if(!id){
      id=(globalThis.crypto?.randomUUID?.())||("enh-"+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
      localStorage.setItem(FEL_ENHET_KEY,id);
    }
    return id;
  }catch(_){ return "okand-enhet"; }
}
function felLasaKo(){
  try{ const x=JSON.parse(localStorage.getItem(FEL_KO_KEY)||"[]"); return Array.isArray(x)?x:[]; }
  catch(_){ return []; }
}
function felSkrivKo(lista){
  try{ localStorage.setItem(FEL_KO_KEY,JSON.stringify(lista.slice(-200))); }catch(_){}
}
function felUppgiftsId(t){ return String(t?.ursprungsId||t?.id||""); }
function felRedanRapporterad(t){

}
function felFlaggaHtml(t){

      onclick="oppnaFelrapport()" title="Rapportera fel i uppgiften"

        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 21V4h9l.6 2H20v9h-6.4l-.6-2H4"/></svg>
      <span>${gjord?"Rapporterad":"Rapportera fel"}</span>

}

async function felSkickaEn(r){
  if(!MOLN_PA()) return false;
  try{
    const rapport={
      kurs:r.kurs, spar:r.spar||null, uppgift:r.uppgift, deluppgift:r.deluppgift||null,
      kapitel:r.kapitel||null, omrade:r.omrade||null, svarstyp:r.svarstyp||null,
      taggar:r.taggar||[], kommentar:r.kommentar||null,
      bank:r.bank||null, enhet:r.enhet||null, tid:r.tid||null
    };
    const svar=await fetch(SUPABASE_URL+"/rest/v1/rpc/kg_rapportera_fel",{
      method:"POST",headers:sbHeaders(!!session),body:JSON.stringify({p_rapport:rapport})
    });
    if(svar.ok && session){
      /* Separat admin-audit. Misslyckas den påverkas inte den vanliga rapporten. */
      fetch(SUPABASE_URL+"/rest/v1/rpc/kg_logga_felrapport_anvandare",{
        method:"POST",headers:sbHeaders(true),body:JSON.stringify({p_rapport:rapport})
      }).catch(()=>{});
    }
    return svar.ok;
  }catch(_){ return false; }
}
async function felTommKo(){
  const ko=felLasaKo();
  if(!ko.some(r=>!r.skickad)) return;
  let andrat=false;
  for(const r of ko){
    if(r.skickad) continue;
    if(await felSkickaEn(r)){ r.skickad=true; andrat=true; }
  }
  if(andrat) felSkrivKo(ko);
}

/* ── Belöning för åtgärdade rapporter ────────────────────────────────── */
/* Servern (rpc kg_mina_atgardade) svarar med de av elevens egna rapporter
   som läraren har markerat som åtgärdade. Saknas rpc:n ligger funktionen
   tyst — betan fungerar precis som förut. */
async function felHamtaAtgardade(){
  if(FEL_BONUS_XP<=0) return;
  if(!MOLN_PA()) return;
  if(!felLasaKo().some(r=>r.skickad)) return;
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/kg_mina_atgardade",{
      method:"POST",headers:sbHeaders(!!session),
      body:JSON.stringify({p_enhet:felEnhetsId()})
    });
    if(!r.ok) return;
    const rader=await r.json();
    if(Array.isArray(rader) && rader.length) belonaAtgardade(rader);
  }catch(_){ /* nätet får aldrig störa träningen */ }
}
function belonaAtgardade(rader){
  profile.felBelonade ||= {};
  /* Kvittensen ligger både i profilen (följer med molnsynken) och lokalt
     på enheten, så samma rapport aldrig kan betalas ut två gånger även om
     profilnyckeln skulle falla bort i synken. */
  const lokalt=felBelonadeLokalt();
  const mina=felLasaKo();
  let nya=0;
  rader.forEach(r=>{
    const kurs=String(r.kurs||""), uppgift=String(r.uppgift||"");
    if(!kurs||!uppgift) return;
    const nyckel=kurs+"|"+uppgift;
    if(profile.felBelonade[nyckel] || lokalt[nyckel]) return;
    // Bara rapporter som den här eleven själv har skickat in.
    if(!mina.some(x=>x.kurs===kurs && x.uppgift===uppgift)) return;
    profile.felBelonade[nyckel]=Date.now();
    lokalt[nyckel]=Date.now();
    nya++;
  });
  if(!nya) return;
  felSkrivBelonade(lokalt);
  const fore=profile.xp;
  profile.xp+=nya*FEL_BONUS_XP;
  profile.felFynd=(profile.felFynd||0)+nya;
  saveProfile();
  animeraXp(fore,profile.xp);
  /* En rapport som leder till en rättelse är ett riktigt bidrag till
     banken. Det förtjänar mer än en notis som glider förbi i hörnet, så
     beskedet kommer i samma ruta som nivåhöjningar. */
  cheer(medaljIkon("betaflagga"),
    nya===1 ? "Rapport åtgärdad" : "Rapporter åtgärdade",
    nya===1 ? "Felet är rättat" : `${nya} fel är rättade`,
    nya===1
      ? `Uppgiften du rapporterade är fixad i banken. Tack för hjälpen. +${FEL_BONUS_XP} XP`
      : `Uppgifterna du rapporterade är fixade i banken. Tack för hjälpen. +${nya*FEL_BONUS_XP} XP`);
  checkBadges(1400);
}

let felValdaTaggar=null;
function oppnaFelrapport(){
  const t=state.currentTask;
  if(!t) return;
  if(felRedanRapporterad(t)){ toast("Du har redan rapporterat den här uppgiften. Tack!"); return; }
  stangFelrapport();
  felValdaTaggar=new Set();
  const el=document.createElement("div");
  el.className="modal"; el.id="felruta";
  el.innerHTML=`<div class="modal-kort" role="dialog" aria-modal="true" aria-label="Rapportera fel">
      <div class="modal-topp">
        <div>
          <div class="lbl">Uppgift #${esc(felUppgiftsId(t))}${t.deluppgift?" · del "+esc(t.deluppgift):""}</div>
          <h2>Rapportera fel</h2>
        </div>
        <button class="iconbtn" onclick="stangFelrapport()" aria-label="Stäng">✕</button>
      </div>
      <p class="modal-text">Klicka bara på Skicka om något inte stämmer. Du behöver inte
        förklara vad felet är – läraren ser vilken uppgift det gäller.${
        FEL_BONUS_XP>0?` Blir uppgiften rättad får du ${FEL_BONUS_XP} XP.`:""}</p>
      <div class="felval">${FEL_TAGGAR.map(x=>
        `<button type="button" data-fel-tagg="${x.id}" onclick="vaxlaFelTagg('${x.id}')">${esc(x.txt)}</button>`
      ).join("")}</div>
      <textarea id="felkommentar" maxlength="300" placeholder="Vill du säga något mer? (frivilligt)"></textarea>
      <div class="modal-fot">
        <span class="spacer"></span>
        <button class="btn" onclick="stangFelrapport()">Avbryt</button>
        <button class="btn primary" onclick="skickaFelrapport()">Skicka rapport</button>
      </div>
    </div>`;
  document.body.appendChild(el);
  el.addEventListener("click",e=>{ if(e.target===el) stangFelrapport(); });
  requestAnimationFrame(()=>el.classList.add("visa"));
}
function stangFelrapport(){
  const el=document.getElementById("felruta");
  if(!el) return;
  el.removeAttribute("id");
  el.classList.remove("visa");
  setTimeout(()=>el.remove(),250);
}
function vaxlaFelTagg(id){
  if(!felValdaTaggar) return;
  felValdaTaggar.has(id)?felValdaTaggar.delete(id):felValdaTaggar.add(id);
  const k=document.querySelector(`#felruta [data-fel-tagg="${id}"]`);
  if(k) k.classList.toggle("vald",felValdaTaggar.has(id));
}
function skickaFelrapport(){
  const t=state.currentTask;
  if(!t) return stangFelrapport();
  let kommentar=(document.getElementById("felkommentar")?.value||"").trim().slice(0,300);
  /* Rapporter från lärarkonton märks i kommentaren, så att loggen kan skilja
     lärarens kommentar från elevernas (servern sparar ingen roll). */
  const mark=felRapportorMarkering();
  if(mark) kommentar=(mark+(kommentar?" "+kommentar:"")).slice(0,300);
  const post={
    kurs:state.course, spar:state.track||null,
    uppgift:felUppgiftsId(t), deluppgift:t.deluppgift||null,
    kapitel:t.kap??null, omrade:t.omr||null,
    svarstyp:t.svarstyp||null,
    taggar:[...(felValdaTaggar||[])],
    kommentar:kommentar||null,
    bank:(typeof BANK_VERSION!=="undefined"?BANK_VERSION:null),
    enhet:felEnhetsId(), tid:new Date().toISOString(), skickad:false
  };
  const ko=felLasaKo(); ko.push(post); felSkrivKo(ko);
  stangFelrapport();
  const knapp=document.getElementById("felflagga");
  if(knapp){
    knapp.classList.add("rapporterad");
    const txt=knapp.querySelector("span"); if(txt) txt.textContent="Rapporterad";
  }
  toast("Tack! Uppgiften är markerad för granskning.");
  felSkickaEn(post).then(ok=>{
    if(!ok) return;
    const lista=felLasaKo();
    const rad=lista.find(r=>r.enhet===post.enhet && r.tid===post.tid && r.uppgift===post.uppgift);
    if(rad){ rad.skickad=true; felSkrivKo(lista); }
  });
}

/* ── Lärarens logg ───────────────────────────────────────────────────── */
async function hamtaFelloggen(visaAtgardade){
  if(!MOLN_PA()) throw new Error("Molnet är avstängt i den här versionen.");
  if(!session) throw new Error("Logga in med ditt lärarkonto först.");
  const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/kg_felrapport_logg",{
    method:"POST",headers:sbHeaders(true),
    body:JSON.stringify({p_visa_atgardade:!!visaAtgardade})
  });
  if(r.status===404) throw new Error("Felrapport-tabellen är inte installerad i Supabase ännu.");
  if(!r.ok) throw new Error("Loggen kunde inte hämtas. Är kontot upplagt som lärare?");
  const d=await r.json();
  return Array.isArray(d)?d:[];
}
let felloggData=[];

  if(k) k.textContent=felloggVisaKlara?"Dölj åtgärdade":"Visa åtgärdade";

async function ritaFellogg(){
  const host=document.getElementById("felloggkropp");
  if(!host) return;
  try{ felloggData=await hamtaFelloggen(felloggVisaKlara); }
  catch(e){ host.innerHTML=`<p class="modal-text">${esc(e.message)}</p>`; return; }
  if(!felloggVisaKlara){ felOppnaAntal=felloggData.length; uppdateraFelNotis(); }
  else uppdateraFelAntal();
  if(!felloggData.length){
    host.innerHTML=`<p class="modal-text">Inga öppna felrapporter just nu.</p>`; return;
  }
  let html="", kurs=null;
  felloggData.forEach(r=>{
    if(r.kurs!==kurs){
      kurs=r.kurs;
      html+=`<div class="kursrad">${esc(COURSES[kurs]?.name||kurs)}</div>`;
    }
    const taggar=(r.taggar||[]).map(x=>FEL_TAGGAR.find(y=>y.id===x)?.txt||x).join(" · ");
    const kd=felDelaKommentarer(r.kommentarer);
    const komm=[...kd.larare.map(p=>"Lärare "+felPostText(p,false)),
      ...kd.elev.map(p=>(p.namn?"Elev ":"")+felPostText(p,false))].slice(0,4).join(" | ");
    html+=`<div class="felpost${r.atgardad?" klar":""}">
      <span class="nr">#${esc(r.uppgift)}</span>
      <span class="txt">${taggar?esc(taggar):"<em>ingen tagg</em>"}${
        komm?` · ${esc(komm)}`:""}${r.spar?` · ${esc(r.spar)}`:""}</span>
      <span class="antal" title="${r.senast?"Senast rapporterad "+esc(kgAdminTid(r.senast)):""}">${r.antal}×${r.senast?`<small style="display:block;font-weight:400;opacity:.7">${esc(kgAdminTid(r.senast))}</small>`:""}</span>
      ${r.atgardad?"":`<button class="knapp" onclick="markeraFelAtgardad('${esc(r.kurs)}','${esc(r.uppgift)}')"
        title="Uppgiften var fel och är rättad. Eleverna som rapporterat får ${FEL_BONUS_XP} XP.">Åtgärdad</button>
      <button class="knapp avfard" onclick="ignoreraFel('${esc(r.kurs)}','${esc(r.uppgift)}')"
        title="Uppgiften var inte fel. Stänger rapporten utan XP.">Ignorera</button>`}
    </div>`;
  });
  host.innerHTML=html;
}
async function markeraFelAtgardad(kurs,uppgift){

    });

    }).catch(()=>{});

async function ignoreraFel(kurs,uppgift){

    });

    if(!r.ok) throw new Error("Kunde inte ignorera rapporten.");
    fetch(SUPABASE_URL+"/rest/v1/rpc/kg_synka_felstatus",{
      method:"POST",headers:sbHeaders(true),body:JSON.stringify({p_kurs:kurs,p_uppgift:uppgift,p_status:"ignorerad"})
    }).catch(()=>{});

}
function felloggText(){
  const rader=["Felrapporterade uppgifter · Kunskapsgymmet · "+kgAdminTid(new Date()),""];
  let kurs=null;
  felloggData.forEach(r=>{
    if(r.kurs!==kurs){
      kurs=r.kurs;
      rader.push("",(COURSES[kurs]?.name||kurs)+"  ["+kurs+"]");
    }
    const taggar=(r.taggar||[]).map(x=>FEL_TAGGAR.find(y=>y.id===x)?.txt||x).join(", ");
    const kd=felDelaKommentarer(r.kommentarer);
    const cit=a=>a.map(p=>felPostText(p,true)).join(" · ");
    rader.push(`  #${r.uppgift}${r.deluppgift?" del "+r.deluppgift:""}`
      +`${r.spar?"  spår "+r.spar:""}  ${r.antal} rapport${r.antal===1?"":"er"}`
      +`${r.forst&&r.antal>1&&kgAdminTid(r.forst)!==kgAdminTid(r.senast)?"  först "+kgAdminTid(r.forst):""}`
      +`${r.senast?"  senast "+kgAdminTid(r.senast):""}`
      +`${taggar?"\n      taggar: "+taggar:""}`
      +`${kd.larare.length?"\n      lärare: "+cit(kd.larare):""}`
      +`${kd.elev.length?"\n      elever: "+cit(kd.elev):""}`);
  });
  return rader.join("\n");
}
function kopieraFellogg(){

  const vv=window.visualViewport, el=skrivRuta;

  const r=el.getBoundingClientRect();
  const marginal=12;
  const onskadTop=vv.height-r.height-marginal;
  const diff=r.top-onskadTop;
  if(Math.abs(diff)>10) window.scrollBy({top:diff,behavior:"smooth"});

/* =======================================================================
   Händelselogg och lärarstatistik

   Varje besvarad uppgift skickas som en rad till kg_handelse. Raden är
   anonym: kurs, uppgift, resultat och en enhetsnyckel, ingen elevtext och
   inga namn. Statistiken räknas fram server-side i rpc kg_statistik och
   visas bara för konton som ligger i kg_larare.
   ===================================================================== */
function kgLoggaHandelse(t,{andel,correct,xp}){
  if(!MOLN_PA() || !t) return;
  const kropp={p_handelse:{
    kurs:state.course, spar:state.track||null,
    uppgift:felUppgiftsId(t), omrade:t.omr||null,
    niva:(typeof levelNumber==="function"?levelNumber(t):null),
    andel:Math.round(Math.max(0,Math.min(1,andel||0))*100)/100,
    ratt:!!correct, ledtrad:!!state.hintUsed, facit:!!state.solutionShown,
    xp:Math.max(0,Math.round(xp||0)), enhet:felEnhetsId()
  }};
  /* Statistiken får aldrig störa träningen: ingen väntan, inga fel. */
  try{
    fetch(SUPABASE_URL+"/rest/v1/rpc/kg_logga_handelse",{
      method:"POST",headers:sbHeaders(!!session),body:JSON.stringify(kropp),keepalive:true
    }).catch(()=>{});
  }catch(_){}
}

  if(!r.ok) throw new Error("Statistiken kunde inte hämtas. Är kontot upplagt som lärare?");
  return r.json();
}
