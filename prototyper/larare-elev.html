<html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kunskapsgymmet – arbetsflöde, prototyp</title>
<style>
:root{color-scheme:dark;--bg:#090f1b;--panel:#151f32;--panel2:#1b2840;--ink:#edf2fb;--muted:#a9b6cc;--line:#304058;--blue:#75aaff;--green:#70dfb4;--amber:#f2c976;--radius:18px;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button{border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--ink);padding:10px 16px;font-weight:650}button:hover:not(:disabled){border-color:var(--blue);background:#243958}.primary{background:#3478e1;border-color:#5797fb;color:white}.primary:hover:not(:disabled){background:#2869cf}.quiet{background:transparent}.small{padding:6px 11px;font-size:13px}.link{padding:0;border:0;background:transparent;color:var(--blue);text-align:left}.link:hover:not(:disabled){background:transparent;text-decoration:underline}.prototype{padding:9px 24px;background:#192438;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.prototype label{display:flex;align-items:center;gap:8px}.prototype select{padding:5px 9px}.prototype b{color:#d3e2ff}.shell{max-width:1160px;margin:auto;padding:0 24px}.top{border-bottom:1px solid #233047;background:#0d1524}.top .shell{display:flex;gap:20px;align-items:center;min-height:84px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}.brand{background:none;border:0;padding:0;font-size:19px;font-weight:800;letter-spacing:-.7px}.brand span{color:var(--blue)}.brandmark{display:inline-grid;place-items:center;width:32px;height:32px;background:#285383;border-radius:11px;margin-right:8px;vertical-align:middle;font-size:20px}.mode{display:flex;padding:4px;background:#080f1b;border:1px solid var(--line);border-radius:13px;gap:4px;margin-left:auto}.mode button{border:0;background:none;font-size:14px;padding:9px 14px;color:var(--muted)}.mode button.active{background:#233450;color:white}.avatar{width:36px;height:36px;border-radius:50%;padding:0;background:#233450}.account{display:flex;align-items:center;gap:10px;font-size:13px}.account small{display:block;color:var(--muted)}main{padding:38px 0 70px}h1{font-size:clamp(30px,4vw,44px);line-height:1.12;letter-spacing:-1.7px;margin:8px 0 14px}h2{font-size:23px;letter-spacing:-.6px;margin:0}h3{font-size:19px;letter-spacing:-.3px;margin:0 0 7px}p{margin:0 0 16px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:1.9px;text-transform:uppercase;color:var(--blue);font-weight:750}.intro{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:30px}.intro p{color:var(--muted);max-width:650px;margin-bottom:0}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:24px 0 34px}.metric{padding:19px 22px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.metric b{display:block;font-size:28px;letter-spacing:-1px}.metric span{overflow-wrap:anywhere;color:var(--muted);font-size:13px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 15px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:23px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-width:0}.card p{color:var(--muted);font-size:14px}.card .footer{border-top:1px solid var(--line);margin-top:21px;padding-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.tag{display:inline-flex;align-items:center;gap:7px;padding:4px 9px;background:#22334e;color:#c9ddff;border-radius:7px;font-size:12px;font-weight:600;margin-bottom:13px}.green{background:#15392f;color:var(--green)}.amber{background:#3b3121;color:var(--amber)}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}.course-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#253e61;color:#abd1ff;font-weight:750;font-size:18px;margin-bottom:17px}.callout{padding:16px 20px;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#111d2e;color:var(--muted);font-size:14px}.callout p{margin:0}.note{font-size:13px;color:var(--muted)}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:27px 0}.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--muted);padding:12px 2px}.tabs .active{border-bottom-color:var(--blue);color:var(--ink)}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row p{margin:3px 0 0;color:var(--muted);font-size:13px}.progress{height:7px;border-radius:9px;background:#2c3c55;overflow:hidden;margin:13px 0 7px}.progress i{display:block;background:var(--green);height:100%;border-radius:9px}.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px}.bars .row{display:block}.bars .row>div:first-child{display:flex;justify-content:space-between;gap:14px;font-size:14px}.empty{text-align:center;padding:35px 16px}.empty h2{margin-bottom:8px}.empty p{color:var(--muted);max-width:500px;margin:0 auto 20px}.onboard{display:flex;gap:18px;align-items:flex-start;margin:22px 0}.onboard b:first-child{display:grid;place-items:center;flex-shrink:0;width:32px;height:32px;background:#233958;border-radius:50%;color:var(--blue)}.onboard p{margin:3px 0 0}.badge-xp{font-size:12px;color:var(--green);border:1px solid #315346;border-radius:8px;padding:5px 8px}.crumb{margin-bottom:22px}.modal-wrap{position:fixed;inset:0;z-index:50;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}.modal{width:min(660px,100%);max-height:90dvh;overflow:auto;border:1px solid var(--line);border-radius:22px;background:var(--panel);padding:28px;box-shadow:0 30px 90px #0008}.modal .section-head{margin:0 0 20px}.modal label.field{display:block;margin:18px 0 7px;font-weight:600;font-size:14px}input,select{color:var(--ink);background:#0f192a;border:1px solid var(--line);border-radius:9px;padding:11px 12px;max-width:100%}input[type=text],select.full{width:100%}.modal footer{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);margin-top:24px;padding-top:20px}.check{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;border-bottom:1px solid #27364e}.check input{width:19px;height:19px;accent-color:#6da4ff;flex-shrink:0}.check span{min-width:0;overflow-wrap:anywhere}.check small{display:block;color:var(--muted)}.roster{max-height:290px;overflow:auto;padding:0 8px}.search{margin:18px 0 8px}.selected{color:var(--blue);font-size:13px;margin-top:12px}.code{font-size:29px;letter-spacing:5px;font-weight:800;padding:22px;background:#0c1626;border-radius:14px;text-align:center;margin:20px 0}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:90vw;padding:13px 20px;background:#e5f4ee;color:#16362a;border-radius:12px;z-index:100;box-shadow:0 10px 45px #0006}.question{font-size:24px;margin:24px 0}.answer{display:flex;gap:10px;align-items:center}.hidden{display:none!important}.linkcard{width:100%;text-align:left;background:none;border:0;padding:0;display:block}.practice-grid .card:hover{border-color:var(--blue)}.practice-grid .card:focus-within{outline:2px solid var(--blue)}.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.pillrow button.active{border-color:var(--blue);background:#243b5b}.pending{font-size:12px;color:var(--amber)}.small-number{font-size:12px;color:var(--muted)}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.top .shell{gap:12px}.account .account-name{display:none}.mode button{font-size:13px;padding:8px 10px}.brand{font-size:17px}.intro{align-items:flex-start;flex-direction:column}.stats{margin-top:18px}.prototype{padding:8px 16px}.shell{padding:0 18px}.modal{padding:22px}.card{padding:19px}}
@media(max-width:520px){.grid,.grid.two{grid-template-columns:1fr}.top .shell{padding-top:14px;padding-bottom:14px}.mode{order:3;width:100%;margin:0}.mode button{flex:1}.account{margin-left:auto}.stats{gap:8px}.metric{padding:13px 11px}.metric b{font-size:24px}.metric span{font-size:11px}.section-head h2{font-size:21px}.callout{align-items:flex-start;flex-direction:column}.intro{gap:17px;margin-bottom:24px}.tabs{gap:18px}.modal-wrap{padding:10px}.row{gap:10px}.actions{gap:8px}main{padding-top:25px}.prototype>span{font-size:11px}.prototype label{width:100%}.prototype select{flex:1;min-width:0}.answer{flex-wrap:wrap}}
</style>
<body><div class="prototype"><span><b>KLICKBAR PROTOTYP</b> · Exempeldata · Inga riktiga konton påverkas</span><label>Visa som <select id="scenario" onchange="setScenario(this.value)"><option value="teacher">Lärare · med grupper</option><option value="newteacher">Lärare · första besöket</option><option value="student">Elev · med träningspass</option><option value="empty">Elev · utan träningspass</option></select></label></div><div id="app"></div><div id="overlay"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const names=['Ada Lind','Amir Berg','Elin Holm','Hugo Ek','Iris Dahl','Leo Lund','Maja Sand','Noah Vik','Alva Bo','Elias Strand','Freja Nor','Liam Sjö','Mira Sol','Nils West','Sam Lind','Vera Gren','Axel Örn','Ella Lund','Isak Berg','Liv Holm','Malte Ek','Nora Vik','Olle Sand','Siri Dahl'];
const students=names.map((name,i)=>({id:i+1,name,klass:['NA26a','NA26b','TE26a'][Math.floor(i/8)]}));
const courses=['Matematik nivå 2','Fysik nivå 1','Matematik nivå 1'];
let groups,passes,scenario='teacher',mode='teach',view='home',groupId=1,tab='overview',practiceCourse=courses[0],practiceTask=0,groupDraft=null,selection=new Set(),currentPass=null;
const studentId=3;let toastTimer;
function resetData(){groups=[{id:1,name:'Matematik · NA26a + NA26b',course:courses[0],ids:students.slice(0,12).map(s=>s.id),code:'MATT26'},{id:2,name:'Fysik · NA26a',course:courses[1],ids:students.slice(0,8).map(s=>s.id),code:'FYSI26'},{id:3,name:'Mattestugan',course:courses[0],ids:[3,9,14,18],code:'STUG26'}];passes=[{id:101,title:'Inför provet: ekvationer',course:courses[0],groups:[1,3],count:20,deadline:'Fredag 16 oktober',topic:'Ekvationer',done:8},{id:102,title:'Krafter i vardagen',course:courses[1],groups:[2],count:12,deadline:'Måndag 19 oktober',topic:'Krafter',done:0}];}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const teacher=()=>scenario==='teacher'||scenario==='newteacher';const group=()=>groups.find(g=>g.id===groupId);const uniqueStudents=()=>new Set(groups.flatMap(g=>g.ids));
function notify(message){clearTimeout(toastTimer);$('toast').className='toast';$('toast').textContent=message;toastTimer=setTimeout(()=>{$('toast').textContent='';$('toast').className='';},4000);}
function setScenario(value){scenario=value;mode=teacher()?'teach':'practice';view='home';tab='overview';currentPass=null;closeModal();resetData();if(value==='newteacher'){groups=[];passes=[];}if(value==='empty')passes=[];render();}
function setMode(value){mode=value;view='home';currentPass=null;render();}
function home(){view='home';render();}
function modeBar(){return teacher()?`<nav class="mode" aria-label="Arbetsläge"><button class="${mode==='teach'?'active':''}" aria-pressed="${mode==='teach'}" onclick="setMode('teach')">Min undervisning</button><button class="${mode==='practice'?'active':''}" aria-pressed="${mode==='practice'}" onclick="setMode('practice')">Träna själv</button></nav>`:'';}
function header(){return `<header class="top"><div class="shell"><button class="brand" onclick="home()"><b class="brandmark" aria-hidden="true">✦</b>Kunskaps<span>gymmet</span></button>${modeBar()}<div class="account">${mode==='practice'?'<span class="badge-xp">Nivå 8 · 1 240 XP</span>':''}<span class="account-name">${teacher()?'Alex Lind':'Elin Holm'}<small>${teacher()?'Lärare':'NA26a'}</small></span><button class="avatar" aria-label="Konto" onclick="account()">${teacher()?'AL':'EH'}</button></div></div></header>`;}
function render(){ $('app').innerHTML=header()+`<main><div class="shell">${mode==='teach'?(view==='group'?groupPage():teacherHome()):(view==='course'?coursePage():view==='exercise'?exercisePage():studentHome())}</div></main>`;window.scrollTo(0,0);}
function teacherHome(){return `<section class="intro"><div><span class="eyebrow">Exempelskolan · Min undervisning</span><h1>${groups.length?'Din undervisning, samlad.':'Välkommen till din undervisning.'}</h1><p>${groups.length?'Öppna en grupp för att dela träning och följa elevernas utveckling.':'Börja med en grupp. Lägg till elever och ge dem något att träna på.'}</p></div><button class="primary" onclick="newGroup()">+ Skapa grupp</button></section>${groups.length?`<div class="stats"><div class="metric"><b>${groups.length}</b><span>Grupper</span></div><div class="metric"><b>${uniqueStudents().size}</b><span>Elever · räknade en gång</span></div><div class="metric"><b>${passes.length}</b><span>Aktiva träningspass</span></div></div><div class="section-head"><h2>Mina grupper</h2><span class="note">Välj en grupp för att arbeta vidare</span></div><div class="grid">${groups.map(g=>`<article class="card"><span class="tag">${esc(g.course)}</span><h3>${esc(g.name)}</h3><p>${g.ids.length} elever · ${[...new Set(g.ids.map(id=>students.find(s=>s.id===id).klass))].map(esc).join(', ')||'Lägg till dina första elever'}</p><div class="meta"><span>${passes.filter(p=>p.groups.includes(g.id)).length} aktiva pass</span></div><div class="footer"><span class="small-number">Kod ${esc(g.code)}</span><button class="small" onclick="openGroup(${g.id})">Öppna grupp →</button></div></article>`).join('')}</div>`:`<section class="card"><div class="onboard"><b>1</b><div><h3>Skapa din undervisningsgrupp</h3><p>Välj namn och kurs, till exempel ”Matematik 2c · NA26a”.</p></div></div><div class="onboard"><b>2</b><div><h3>Lägg till elever</h3><p>Välj en eller flera klasser, eller låt eleverna gå med via kod.</p></div></div><div class="onboard"><b>3</b><div><h3>Dela ett träningspass</h3><p>Välj innehåll. Eleverna får passet direkt på sin startsida.</p></div></div><div class="actions"><button class="primary" onclick="newGroup()">Skapa min första grupp</button><button class="quiet" onclick="setMode('practice')">Träna själv</button></div></section>`}`;}
function openGroup(id){groupId=id;view='group';tab='overview';render();}
function groupPage(){const g=group(), gp=passes.filter(p=>p.groups.includes(g.id));return `<div class="crumb"><button class="link" onclick="home()">← Mina grupper</button></div><section class="intro"><div><span class="eyebrow">${esc(g.course)} · ${g.ids.length} elever</span><h1>${esc(g.name)}</h1><p>Elever, träningspass och uppföljning för den här undervisningsgruppen.</p></div><button class="quiet" onclick="settings()">Gruppinställningar</button></section><nav class="tabs" aria-label="Gruppens innehåll">${[['overview','Översikt'],['passes','Träningspass'],['students','Elever']].map(([id,label])=>`<button class="${tab===id?'active':''}" aria-current="${tab===id?'page':'false'}" onclick="tab='${id}';render()">${label}</button>`).join('')}</nav>${tab==='students'?studentsPage(g):tab==='passes'?`<div class="section-head"><h2>Träningspass</h2><button class="primary" onclick="newPass()">+ Skapa träningspass</button></div>${gp.length?gp.map(p=>passTeacherCard(p)).join(''):'<div class="empty"><h3>Gruppens första pass väntar.</h3><p>Välj ett område som eleverna ska träna på.</p></div>'}`:overview(g,gp)}`;}
function overview(g,gp){const active=g.ids.filter(id=>id%4!==0).length;return `${!g.ids.length?'<div class="callout"><p>Lägg till elever för att komma igång med gruppen.</p><button class="primary" onclick="importStudents()">Lägg till elever</button></div>':''}<div class="section-head"><h2>Aktuellt i gruppen</h2><button class="primary" onclick="newPass()">+ Skapa träningspass</button></div><div class="split"><div>${gp.length?gp.map(passTeacherCard).join(''):'<section class="card empty"><h3>Skapa gruppens första träningspass</h3><p>Utgå från det ni arbetar med just nu. Eleverna hittar passet på sin startsida.</p><button class="primary" onclick="newPass()">Välj innehåll</button></section>'}</div><section class="card"><div class="section-head" style="margin-top:0"><h3>Gruppens träning</h3><select aria-label="Statistikperiod" onchange="periodChanged(this.value)"><option>Senaste 7 dagarna</option><option>Senaste 30 dagarna</option></select></div><p><b id="active-count" style="color:var(--ink)">${active} av ${g.ids.length}</b> elever har tränat.</p><div class="bars">${(g.ids.length?[['Ekvationer',72],['Problemlösning',46],['Begrepp',84]]:[]).map(([name,value])=>`<div class="row"><div><span>${g.course===courses[1]?({'Ekvationer':'Kraft och rörelse','Problemlösning':'Friläggning','Begrepp':'Kraftbegrepp'}[name]):name}</span><span>${value}% rätt</span></div><div class="progress"><i style="width:${value}%"></i></div></div>`).join('')}</div><p class="note" style="margin-top:16px">Utgå från resultaten när du planerar nästa träning.</p><button class="link" onclick="newPass('Problemlösning')">Skapa pass på ett område →</button></section></div>`;}
function periodChanged(value){$('active-count').textContent=(value.includes('30')?group().ids.length:group().ids.filter(id=>id%4!==0).length)+' av '+group().ids.length;}
function passTeacherCard(p){const ids=[...new Set(p.groups.flatMap(id=>groups.find(g=>g.id===id)?.ids||[]))],gids=group().ids,done=gids.filter(id=>id%4!==0&&id%3===0).length,notStarted=gids.filter(id=>id%4===0).length;return `<article class="card" style="margin-bottom:14px"><span class="tag green">Aktivt pass</span><h3>${esc(p.title)}</h3><p>${esc(p.deadline)} · ${p.count} uppgifter</p><div class="meta"><span>${done} klara</span><span>${gids.length-done-notStarted} påbörjade</span><span>${notStarted} inte börjat</span></div><div class="progress"><i style="width:${gids.length?done/gids.length*100:0}%"></i></div><div class="footer"><span class="note">${p.groups.length>1?`Delat med ${p.groups.length} grupper · ${ids.length} unika elever`:'Delat med gruppen'}</span><button class="small" onclick="passResults(${p.id})">Följ upp →</button></div></article>`;}
function studentsPage(g){return `<div class="section-head"><h2>Elever <span class="muted">${g.ids.length}</span></h2><div class="actions"><button class="quiet" onclick="showCode()">Dela gruppkod</button><button class="primary" onclick="importStudents()">+ Lägg till elever</button></div></div><p class="note">Elevernas ordinarie klass visas här. Att lägga till dem i gruppen ändrar inte deras klass.</p><section class="card">${g.ids.length?g.ids.map(id=>{const s=students.find(s=>s.id===id);return `<div class="row"><div><b>${esc(s.name)}</b><p>${esc(s.klass)}</p></div><div class="actions"><span class="note">${id%4===0?'Ingen träning denna vecka':`${id*3} uppgifter denna vecka`}</span><button class="small quiet" onclick="studentStats(${id})">Se utveckling</button></div></div>`;}).join(''):'<div class="empty"><h3>Här kommer dina elever att synas.</h3><p>Importera en klass eller dela gruppkoden.</p></div>'}</section>`;}
function ownCourses(){return `<div class="grid practice-grid">${courses.map((course,i)=>`<article class="card"><button class="linkcard" onclick="openCourse(${i})"><span class="course-icon">${['2c','Fy1','1c'][i]}</span><h3>${esc(course)}</h3><p>Välj område och träna på din nivå.</p><span style="color:var(--blue);font-weight:650">Välj område →</span></button></article>`).join('')}</div>`;}
function myPasses(){return [...new Map(passes.filter(p=>p.groups.some(id=>groups.find(g=>g.id===id)?.ids.includes(studentId))).map(p=>[p.id,p])).values()];}
function studentHome(){const list=teacher()?[]:myPasses();return `<section class="intro"><div><span class="eyebrow">${teacher()?'Din egen träning':'Din träning · Exempelskolan · NA26a'}</span><h1>${teacher()?'Träna själv.':list.length?'Vad vill du träna på idag?':'Välj kurs och börja träna.'}</h1><p>${teacher()?'Utforska uppgifterna och träna på din egen nivå. Dina resultat hör till din egen profil.':list.length?'Fortsätt med ett pass från din lärare eller välj egen träning.':'Du kan alltid träna på egen hand. Välj en kurs nedan – nivån anpassas efter hur det går.'}</p></div>${teacher()?'':`<button class="quiet" onclick="joinCode()">Jag har en kod</button>`}</section>${list.length?`<div class="section-head"><h2>Från dina lärare</h2><button class="link" onclick="myGroups()">Mina grupper</button></div><div class="grid two">${list.map(p=>`<article class="card"><span class="tag">${esc(p.course)}</span><h3>${esc(p.title)}</h3><p>Alex Lind · ${esc(p.deadline)}</p><div class="progress"><i style="width:${p.done/p.count*100}%"></i></div><div class="meta">${p.done} av ${p.count} uppgifter gjorda</div><div class="footer"><span class="note">${p.done?'Fortsätt där du slutade':'Redo att börja'}</span><button class="primary" onclick="startPass(${p.id})">${p.done?'Fortsätt':'Börja träna'} →</button></div></article>`).join('')}</div>`:''}<div class="section-head"><h2>${list.length?'Träna på egen hand':'Välj kurs'}</h2>${!teacher()&&!list.length?'<button class="link" onclick="myGroups()">Mina grupper</button>':''}</div>${ownCourses()}${!teacher()&&!list.length?'<div class="callout" style="margin-top:22px"><p>Du har inga tilldelade pass just nu. När din lärare delar ett pass hittar du det här.</p></div>':''}`;}
function openCourse(i){practiceCourse=courses[i];currentPass=null;view='course';render();}
function coursePage(){const areas=practiceCourse===courses[1]?['Rörelse','Krafter','Energi','Tryck','Elektricitet']:['Ekvationer','Funktioner','Geometri','Statistik'];return `<div class="crumb"><button class="link" onclick="home()">← Mina kurser</button></div><section class="intro"><div><span class="eyebrow">${teacher()?'Träna själv':'Egen träning'}</span><h1>${esc(practiceCourse)}</h1><p>Välj vad du vill träna på. Du kan börja direkt.</p></div></section><div class="grid two">${areas.map(a=>`<article class="card"><h3>${a}</h3><p>Uppgifter på flera nivåer.</p><button class="primary" onclick="startExercise('${a}')">Börja träna →</button></article>`).join('')}</div>`;}
function startExercise(area){practiceTask=0;view='exercise';render();}
function startPass(id){currentPass=passes.find(p=>p.id===id);practiceCourse=currentPass.course;startExercise(currentPass.topic);}
function exercisePage(){return `<div class="crumb"><button class="link" onclick="home()">← Till min träning</button></div><span class="eyebrow">${currentPass?esc(currentPass.title):'Egen träning'} · ${esc(practiceCourse)}</span><div class="section-head"><h1>Då kör vi.</h1><span class="tag">Exempeluppgift i prototypen</span></div><section class="card"><p class="muted">${currentPass?`${currentPass.done} av ${currentPass.count} uppgifter gjorda`:'Din egen träningsprofil'}</p><div class="question">${practiceCourse===courses[1]?'En bil kör 150 meter på 10 sekunder. Vilken är medelhastigheten?':'Lös ekvationen 3x + 6 = 21.'}</div><div class="answer"><label for="answer">${practiceCourse===courses[1]?'m/s':'x ='}</label><input id="answer" inputmode="decimal" aria-label="Ditt svar" onkeydown="if(event.key==='Enter')check()"><button class="primary" onclick="check()">Kontrollera</button></div><div id="feedback" role="status" style="margin-top:18px"></div></section>`;}
function check(){const correct=Number($('answer').value.replace(',','.'))===(practiceCourse===courses[1]?15:5);$('feedback').textContent=correct?'Rätt! I den riktiga tjänsten fortsätter träningen med nästa uppgift.':'Försök igen. '+(practiceCourse===courses[1]?'Dela sträckan med tiden.':'Börja med att subtrahera 6 på båda sidor.');if(correct&&currentPass&&!practiceTask){currentPass.done=Math.min(currentPass.count,currentPass.done+1);practiceTask=1;}}
function modal(title,body,footer=''){const previous=document.activeElement;window.modalReturn=previous;$('overlay').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="section-head"><h2 id="modal-title">${title}</h2><button class="quiet small" aria-label="Stäng" onclick="closeModal()">✕</button></div>${body}${footer?`<footer>${footer}</footer>`:''}</section></div>`;setTimeout(()=>$('overlay').querySelector('input,select,button')?.focus(),20);}
function closeModal(){$('overlay').innerHTML='';if(window.modalReturn?.isConnected)window.modalReturn.focus();}
document.addEventListener('keydown',e=>{if(!$('overlay').firstChild)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const f=[...$('overlay').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled)')].filter(x=>x.offsetParent!==null);if(!f.length)return;if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus();}}});
function newGroup(){modal('Skapa undervisningsgrupp',`<p class="muted">En grupp kan innehålla elever från flera klasser.</p><label class="field" for="group-name">Gruppens namn</label><input type="text" id="group-name" maxlength="60" placeholder="Till exempel Matematik · NA26a"><label class="field" for="group-course">Kurs</label><select class="full" id="group-course">${courses.map(c=>`<option>${c}</option>`).join('')}</select><p class="note" style="margin-top:12px">Kursen följer med till gruppens pass och statistik.</p><p id="form-error" role="status"></p>`,`<button class="quiet" onclick="closeModal()">Avbryt</button><button class="primary" onclick="createGroup()">Skapa och lägg till elever →</button>`);}
function createGroup(){const name=$('group-name').value.trim();if(name.length<2){$('form-error').textContent='Skriv ett gruppnamn med minst två tecken.';return;}const id=Date.now();groups.push({id,name,course:$('group-course').value,ids:[],code:'GRP'+String(id).slice(-3)});closeModal();openGroup(id);importStudents();}
function importStudents(){selection=new Set();const g=group();modal('Lägg till elever',`<p class="muted">${esc(g.name)} · ${esc(g.course)}</p><label class="field" for="class-select">Välj en klass</label><select class="full" id="class-select" onchange="selectClass(this.value)"><option value="">Välj klass …</option>${['NA26a','NA26b','TE26a'].map(k=>`<option>${k}</option>`).join('')}</select><p class="note" style="margin-top:10px">Du kan välja flera klasser och justera urvalet. Elevernas ordinarie klass och andra grupper behålls.</p><input class="search" type="text" id="student-search" aria-label="Sök elev" placeholder="Sök elevens namn" oninput="drawRoster()"><div class="roster" id="roster"></div><p class="selected" id="selection-count">0 nya elever valda</p>`,`<button class="quiet" onclick="showCode()">Använd gruppkod i stället</button><button class="primary" id="save-students" disabled onclick="saveStudents()">Lägg till valda elever</button>`);drawRoster();}
function drawRoster(){const g=group(),q=$('student-search').value.trim().toLocaleLowerCase('sv');$('roster').innerHTML=students.filter(s=>s.name.toLocaleLowerCase('sv').includes(q)).map(s=>`<label class="check"><input type="checkbox" value="${s.id}" ${g.ids.includes(s.id)?'checked disabled':selection.has(s.id)?'checked':''} onchange="toggleStudent(${s.id},this.checked)"><span>${s.name}<small>${s.klass}</small></span></label>`).join('')||'<p class="note">Ingen elev matchar sökningen.</p>';$('selection-count').textContent=selection.size+' nya elever valda';$('save-students').disabled=!selection.size;}
function selectClass(k){students.filter(s=>s.klass===k&&!group().ids.includes(s.id)).forEach(s=>selection.add(s.id));$('student-search').value='';drawRoster();}
function toggleStudent(id,checked){checked?selection.add(id):selection.delete(id);$('selection-count').textContent=selection.size+' nya elever valda';$('save-students').disabled=!selection.size;}
function saveStudents(){const n=selection.size;group().ids=[...new Set([...group().ids,...selection])];closeModal();tab='students';render();notify(`${n} elever har lagts till i gruppen.`);}
function showCode(){modal('Bjud in till gruppen',`<p class="muted">Eleverna väljer ”Jag har en kod” och skriver:</p><div class="code">${esc(group().code)}</div><p class="note">Koden gäller ${esc(group().name)}. Eleverna behåller sin ordinarie klass.</p>`,`<button class="primary" onclick="copyCode()">Kopiera gruppkod</button>`);}
async function copyCode(){try{await navigator.clipboard.writeText(group().code);notify('Gruppkoden är kopierad.');}catch(e){notify('Markera och kopiera koden som visas i rutan.');}}
function newPass(topic=''){const g=group();modal('Skapa träningspass',`<span class="tag">${esc(g.course)}</span><label class="field" for="pass-name">Passets namn</label><input type="text" id="pass-name" maxlength="80" placeholder="Till exempel Repetition inför provet"><label class="field" for="pass-topic">Innehåll</label><select class="full" id="pass-topic">${(g.course===courses[1]?['Krafter','Rörelse','Energi','Tryck']:['Ekvationer','Problemlösning','Geometri','Statistik']).map(t=>`<option ${t===topic?'selected':''}>${t}</option>`).join('')}</select><div class="grid two"><div><label class="field" for="pass-count">Antal uppgifter</label><select class="full" id="pass-count"><option>10</option><option selected>20</option><option>30</option></select></div><div><label class="field" for="pass-date">Klart senast · valfritt</label><input type="date" id="pass-date" style="width:100%"></div></div><label class="field">Dela med grupper</label>${groups.filter(x=>x.course===g.course).map(x=>`<label class="check"><input type="checkbox" name="pass-group" value="${x.id}" ${x.id===g.id?'checked':''} onchange="passAudience()"><span>${esc(x.name)}<small>${x.ids.length} elever</small></span></label>`).join('')}<p id="pass-audience" class="selected"></p><p class="note">En elev som finns i flera valda grupper får passet en gång.</p><p id="form-error" role="status"></p>`,`<button class="quiet" onclick="closeModal()">Avbryt</button><button class="primary" onclick="savePass()">Skapa och dela pass</button>`);passAudience();}
function selectedGroups(){return [...document.querySelectorAll('input[name=pass-group]:checked')].map(e=>Number(e.value));}
function passAudience(){const selected=selectedGroups(),n=new Set(selected.flatMap(id=>groups.find(g=>g.id===id).ids)).size;$('pass-audience').textContent=`${selected.length} grupper · ${n} unika elever`}
function savePass(){const title=$('pass-name').value.trim(),ids=selectedGroups();if(!title||!ids.length){$('form-error').textContent='Skriv ett namn och välj minst en grupp.';return;}passes.push({id:Date.now(),title,course:group().course,groups:ids,count:Number($('pass-count').value),topic:$('pass-topic').value,deadline:$('pass-date').value||'Utan slutdatum',done:0});closeModal();tab='passes';render();notify('Passet är delat. Eleverna hittar det på sin startsida.');}
function passResults(id){const p=passes.find(p=>p.id===id),g=group();modal('Följ upp träningspass',`<span class="tag">${esc(p.title)}</span><p class="muted">Resultat för ${esc(g.name)}.</p><div class="roster">${g.ids.map(id=>{const s=students.find(s=>s.id===id),n=id%4===0?0:id%3===0?p.count:Math.min(p.count-1,id);return `<div class="row"><div><b>${s.name}</b><p>${s.klass}</p></div><span class="${n===0?'pending':'note'}">${n===0?'Inte börjat':`${n} av ${p.count} gjorda`}</span></div>`}).join('')}</div>`,`<button class="primary" onclick="closeModal()">Tillbaka till gruppen</button>`);}
function studentStats(id){const s=students.find(s=>s.id===id);modal(esc(s.name),`<p class="muted">${s.klass} · ${esc(group().course)}</p><div class="stats"><div class="metric"><b>${id*3}</b><span>Uppgifter denna vecka</span></div><div class="metric"><b>76%</b><span>Rätt på första försöket</span></div><div class="metric"><b>3</b><span>Dagar med träning</span></div></div><h3>Att följa upp</h3><p class="muted">Eleven har kommit igång. Titta tillsammans på uppgifterna som kräver flera beräkningssteg.</p>`,`<button class="primary" onclick="closeModal()">Tillbaka</button>`);}
function settings(){modal('Gruppinställningar',`<label class="field" for="edit-name">Gruppens namn</label><input type="text" id="edit-name" value="${esc(group().name)}"><label class="field">Kurs</label><p>${esc(group().course)}</p><p class="note">Gruppen är fristående från elevernas ordinarie klasser.</p><h3>Lärare</h3><p class="muted">Alex Lind</p><button onclick="notify('I nästa version kan en kollega bjudas in till samma grupp.')">Bjud in kollega</button>`,`<button onclick="closeModal()">Avbryt</button><button class="primary" onclick="saveSettings()">Spara</button>`);}
function saveSettings(){const name=$('edit-name').value.trim();if(name.length<2){notify('Skriv ett längre gruppnamn.');return;}group().name=name;closeModal();render();}
function myGroups(){modal('Mina undervisningsgrupper',`<p class="muted">Din klass: <b>NA26a</b></p>${groups.filter(g=>g.ids.includes(studentId)).map(g=>`<div class="row"><div><b>${esc(g.name)}</b><p>${esc(g.course)} · Alex Lind</p></div></div>`).join('')}<p class="note" style="margin-top:20px">Din lärare följer träningen i sin undervisningsgrupp.</p>`,`<button class="primary" onclick="joinCode()">Gå med med kod</button>`);}
function joinCode(){modal('Gå med med kod',`<p class="muted">Ange koden från din lärare. Du kommer till rätt grupp eller träningspass.</p><input id="join-code" type="text" aria-label="Gruppkod" placeholder="Till exempel MATT26" style="text-transform:uppercase"><p class="note" style="margin-top:10px">Prova MATT26 i prototypen.</p><p id="form-error" role="status"></p>`,`<button class="quiet" onclick="closeModal()">Avbryt</button><button class="primary" onclick="join()">Gå med →</button>`);}
function join(){const g=groups.find(g=>g.code===$('join-code').value.trim().toUpperCase());if(!g){$('form-error').textContent='Koden hittades inte. Kontrollera den med din lärare.';return;}g.ids=[...new Set([...g.ids,studentId])];closeModal();render();notify(`Du är med i ${g.name}.`);}
function account(){modal(teacher()?'Alex Lind':'Elin Holm',`<p>Exempelskolan</p><p class="muted">${teacher()?'Lärarkonto · Din undervisning och din egen träning har separata ingångar.':'Klass NA26a · Din klass och dina undervisningsgrupper är separata.'}</p><p class="note">Alla personer och resultat i den här prototypen är exempeldata.</p>`);}
resetData();render();
</script></body></html>
